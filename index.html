<section class="slide" data-t="Title" data-n="Adam opens. Then the week in one slide."><div class="fill title-slide"><div class="kicker">Sam Nunn School of International Affairs &middot; 31 August &ndash; 4 September 2026</div><div class="t">Out of the Dark Ages?</div><div class="s">Supercharging your research workflow with LLMs</div><div class="m">Five days &middot; 11:00&ndash;13:30 daily &middot; Nunn Conference Room<br>Stephan De Spiegeleire, The Hague Centre for Strategic Studies</div></div></section>
<section class="slide" data-t="The week" data-n="THE map slide. Reuse it as the opening we-are-here slide every morning."><h2>The week</h2><p class="sub">One pipeline. Each day owns one stage of it, and each day stands on its own.</p><div class="grid c5 top"><div class="card hot"><div class="k">Day 1 &middot; Foundations</div><div class="d">Why the way we work now does not hold.</div></div><div class="card "><div class="k">Day 2 &middot; Corpora</div><div class="d">Finding what you have been missing.</div></div><div class="card "><div class="k">Day 3 &middot; Taxonomies</div><div class="d">Building the instrument.</div></div><div class="card "><div class="k">Day 4 &middot; Classification</div><div class="d">Applying it at scale, and evaluating it.</div></div><div class="card "><div class="k">Day 5 &middot; Your projects</div><div class="d">And the parts of the kit you can take.</div></div></div><div class="small-note">Students come and go. <b>Every day is self-contained</b> and opens with a cold start, so arriving on Wednesday costs you nothing.</div></section>
<section class="slide divider" data-t="Day 1 &amp;middot; Monday 31 August - Foundations" data-n="Day divider. Recap where we are on the five-day map, then go."><div class="fill daycard"><div class="kicker">Day 1 &middot; Monday 31 August</div><div class="daytitle">Foundations</div><div class="daysub">Why current practice does not hold &ndash; and what changed everywhere else</div><div class="daymins">11:00 &ndash; 13:30</div></div></section>
<section class="slide" data-t="How this week works" data-n="Fletcher text verbatim. The third card also tells drop-ins they can join later."><h2>How this week works</h2><p class="sub">Three ground rules. The third is the important one.</p><div class="grid c3"><div class="card "><div class="k">Please interrupt</div><div class="d">Questions welcome at any time.</div></div><div class="card "><div class="k">Topics will bleed into the next day</div><div class="d">Perfectly fine. The days are not sealed off.</div></div><div class="card hot"><div class="k">We won't finish everything today &ndash; by design</div><div class="d">Quality over coverage. Each day stands alone.</div></div></div></section>
<section class="slide" data-t="Sound familiar?" data-n="Show of hands on each. The only audience survey you get."><h2>Sound familiar?</h2><p class="sub">Which of these is yours?</p><div class="grid c3 r2"><div class="card q"><div class="k">Have I read enough? What am I missing?</div></div><div class="card q"><div class="k">I found 3,000 papers. Now what?</div></div><div class="card q"><div class="k">My lit review is 50 pages of summary. Where's the insight?</div></div><div class="card q"><div class="k">Everyone cites the same 10 papers. Is that the whole field?</div></div><div class="card q"><div class="k">How do I deal with sources in languages I don't read?</div></div><div class="card q"><div class="k">My committee wants &lsquo;systematic analysis&rsquo; but I'm just&hellip; reading?</div></div></div></section>
<section class="slide" data-t="You are not alone" data-n="Land it, then change gear into the side-story."><div class="fill"><div class="body-lg">Traditional research methods were not built for an era of <b class="y">200 million</b> scholarly articles, multilingual corpora and information overload.</div><div class="body-lg"><span class="c">But new tools are.</span></div></div></section>
<section class="slide" data-t="A salutary side-story" data-n="Deliberate change of gear."><div class="fill"><div class="body-lg">A salutary side-story.</div><div class="body-lg"><span class="sub2">Not about international affairs. About medicine.</span></div></div></section>
<section class="slide img" data-t="Yesterday: the four humors" data-n="Medicine&#x27;s operating system for 2,000 years. Coherent, taught in universities, wrong."><img src="img/d1_humors.jpg" alt="Yesterday: the four humors"><span class="src">GaTech 2025 source deck</span></section>
<section class="slide img" data-t="The &#x27;omics" data-n="Not a better theory - measurement at a scale that made the old categories redundant."><img src="img/d1_omics.jpg" alt="The &#x27;omics"><span class="src">GaTech 2025 source deck</span></section>

<section class="slide img" data-t="Paradigm shifts 1/2" data-n="Walk two or three rows. Sociology - sampling versus n = all - is ours."><img src="img/d1_para1.jpg" alt="Paradigm shifts 1/2"><span class="src">GaTech 2025 source deck</span></section>

<section class="slide" data-t="What this has produced" data-n="Evidence for a claim already made, not a portfolio."><h2>What this has actually produced</h2><p class="sub">Four projects, one method &ndash; the one you will use on your own question.</p><div class="grid c4"><div class="card num "><div class="v">2,500+</div><div class="k">WACKO</div><div class="d">Official documents against the semantic echoes of <b>1,000+</b> Russian philosopher books.</div></div><div class="card num "><div class="v">1958&ndash;2020</div><div class="k">Red Lines</div><div class="d">Red lines do <b>not &ndash; yet &ndash;</b> track Western provocations, or the reverse.</div></div><div class="card num "><div class="v">1,400</div><div class="k">Grey Horizon</div><div class="d">Taxa across <b>13</b> dimensions of below-threshold conflict.</div></div><div class="card num "><div class="v">1M+</div><div class="k">Regeneration</div><div class="d">Taxonomically annotated text chunks in one corpus.</div></div></div></section>
<section class="slide" data-t="Before tomorrow" data-n="One instruction. A persistent link, never one that expires overnight."><h2>Before tomorrow</h2><div class="fill" style="border-left:5px solid var(--accent);padding-left:4%"><div class="body-lg" style="font-size:clamp(16px,3.3cqw,48px)">Write your research question. One sentence.</div><p class="sub" style="margin:0">Bring it tomorrow &ndash; <em class="c">Day 2 goes looking for everything that exists on it.</em></p><p class="sub" style="margin:0">Everything from today and everything coming: <em class="c">one link, live all week.</em></p></div></section>

<section class="slide" data-t="The independence test" data-n="The quality gate. Peer-swap taxonomies here and let them break each other&#x27;s."><h2>The independence test</h2><p class="sub">A taxonomy is only an instrument if its dimensions are actually independent.</p><div class="grid c3"><div class="card "><div class="k">Can a case score high on A and low on B?</div><div class="d">If not, A and B are the same dimension wearing two names.</div></div><div class="card "><div class="k">Does every taxon have a plausible negative case?</div><div class="d">If nothing could fail to qualify, the taxon measures nothing.</div></div><div class="card hot"><div class="k">Would a second coder assign the same label?</div><div class="d">If not, you have a vocabulary, not a scheme.</div></div></div><div class="small-note">Target for your own: <b>8&ndash;12 dimensions</b>, tested for independence, before you classify anything.</div></section>
<section class="slide" data-t="What your instrument cannot see" data-n="The RRLS blind spot, generalised. This is the idea they should still have in five years."><h2>What your instrument cannot see</h2><p class="sub">The most transferable idea of the week.</p><div class="split"><div class="stack"><div class="card "><div class="k">A real filter, from our own work</div><div class="d">A statement enters the set only if it carries <b>both</b> a boundary span <b>and</b> a threatened-consequence span.</div></div><div class="card hot"><div class="k">The consequence</div><div class="d">Deliberately deniable coercion is invisible <b>by construction</b>. Two documents sit in the corpus and produced <b>zero</b> hits.</div></div></div><div class="stack"><div class="body-lg">The rejections were <em>correct</em> on the coding scheme.<br>It is not a bug.</div><p class="sub" style="margin:0">An instrument only sees what its definition admits. Write down, today, what yours is built to miss.</p></div></div></section>

<section class="slide" data-t="Measure whether it worked" data-n="Set this up before the punchline slide."><h2>Now measure whether it worked</h2><p class="sub">Three checks, in increasing order of discomfort.</p><div class="grid c3"><div class="card "><div class="k">Does the quoted span exist?</div><div class="d">Make the model quote the text justifying each call, then check mechanically that the quote is really there.</div></div><div class="card "><div class="k">Do two models agree?</div><div class="d">One model is an opinion. Disagreement is where your scheme is ambiguous.</div></div><div class="card hot"><div class="k">Do two humans agree?</div><div class="d">Cohen's kappa. This is the number your committee will ask for.</div></div></div></section>
<section class="slide" data-t="An illustration from our own current work" data-n="PROVISIONAL - our labels are not yet independently validated. Present it as an illustration of the method, never as a finding."><h2>What that measurement found</h2><div class="split"><div class="stack"><div class="card num hot"><div class="v">2.5% &ndash; 45.8%</div><div class="k">span fabrication</div><div class="d">How often the quote justifying a call was <b>not actually in the passage</b>. <b>Preliminary, on our own unvalidated labels.</b></div></div></div><div class="stack"><div class="body-lg">An <span class="y">eighteen-fold</span> spread &ndash; at <em>identical accuracy</em>.</div><p class="sub" style="margin:0">No accuracy leaderboard would ever show you this. It is only visible because we forced the model to point at its evidence and then checked.</p></div></div></section>
<section class="slide" data-t="Two traps" data-n="Both from our own scars. Concrete, not cautionary."><h2>Two traps that will cost you a result</h2><p class="sub">Both measured, both expensive.</p><div class="grid c2"><div class="card hot"><div class="k">The router trap</div><div class="d">An open-weight model called through a load-balancing router may be served to you <b>quantised</b>, from an arbitrary host. Your benchmark then measures the host, not the model.</div></div><div class="card "><div class="k">The anchoring trap</div><div class="d">Show a coder the model's answer and you have not measured agreement &ndash; you have measured compliance. Blind coding or nothing.</div></div></div><div class="small-note">And the honest framing for your methods section: a single adjudicated pass gives you <b>agreement with your own reference</b>, not accuracy against ground truth. Say so, and you will be believed.</div></section>

  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(i+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1);}
  else if(e.key==='ArrowDown'){e.preventDefault();nextDay();}
  else if(e.key==='ArrowUp'){e.preventDefault();prevDay();}
  else if(e.key==='Home'){go(0);}else if(e.key==='End'){go(S.length-1);}
  else if(e.key==='o'||e.key==='O'){ov.classList.toggle('on');}
  else if(e.key==='Escape'){ov.classList.remove('on');}
  else if(e.key==='n'||e.key==='N'){notesOn=!notesOn;notes.classList.toggle('on',notesOn);}});
 stage.addEventListener('click',function(e){if(e.target.closest('#hud'))return;
   (e.clientX>window.innerWidth*0.5?function(){go(i+1)}:function(){go(i-1)})();});
 ov.addEventListener('click',function(e){if(e.target===ov)ov.classList.remove('on');});
 window.addEventListener('hashchange',function(){var n=parseInt(location.hash.slice(1),10);
   if(n>=1&&n<=S.length)go(n-1);});
 var st=parseInt(location.hash.slice(1),10);go(st>=1&&st<=S.length?st-1:0);
})();
</script></body></html>
