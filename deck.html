<section class="slide" data-t="A SWOT analysis of Russian regeneration aptitude" data-n="The end-to-end payoff slide. Say out loud that every line traces back to labelled chunks."><h2>A SWOT analysis of Russian regeneration aptitude</h2><p class="sub">Produced end to end by the pipeline: question, corpus, taxonomy, labels, this.</p><div class="split"><div class="stack"><div class="kicker">Self-perceived strengths</div><div class="card " data-frag="1"><div class="k">Manpower flexibility</div><div class="d">A broad pool of conscripts, volunteers and private military companies, read as evidence of an ability to mobilise and field sizeable forces rapidly.</div></div><div class="card " data-frag="2"><div class="k">Industrial resilience</div><div class="d">Despite technological bottlenecks, official messaging underscores capacity to maintain or increase output in key defense sectors, often on Soviet-era infrastructure.</div></div><div class="card " data-frag="3"><div class="k">Doctrinal adaptation</div><div class="d">Evolving tactics in hybrid and urban warfare presented as institutional learning: drones, updated artillery practice, novel offensive strategies.</div></div></div><div class="stack"><div class="kicker">Self-perceived weaknesses</div><div class="card hot" data-frag="4"><div class="k">Morale and discipline gaps</div><div class="d">Uneven training standards, inconsistent welfare support and mixed-force structures degrading cohesion and battlefield effectiveness.</div></div><div class="card hot" data-frag="5"><div class="k">Logistical fragility</div><div class="d">Rail disruption, shortages of advanced components, sabotage threats. Sanctions limit access to modern technology and amplify reliance on Soviet platforms.</div></div><div class="card hot" data-frag="6"><div class="k">Command complexities</div><div class="d">Centralised directives coexisting with irregular and regional forces, straining unified command, communication and long-term planning.</div></div></div></div></section>
<section class="slide" data-t="Measure whether it worked" data-n="Set this up before the punchline slide."><h2>Now measure whether it worked</h2><p class="sub">Three checks, in increasing order of discomfort.</p><div class="grid c3"><div class="card " data-frag="1"><div class="k">Does the quoted span exist?</div><div class="d">Make the model quote the text justifying each call, then check mechanically that the quote is really there.</div></div><div class="card " data-frag="2"><div class="k">Do two models agree?</div><div class="d">One model is an opinion. Disagreement is where your scheme is ambiguous.</div></div><div class="card hot" data-frag="3"><div class="k">Do two humans agree?</div><div class="d">Cohen's kappa. This is the number your committee will ask for.</div></div></div></section>
<section class="slide" data-t="An illustration from our own current work" data-n="PROVISIONAL - our labels are not yet independently validated. Present it as an illustration of the method, never as a finding."><h2>What that measurement found</h2><div class="split"><div class="stack"><div class="card num hot" data-frag="1"><div class="v">2.5% &ndash; 45.8%</div><div class="k">span fabrication</div><div class="d">How often the quote justifying a call was <b>not actually in the passage</b>. <b>Preliminary, on our own unvalidated labels.</b></div></div></div><div class="stack"><div class="body-lg">An <span class="y">eighteen-fold</span> spread &ndash; at <em>identical accuracy</em>.</div><p class="sub" style="margin:0">No accuracy leaderboard would ever show you this. It is only visible because we forced the model to point at its evidence and then checked.</p></div></div></section>
<section class="slide" data-t="Two traps" data-n="Both from our own scars. Concrete, not cautionary."><h2>Two traps that will cost you a result</h2><p class="sub">Both measured, both expensive.</p><div class="grid c2"><div class="card hot" data-frag="1"><div class="k">The router trap</div><div class="d">An open-weight model called through a load-balancing router may be served to you <b>quantised</b>, from an arbitrary host. Your benchmark then measures the host, not the model.</div></div><div class="card " data-frag="2"><div class="k">The anchoring trap</div><div class="d">Show a coder the model's answer and you have not measured agreement &ndash; you have measured compliance. Blind coding or nothing.</div></div></div><div class="small-note" data-frag="3">And the honest framing for your methods section: a single adjudicated pass gives you <b>agreement with your own reference</b>, not accuracy against ground truth. Say so, and you will be believed.</div></section>
<section class="slide" data-t="Reading a kappa" data-n="Give them the bands before the worked number, or the number means nothing."><h2>Reading a kappa</h2><p class="sub">Cohen's kappa corrects agreement for the agreement you would get by chance alone.</p><div class="grid c4"><div class="card hot" data-frag="1"><div class="k">&lt; 0.40</div><div class="d">Poor to fair. Your scheme is ambiguous, not your coders.</div></div><div class="card " data-frag="2"><div class="k">0.40 &ndash; 0.60</div><div class="d">Moderate. Publishable with discussion of where it fails.</div></div><div class="card " data-frag="3"><div class="k">0.60 &ndash; 0.80</div><div class="d">Substantial. This is a realistic target for a first pass.</div></div><div class="card " data-frag="4"><div class="k">&gt; 0.80</div><div class="d">Almost suspicious. Check that your coders were genuinely independent.</div></div></div><div class="small-note" data-frag="5">Two coders, one scheme, the same passages, <b>neither seeing the other or the model</b>. Anything else is not a kappa, whatever you call it in the paper.</div></section>
<section class="slide" data-t="A real number" data-n="0.384 is ours, measured, and the reason the blind path exists. Use it - it is honest and it stings."><h2>A real number, from our own pipeline</h2><p class="sub">And what it cost us to learn it.</p><div class="split"><div class="stack"><div class="card num hot" data-frag="1"><div class="v">0.384</div><div class="k">auto-draft kappa, red lines</div><div class="d">Model-drafted labels, then human review. The neighboring layer scored <b>0.563</b> on the same pass. <b>Poor</b> &ndash; and it looks fine until you compute it.</div></div></div><div class="stack"><div class="body-lg">The coders were not disagreeing with each other.<br>They were <span class="y">agreeing with the model</span>.</div><p class="sub" style="margin:0">Show a reviewer the machine answer and you measure compliance, not reliability. The fix is expensive and unavoidable: a genuinely blind second pass.</p></div></div></section>
<section class="slide" data-t="A real confusion matrix" data-n="Ask what they would conclude BEFORE the next slide. Most will say 93 percent, fine, move on."><h2>A real confusion matrix</h2><p class="sub">Two human readers, one scheme, the red-line layer. Every cell is ours.</p><div class="split"><div class="stack"><table class="cm"><tr><td class="h"></td><td class="h">B says yes</td><td class="h">B says no</td></tr><tr><td class="h">A says yes</td><td class="ok">34</td><td class="dis">2</td></tr><tr><td class="h">A says no</td><td class="dis">9</td><td class="ok">207</td></tr></table><div class="small-note" data-frag="1">252 passages coded by both. Raw agreement <b>93%</b>.</div></div><div class="stack"><div class="body-lg">The disagreement is <span class="y">one-directional</span>: <b>9</b> against <b>2</b>.</div><p class="sub" style="margin:0">That asymmetry is the finding. This is not noise between two careful readers. One of them is systematically <em>more inclusive</em> than the other. A threshold disagreement can be fixed by rewriting a definition. Noise cannot.</p></div></div></section>
<section class="slide" data-t="The same data, two answers" data-n="THE evaluation slide of the week. A high agreement number on a skewed base rate means almost nothing."><h2>The same data. Two answers.</h2><p class="sub">Both are correctly computed. Only one of them means anything.</p><div class="grid c3"><div class="card num " data-frag="1"><div class="v">93%</div><div class="k">raw agreement</div><div class="d">What the matrix says if you stop reading there.</div></div><div class="card num hot" data-frag="2"><div class="v">0.24</div><div class="k">Cohen's kappa</div><div class="d">On the passages where the second reader actually made an independent call.</div></div><div class="card hot" data-frag="3"><div class="k">Why they diverge</div><div class="d"><b>216 of 252 passages are an easy no</b>, agreed without either reader having to think. Chance alone scores about three quarters on a base rate that skewed. Kappa subtracts that floor. Raw agreement pockets it.</div></div></div><div class="small-note" data-frag="4">The gate we had set for ourselves was <b>0.70</b>. The honest reading is not that the coders failed: it is that <b>the boundary is genuinely subjective</b>, which is a reportable finding rather than something to bury. <b>Caveat, and say it out loud:</b> n = 34 contested passages, so the interval is wide, and this is expert re-annotation rather than two fully independent coders.</section>
<section class="slide" data-t="Where the model stands" data-n="The argument for keeping a human on the hard layer - and for never reporting one overall number."><h2>And where the model actually stands</h2><p class="sub">Same passages, same scheme. Measured per layer, not overall.</p><div class="grid c3"><div class="card num hot" data-frag="1"><div class="v">&minus;0.02</div><div class="k">model vs human, red lines</div><div class="d">On the contested passages the production model is <b>indistinguishable from chance</b>. Raw agreement 55%.</div></div><div class="card num " data-frag="2"><div class="v">+0.72</div><div class="k">model vs human, nuclear signalling</div><div class="d">On the easier layer the same model is <b>substantial</b>. Raw agreement 89%.</div></div><div class="card hot" data-frag="3"><div class="k">So measure per layer</div><div class="d">One model, one scheme, one corpus &ndash; and it is <em>worthless on one layer and good on the other</em>. A single headline accuracy would have hidden both facts.</div></div></div><div class="small-note" data-frag="4">Two independent readers and the careful literal machine reads all clustered around <b>0.65 to 0.72</b>; the inclusive reader sat apart from every one of them. <b>The disagreement axis was not human versus machine.</b></div></section>
<section class="slide" data-t="The number we still do not have" data-n="Do not skip this. Saying &#x27;we do not have it yet&#x27; is the most credible thing in the deck."><h2>The number we still do not have</h2><p class="sub">And why we are telling you that instead of quoting one.</p><div class="split"><div class="stack"><div class="body-lg">Everything on the last three slides is <span class="y">expert re-annotation</span>, not two independent coders.</div><p class="sub" style="margin:0">The same person was second reader <em>and</em> adjudicator, and part of the pass was assisted. That is a legitimate second look. It is not inter-annotator reliability, and calling it that in a paper would be the thing a reviewer catches.</p></div><div class="stack"><div class="card hot" data-frag="1"><div class="k">What a clean number needs</div><div class="d">Two coders. One scheme. The same passages. <b>Neither seeing the other, nor the model.</b></div></div><div class="card " data-frag="2"><div class="k">Where ours stands</div><div class="d">A blind app exists and the passages are drawn. The pass has <b>not come back yet</b>, so we quote no clean kappa at all.</div></div></div></div></section>
<section class="slide" data-t="What to report" data-n="This is the takeaway artefact. Put it on one page and hand it out."><h2>What to report</h2><p class="sub">Six lines. If your methods section has these, it will survive review.</p><div class="grid c3 r2"><div class="card " data-frag="1"><div class="k">1 &middot; The question</div><div class="d">Stated so someone else could ask it again.</div></div><div class="card " data-frag="2"><div class="k">2 &middot; The query</div><div class="d">Verbatim, with the date you ran it and the database version.</div></div><div class="card " data-frag="3"><div class="k">3 &middot; The corpus</div><div class="d">N documents, N chunks, sources, languages, and how duplicates were handled.</div></div><div class="card " data-frag="4"><div class="k">4 &middot; The scheme</div><div class="d">Dimensions, levels, and one worked coding decision.</div></div><div class="card hot" data-frag="5"><div class="k">5 &middot; The reliability</div><div class="d">Kappa, how many coders, and whether they were blind.</div></div><div class="card hot" data-frag="6"><div class="k">6 &middot; The blind spot</div><div class="d">What your instrument cannot see, in one sentence.</div></div></div></section>
<section class="slide" data-t="Day 4 close" data-n="&#x27;One number honestly&#x27; is the whole assessment criterion."><h2>Before tomorrow</h2><div class="fill" style="border-left:5px solid var(--accent);padding-left:4%"><div class="body-lg" style="font-size:clamp(16px,3.3cqw,48px)">Run your classifier over a bigger slice. Report one number honestly.</div><p class="sub" style="margin:0"><em class="c">Tomorrow is yours: your project, and what you can actually take away.</em></p></div></section>

<section class="slide" data-t="How to represent knowledge" data-n="The non-state-actor point is the one that lands with an IR room."><h2>How to represent knowledge</h2><p class="sub">Three reasons the graph formalism is the one that stuck.</p><div class="grid c3"><div class="card " data-frag="1"><div class="k">A graph formalism</div><div class="d">Labeled graphs in the graph-theory sense, where the reasoning mechanisms are <b>graph operations</b>, with graph homomorphism at the core.</div></div><div class="card " data-frag="2"><div class="k">Logically founded</div><div class="d">Which matters, because logic has been the foundation for knowledge representation and reasoning <em>for millennia</em>.</div></div><div class="card hot" data-frag="3"><div class="k">And it is what industry actually built</div><div class="d">It works with the new knowledge graphs, involving some of the world's premier <b>non-state</b> actors: Google, Baidu, the Wikipedia ecosystem, Amazon, Facebook, Yahoo, Yandex.</div></div></div></section>
<section class="slide img" data-t="An experiment in truthiness" data-n="Why search alone was never enough."><img src="img/d5_truthiness.jpg" alt="An experiment in truthiness"></section>
<section class="slide" data-t="Things, not strings" data-n="The entity-versus-string distinction is the whole reason a taxonomy is worth building."><h2>Things, not strings</h2><p class="sub">Companies moved from information retrieval to question answering.</p><div class="split"><div class="stack"><div class="card " data-frag="1"><div class="k">What that shift needs</div><div class="d">Some NLP, above all <b>named entity recognition</b>, and good knowledge bases.</div></div><div class="card tint" data-frag="2"><div class="k">DBpedia</div><div class="d">An open-source knowledge base in RDF, built from Wikipedia.</div></div></div><div class="stack"><div class="card hot" data-frag="3"><div class="k">Google, as the worked example</div><div class="d"><b>2014</b> Freebase: 1.2 billion facts about 43 million entities.<br><b>2015</b> the Google knowledge graph, updated by text information extraction.</div></div><div class="card " data-frag="4"><div class="k">And everyone else has one</div><div class="d">Microsoft (Satori), IBM (Watson), Apple, Wolfram (Alpha), Facebook (Open Graph).</div></div></div></div></section>

<section class="slide" data-t="What you can take" data-n="Say which is which, plainly."><h2>What you can actually take</h2><p class="sub">Being precise about this buys more credibility than overclaiming.</p><div class="split"><div class="stack"><div class="card hot" data-frag="1"><div class="k">Yours to use</div><div class="d">The method. The query discipline. The taxonomy architecture and its independence test. The evaluation habit. The public dashboards and reports.</div></div></div><div class="stack"><div class="card " data-frag="2"><div class="k">Ours, and not transferable</div><div class="d">Credentialed corpora, licensed sources, the annotation database, and anything that needs our infrastructure to run.</div></div><div class="card " data-frag="3"><div class="k">The honest middle</div><div class="d">Prompts and pipelines we will share, that will need adapting to your material before they are any use.</div></div></div></div></section>
<section class="slide" data-t="Clinics" data-n="Circulate. Ten minutes each, and mean it."><h2>Clinics</h2><p class="sub">The rest of today is yours.</p><div class="grid c3"><div class="card " data-frag="1"><div class="k">Bring what you built</div><div class="d">Corpus, taxonomy, classifications &ndash; however far you got.</div></div><div class="card " data-frag="2"><div class="k">Ten minutes each</div><div class="d">One specific recommendation, not general encouragement.</div></div><div class="card hot" data-frag="3"><div class="k">Missing days is fine</div><div class="d">Come with the question and we will start from wherever you are.</div></div></div></section>
<section class="slide" data-t="30-day plan" data-n="The thing that survives the week. Send it to them in writing afterwards."><h2>Your 30-day plan</h2><p class="sub">Four things, in order. Nothing here needs our infrastructure.</p><div class="grid c4"><div class="card " data-frag="1"><div class="k">Week 1</div><div class="d">Freeze your research question and harvest the corpus properly &ndash; with dedup.</div></div><div class="card " data-frag="2"><div class="k">Week 2</div><div class="d">Build the taxonomy to L3 on one branch, and run the independence test.</div></div><div class="card " data-frag="3"><div class="k">Week 3</div><div class="d">Classify a sample. Measure fabrication and agreement.</div></div><div class="card hot" data-frag="4"><div class="k">Week 4</div><div class="d">Write the methods section. Include what your instrument cannot see.</div></div></div></section>
<section class="slide" data-t="The week in one slide" data-n="Say it back to them. People underestimate what they got through."><h2>The week, in one slide</h2><p class="sub">What you did, in the order you did it.</p><div class="grid c5 top"><div class="card " data-frag="1"><div class="k">Monday</div><div class="d">Named a question, and saw why the usual way of answering it does not hold.</div></div><div class="card " data-frag="2"><div class="k">Tuesday</div><div class="d">Built a corpus, and could say how complete it is.</div></div><div class="card " data-frag="3"><div class="k">Wednesday</div><div class="d">Built an instrument, and tested whether its dimensions are independent.</div></div><div class="card " data-frag="4"><div class="k">Thursday</div><div class="d">Ran the instrument over the corpus, and measured how well it worked.</div></div><div class="card hot" data-frag="5"><div class="k">Friday</div><div class="d">Turned that into something you can defend.</div></div></div></section>
<section class="slide" data-t="When it breaks" data-n="The most useful slide of the week for anyone working alone afterwards."><h2>When it breaks &ndash; and it will</h2><p class="sub">The four failures that will actually happen, and what each one means.</p><div class="grid c2 r2"><div class="card " data-frag="1"><div class="k">The query returns 40,000 hits</div><div class="d">Your terms are too broad, or you are missing a NOT. Narrow by domain, never by convenience.</div></div><div class="card " data-frag="2"><div class="k">The query returns 11 hits</div><div class="d">Almost always a quoting or a field-search error &ndash; not a small field.</div></div><div class="card " data-frag="3"><div class="k">The model labels everything the same</div><div class="d">Your taxon has no plausible negative case. Fix the scheme, not the prompt.</div></div><div class="card hot" data-frag="4"><div class="k">Two coders disagree constantly</div><div class="d">Good. That is the scheme telling you where it is ambiguous.</div></div></div></section>
<section class="slide" data-t="Close" data-n="From the Boston invitation. End on it and stop talking."><div class="fill"><div class="body-lg">The question is not whether AI will change research methods.</div><div class="body-lg" data-frag="1"><span class="c">It is whether you will be ahead of the curve or behind it.</span></div></div></section></template>

function go(i,push,built){ if(i<0)i=0;if(i>=slides.length)i=slides.length-1; /* set the incoming slide's fragment state BEFORE it becomes visible: otherwise a slide that still carries .shown from a previous build paints fully built for a few frames and then collapses - the 'ghosting' flash. */ setFrags(i, (buildOff || built===true) ? frags(i).length : 0); slides[cur].classList.remove('on'); cur=i; slides[cur].classList.add('on'); autofit(cur); setFrags(cur, (buildOff || built===true) ? frags(cur).length : 0);
  document.getElementById('counter').textContent=(cur+1)+' / '+slides.length;
  document.getElementById('slidetitle').innerHTML=slides[cur].dataset.t||'';
  document.getElementById('notes').innerHTML=slides[cur].dataset.n?('<b>Note</b> &nbsp;'+slides[cur].dataset.n):'<i>No note on this slide.</i>';
  paintTimeline();paintSidebar();
  if(push!==false)history.replaceState(null,'','#'+(cur+1));
}
function showDeck(i,built){
  view='deck';
  document.getElementById('home').classList.remove('on');
  stage.classList.add('on');document.getElementById('deckbar').classList.add('on');
  document.getElementById('navHome').classList.remove('on');
  document.getElementById('navDeck').classList.add('on');
  go(typeof i==='number'?i:cur, true, built!==false ? true : false);
}
function showHome(){
  view='home';
  stage.classList.remove('on');document.getElementById('deckbar').classList.remove('on');
  document.getElementById('notes').classList.remove('on');
  document.getElementById('home').classList.add('on');
  document.getElementById('navHome').classList.add('on');
  document.getElementById('navDeck').classList.remove('on');
  history.replaceState(null,'','#home');
  paintTimeline();paintSidebar();
}
function goDay(d){showDeck(d===0?0:dividers[d-1]);}
function toggleNotes(){document.getElementById('notes').classList.toggle('on');}
function toggleOv(){
  var ov=document.getElementById('ov');
  if(!ov.classList.contains('on'))buildOv();
  ov.classList.toggle('on');
}
function present(){
  if(view!=='deck')showDeck();
  document.body.classList.add('present');
  fitted=[];autofit(cur);
  if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(function(){});
}
function unpresent(){
  document.body.classList.remove('present');
  fitted=[];autofit(cur);
  if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(function(){});
}

/* ---------------- chrome painting ---------------- */
function paintTimeline(){
  var bar=document.getElementById('timelineBar');
  if(!bar.dataset.built){
    var h='';
    DAYS.forEach(function(d,k){
      if(k)h+='<div class="timeline-connector"></div>';
      h+='<button class="timeline-block" data-d="'+(k+1)+'" onclick="goDay('+(k+1)+')">'+
         '<div class="timeline-time">'+d.label+' &#183; '+d.when+'</div>'+
         '<div class="timeline-label">'+d.title+'</div>'+
         '<div class="timeline-duration">'+d.time+'</div></button>';
    });
    bar.innerHTML=h;bar.dataset.built='1';
  }
  var d=view==='deck'?dayOf(cur):0;
  [].forEach.call(bar.querySelectorAll('.timeline-block'),function(b){
    b.classList.toggle('active',parseInt(b.dataset.d,10)===d);});
}
function paintSidebar(){
  var sb=document.getElementById('sidebar'),h='';
  if(view==='home'){
    h+='<div class="sidebar-section"><div class="sidebar-section-title">The week</div>';
    DAYS.forEach(function(d,k){
      h+='<button class="sidebar-item" onclick="goDay('+(k+1)+')"><span class="sidebar-item-title">'+
         d.label+' &#183; '+d.title+'</span><span class="sidebar-badge">'+d.when+'</span></button>';});
    h+='</div><div class="sidebar-section"><div class="sidebar-section-title">Deck</div>'+
       '<button class="sidebar-item" onclick="showDeck(0)"><span class="sidebar-item-title">Open from the start</span><span class="sidebar-badge">'+slides.length+'</span></button>'+
       '<button class="sidebar-item" onclick="toggleOv()"><span class="sidebar-item-title">Slide overview</span><span class="sidebar-badge">O</span></button>'+
       '<button class="sidebar-item" onclick="present()"><span class="sidebar-item-title">Present full screen</span><span class="sidebar-badge">F</span></button></div>'+
       '<div class="sidebar-section"><div class="sidebar-section-title">Reference</div>'+
       '<a class="sidebar-item" href="index.html"><span class="sidebar-item-title">Back to the programme</span><span class="sidebar-badge">&#8599;</span></a>'+
       '<a class="sidebar-item" href="casestudy.html"><span class="sidebar-item-title">Worked case study</span><span class="sidebar-badge">&#8599;</span></a>'+
       '<a class="sidebar-item" href="index.html#materials"><span class="sidebar-item-title">Prompts and materials</span><span class="sidebar-badge">&#8599;</span></a>'+
       '<a class="sidebar-item" href="https://rubase.org/" target="_blank" rel="noopener"><span class="sidebar-item-title">RuBase dashboard</span><span class="sidebar-badge">&#8599;</span></a>'+
       '<a class="sidebar-item" href="https://sdspieg.github.io/rubase-workshop-5day/"><span class="sidebar-item-title">5-day full programme</span><span class="sidebar-badge">&#8599;</span></a></div>';
    sb.innerHTML=h;return;
  }
  var d=dayOf(cur);
  var start=d===0?0:dividers[d-1];
  var end=d<dividers.length?dividers[d]:slides.length;
  if(d===0){start=0;end=dividers.length?dividers[0]:slides.length;}
  h+='<div class="sidebar-section"><div class="sidebar-section-title">'+
     (d===0?'Opening':('Day '+d+' &#183; '+DAYS[d-1].title))+'</div>';
  for(var i=start;i<end;i++){
    h+='<button class="sidebar-item'+(i===cur?' active':'')+'" onclick="showDeck('+i+')">'+
       '<span class="sidebar-item-title">'+(slides[i].dataset.t||('Slide '+(i+1)))+'</span>'+
       '<span class="sidebar-badge">'+(i+1)+'</span></button>';
  }
  h+='</div><div class="sidebar-section"><div class="sidebar-section-title">Jump to a day</div>';
  DAYS.forEach(function(dd,k){
    h+='<button class="sidebar-item'+(k+1===d?' active':'')+'" onclick="goDay('+(k+1)+')">'+
       '<span class="sidebar-item-title">'+dd.label+' &#183; '+dd.title+'</span>'+
       '<span class="sidebar-badge">'+dd.when+'</span></button>';});
  h+='</div>';
  sb.innerHTML=h;
  var act=sb.querySelector('.sidebar-item.active');
  if(act&&act.scrollIntoViewIfNeeded)act.scrollIntoViewIfNeeded();
}
function buildHome(){
  var h='<div class="welcome-screen">'+
    '<div class="welcome-title">Out of the Dark Ages?</div>'+
    '<div class="welcome-subtitle">Supercharging your research workflow with LLMs. Five afternoons in which we take one research pipeline apart&nbsp;&ndash; from the question, through the corpus and the instrument, to a result you can defend&nbsp;&ndash; and put it back together with tools that did not exist when most of our methods were written.</div>'+
    '<div class="welcome-meta">Sam Nunn School of International Affairs &#183; 31 August &ndash; 4 September 2026 &#183; 11:00&ndash;13:30 daily &#183; Nunn Conference Room</div>'+
    '<div class="pipeline">';
  PIPE.forEach(function(p,k){
    if(k)h+='<div class="pipe-arrow">&rarr;</div>';
    h+='<button class="pipe-step" onclick="goDay('+(k+1)+')"><div class="step-label">'+p[0]+'</div><div class="step-name">'+p[1]+'</div></button>';});
  h+='</div><div class="session-grid">';
  DAYS.forEach(function(d,k){
    h+='<button class="session-card" onclick="goDay('+(k+1)+')">'+
       '<div class="card-num">'+d.n+'</div>'+
       '<div class="card-time">'+d.when+' &#183; '+d.time+'</div>'+
       '<div class="card-title">'+d.title+'</div>'+
       '<div class="card-desc">'+d.desc+'</div><div class="card-items">';
    d.items.forEach(function(it){h+='<div class="card-item"><span class="card-item-bullet"></span><span>'+it+'</span></div>';});
    h+='</div></button>';});
  h+='</div></div>';
  document.getElementById('home').innerHTML=h;
}
function buildOv(){
  var g=document.getElementById('ovg'),h='';
  slides.forEach(function(s,i){
    h+='<button class="'+(s.classList.contains('divider')?'d':'')+'" onclick="document.getElementById(\'ov\').classList.remove(\'on\');showDeck('+i+')">'+
       '<i>'+(i+1)+'</i>'+(s.dataset.t||'')+'</button>';});
  g.innerHTML=h;
}

/* ---------------- keys ---------------- */
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  var k=e.key;
  if(k==='Escape'){
    if(document.getElementById('ov').classList.contains('on')){document.getElementById('ov').classList.remove('on');return;}
    if(document.body.classList.contains('present')){unpresent();return;}
  }
  if(view!=='deck'&&['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','n','N'].indexOf(k)>-1){showDeck();if(k==='ArrowRight'||k==='ArrowLeft')return;}
  if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();if(!stepFwd())go(cur+1);}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();if(!stepBack())go(cur-1,true,true);}
  else if(k==='ArrowDown'){e.preventDefault();var d=dayOf(cur);goDay(Math.min(d+1,DAYS.length));}
  else if(k==='ArrowUp'){e.preventDefault();var d2=dayOf(cur);goDay(Math.max(d2-1,0));}
  else if(k==='Home'){e.preventDefault();go(0);}
  else if(k==='End'){e.preventDefault();go(slides.length-1);}
  else if(k==='o'||k==='O'){toggleOv();}
  else if(k==='n'||k==='N'){toggleNotes();}
  else if(k==='b'||k==='B'){toggleBuild();}
  else if(k==='f'||k==='F'){document.body.classList.contains('present')?unpresent():present();}
});
document.addEventListener('fullscreenchange',function(){
  if(!document.fullscreenElement&&document.body.classList.contains('present'))document.body.classList.remove('present');
  fitted=[];autofit(cur);
});
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){fitted=[];autofit(cur);},140);});

/* ---------------- start ---------------- */
buildHome();
var hash=(location.hash||'').replace('#','');
if(hash&&hash!=='home'&&!isNaN(parseInt(hash,10))){showDeck(parseInt(hash,10)-1);}
else{showHome();}
</script>
