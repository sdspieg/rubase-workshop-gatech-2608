<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Out of the Dark Ages? &middot; slides</title>
<meta name="description" content="RuBase / StratBase Methods Workshop, Georgia Tech, 31 August to 4 September 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,400&display=swap">
<style>
/* == StratBase house palette - identical tokens to the sibling workshop apps == */
:root{
  --bg:#09182f; --db:#132f59; --db2:#173966; --gold:#dbad50;
  --lb:#9db8d6; --wh:#f3f6fb; --line:rgba(255,255,255,.12); --r:8px;
  --font:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--wh);overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}

/* ---------- house header ---------- */
.header{background:var(--db);border-bottom:1px solid var(--line);padding:8px 1.5rem;
 display:grid;grid-template-rows:auto auto;row-gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:100;flex-shrink:0}
.header-row1{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1rem}
.header-row2{display:flex;align-items:center;justify-content:center;gap:.5rem;padding-top:6px;
 border-top:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
.h-left,.h-right{display:flex;align-items:center;gap:1rem}
.h-right{justify-content:flex-end}
.h-logo{height:34px;width:auto;flex-shrink:0;display:inline-flex;align-items:center;border-radius:4px;
 transition:opacity .15s,transform .15s;opacity:.9}
.h-logo:hover,.h-logo:focus-visible{opacity:1;transform:translateY(-1px)}
.h-logo:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.h-logo img{height:34px;width:auto;display:block}
.h-logo.invert img{filter:brightness(0) invert(1)}
.header-title{font-size:1.06rem;font-weight:700;color:var(--wh);letter-spacing:.4px;text-align:center;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-title span{color:var(--gold)}
.header-nav{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:center}
.header-nav a,.header-nav button,.header-nav select{background:transparent;border:1px solid var(--gold);
 color:var(--gold);padding:.34rem .78rem;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:700;
 font-size:.8rem;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s}
.header-nav a:hover,.header-nav button:hover{background:var(--gold);color:var(--db)}
.header-nav button.on{background:var(--gold);color:var(--db)}
.header-nav select option{background:var(--db);color:var(--wh)}
@media (max-width:1200px){.h-logo,.h-logo img{height:28px}.header-title{font-size:.94rem}
 .header-nav a,.header-nav button,.header-nav select{font-size:.75rem;padding:.3rem .6rem}}
@media (max-width:980px){.header-row1{grid-template-columns:auto 1fr}.h-right{display:none}
 .header-title{white-space:normal}}

/* ---------- day timeline ---------- */
.timeline-bar{background:var(--db2);padding:9px 24px;border-bottom:1px solid var(--line);
 display:flex;align-items:center;gap:0;overflow-x:auto;flex-shrink:0}
.timeline-block{flex:1;text-align:center;padding:7px 8px;cursor:pointer;transition:background .14s;
 min-width:126px;border-radius:6px;border:0;background:transparent;font-family:inherit;color:inherit}
.timeline-block:hover{background:rgba(219,173,80,.08)}
.timeline-block.active{background:rgba(219,173,80,.14);box-shadow:inset 0 -2px 0 var(--gold)}
.timeline-time{font-size:.7rem;color:var(--gold);font-weight:600;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.timeline-label{font-size:.85rem;font-weight:700;color:var(--wh)}
.timeline-duration{font-size:.68rem;color:var(--lb);margin-top:2px}
.timeline-connector{width:18px;height:2px;background:var(--line);flex-shrink:0}

/* ---------- layout ---------- */
.main-container{display:flex;flex:1;min-height:0}
.sidebar{width:284px;flex-shrink:0;background:var(--db);border-right:1px solid var(--line);
 padding:16px 16px 26px;overflow-y:auto}
.sidebar-section{margin-bottom:18px}
.sidebar-section-title{color:var(--gold);font-size:.76rem;text-transform:uppercase;letter-spacing:1px;
 margin-bottom:9px;padding-bottom:5px;border-bottom:1px solid rgba(219,173,80,.25)}
.sidebar-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;
 margin:2px 0;border-radius:6px;cursor:pointer;transition:all .14s;border:1px solid transparent;
 background:transparent;font-family:inherit;color:inherit;width:100%;text-align:left}
.sidebar-item:hover{border-color:var(--gold);background:rgba(219,173,80,.06);transform:translateX(3px)}
.sidebar-item.active{background:rgba(219,173,80,.12);border-color:var(--gold)}
.sidebar-item-title{font-size:.83rem;font-weight:600;line-height:1.3}
.sidebar-item.active .sidebar-item-title{color:var(--gold)}
.sidebar-badge{font-size:.66rem;color:var(--lb);font-variant-numeric:tabular-nums;flex-shrink:0}
.content-area{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}

/* ---------- stage ---------- */
#stage{flex:1;min-height:0;display:none;place-items:center;padding:14px;container-type:size}
#stage.on{display:grid}
.slide{position:relative;width:min(100%,100cqh * 16/9);aspect-ratio:16/9;background:var(--bg);
 border:1px solid var(--line);border-radius:var(--r);padding:3.1% 3.6%;display:none;flex-direction:column;
 container-type:inline-size;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45);--sc:1}
.slide.on{display:flex}
.slide.img{padding:0;background:#000}
.slide.img img{width:100%;height:100%;object-fit:contain;display:block;border-radius:var(--r)}
.src{position:absolute;right:.6%;top:.6%;background:rgba(9,24,47,.72);padding:2px 6px;border-radius:3px;
 font-size:10px;color:#5d7a9d;letter-spacing:.05em}

/* ---- type scale: every size is cqw * --sc; the autofit engine grows --sc to fill ---- */
h2{margin:0 0 .34em;color:var(--gold);font-weight:700;font-size:calc(4.5cqw * var(--sc));
 line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:-.1em 0 .8em;color:var(--lb);font-size:calc(1.95cqw * var(--sc));line-height:1.35;max-width:62ch}
.sub2{color:var(--lb);font-weight:400;font-size:.62em}
.body-lg{font-size:calc(2.75cqw * var(--sc));line-height:1.3;font-weight:500;text-wrap:balance}
.kicker{font-size:calc(1.25cqw * var(--sc));letter-spacing:.2em;text-transform:uppercase;color:var(--gold);
 font-weight:700;margin-bottom:.9em}
.fill{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:calc(1.6cqw * var(--sc))}
.small-note{margin-top:.8em;color:var(--lb);font-size:calc(1.4cqw * var(--sc));line-height:1.4}
.small-note b{color:var(--wh)}
.title-slide .t{font-size:calc(7.6cqw * var(--sc));font-weight:900;color:var(--gold);line-height:1.06;letter-spacing:-.02em}
.title-slide .s{font-size:calc(2.9cqw * var(--sc));color:var(--wh);font-weight:600}
.title-slide .m{font-size:calc(1.5cqw * var(--sc));color:var(--lb);margin-top:.7em;line-height:1.6}
.slide.divider{background:linear-gradient(135deg,#09182f 0%,#173966 58%,#09182f 100%);border-color:var(--gold)}
.daycard{justify-content:center;gap:.28em}
.daytitle{font-size:calc(6.2cqw * var(--sc));font-weight:800;color:var(--gold);line-height:1.06;letter-spacing:-.012em}
.daysub{font-size:calc(2.6cqw * var(--sc));color:var(--wh);font-weight:600;max-width:30ch;line-height:1.25}
.daymins{font-size:calc(1.45cqw * var(--sc));color:var(--lb);margin-top:.9em;letter-spacing:.12em}

/* grids: rows STRETCH so cards fill the frame (align-content:center was the bug) */
.grid{display:grid;gap:1.8%;flex:1;min-height:0;align-content:stretch;grid-auto-rows:1fr}
.c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}
.c4{grid-template-columns:repeat(4,1fr)}.c5{grid-template-columns:repeat(5,1fr)}
.r2{grid-template-rows:repeat(2,1fr)}
.top .card{justify-content:flex-start}
.card{background:var(--db);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--r);
 padding:3.4% 4%;display:flex;flex-direction:column;justify-content:center;gap:.4em;min-height:0;min-width:0;overflow:hidden}
.card .k{font-size:calc(2.45cqw * var(--sc));font-weight:700;line-height:1.16;text-wrap:balance;color:var(--wh)}
.card .d{font-size:calc(1.55cqw * var(--sc));color:var(--lb);line-height:1.4}
.card .v{font-size:calc(5.4cqw * var(--sc));font-weight:900;color:var(--gold);line-height:1.02;
 font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.num .k{color:var(--gold)}
.q .k{font-weight:400;font-style:italic;color:var(--wh)}
.q .k::before{content:"\201C"}.q .k::after{content:"\201D"}
.q{border-left-color:var(--lb)}
.tint{background:transparent;border-left-color:var(--lb)}
.hot{border-color:var(--gold);background:rgba(219,173,80,.10)}
.hot .k{color:var(--gold)}
.y,.c{color:var(--gold)}
ul.big{margin:auto 0;padding-left:1.05em;display:flex;flex-direction:column;gap:.6em}
ul.big li{font-size:calc(2.55cqw * var(--sc));line-height:1.26}
ul.big li::marker{color:var(--gold)}
ul.big li b{color:var(--gold)}
ul.big li em{color:var(--wh);font-style:normal;font-weight:700}
.split{display:grid;grid-template-columns:1fr 1fr;gap:3%;flex:1;min-height:0;align-items:stretch}
.stack{display:flex;flex-direction:column;gap:.7em;min-width:0;justify-content:center}
/* was flex:0 0 30% - a fixed band that left half the slide empty */
.arrowrow{display:flex;align-items:stretch;gap:1.2%;flex:1 1 auto;min-height:0;min-width:0;margin-bottom:2%}
.arrowrow .card{flex:1 1 0;min-width:0;height:100%;padding:2.6% 2.4%}
.arrowrow .ar{color:var(--gold);font-size:calc(2.4cqw * var(--sc));font-weight:700;opacity:.75;flex:0 0 auto;align-self:center}


/* confusion matrix */
table.cm{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.cm td{border:1px solid var(--line);padding:3.2% 2%;text-align:center;
 font-size:calc(2.6cqw * var(--sc));font-weight:800;line-height:1.05}
table.cm td.h{background:transparent;border:0;color:var(--lb);font-weight:600;
 font-size:calc(1.5cqw * var(--sc));text-align:right;padding:1.4% 2%}
table.cm td.ok{background:var(--db);color:var(--wh)}
table.cm td.dis{background:rgba(219,173,80,.16);color:var(--gold);border-color:var(--gold)}


/* paradigm-shift tables */
table.shift{border-collapse:collapse;width:100%;flex:1;min-height:0;table-layout:fixed}
table.shift th{background:var(--db2);color:var(--gold);font-size:calc(1.35cqw * var(--sc));
 text-transform:uppercase;letter-spacing:.06em;padding:.7% .8%;text-align:left;
 border-bottom:1px solid var(--gold);font-weight:700}
table.shift td{border-bottom:1px solid var(--line);padding:.75% .8%;vertical-align:top;
 color:var(--lb);font-size:calc(1.35cqw * var(--sc));line-height:1.28}
table.shift td.d{color:var(--wh);font-weight:700}
table.shift td.k{color:var(--wh)}
table.shift tr:nth-child(even) td{background:rgba(255,255,255,.025)}
table.shift ul{margin:0;padding-left:1em;list-style:none}
table.shift ul li{position:relative;padding-left:.15em}
table.shift ul li::before{content:"\2022";color:var(--gold);position:absolute;left:-.8em}
table.shift col:first-child{width:12%}


/* ---------- build-up fragments ----------
   Fragments use OPACITY, not display, so they still occupy layout: the autofit
   engine measures the fully-built slide and must not resize mid-build. */
.slide [data-frag]{opacity:0;transform:translateY(.28em);
 transition:opacity .26s ease,transform .26s ease}
.slide [data-frag].shown{opacity:1;transform:none}
/* geometry must always be measured in the BUILT state: an unbuilt fragment is
   translated a little, and the overflow detector correctly reads that shift as
   clipping. Autofit and the detector both raise this flag while measuring. */
body.measuring .slide [data-frag]{opacity:1;transform:none;transition:none}
body.nobuild .slide [data-frag]{opacity:1;transform:none}
#buildpip{margin-left:2px;color:var(--gold);font-variant-numeric:tabular-nums;font-weight:700}
@media (prefers-reduced-motion:reduce){.slide [data-frag]{transition:none}}


/* prompt blocks: the originals were screenshots of 6pt code, unreadable past row two */
pre.prompt{margin:0;flex:1 1 auto;background:#0c2038;border:1px solid var(--line);border-left:3px solid var(--gold);
 border-radius:var(--r);padding:2.4% 2.8%;overflow:hidden;white-space:pre-wrap;
 font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
 font-size:calc(1.5cqw * var(--sc));line-height:1.5;color:var(--lb)}
pre.prompt b{color:var(--gold);font-weight:700}
pre.prompt i{color:var(--wh);font-style:normal}
pre.prompt .c{color:#6e88a8}
.promptwrap{display:flex;flex:1 1 auto;min-height:0;gap:2%;align-items:stretch}
.promptwrap>*{flex:1 1 0;min-width:0;display:flex;flex-direction:column}

/* ---------- deck toolbar ---------- */
.deckbar{flex-shrink:0;display:none;align-items:center;gap:10px;padding:7px 16px 10px;
 border-top:1px solid var(--line);background:var(--db);font-size:.78rem;color:var(--lb)}
.deckbar.on{display:flex}
.deckbar button{background:transparent;border:1px solid var(--line);color:var(--lb);font:inherit;
 padding:4px 11px;border-radius:6px;cursor:pointer;font-weight:700}
.deckbar button:hover,.deckbar button:focus-visible{border-color:var(--gold);color:var(--gold);outline:none}
.deckbar .spacer{flex:1}
#counter{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700}
#slidetitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34ch}
#keyhelp{color:#6e88a8;font-size:.72rem}
#notes{flex-shrink:0;max-height:26vh;overflow:auto;background:#0d2038;border-top:1px solid var(--line);
 padding:11px 18px 14px;display:none;color:var(--lb);font-size:.86rem;line-height:1.6}
#notes.on{display:block}
#notes b{color:var(--wh)}

/* ---------- home ---------- */
#home{flex:1;min-height:0;overflow-y:auto;padding:28px;display:none}
#home.on{display:block}
.welcome-screen{text-align:center;padding:12px 10px 28px}
.welcome-title{font-size:2.5rem;margin-bottom:14px;color:var(--gold);font-weight:800;letter-spacing:.5px}
.welcome-subtitle{font-size:1.08rem;color:var(--lb);margin-bottom:8px;line-height:1.55;max-width:860px;margin-left:auto;margin-right:auto}
.welcome-meta{font-size:.94rem;color:var(--gold);margin-bottom:24px}
.pipeline{display:flex;align-items:stretch;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 auto 30px;
 padding:16px;background:rgba(219,173,80,.06);border:1px dashed var(--line);border-radius:var(--r);max-width:1200px}
.pipe-step{text-align:center;padding:8px 14px;min-width:114px;cursor:pointer;border-radius:6px;
 transition:background .14s;border:0;background:transparent;font-family:inherit}
.pipe-step:hover{background:rgba(219,173,80,.1)}
.pipe-step .step-label{font-size:.68rem;color:var(--lb);text-transform:uppercase;letter-spacing:1px}
.pipe-step .step-name{font-size:.96rem;font-weight:700;margin-top:4px;color:var(--gold)}
.pipe-arrow{color:var(--gold);font-size:1.25rem;align-self:center}
@media (max-width:900px){.pipe-arrow{display:none}}
.session-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(252px,1fr));gap:17px;max-width:1320px;margin:0 auto;text-align:left}
.session-card{background:var(--db);border:1px solid rgba(255,255,255,.08);border-left:4px solid var(--gold);
 border-radius:var(--r);padding:20px;cursor:pointer;transition:transform .14s,border-color .14s,box-shadow .14s;
 font-family:inherit;color:inherit;text-align:left}
.session-card:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.card-num{font-size:2.15rem;line-height:1;color:var(--gold);font-weight:900;margin-bottom:6px}
.card-time{font-size:.74rem;color:var(--gold);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.card-title{font-size:1.06rem;font-weight:700;margin-bottom:8px;color:var(--wh)}
.card-desc{color:var(--lb);font-size:.85rem;line-height:1.55}
.card-items{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
.card-item{display:flex;align-items:baseline;gap:8px;padding:2px 0;font-size:.8rem;color:var(--lb)}
.card-item-bullet{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--gold)}

/* ---------- overview ---------- */
#ov{position:fixed;inset:0;z-index:200;background:rgba(9,24,47,.985);display:none;overflow:auto;padding:22px}
#ov.on{display:block}
#ovg{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:9px;max-width:1600px;margin:0 auto}
#ovg button{aspect-ratio:16/9;background:var(--db);border:1px solid var(--line);color:var(--lb);font:inherit;
 font-size:10px;text-align:left;padding:7px;cursor:pointer;line-height:1.22;overflow:hidden;border-radius:5px}
#ovg button.d{background:#173966;border-color:var(--gold);color:var(--gold);font-weight:700}
#ovg button:hover,#ovg button:focus-visible{border-color:var(--gold);color:var(--wh);outline:none}
#ovg button i{display:block;color:var(--gold);font-style:normal;font-weight:700;margin-bottom:4px;font-variant-numeric:tabular-nums}

/* ---------- present mode ---------- */
body.present .header,body.present .timeline-bar,body.present .sidebar,body.present .deckbar{display:none}
body.present #stage{padding:0}
body.present .slide{border:0;border-radius:0;box-shadow:none}
body.present #notes{position:fixed;left:0;right:0;bottom:0;z-index:60}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
a.sidebar-item,a.sidebar-item:visited{color:var(--wh);text-decoration:none}
.slide .small-note a{color:var(--gold)}
</style></head>

<header class="header">

    <div class="h-left">
      <a class="h-logo invert" href="https://hcss.nl" target="_blank" rel="noopener" title="HCSS"><img src="assets/logos/hcss_logo.svg" alt="HCSS"></a>

      <a class="h-logo" href="https://rubase.org/" target="_blank" rel="noopener" title="RuBase dashboard"><img src="assets/logos/rubase_logo.svg" alt="RuBase"></a>

</header>
<div class="timeline-bar" id="timelineBar"></div>

      <span id="slidetitle"></span><span id="buildpip"></span>

</div>
<div id="ov"><div id="ovg"></div></div>

<section class="slide" data-t="Yesterday: the four humors" data-n="Reveal the wheel first, then the four humors one at a time. The point lands on the fourth: a complete, internally consistent, entirely wrong system."><h2>Yesterday: &lsquo;humors&rsquo;, &lsquo;spirits of the body&rsquo;, &lsquo;temperaments&rsquo;</h2><p class="sub">A complete theory of the body. Internally consistent. Entirely wrong.</p><div class="split" style="gap:2.5%"><div class="stack" style="flex:0 0 42%" data-frag="1"><img src="img/d1_humors_wheel.jpg" alt="Medieval diagram of the four humors" style="width:100%;height:auto;max-height:62cqh;object-fit:contain;border-radius:3px"></div><div class="stack" style="flex:1;gap:.5em"><div class="card tint" data-frag="2"><div class="k">Blood &middot; sanguine</div><div class="d">Air, spring, warm and moist. Cheerful, optimistic, energetic.</div></div><div class="card tint" data-frag="3"><div class="k">Yellow bile &middot; choleric</div><div class="d">Fire, summer, hot and dry. Ambitious, leaderly, quick to anger.</div></div><div class="card tint" data-frag="4"><div class="k">Black bile &middot; melancholic</div><div class="d">Earth, autumn, cold and dry. Introspective, thoughtful, depressive.</div></div><div class="card hot" data-frag="5"><div class="k">Phlegm &middot; phlegmatic</div><div class="d">Water, winter, cold and moist. Calm, reliable, sluggish. <b>Four elements, four seasons, four temperaments &ndash; and not one measurement.</b></div></div></div></div></section>
<section class="slide" data-t="The 'omics" data-n="Reveal the diagram, then walk up the layers. The point is the last card: each layer measured WHOLE, then integrated."><h2>The &lsquo;omics&rsquo;</h2><p class="sub">One living system, measured layer by layer &ndash; and then put back together.</p><div class="split" style="gap:2.5%"><div class="stack" style="flex:0 0 52%" data-frag="1"><img src="img/d1_omics.jpg" alt="From chromosomes and DNA through proteins to cells and communities" style="width:100%;height:auto;max-height:62cqh;object-fit:contain;border-radius:3px"></div><div class="stack" style="flex:1;gap:.5em"><div class="card tint" data-frag="2"><div class="k">Genomics &middot; the parts list</div><div class="d">Chromosomes, genes, DNA. What the organism <em>could</em> build.</div></div><div class="card tint" data-frag="3"><div class="k">Proteomics &middot; what the parts become</div><div class="d">Proteins and the molecular machines they assemble into. What is <em>actually</em> being built.</div></div><div class="card tint" data-frag="4"><div class="k">Cells and communities &middot; the system running</div><div class="d">30&ndash;40 trillion cells, and the communities they form. Behavior, not parts.</div></div><div class="card hot" data-frag="5"><div class="k">And then: integration</div><div class="d"><b>Each layer measured whole, then the layers read together.</b> That integration is what makes it an &lsquo;omics rather than a collection of facts.</div></div></div></div></section>
<section class="slide" data-t="genomics : the genome :: geomics : the conflict" data-n="This is OUR framing, not a borrowed biology analogy. The tumour line is the one that lands."><h2>genomics : the genome  ::  geomics : the conflict</h2><p class="sub">Medicine measured its way from impression to evidence. The study of conflict never did.</p><div class="split"><div class="stack"><div class="card " data-frag="1"><div class="k">What the 'omics' actually are</div><div class="d">A field that <b>systematically measures an entire deep layer</b> of a living system, then <b>integrates the layers</b> to guide treatment. Genomics, proteomics, transcriptomics. That is how medicine crossed from hunch to measurement.</div></div><div class="card hot" data-frag="2"><div class="k">And where we still are</div><div class="d"><em>We can profile a tumour in a day, yet still size up how adversaries publicly portray one another by vibe and hunch.</em> Rich in theory, empirically stuck at the surface.</div></div></div><div class="stack"><div class="card " data-frag="3"><div class="k">Geomics borrows the method, not the biology</div><div class="d">Define a system's measurable layers, measure each, integrate &ndash; treating <b>the conflict as the disease</b> and its parties as the patients.</div></div><div class="card tint" data-frag="4"><div class="k">One honest difference</div><div class="d">IR has <b>no central dogma</b> and no meiosis: no settled prior about how perceptions, doctrines and actions relate, and no heritable code. So the cross-layer structure is <em>estimated</em>, not assumed.</div></div></div></div><div class="small-note" data-frag="5">Reading meaning at this scale was simply impossible before large language models. That is what changed, and it is the only thing that changed. <b>geomics.org</b></div></section>

<section class="slide" data-t="The AlphaFold moment" data-n="Show the structures, then the four claims one at a time. The fourth is the one that lands."><h2>The AlphaFold moment</h2><p class="sub">What happens when a field finally gets its instrument.</p><div class="split" style="gap:2.5%"><div class="stack" style="flex:0 0 40%;justify-content:center" data-frag="1"><img src="img/d1_alphafold_viz.jpg" alt="Predicted protein structures" style="width:100%;height:auto;object-fit:contain;border-radius:3px"></div><div class="stack" style="flex:1;gap:.45em"><div class="card tint" data-frag="2"><div class="k">The scale</div><div class="d"><b>200 million structures</b> against roughly <b>100,000</b> from decades of prior research &ndash; now in minutes.</div></div><div class="card tint" data-frag="3"><div class="k">Beyond proteins</div><div class="d">DNA, RNA and small-molecule interactions, about <b>50% more accurately</b>.</div></div><div class="card tint" data-frag="4"><div class="k">Real-world impact</div><div class="d">Drug discovery, food security, and much besides.</div></div><div class="card hot" data-frag="5"><div class="k">And for us?</div><div class="d"><b>Imagine the same leap for global crises and diplomatic behavior.</b> That is what this week is about.</div></div></div></div></section>
<section class="slide" data-t="Paradigm shifts across disciplines (1/2)" data-n="Walk two or three rows. Sociology - sampling versus n = all - is ours."><h2>Paradigm shifts across disciplines (1/2)</h2><p class="sub">Every neighboring field made the same crossing. Read two rows, then move.</p><table class="shift"><tr><th>Discipline</th><th>Conventional wisdom</th><th>New understanding</th><th>Key insight</th><th>Impact</th></tr><tr><td data-frag="1" class="d">Medicine</td><td data-frag="2">Doctors make treatment decisions based on clinical judgment</td><td data-frag="3">Evidence-based medicine guided by data analytics</td><td data-frag="4" class="k">Medical data volume doubles every 40 months since the 1980s</td><td data-frag="5"><ul><li>More personalized treatments</li><li>Improved patient outcomes</li><li>AI in diagnosis</li></ul></td></tr><tr><td data-frag="6" class="d">Economics</td><td data-frag="7">Technological automation does not lead to permanent unemployment</td><td data-frag="8">AI could substitute for human cognitive capabilities</td><td data-frag="9" class="k">Potential for widespread job displacement</td><td data-frag="10"><ul><li>Focus on AI's impact on labor markets</li><li>New policies needed</li><li>Rethinking education</li></ul></td></tr><tr><td data-frag="11" class="d">Sociology</td><td data-frag="12">Social research relies on sampling techniques</td><td data-frag="13">Big data allows analysis of entire populations (n = all)</td><td data-frag="14" class="k">Comprehensive analysis raises privacy concerns</td><td data-frag="15"><ul><li>More accurate social insights</li><li>Real-time network study</li><li>Privacy questions</li></ul></td></tr><tr><td data-frag="16" class="d">Physics</td><td data-frag="17">Complex systems are chaotic and unpredictable</td><td data-frag="18">AI can mine information from complex data</td><td data-frag="19" class="k">Controlling chaos has wide applications</td><td data-frag="20"><ul><li>AI physics platforms</li><li>Laser synchronization</li><li>Wireless energy transfer</li></ul></td></tr><tr><td data-frag="21" class="d">Biology</td><td data-frag="22">Research focuses on individual genes and proteins</td><td data-frag="23">High-throughput technologies enable whole-genome studies</td><td data-frag="24" class="k">Holistic study has profound implications</td><td data-frag="25"><ul><li>Understanding biological systems</li><li>Personalized medicine</li><li>AI-powered protein design</li></ul></td></tr></table></section>
<section class="slide" data-t="Paradigm shifts across disciplines (2/2)" data-n="Political science last, on purpose."><h2>Paradigm shifts across disciplines (2/2)</h2><p class="sub">Every neighboring field made the same crossing. Read two rows, then move.</p><table class="shift"><tr><th>Discipline</th><th>Conventional wisdom</th><th>New understanding</th><th>Key insight</th><th>Impact</th></tr><tr><td data-frag="1" class="d">Environmental science</td><td data-frag="2">Material discovery is slow and intuition-based</td><td data-frag="3">AI accelerates discovery through data analysis</td><td data-frag="4" class="k">AI can revolutionize energy storage development</td><td data-frag="5"><ul><li>Tools like MatterGen</li><li>New electronics materials</li><li>More efficient validation</li></ul></td></tr><tr><td data-frag="6" class="d">History</td><td data-frag="7">Research relies on limited historical records</td><td data-frag="8">AI can decipher previously unreadable ancient texts</td><td data-frag="9" class="k">New sources could change historical understanding</td><td data-frag="10"><ul><li>Deciphering ancient scrolls</li><li>New historical data</li><li>Challenging interpretations</li></ul></td></tr><tr><td data-frag="11" class="d">Linguistics</td><td data-frag="12">Language analysis relies on predefined rules</td><td data-frag="13">Generative AI learns patterns and produces outputs</td><td data-frag="14" class="k">AI can break down language barriers</td><td data-frag="15"><ul><li>Advanced NLP</li><li>Automated translation</li><li>New language insights</li></ul></td></tr><tr><td data-frag="16" class="d">Psychology</td><td data-frag="17">Research uses controlled experiments with small samples</td><td data-frag="18">Big data enables real-world behavior study</td><td data-frag="19" class="k">Real-world data provides ecological validity</td><td data-frag="20"><ul><li>Memory and emotion insights</li><li>Personalized interventions</li><li>Redefining concepts</li></ul></td></tr><tr><td data-frag="21" class="d">Political science</td><td data-frag="22">Campaigns rely on traditional outreach methods</td><td data-frag="23">AI analyzes voter data and personalizes messaging</td><td data-frag="24" class="k">Raises concerns about manipulation and democracy</td><td data-frag="25"><ul><li>Voter manipulation concerns</li><li>Impact on political discourse</li></ul></td></tr></table></section>
<section class="slide" data-t="So why not us?" data-n="Ask the room for their answer before revealing either card."><h2>Every neighboring discipline crossed over. Why didn't ours?</h2><p class="sub">Two answers. Neither of them is about the tools.</p><div class="split"><div class="stack"><div class="card hot" data-frag="1"><div class="k">1 &middot; We never built the instrument</div><div class="d">Biology has the Gene Ontology, medicine has SNOMED and ICD. <b>We have no shared, defined vocabulary for what we study</b> &ndash; so nothing anyone measures can be compared with anything anyone else measured.</div></div></div><div class="stack"><div class="card hot" data-frag="2"><div class="k">2 &middot; The incentives point the other way</div><div class="d">A new framework is publishable; a measurement layer is infrastructure. <b>The work that would have let the field cross over is the work nobody is rewarded for doing.</b></div></div></div></div></section>
<section class="slide" data-t="How do we currently do it?" data-n="Genuine show of hands. Do not fill the silence - the answers are the slide."><div class="fill"><div class="body-lg">How do we <span class="y">currently</span> do it?</div><div class="body-lg" data-frag="1"><span class="sub2">You tell me.</span></div></div></section>
<section class="slide" data-t="How search is typically done today" data-n="The Hobbes line is the joke. The four questions under it are the actual indictment."><h2>How search is typically done today</h2><p class="sub">Solitary, poor, nasty, brutish, and short.</p><div class="split"><div class="stack"><div class="card hot" data-frag="1"><div class="k">In 99.9% of cases it is not explicit</div><div class="d">And it is <b>not documented</b>. The references are non-transparent: <em>why those sources and not others? which excerpt exactly? complete citation? alternative readings?</em></div></div></div><div class="stack"><div class="card " data-frag="2"><div class="k">What we lean on instead</div><div class="d"><b>Presumably authoritative sources</b> - peer-reviewed, most-cited. <em>Trust me, I know the literature.</em> And herd behavior.</div></div><div class="card tint" data-frag="3"><div class="k">The alternatives that already exist</div><div class="d">Bibliometric databases: Scopus, Web of Science, Lens. And, cheating, <em>syllabus site:.edu</em>.</div></div></div></div></section>
<section class="slide img" data-t="The sophistication of our queries" data-n="Moz 2018, 1.2 million queries: only 3.02% used quotation marks. Two-word queries are 40%. Let that land."><img src="img/x_querylen.jpg" alt="The sophistication of our queries"></section>
<section class="slide" data-t="Problems with search today" data-n="Time is the one that actually decides what gets read. Say so."><h2>Problems with search today</h2><p class="sub">Three, and only one of them is about the tools.</p><div class="grid c3"><div class="card " data-frag="1"><div class="k">Access</div><div class="d">Paywalls and terms of use. <b>We are unusually fortunate here through RuBase</b>, which is exactly why it is easy to forget how binding this is for everyone else.</div></div><div class="card hot" data-frag="2"><div class="k">Time</div><div class="d">Small projects force researchers to the low-hanging fruit: to <b>narrow, risk-averse precision</b>, and to neglect recall.</div></div><div class="card " data-frag="3"><div class="k">Search query syntax</div><div class="d">Many datasets have decidedly suboptimal search. Nearly all are keyword-based old-school search; not even proximity operators are always implemented.</div></div></div><div class="small-note" data-frag="4">And we are stuck with that <b>to build the corpus</b> &ndash; which we can then play with the way we want, with unsupervised and semi-supervised NLP tools.</div></section>
<section class="slide" data-t="Precision and recall" data-n="Venn first, then the two definitions, then the trade-off. Recall is the one nobody measures."><h2>Precision and recall</h2><p class="sub">Two numbers. Almost everyone optimises the wrong one.</p><div class="split" style="gap:2.5%"><div class="stack" style="flex:0 0 44%;justify-content:center" data-frag="1"><img src="img/x_precrecall_venn.jpg" alt="Relevant and retrieved documents as overlapping sets" style="width:100%;height:auto;max-height:54cqh;object-fit:contain;border-radius:3px"></div><div class="stack" style="flex:1;gap:.5em"><div class="card tint" data-frag="2"><div class="k">Precision</div><div class="d">Of what you <em>retrieved</em>, how much was relevant. Easy to see: you are looking at it.</div></div><div class="card tint" data-frag="3"><div class="k">Recall</div><div class="d">Of what was <em>relevant</em>, how much you retrieved. <b>You cannot see what you missed</b>, which is exactly why it goes unmeasured.</div></div><div class="card hot" data-frag="4"><div class="k">The trade-off you are actually making</div><div class="d">A narrow query feels rigorous and quietly buys precision with recall. <b>Every AND and every NOT is a bet that what you excluded did not matter.</b></div></div></div></div></section>
<section class="slide" data-t="What would a useful search even look like?" data-n="Diversity is the one nobody optimises for, and it is the one that decides what your field contains."><h2>What would a useful search even look like?</h2><p class="sub">Two questions, then six metrics.</p><div class="split"><div class="stack"><div class="kicker">Are we looking for</div><div class="card hot" data-frag="1"><div class="k">Good or excellent articles?</div><div class="d">And how would we know?</div></div><div class="card hot" data-frag="2"><div class="k">Good knowledge and insight?</div><div class="d">And how would we know <em>that</em>?</div></div></div><div class="stack"><div class="kicker">Metrics of usefulness</div><div class="card " data-frag="3"><div class="k">Precision and accuracy</div><div class="d">Just <b>narrow</b> (influencing / IR / EUR to RUS), or <b>broad</b> (influencing / IR, or even influencing / human)?</div></div><div class="card " data-frag="4"><div class="k">And then</div><div class="d"><b>Recall</b> &middot; <b>authoritativeness</b> &middot; <b>quality</b> &middot; <b>diversity</b>: semantic, disciplinary, linguistic.</div></div></div></div></section>

<section class="slide" data-t="Why at least try broader?" data-n="The &#x27;now we can&#x27; turn is the point of the slide. Everything before it is the setup."><h2>Why at least try broader?</h2><p class="sub">Take any existing research question. Say models of regionalism.</p><div class="grid c3"><div class="card " data-frag="1"><div class="k">You find the comparative literature</div><div class="d">Which may already be doing the work of identifying those models for you.</div></div><div class="card hot" data-frag="2"><div class="k">And you also find the single cases</div><div class="d">Studies on <b>one</b> regional organization that were never in the comparative literature &ndash; but ask similar questions, or carry an interesting design.</div></div><div class="card " data-frag="3"><div class="k">Which leads somewhere</div><div class="d">New research questions, and new research designs.</div></div></div><div class="small-note" data-frag="4">And mainly because <b>now we can</b>. It used to be a daunting prospect. Today we collate large bibliometric and full-text datasets, explore them, and find relevant text spans far more quickly and intelligently. <b>Breaking through the stovepipes, and building more transversal knowledge.</b></div></section>
<section class="slide" data-t="Towards strategic analysis 3.0" data-n="One era at a time. Note that 2.0 is where most of the field still sits."><h2>Towards strategic analysis 3.0</h2><p class="sub">From analogue to digital, and then: <b>text is data</b>.</p><div class="split" style="gap:2.5%"><div class="stack" style="flex:0 0 40%;justify-content:center" data-frag="1"><img src="img/d1_analysis3.jpg" alt="Three eras of strategic analysis" style="width:100%;height:auto;max-height:54cqh;object-fit:contain;border-radius:3px"></div><div class="stack" style="flex:1;gap:.5em"><div class="card tint" data-frag="2"><div class="k">1.0 &middot; the expert</div><div class="d">One scholar, deep reading, a judgement you either trust or you do not. Analogue.</div></div><div class="card tint" data-frag="3"><div class="k">2.0 &middot; multiple perspectives</div><div class="d">Several experts, structured methods, contending views. Digital, but still bounded by how much a team can read.</div></div><div class="card tint" data-frag="4"><div class="k">3.0 &middot; text is data</div><div class="d">The record itself becomes measurable, at a scale no reading team reaches. Towards knowledge graphs.</div></div><div class="card hot" data-frag="5"><div class="k">The point of the arrow</div><div class="d"><b>Towards cumulative knowledge-building</b> &ndash; each study adding to a structure rather than restarting the argument.</div></div></div></div></section>
<section class="slide" data-t="Pub-centric to knowledge-centric" data-n="Reveal the stack, then the shift, then the cost. The cost card is the argument."><h2>From pub-centric to knowledge-centric</h2><p class="sub">The unit of knowledge is changing under us.</p><div class="split" style="gap:2.5%"><div class="stack" style="flex:0 0 44%;justify-content:center" data-frag="1"><img src="img/d1_pubcentric.jpg" alt="From a mountain of publications to a language model" style="width:100%;height:auto;max-height:56cqh;object-fit:contain;border-radius:3px"></div><div class="stack" style="flex:1;gap:.5em"><div class="card tint" data-frag="2"><div class="k">From: the publication</div><div class="d">The paper is the atom. To know something you find, read and remember whole documents &ndash; and the pile grows faster than anyone can read it.</div></div><div class="card tint" data-frag="3"><div class="k">To: the claim</div><div class="d">The atom becomes the individual <em>claim</em>, extractable and comparable across thousands of documents at once.</div></div><div class="card hot" data-frag="4"><div class="k">What that costs you</div><div class="d"><b>A claim you cannot trace back to its source is worthless.</b> Everything this week does about provenance exists because of that.</div></div></div></div></section>
<section class="slide" data-t="The 'real' IR vs 'our' IR" data-n="Climb the ladder one rung at a time, then reveal the short-circuit. Ask the room where their own work sits."><h2>From data to decisions: the &lsquo;real&rsquo; IR vs &lsquo;our&rsquo; IR</h2><p class="sub">Five rungs. Most of our field uses two of them.</p><div class="split" style="gap:2.5%"><div class="stack" style="flex:1;gap:.4em"><div class="card tint" data-frag="1"><div class="k">Data</div><div class="d">Signals. Numbers, text, audio, images, video. <em>Know nothing.</em></div></div><div class="card tint" data-frag="2"><div class="k">Information &middot; given context</div><div class="d">Useful, organized, structured.</div></div><div class="card tint" data-frag="3"><div class="k">Knowledge &middot; given meaning</div><div class="d">Contextual, synthesized, learned.</div></div><div class="card tint" data-frag="4"><div class="k">Insight &middot; given focus</div><div class="d">Applied, integrated, actionable.</div></div><div class="card tint" data-frag="5"><div class="k">Decisions &middot; given purpose</div><div class="d">Change. Movement.</div></div></div><div class="stack" style="flex:0 0 34%;justify-content:center"><div class="card hot" data-frag="6"><div class="k">And what we actually do</div><div class="d"><b>We jump from data straight to insight and decisions</b>, skipping information and knowledge entirely &ndash; no shared structure, nothing that accumulates. <em>That short-circuit is the whole problem this week is about.</em></div></div></div></div></section>
<section class="slide" data-t="RuBase: what's in a name" data-n="Reveal the map, then the three readings of Base. The third is the ambition."><h2>RuBase &ndash; what&rsquo;s in a name</h2><p class="sub">Ru &ndash; <b>Base</b>. Three readings, and the third is the point.</p><div class="split" style="gap:2.5%"><div class="stack" style="flex:0 0 34%;justify-content:center" data-frag="1"><img src="img/d1_name_map.jpg" alt="Russia in the colours of its flag" style="width:100%;height:auto;max-height:52cqh;object-fit:contain;border-radius:3px"></div><div class="stack" style="flex:1;gap:.5em"><div class="card tint" data-frag="2"><div class="k">A knowledge <b>base</b></div><div class="d">Somewhere the evidence actually lives, rather than being rediscovered per project.</div></div><div class="card tint" data-frag="3"><div class="k">The <b>base</b> of the DIKW pyramid</div><div class="d">The layer our field skips. Data made into information and knowledge, so that insight has something underneath it.</div></div><div class="card hot" data-frag="4"><div class="k">A new <b>foundation</b></div><div class="d">For <b>collaborative, cumulative knowledge-building</b> &ndash; work that adds up across people and years instead of restarting.</div></div></div></div></section>

<section class="slide" data-t="The scholarly record on your topic" data-n="Make them guess out loud BEFORE the number appears. The gap between guess and number is the lesson."><h2>The scholarly record on your topic</h2><p class="sub">Ask them to guess the size of their own field first. They will be wrong.</p><div class="split"><div class="stack"><div class="card num hot" data-frag="1"><div class="v">1,000 &ndash; 150k</div><div class="k">publications per topic</div><div class="d">What the scholarly knowledge base on most topics actually holds, in the largest bibliometric databases.</div></div></div><div class="stack"><div class="card " data-frag="2"><div class="k">Even the smallest databases</div><div class="d">Web of Science, Scopus &ndash; typically yield a few hundred publications on a topic.</div></div><div class="card hot" data-frag="3"><div class="k">Which is the problem</div><div class="d"><b>A figure far beyond human absorption capability.</b> Not a little beyond. Far beyond.</div></div></div></div></section>
<section class="slide img" data-t="Misleading tips of icebergs" data-n="The danger of the non-systematic literature review, in one picture."><img src="img/d2_tips.jpg" alt="Misleading tips of icebergs"></section>
<section class="slide" data-t="Two ways to explore the full record" data-n="The 0.15% is the hook: the method that reads the record is nearly absent FROM the record."><h2>Two ways to explore the full record</h2><p class="sub">And in both of them, search plays a critical role.</p><div class="split"><div class="stack"><div class="card " data-frag="1"><div class="k">Bibliometrics</div><div class="d">Read the shape of the record: who publishes, where, with whom, on what, and when.</div></div><div class="card " data-frag="2"><div class="k">LLMs and RAG</div><div class="d">Read the content of the record, at a scale no human coding team can match.</div></div></div><div class="stack"><div class="card num hot" data-frag="3"><div class="v">257 / 175,010</div><div class="k">occurrences of &lsquo;bibliometric&rsquo;</div><div class="d">A quick check in our own quite expansive Russian Foreign, Security and Defense Policy dataset. <b>Fewer than 0.15%</b> of scholarly publications mention it at all.</div></div></div></div><div class="small-note" data-frag="4"><b>But in both cases search plays a critical role &ndash; and we are not very skilled at it.</b> That is what the rest of today is about.</div></section>
<section class="slide" data-t="Where to get data?" data-n="The last line is the honest one: budget, not method, usually picks the database."><h2>Where to get the data</h2><p class="sub">The bibliometric databases, and what is wrong with each of them.</p><div class="grid c5 top"><div class="card " data-frag="1"><div class="k">Subscription-based</div><div class="d">And <b>(very) expensive</b>.</div></div><div class="card " data-frag="2"><div class="k">Hard to access</div><div class="d">Especially to retrieve in large quantities, which is what you actually need.</div></div><div class="card hot" data-frag="3"><div class="k">Of disappointing quality</div><div class="d">Many inconsistencies and omissions <em>even within</em> a single database.</div></div><div class="card " data-frag="4"><div class="k">Significantly overlapping</div><div class="d">Across databases &ndash; so more sources is not the same as more coverage.</div></div><div class="card " data-frag="5"><div class="k">And few value-added services</div><div class="d">Surprisingly few, given the price.</div></div></div><div class="small-note" data-frag="6">Scopus &middot; Web of Science &middot; Crossref &middot; Google Scholar &middot; Dimensions &middot; Semantic Scholar &middot; OpenAlex &middot; The Lens &middot; scite_ &middot; findr. The one you can afford is usually the one that decides your corpus.</div></section>

<section class="slide" data-t="Shaping a search strategy" data-n="The last card is the one that saves them at submission. Say why."><h2>Shaping a search strategy</h2><p class="sub">Six things a defensible strategy contains.</p><div class="grid c3 r2"><div class="card " data-frag="1"><div class="k">Key concepts</div><div class="d">And the meaningful terms that carry them.</div></div><div class="card " data-frag="2"><div class="k">Keywords or subject headings</div><div class="d">The controlled vocabulary, where the database has one.</div></div><div class="card " data-frag="3"><div class="k">Alternative keywords</div><div class="d">The synonyms, and the words the other half of the field uses.</div></div><div class="card hot" data-frag="4"><div class="k">Careful linking</div><div class="d">Care in linking concepts <b>correctly</b> &ndash; this is where most queries quietly break.</div></div><div class="card " data-frag="5"><div class="k">Regular evaluation</div><div class="d">Of the results, to keep the search focused.</div></div><div class="card hot" data-frag="6"><div class="k">A detailed record</div><div class="d">Of the final strategy. <b>You will re-run it at the end of the review</b> to catch what was published while you worked.</div></div></div></section>
<section class="slide img" data-t="How we actually built a query" data-n="Walk it line by line. This is the single most useful ten minutes of the day."><img src="img/x_buildquery.jpg" alt="How we actually built a query"></section>
<section class="slide" data-t="Boolean operators" data-n="Capitalisation is the boring rule that breaks the most student queries. Do not skip it."><h2>Boolean: AND</h2><p class="sub">Narrows. Returns only what carries both.</p><div class="split"><div class="stack"><div class="card hot" data-frag="1"><div class="k">Must be capitalised</div><div class="d">In almost every database. Lower-case <em>and</em> is usually treated as a stop word and silently ignored.</div></div><div class="card " data-frag="2"><div class="k">It narrows</div><div class="d">Every AND you add can only make the set smaller. That is the point, and it is also the risk.</div></div></div><div class="stack"><div class="card tint" data-frag="3"><div class="k">police AND ethics</div><div class="d">Returns only the documents that carry <b>both</b> terms &ndash; the overlap, not the union.</div></div></div></div></section>
<section class="slide" data-t="NOT - and why it is dangerous" data-n="This is the slide the seed corpus demonstrates on Tuesday. Flag it forward."><h2>Boolean: NOT</h2><p class="sub">Excludes. And it is the operator most likely to cost you a finding.</p><div class="split"><div class="stack"><div class="card " data-frag="1"><div class="k">What it is for</div><div class="d">Excluding words when you are getting too many results. In Google and some other databases, the minus sign does the same job.</div></div><div class="card tint" data-frag="2"><div class="k">test NOT drug</div><div class="d">Removes everything carrying <em>drug</em> &ndash; including the fitness, psychological and background senses you may have wanted.</div></div></div><div class="stack"><div class="card hot" data-frag="3"><div class="k">Why it is dangerous</div><div class="d"><b>A NOT term must be domain-FOREIGN.</b> If the noise speaks your own vocabulary, a NOT term removes signal along with it &ndash; and you will never see what it removed.</div></div><div class="card " data-frag="4"><div class="k">The worked case</div><div class="d"><em>Security</em> excluding <em>social security</em>: fine, because the noise is foreign. <em>Deterrence</em> excluding <em>crime</em>: not fine, because criminology is a cousin.</div></div></div></div></section><section class="slide" data-t="OR - the operator that does the recall work" data-n="The baskets on the next slide ARE OR-sets. Say so explicitly."><h2>Boolean: OR</h2><p class="sub">Widens. Returns anything carrying either term &ndash; and it is where recall comes from.</p><div class="split"><div class="stack"><div class="card " data-frag="1"><div class="k">What it is for</div><div class="d">Gathering the synonyms and the words the other half of your field uses. Every concept you care about is spelled several ways.</div></div><div class="card tint" data-frag="2"><div class="k">coercion OR compellence OR pressure</div><div class="d">Returns documents carrying <em>any</em> of them. Each term you add can only make the set larger.</div></div></div><div class="stack"><div class="card hot" data-frag="3"><div class="k">Why it matters most</div><div class="d"><b>AND and NOT can only shrink your results. OR is the only operator that grows them.</b> If you are missing literature, you are almost always missing an OR term, not an AND.</div></div><div class="card " data-frag="4"><div class="k">Bracket it, always</div><div class="d"><em>(coercion OR compellence) AND russia</em> is not the same query as <em>coercion OR (compellence AND russia)</em>. Databases differ on precedence; parentheses remove the doubt.</div></div></div></div></section><section class="slide" data-t="Proximity - AND with a distance limit" data-n="Check the database supports it before you build a query around it."><h2>Proximity</h2><p class="sub">AND, but only when the words are near each other. Where the baskets scheme comes from.</p><div class="split"><div class="stack"><div class="card " data-frag="1"><div class="k">What it is for</div><div class="d">Two words in the same 40,000-word document usually means nothing. Two words in the same sentence usually means something.</div></div><div class="card tint" data-frag="2"><div class="k">russia NEAR/5 coercion</div><div class="d">Within five words of each other. The operator is spelled differently everywhere: <em>NEAR/n</em>, <em>W/n</em>, <em>ADJn</em>, <em>PRE/n</em>.</div></div></div><div class="stack"><div class="card hot" data-frag="3"><div class="k">The scheme you will use</div><div class="d"><b>((a NEAR b) NEAR c)</b>, where a, b and c are your three baskets. That is how one concept gets widened without widening the others.</div></div><div class="card " data-frag="4"><div class="k">Check first, then rely on it</div><div class="d">Many databases do not implement proximity at all, and some ignore it silently rather than erroring. Test it on a query whose answer you already know.</div></div></div></div></section>
<section class="slide" data-t="Compiling baskets" data-n="Baskets are how you keep a query editable. One list per concept, never one long string."><h2>Compiling baskets</h2><p class="sub">The project was about Russian (a) international (b) coercion (c).</p><div class="split"><div class="stack"><div class="card " data-frag="1"><div class="k">One basket per conceptual element</div><div class="d">A basket of search terms for <b>a</b>, one for <b>b</b>, one for <b>c</b> &ndash; so each concept can be widened independently.</div></div><div class="card hot" data-frag="2"><div class="k">The generic scheme</div><div class="d"><b>((a near b) near c)</b></div></div></div><div class="stack"><div class="card " data-frag="3"><div class="k">What proximity search does</div><div class="d">It looks for documents where any word from basket <b>a</b> appears near any word from basket <b>b</b>, and either of those appears near a word from basket <b>c</b>.</div></div><div class="card tint" data-frag="4"><div class="k">Where the operators go</div><div class="d">Proximity operators sit <em>between</em> the words to be searched. Not every database implements them &ndash; check before you design around them.</div></div></div></div></section>
<section class="slide" data-t="Search is iterative" data-n="Page 100 is the habit that separates a search from a lucky first page."><h2>Search is iterative</h2><p class="sub">Four habits. None of them is optional.</p><div class="grid c4"><div class="card " data-frag="1"><div class="k">Check items from the first few pages</div><div class="d">Both the bad-looking and the good-looking ones. The good-looking ones are how you learn the vocabulary.</div></div><div class="card hot" data-frag="2"><div class="k">Try several items from beyond page 100</div><div class="d"><b>This is the one nobody does.</b> It is also the only way to find out whether your ranking is hiding anything.</div></div><div class="card " data-frag="3"><div class="k">If something looks suspicious, check it</div><div class="d">More carefully than feels necessary.</div></div><div class="card " data-frag="4"><div class="k">Try another query</div><div class="d">A single query is a hypothesis, not a search.</div></div></div></section>

<section class="slide" data-t="LLMs: pros and cons" data-n="The two hot cards are the ones that decide whether a result survives review."><h2>LLMs: pros and cons</h2><p class="sub">From the 2025 edition, and still the right ledger.</p><div class="split"><div class="stack"><div class="kicker">Pros</div><div class="card hot" data-frag="1"><div class="k">A broader aperture</div><div class="d">To contextualise and frame a policy research question.</div></div><div class="card " data-frag="2"><div class="k">Rapid summarisation</div><div class="d">Quickly digesting large volumes of publications.</div></div><div class="card " data-frag="3"><div class="k">Idea generation</div><div class="d">Brainstorming policy options, offering counterarguments, simulating dialogues between stakeholders.</div></div><div class="card " data-frag="4"><div class="k">Drafting support</div><div class="d">Versions of briefs, memos and reports in different styles. And visuals.</div></div></div><div class="stack"><div class="kicker">Cons</div><div class="card hot" data-frag="5"><div class="k">Hallucinations</div><div class="d">Text that sounds plausible but is not factually accurate or grounded in reality. This necessitates careful fact-checking.</div></div><div class="card " data-frag="6"><div class="k">Bias</div><div class="d">Trained on data that may carry societal biases, potentially producing discriminatory or harmful output.</div></div><div class="card hot" data-frag="7"><div class="k">No deep reasoning</div><div class="d">Excellent at pattern recognition, but often struggling with true causal understanding or complex analysis.</div></div></div></div></section>
<section class="slide" data-t="Bibliographical RAG - the workflow" data-n="Step 4 is where the credibility lives. Say so."><h2>A workflow for bibliographic RAG</h2><p class="sub">Five steps. The fourth is the one people skip.</p><div class="grid c5 top"><div class="card num " data-frag="1"><div class="v">1</div><div class="k">Define your research question</div><div class="d"></div></div><div class="card num " data-frag="2"><div class="v">2</div><div class="k">Retrieve</div><div class="d">Write a query, or upload the PDFs.</div></div><div class="card num " data-frag="3"><div class="v">3</div><div class="k">Analyze and synthesise</div><div class="d">Ask questions against the provided context.</div></div><div class="card num hot" data-frag="4"><div class="v">4</div><div class="k">Review and validate</div><div class="d">Cross-check what the model found against a traditional literature review. <b>This is the step that gets skipped.</b></div></div><div class="card num " data-frag="5"><div class="v">5</div><div class="k">Document and iterate</div><div class="d">Keep a record of your process, for transparency and reproducibility.</div></div></div></section>
<section class="slide" data-t="Key tools" data-n="Do not demo these. Name them, say the list rots, move on."><h2>Tools for bibliographic RAG</h2><p class="sub">The landscape as of the 2025 edition. It moves; the workflow does not.</p><div class="split"><div class="stack"><div class="card tint" data-frag="1"><div class="k">Built on OpenAI GPTs</div><div class="d">Dimensions Research GPT &middot; Scholar GPT &middot; Scholar AI</div></div><div class="card tint" data-frag="2"><div class="k">Purpose-built for the literature</div><div class="d">consensus &middot; scite_ &middot; elicit &middot; scipace</div></div></div><div class="stack"><div class="card tint" data-frag="3"><div class="k">General assistants doing the job</div><div class="d">NotebookLM &middot; OpenAI Deep Research &middot; DeepSeek</div></div><div class="card tint" data-frag="4"><div class="k">Open</div><div class="d">OpenScholar</div></div></div></div><div class="small-note" data-frag="5">Named for orientation, <b>not endorsed</b>. The half-life of this list is months; the workflow on the previous slide is what survives it.</div></section>

<section class="slide" data-t="What are ontologies and taxonomies?" data-n="The tiger example does the work. Do not over-explain it."><h2>What are ontologies and taxonomies?</h2><p class="sub">Both organize knowledge. They do slightly different jobs.</p><div class="split"><div class="stack"><div class="card " data-frag="1"><div class="k">A taxonomy classifies</div><div class="d">Concepts into hierarchical, tree-like structures, grouping related entities under broader categories and defining <b>is-a</b> relationships. <em>A tiger is a mammal.</em></div></div><div class="card tint" data-frag="2"><div class="k">Like a library classification</div><div class="d">Books on physics are grouped together.</div></div></div><div class="stack"><div class="card hot" data-frag="3"><div class="k">An ontology relates</div><div class="d">It goes beyond classification by defining relationships between concepts: rules, attributes and connections describing how elements interact. <em>A tiger preys on deer. A tiger's habitat is the jungle.</em></div></div><div class="card tint" data-frag="4"><div class="k">Like a knowledge graph</div><div class="d">Books linked not just by category but by content, themes and authors.</div></div></div></div></section>
<section class="slide" data-t="Why they matter for cumulative knowledge" data-n="The third example is the one about us. Land it and move."><h2>Why they matter for cumulative knowledge</h2><p class="sub">Progress depends on building on previous findings rather than rediscovering them.</p><div class="grid c4"><div class="card " data-frag="1"><div class="k">Structuring information</div><div class="d">A common language for concepts, reducing ambiguity and organizing knowledge systematically.</div></div><div class="card " data-frag="2"><div class="k">Facilitating discoverability</div><div class="d">Well-classified work can be retrieved and compared efficiently, which reduces duplicated effort.</div></div><div class="card " data-frag="3"><div class="k">Enabling interdisciplinary research</div><div class="d">Ontologies define connections between fields, so researchers in different disciplines can understand each other's concepts.</div></div><div class="card hot" data-frag="4"><div class="k">Supporting machine learning</div><div class="d">Many AI systems rely on structured knowledge representations to interpret data, recognize patterns and generate new hypotheses.</div></div></div><div class="small-note" data-frag="5"><b>In biology</b> the Gene Ontology keeps gene functions described consistently across species and studies. <b>In astronomy</b> stellar classification standardises how types of star are described. <b>In the social sciences</b> the lack of rigorous taxonomies leaves terms like <em>power</em> and <em>institutions</em> used inconsistently, and studies fragmented.</div></section>
<section class="slide" data-t="Patchy scientific uptake" data-n="The context-dependent defence is the one they will raise. Pre-empt it here."><h2>Patchy scientific uptake</h2><p class="sub">Some fields built the instrument. Ours did not.</p><div class="split"><div class="stack"><div class="kicker">Well developed</div><div class="card " data-frag="1"><div class="k">Biology and medicine</div><div class="d">Gene Ontology, SNOMED CT and ICD give research and clinical practice a structured language.</div></div><div class="card " data-frag="2"><div class="k">Computer science and AI</div><div class="d">Ontologies power knowledge graphs, semantic search and expert systems: the Semantic Web, WordNet.</div></div><div class="card " data-frag="3"><div class="k">Linguistics, astronomy and physics</div><div class="d">FrameNet and Universal Dependencies; Harvard stellar classification for celestial objects, particles and phenomena.</div></div></div><div class="stack"><div class="kicker">Underdeveloped</div><div class="card hot" data-frag="4"><div class="k">Social sciences</div><div class="d"><em>Power</em>, <em>identity</em> and <em>institutions</em> used inconsistently across studies and subfields.</div></div><div class="card hot" data-frag="5"><div class="k">International relations and political science</div><div class="d">No rigorous taxonomies for geopolitical strategies, military doctrines or diplomatic norms.</div></div><div class="card hot" data-frag="6"><div class="k">History, humanities, economics</div><div class="d">Classification informal and subjective; macroeconomic concepts like <em>inflation expectations</em> lack standard definitions across models.</div></div></div></div><div class="small-note" data-frag="7"><b>Why some fields lag:</b> they rely on fluid, interpretive concepts rather than strictly defined categories; standardized datasets are missing, which makes formal classification harder; and IR and political science actively resist rigid taxonomies <b>because their concepts are context-dependent</b>. That last one is an argument, not an excuse.</div></section>
<section class="slide img" data-t="Multidimensional taxonomies: an analogy" data-n="The one slide that makes multi-dimensionality click."><img src="img/d3_analogy.jpg" alt="Multidimensional taxonomies: an analogy"></section>
<section class="slide" data-t="The taxonomy generation prompt (1)" data-n="HLTP is our word and it needs saying once, slowly. It is just: an independent way of looking at the thing."><h2>The taxonomy generation prompt</h2><p class="sub">What you are asking for, before you ask for it.</p><div class="split"><div class="stack"><div class="card " data-frag="1"><div class="k">A multi-dimensional taxonomy</div><div class="d">A framework for analyzing a complex domain through <b>multiple independent analytical perspectives</b>, each a fundamental way of looking at the subject.</div></div><div class="card hot" data-frag="2"><div class="k">Not the usual thing</div><div class="d">Traditional hierarchical taxonomies organize concepts along a <em>single</em> dimension. Complex phenomena live in spaces where several factors operate at once, and independently.</div></div></div><div class="stack"><div class="kicker">Four levels</div><div class="card " data-frag="3"><div class="k">HLTP</div><div class="d"><b>High-Level Taxonomic Principles</b>: the independent dimensions, the lenses. Temporal, geographical, power application.</div></div><div class="card " data-frag="4"><div class="k">Second and third level</div><div class="d">Major divisions within each principle, then the specific operational areas within those.</div></div><div class="card tint" data-frag="5"><div class="k">Taxa</div><div class="d">The concrete instances that get classified along every dimension.</div></div></div></div></section>
<section class="slide" data-t="The taxonomy generation prompt (2)" data-n="These five ARE the independence test they run in the hands-on block. Flag it forward."><h2>And how to test the dimensions you get back</h2><p class="sub">Five criteria. A dimension that fails one of them is not a dimension.</p><div class="grid c5 top"><div class="card hot" data-frag="1"><div class="k">Independence</div><div class="d">Does this dimension vary <b>independently</b> of the others?</div></div><div class="card " data-frag="2"><div class="k">Universality</div><div class="d">Can <b>all</b> instances in the domain be classified along it?</div></div><div class="card " data-frag="3"><div class="k">Fundamentality</div><div class="d">Does it capture something essential, rather than superficial?</div></div><div class="card " data-frag="4"><div class="k">Distinctiveness</div><div class="d">Does it give a genuinely <b>unique</b> analytical perspective?</div></div><div class="card " data-frag="5"><div class="k">Utility</div><div class="d">Does it reveal insight, or support practical work?</div></div></div><div class="small-note" data-frag="6"><b>The method that produces them:</b> define the domain boundaries &middot; brainstorm dimensions from several perspectives &middot; review the literature for existing frameworks &middot; consult domain experts &middot; and ask, from first principles, what fundamentally defines this domain. <em>Independence is the one that fails most often, and Wednesday&#39;s hands-on tests exactly that.</em></div></section>

<section class="slide" data-t="The independence test" data-n="The quality gate. Peer-swap taxonomies here and let them break each other&#x27;s."><h2>The independence test</h2><p class="sub">A taxonomy is only an instrument if its dimensions are actually independent.</p><div class="grid c3"><div class="card " data-frag="1"><div class="k">Can a case score high on A and low on B?</div><div class="d">If not, A and B are the same dimension wearing two names.</div></div><div class="card " data-frag="2"><div class="k">Does every taxon have a plausible negative case?</div><div class="d">If nothing could fail to qualify, the taxon measures nothing.</div></div><div class="card hot" data-frag="3"><div class="k">Would a second coder assign the same label?</div><div class="d">If not, you have a vocabulary, not a scheme.</div></div></div><div class="small-note" data-frag="4">Target for your own: <b>8&ndash;12 dimensions</b>, tested for independence, before you classify anything. The prompt that generates one is in <a href="index.html#materials">Materials</a> &ndash; it is the real one we use, with the domain left blank.</div></section>
<section class="slide" data-t="What your instrument cannot see" data-n="The RRLS blind spot, generalised. This is the idea they should still have in five years."><h2>What your instrument cannot see</h2><p class="sub">The most transferable idea of the week.</p><div class="split"><div class="stack"><div class="card " data-frag="1"><div class="k">A real filter, from our own work</div><div class="d">A statement enters the set only if it carries <b>both</b> a boundary span <b>and</b> a threatened-consequence span.</div></div><div class="card hot" data-frag="2"><div class="k">The consequence</div><div class="d">Deliberately deniable coercion is invisible <b>by construction</b>. Two documents sit in the corpus and produced <b>zero</b> hits.</div></div></div><div class="stack"><div class="body-lg">The rejections were <em>correct</em> on the coding scheme.<br>It is not a bug.</div><p class="sub" style="margin:0">An instrument only sees what its definition admits. Write down, today, what yours is built to miss.</p></div></div></section>

<section class="slide" data-t="Prompting an LLM to assign chunks to taxonomic elements" data-n="Read the two bolded constraints out loud. Everything on Thursday depends on them."><h2>The assignment prompt</h2><p class="sub">Verbatim from the pipeline. This is the whole of what tells the model what to do.</p><div class="promptwrap"><div><pre class="prompt"><span class="c">system_prompt</span>

You are an <b>expert military analyst</b> specializing in assessing
military capabilities and strategic trends in assessing Russian
military regeneration prospects.

Your task is to <b>classify each text chunk</b> according to our
taxonomy that lists various important aspects of Russia&#39;s
military regeneration aptitude.

Below is the taxonomy in JSON form for your reference. You must
<b>ONLY use Tier-3 name values present in this taxonomy</b>.

<span class="c">[TAXONOMY START]  ... the whole scheme is injected here ...</span></pre></div><div><pre class="prompt"><span class="c">for each text chunk</span>

&bull; Read the chunk carefully.

&bull; Identify any content that matches the definitions of any
  Tier-3 node in the taxonomy <b>exactly</b>.

&bull; Assign a Tier-3 node <b>only if there is direct evidence</b>
  or a clear match in the chunk&#39;s text to that node&#39;s
  definition. <b>If unsure, leave it untagged.</b>

&bull; Return an array element with: chunk_id (the index),
  tier3_tags (array of Tier-3 node names that apply).</pre></div></div><div class="small-note" data-frag="1"><b>Two lines carry the whole method.</b> <em>Only use names present in this taxonomy</em> stops the model inventing categories; <em>if unsure, leave it untagged</em> is what makes the output honest rather than complete. A model that always answers is a model you cannot measure.</div></section>

<section class="slide" data-t="Prompting an LLM to analyse all chunks for one element" data-n="The chunk-ID requirement is the point. Say why before you show the write-up."><h2>The analysis prompt</h2><p class="sub">Once the chunks are labeled, this is what turns labels into an argument.</p><pre class="prompt">You are an expert in military analysis. Your task is to <b>analyze a specific topic</b>,
focusing on its implications for Russian military regeneration capabilities. The analysis
will be conducted using data provided as input, and it should <b>reference the chunk IDs</b>
associated with the specific text used to support each observation.</pre><div class="grid c4"><div class="card num " data-frag="1"><div class="v">1</div><div class="k">Summary</div><div class="d">Key points for this topic, and how they relate to the capacity to regenerate across domains. <b>Explicitly mention strengths and weaknesses.</b> Reference the chunk IDs.</div></div><div class="card num " data-frag="2"><div class="v">2</div><div class="k">Themes</div><div class="d">The recurring themes and subtopics &ndash; manpower, logistics, equipment, adaptability, industrial capacity, economic resilience. <b>Specific examples with chunk IDs.</b></div></div><div class="card num hot" data-frag="3"><div class="v">3</div><div class="k">Evolution</div><div class="d">How the discussion changed over time, <b>using months as the primary unit</b>, tied to specific events. Highlight turning points.</div></div><div class="card num hot" data-frag="4"><div class="v">4</div><div class="k">Author and source differences</div><div class="d">Where sources agree, disagree, or are simply silent. <b>Silence is a finding.</b></div></div></div><div class="small-note" data-frag="5">Every instruction demands <b>a chunk ID</b>. That is not bureaucracy: it is what makes the write-up auditable, and it is the difference between an analysis you can defend and a summary you have to be trusted on.</div></section>
