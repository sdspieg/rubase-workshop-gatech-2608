<section class="slide" data-t="For 2,300 years: the four humors" data-n="Reveal the wheel first, then the four humors one at a time. As you go: blood, phlegm and yellow bile are real substances. Black bile is not - there is no such thing in the human body. It exists because the grid required something cold and dry for autumn and earth. What people actually saw was clotted blood, or melena, the black stool of an upper GI bleed. The word survives in melancholia. The point lands on the fourth card: four elements, four seasons, four temperaments, complete internal consistency, one invented ingredient, and not one measurement in 2,300 years. Origin: the tetrad came from Empedocles four roots and Alcmaeon balance-of-opposites, not from medicine - the foursome was imported and the body was fitted to it. First stated in the Hippocratic On the Nature of Man, c. 400 BCE, and NOT the consensus even inside the Hippocratic Corpus; it won because Galen adopted it. The temperaments-as-personalities layer is later still, largely late-antique and medieval. Therapy ran on contraria contrariis curantur: venesection and leeches for blood, emetics and purgatives for yellow bile, errhines for phlegm, hellebore for black bile, all inside the six non-naturals regimen. What ended it was not Vesalius 1543 or Harvey 1628, both of which it absorbed. It was Pierre Louis in the 1830s counting outcomes in bled and unbled pneumonia patients, then cellular pathology 1858 and germ theory. Roughly 2,300 years, ended by arithmetic." data-sid="e2c812"><h2>For 2,300 years: &lsquo;humors&rsquo;, &lsquo;spirits of the body&rsquo;, &lsquo;temperaments&rsquo;</h2><p class="sub">Hippocrates, c. 400 BCE &ndash; Pierre Louis&rsquo;s outcome counts, the 1830s: roughly 2,300 years. A complete theory of the body. Internally consistent. Entirely wrong.</p><div class="split" style="gap:2%"><div class="stack" style="flex:0 0 58%" data-frag="1"><img src="img/d1_humors_wheel.png" alt="Medieval diagram of the four humors" style="width:100%;height:auto;max-height:70cqh;object-fit:contain;border-radius:3px"></div><div class="stack" style="flex:1;gap:.5em"><div class="card tint solo" data-frag="2"><div class="k">Blood &middot; sanguine</div><div class="d">Air, spring, hot and moist. Cheerful, optimistic, energetic.</div></div><div class="card tint solo" data-frag="3"><div class="k">Yellow bile &middot; choleric</div><div class="d">Fire, summer, hot and dry. Ambitious, commanding, quick to anger.</div></div><div class="card tint solo" data-frag="4"><div class="k">Black bile &middot; melancholic</div><div class="d">Earth, autumn, cold and dry. Introspective, thoughtful, depressive.</div></div><div class="card tint solo" data-frag="5"><div class="k">Phlegm &middot; phlegmatic</div><div class="d">Water, winter, cold and moist. Calm, reliable, sluggish.</div></div><div class="card hot solo" data-frag="6"><div class="d"><b>Four elements, four seasons, four temperaments &ndash; and not one measurement.</b></div></div></div></div></section>
<section class="slide obuild" data-t="The 'omics" data-sid="04c7c6" data-n="&lt;b&gt;DELIVERY&lt;/b&gt; &middot; this is the ORIGINAL picture, taken apart. Each click adds ONE real component of the diagram AND the box that explains it; the previous box goes away, so there is only ever one to read.&lt;ul&gt;&lt;li&gt;&lt;b&gt;Order:&lt;/b&gt; DNA &rarr; genes &rarr; chromosomes &rarr; the cell &rarr; proteins &rarr; molecular machines &rarr; the living cell &rarr; communities of cells. Smallest thing in the body, to the whole body.&lt;/li&gt;&lt;li&gt;&lt;b&gt;The beat to hold is the cell:&lt;/b&gt; &lt;b&gt;30&ndash;40 trillion&lt;/b&gt; of them, every one carrying the whole genome and reading a different part of it. That is the sentence people remember.&lt;/li&gt;&lt;li&gt;&lt;b&gt;The point is the last card:&lt;/b&gt; each layer measured &lt;b&gt;WHOLE&lt;/b&gt;, then &lt;b&gt;integrated&lt;/b&gt;. Not a collection of facts.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Close on the dates:&lt;/b&gt; &lt;i&gt;finished&lt;/i&gt; human genome &lt;b&gt;2003&lt;/b&gt; &middot; Human Microbiome Project &lt;b&gt;2007&lt;/b&gt; &middot; cryo-EM resolution revolution &lt;b&gt;2013&lt;/b&gt; &middot; AlphaFold &lt;b&gt;2020&lt;/b&gt;. 2003 was not &lt;i&gt;complete&lt;/i&gt;: the first gapless human genome, &lt;b&gt;T2T-CHM13&lt;/b&gt;, came only in &lt;b&gt;April 2022&lt;/b&gt;.&lt;/li&gt;&lt;li&gt;AlphaFold took the &lt;b&gt;2024 Nobel Prize in Chemistry&lt;/b&gt; (Hassabis and Jumper) &ndash; useful if anyone doubts this is mainstream science.&lt;/li&gt;&lt;li&gt;&lt;b&gt;GUARD RAIL:&lt;/b&gt; do NOT claim genomics itself is that young. &lt;i&gt;Sanger sequencing is 1977&lt;/i&gt; and the word &lt;i&gt;genomics&lt;/i&gt; dates to &lt;b&gt;1986&lt;/b&gt;. A sharp student will say so.&lt;/li&gt;&lt;/ul&gt;&lt;b&gt;THE MOVE:&lt;/b&gt; not an old achievement admired from a distance. &lt;b&gt;It happened on our watch&lt;/b&gt; &ndash; which removes the excuse that IR is too young or too hard."><h2>The &lsquo;omics&rsquo;</h2><p class="sub">One living system, measured layer by layer &ndash; and then put back together.</p><div class="ob-pic"><img class="ob-plate" src="img/omics/plate.png" alt=""><div class="ob-step" data-frag="1"><img src="img/omics/dna.png" alt="DNA"><div class="ob-note" style="--x:50%;--y:7%;--w:45%"><div class="k">DNA</div><div class="d">The molecule itself, in every cell that has a nucleus. About <b>two metres</b> of it, wound into a nucleus roughly six micrometres across &ndash; and the sequence is the <em>same</em> in all of them. Your liver cells and your neurons are running identical code. <b>Around 3.1 billion</b> base pairs, four letters, one alphabet.</div></div></div><div class="ob-step" data-frag="1"><img src="img/omics/genes.png" alt="Genes"><div class="ob-note" style="--x:50%;--y:7%;--w:45%"><div class="k">Genes</div><div class="d">Stretches of that sequence that code for a protein. There are roughly <b>20,000</b> of them, and together they are <b>under 2%</b> of the sequence. For decades the other 98% was called junk. It is not: much of it decides <em>which</em> genes get read, <em>where</em>, and <em>when</em>. The regulation turned out to matter as much as the parts.</div></div></div><div class="ob-step" data-frag="1"><img src="img/omics/chromosome.png" alt="Chromosomes"><div class="ob-note" style="--x:50%;--y:7%;--w:45%"><div class="k">Chromosomes</div><div class="d">The same molecule again, wound up for storage. <b>46</b> of them, 23 pairs, in every one of those cells. Nothing new is added at this level &ndash; it is the identical information at a coarser scale. Worth saying out loud, because the layers of an &lsquo;omics are not a hierarchy of <em>importance</em>. They are a hierarchy of <b>resolution</b>.</div></div></div><div class="ob-step" data-frag="1"><img src="img/omics/cell.png" alt="The cell"><div class="ob-note" style="--x:55%;--y:28%;--w:43%"><div class="k">The cell</div><div class="d"><b>30&ndash;40 trillion</b> cells in one human body. Every single one carries the <em>whole</em> genome &ndash; and reads a different part of it. A liver cell and a neuron are not different code; they are the same code, differently expressed. <b>Which is the whole problem in one sentence: the parts list does not tell you what the system is doing.</b></div></div></div><div class="ob-step" data-frag="1"><img src="img/omics/protein.png" alt="Proteins"><div class="ob-note" style="--x:55%;--y:24%;--w:43%"><div class="k">Proteins</div><div class="d">What the genes are actually <em>for</em>. The sequence is the parts list; proteins are what gets built from it &ndash; and there are far more proteins than there are genes, because one gene yields many variants. This is where the causal story starts to run: not the letters, but the things the letters cause to exist.</div></div></div><div class="ob-step" data-frag="1"><img src="img/omics/machine.png" alt="Molecular machines"><div class="ob-note" style="--x:58%;--y:14%;--w:39%"><div class="k">Molecular machines</div><div class="d">Proteins do not work alone; they assemble into machines. And function lives in the folded <b>shape</b>, not in the letters &ndash; which is why knowing the sequence was never enough. Predicting that shape from the sequence was an open problem in biology for <em>fifty years</em>. <b>That is the one AlphaFold solved</b>, and it is why this layer became measurable at scale.</div></div></div><div class="ob-step" data-frag="1"><img src="img/omics/livingcell.png" alt="The living cell"><div class="ob-note" style="--x:58%;--y:2%;--w:39%"><div class="k">The living cell</div><div class="d">The parts, wired together and running. Thousands of reactions at once, each regulating the others &ndash; <b>behaviour, not components</b>. None of this is visible in the genome, and none of it contradicts the genome. It is a different layer, and it has to be measured on its own terms.</div></div></div><div class="ob-step" data-frag="1"><img src="img/omics/community.png" alt="Communities of cells"><div class="ob-note" style="--x:3%;--y:55%;--w:37%"><div class="k">Communities of cells</div><div class="d">Cells in communities: tissues, organs, an organism. The same move once more &ndash; each level is the one below it read at a higher scale, and each one needs its own instrument. Add the microbiome and it is not even all your own DNA: <b>a second genome you did not inherit</b>, carried around in the same body.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-scrim"></div><div class="ob-note wide" style="--x:6%;--y:22%;--w:88%"><div class="k">And then: integration</div><div class="d"><b>Each layer measured whole, then the layers read together.</b> That integration is what makes it an &lsquo;omics rather than a collection of facts. No single layer is the truth: the genome does not tell you the behaviour, and the behaviour does not tell you the code. <b>We have nothing remotely like this for a conflict</b> &ndash; which is the argument for the rest of the week.</div></div><div class="ob-dates">Genome 2003 &middot; complete only 2022 &middot; microbiome 2007 &middot; AlphaFold 2020 &ndash; the integration is younger than most people in this room.</div></div></div></section>
<section class="slide" data-t="genomics : the genome :: geomics : the conflict" data-n="&lt;b&gt;OUR framing&lt;/b&gt;, not a borrowed biology analogy. &lt;ul&gt; &lt;li&gt;&lt;b&gt;Say the tumour line out loud&lt;/b&gt; &ndash; it is the one that lands.&lt;/li&gt; &lt;li&gt;&lt;b&gt;Then point at the dashed arrows:&lt;/b&gt; that is the honest difference. &lt;b&gt;No central dogma&lt;/b&gt;, so cross-layer structure is &lt;i&gt;estimated&lt;/i&gt;, not assumed.&lt;/li&gt; &lt;li&gt;The slide now builds &lt;b&gt;pair by pair&lt;/b&gt; &ndash; genome&harr;discourse, transcriptome&harr;doctrine, proteome&harr;decisions, phenotype&harr;behavior. &lt;b&gt;Let each pair land before moving on.&lt;/b&gt;&lt;/li&gt; &lt;/ul&gt;" data-sid="2363ed"><h2>genomics : the genome  ::  geomics : the conflict</h2><p class="sub">We can profile a tumour in a day. We still size up how adversaries portray each other by hunch.</p><figure class="viz" style="margin:0"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 342" style="width:100%;height:auto;max-height:66cqh;border-radius:3px" role="img" aria-label="Biology measures four layers linked by a known causal structure; geomics measures four layers of a conflict whose links are estimated, not assumed."><style>.h{font:700 12px system-ui,sans-serif;fill:#dbad50;letter-spacing:.09em}.l{font:600 14px system-ui,sans-serif;fill:#e8edf3}.m{font:400 11px system-ui,sans-serif;fill:#9fb3c8}.n{font:400 12px system-ui,sans-serif;fill:#9fb3c8}.g{font:italic 600 12.5px system-ui,sans-serif;fill:#dbad50}</style><defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dbad50"/></marker><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6f8bab"/></marker></defs><rect width="960" height="342" fill="#09182f"/><g data-frag="1"><text x="38" y="30" class="h">GENOMICS : THE GENOME</text><text x="38" y="178" class="h">GEOMICS : THE CONFLICT</text></g><g data-frag="2"><rect x="38" y="42" width="203" height="58" rx="7" fill="#142846" stroke="#27446e"/><text x="53" y="66" class="l">Genome</text><text x="53" y="84" class="m">the code, sequenced</text><rect x="38" y="190" width="203" height="58" rx="7" fill="#142846" stroke="#27446e"/><text x="53" y="214" class="l">Discourse</text><text x="53" y="232" class="m">how they portray</text></g><g data-frag="3"><line x1="245" y1="71" x2="265" y2="71" stroke="#dbad50" stroke-width="2.4" marker-end="url(#s)"/><rect x="270" y="42" width="203" height="58" rx="7" fill="#142846" stroke="#27446e"/><text x="285" y="66" class="l">Transcriptome</text><text x="285" y="84" class="m">what is expressed</text><line x1="245" y1="219" x2="265" y2="219" stroke="#6f8bab" stroke-width="2.4" stroke-dasharray="4 4" marker-end="url(#d)"/><rect x="270" y="190" width="203" height="58" rx="7" fill="#142846" stroke="#27446e"/><text x="285" y="214" class="l">Doctrine</text><text x="285" y="232" class="m">what they declare</text></g><g data-frag="4"><line x1="477" y1="71" x2="497" y2="71" stroke="#dbad50" stroke-width="2.4" marker-end="url(#s)"/><rect x="502" y="42" width="203" height="58" rx="7" fill="#142846" stroke="#27446e"/><text x="517" y="66" class="l">Proteome</text><text x="517" y="84" class="m">what is built</text><line x1="477" y1="219" x2="497" y2="219" stroke="#6f8bab" stroke-width="2.4" stroke-dasharray="4 4" marker-end="url(#d)"/><rect x="502" y="190" width="203" height="58" rx="7" fill="#142846" stroke="#27446e"/><text x="517" y="214" class="l">Decisions</text><text x="517" y="232" class="m">what they commit</text></g><g data-frag="5"><line x1="709" y1="71" x2="729" y2="71" stroke="#dbad50" stroke-width="2.4" marker-end="url(#s)"/><rect x="734" y="42" width="203" height="58" rx="7" fill="#142846" stroke="#27446e"/><text x="749" y="66" class="l">Phenotype</text><text x="749" y="84" class="m">what presents</text><line x1="709" y1="219" x2="729" y2="219" stroke="#6f8bab" stroke-width="2.4" stroke-dasharray="4 4" marker-end="url(#d)"/><rect x="734" y="190" width="203" height="58" rx="7" fill="#142846" stroke="#27446e"/><text x="749" y="214" class="l">Behavior</text><text x="749" y="232" class="m">what the conflict does</text></g><g data-frag="6"><text x="38" y="122" class="n">Central dogma &ndash; the links between layers are <tspan fill="#dbad50" font-weight="600">known</tspan>.</text><text x="38" y="270" class="n">No central dogma, no meiosis &ndash; the links are <tspan fill="#e8edf3" font-weight="600">estimated</tspan>, not assumed.</text></g><g data-frag="7"><rect x="38" y="300" width="884" height="30" rx="6" fill="#12243f" stroke="#27446e"/><text x="480" y="320" class="g" text-anchor="middle">Measure every layer, then integrate &ndash; the conflict as the disease, its parties as the patients.</text></g></svg></figure><div class="small-note" data-frag="8">Reading meaning at this scale was impossible before large language models. That is what changed, and it is the only thing that changed. <b>geomics.org</b></div></section>

<section class="slide obuild afb" data-t="The AlphaFold moment" data-sid="314842" data-n="&lt;b&gt;DELIVERY&lt;/b&gt; &middot; show the figure, then the four claims one at a time. The fourth is the one that lands.&lt;ul&gt;&lt;li&gt;&lt;b&gt;All four are visible now&lt;/b&gt; &ndash; in the 2025 PowerPoint the fourth bullet ran off the bottom of the slide and was never seen.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Walk the figure top to bottom:&lt;/b&gt; panels a and b are the &lt;i&gt;prediction laid over the crystal structure&lt;/i&gt; &ndash; colour is AlphaFold, grey is the experiment. Then the accuracy bars against the previous best methods, for nucleic acids, covalent modifications and proteins. Then the architecture.&lt;/li&gt;&lt;li&gt;&lt;b&gt;AlphaFold took the 2024 Nobel Prize in Chemistry&lt;/b&gt; (Hassabis and Jumper) &ndash; useful if anyone doubts this is mainstream science.&lt;/li&gt;&lt;li&gt;&lt;b&gt;PROVENANCE:&lt;/b&gt; this is the ORIGINAL figure, unzipped from the 2025 PowerPoint's own media (&lt;code&gt;image55.png&lt;/code&gt;, 2116&times;1639) &ndash; not the cropped sliver the HTML deck had been showing. Source: Abramson et al., &lt;i&gt;Accurate structure prediction of biomolecular interactions with AlphaFold&nbsp;3&lt;/i&gt;, Nature 2024, Fig.&nbsp;1.&lt;/li&gt;&lt;li&gt;&lt;b&gt;CHECK BEFORE SAYING IT:&lt;/b&gt; the &lt;i&gt;100,000&lt;/i&gt; comparison is carried over from 2025 and looks low &ndash; the PDB held closer to 200,000 experimentally determined structures by then. &lt;b&gt;Say &quot;a couple of hundred thousand&quot;&lt;/b&gt; rather than a number you cannot source in the room.&lt;/li&gt;&lt;/ul&gt;&lt;b&gt;THE MOVE:&lt;/b&gt; not an old achievement admired from a distance &ndash; &lt;b&gt;it happened on our watch.&lt;/b&gt;"><h2>The AlphaFold moment</h2><p class="sub">What happens when a field finally gets its instrument.</p><div class="ob-pic"><img class="ob-plate" src="img/d1_alphafold_fig.png" alt="AlphaFold 3 figure 1: predicted structures over experimental ones, accuracy against prior methods, and the model architecture"><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/d1_alphafold_fig.png" style="clip-path:inset(0% 0% 71% 0%)" alt=""><div class="ob-note" style="--x:8%;--y:36%;--w:84%"><div class="k">Prediction over experiment</div><div class="d">Two solved test cases, not curated examples. <b>Colour is AlphaFold 3&rsquo;s prediction, grey is the actual crystal structure</b> &ndash; a protein bound to DNA on the left, an antibody locked onto its target on the right.</div></div></div><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/d1_alphafold_fig.png" style="clip-path:inset(29% 0% 30% 0%)" alt=""><div class="ob-note" style="--x:8%;--y:66%;--w:84%"><div class="k">Tested against the field, not itself</div><div class="d">Four separate benchmarks &ndash; ligands, nucleic acids, covalent modifications, protein complexes &ndash; each scored against the best prior method. <b>AlphaFold 3 wins on every one.</b></div></div></div><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/d1_alphafold_fig.png" style="clip-path:inset(70% 0% 0% 0%)" alt=""><div class="ob-note" style="--x:2%;--y:63%;--w:34%"><div class="k">One network, any input</div><div class="d">Sequences, ligands and covalent bonds go in; a diffusion module turns noise into coordinates.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-scrim"></div><div class="ob-note wide" style="--x:8%;--y:34%;--w:84%"><div class="k">200 million structures</div><div class="d">Against a couple of hundred thousand solved experimentally over decades &ndash; and now in minutes.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-note wide" style="--x:8%;--y:34%;--w:84%"><div class="k">Beyond proteins</div><div class="d">DNA, RNA and small-molecule interactions, about <b>50% more accurately</b> than the methods before it.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-note wide" style="--x:8%;--y:34%;--w:84%"><div class="k">Real-world impact</div><div class="d">Drug discovery, food security, and much besides &ndash; and the <b>2024 Nobel Prize in Chemistry</b>.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-note wide hot" style="--x:8%;--y:34%;--w:84%"><div class="k">And for us?</div><div class="d"><b>Imagine the same leap for global crises and diplomatic behaviour.</b> That is what this week is about.</div></div></div></div></section><section class="slide obuild lungb" data-t="Same organ, different disease" data-sid="lung01" data-n="&lt;b&gt;DELIVERY&lt;/b&gt; &middot; the medicine column first, all three steps, then the conflict column. Do not rush the turn &ndash; the audience should see the second column arriving as a copy of the first and then notice it is NOT.&lt;ul&gt;&lt;li&gt;&lt;b&gt;The line that lands is on step 3:&lt;/b&gt; &lt;i&gt;medicine did not get better at treating lung cancer, it STOPPED treating &lsquo;lung cancer&rsquo;.&lt;/i&gt; Pause there.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Step 5 is a question to the room, not a claim&lt;/b&gt; &ndash; which of our datasets could tell you which mechanism was operating in a given case? Let the silence do the work.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Step 6 closes the loop back to the humors slide:&lt;/b&gt; intervention fails &rarr; read as insufficient &rarr; give more of the same. Same failure mode, 2,300 years apart.&lt;/li&gt;&lt;li&gt;&lt;b&gt;PROVENANCE:&lt;/b&gt; EGFR-mutant lung cancer responding to gefitinib was published in &lt;b&gt;2004&lt;/b&gt; (Lynch et al., NEJM; Paez et al., Science). Fearon&#x27;s three rationalist mechanisms are &lt;b&gt;1995&lt;/b&gt;, International Organization; audience costs are &lt;b&gt;1994&lt;/b&gt;, APSR.&lt;/li&gt;&lt;li&gt;&lt;b&gt;GUARD RAIL:&lt;/b&gt; no prevalence figures on this slide on purpose. The EGFR share of adenocarcinoma differs sharply between Western and East Asian populations, which is a lovely extra beat &ndash; but &lt;b&gt;do not quote a number for it until it is sourced.&lt;/b&gt;&lt;/li&gt;&lt;li&gt;&lt;b&gt;Do NOT say&lt;/b&gt; that war is a disease or that states are organisms. The claim is about epistemic architecture: which layer the label comes from.&lt;/li&gt;&lt;/ul&gt;&lt;b&gt;THE MOVE:&lt;/b&gt; this is the sharpest version of the whole medicine analogy, because the other field did not just measure more &ndash; &lt;b&gt;it changed what counted as a category.&lt;/b&gt;"><h2>Same organ, different disease</h2><p class="sub">What precision oncology actually did &ndash; and the same picture, drawn for conflict.</p><div class="ob-pic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1770 750" role="img" aria-label="Lung cancer is now classified by the mechanism driving it, and each mechanism has its own drug. Conflict is still classified by where it surfaces, and the response is keyed to that surface label, bypassing the mechanisms entirely."><style>.hd{font:700 24px system-ui,sans-serif;fill:#dbad50;letter-spacing:.16em}.big{font:700 46px system-ui,sans-serif;fill:#f3f6fb}.sb{font:400 23px system-ui,sans-serif;fill:#9db8d6}.mb{font:700 27px system-ui,sans-serif;fill:#f3f6fb}.ms{font:400 23px system-ui,sans-serif;fill:#9db8d6}.dr{font:600 21px system-ui,sans-serif;fill:#dbad50}.cap{font:italic 700 27px system-ui,sans-serif;fill:#dbad50}.capm{font:italic 700 27px system-ui,sans-serif;fill:#e2915f}</style><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dbad50"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e2915f"/></marker></defs><rect width="1770" height="750" fill="#09182f"/><line x1="885" y1="4" x2="885" y2="536" stroke="#27446e" stroke-width="2"/><g class="lg lg1"><text x="30" y="30" class="hd">MEDICINE</text><rect x="190" y="58" width="505" height="80" rx="10" fill="#142846" stroke="#27446e" stroke-width="1.6"/><text x="442" y="99" class="big" text-anchor="middle">Lung cancer</text><text x="442" y="127" class="sb" text-anchor="middle">one organ &#183; one label &#183; one protocol</text></g><g class="lg lg2"><line x1="442" y1="140" x2="157" y2="200" stroke="#dbad50" stroke-width="2.2" marker-end="url(#ag)"/><rect x="72" y="205" width="170" height="95" rx="8" fill="#12243f" stroke="#dbad50" stroke-width="1.5"/><text x="157" y="245" class="mb" text-anchor="middle">EGFR</text><text x="157" y="275" class="ms" text-anchor="middle">mutant</text><line x1="442" y1="140" x2="347" y2="200" stroke="#dbad50" stroke-width="2.2" marker-end="url(#ag)"/><rect x="262" y="205" width="170" height="95" rx="8" fill="#12243f" stroke="#dbad50" stroke-width="1.5"/><text x="347" y="245" class="mb" text-anchor="middle">ALK</text><text x="347" y="275" class="ms" text-anchor="middle">rearranged</text><line x1="442" y1="140" x2="537" y2="200" stroke="#dbad50" stroke-width="2.2" marker-end="url(#ag)"/><rect x="452" y="205" width="170" height="95" rx="8" fill="#12243f" stroke="#dbad50" stroke-width="1.5"/><text x="537" y="245" class="mb" text-anchor="middle">KRAS</text><text x="537" y="275" class="ms" text-anchor="middle">G12C</text><line x1="442" y1="140" x2="727" y2="200" stroke="#dbad50" stroke-width="2.2" marker-end="url(#ag)"/><rect x="642" y="205" width="170" height="95" rx="8" fill="#12243f" stroke="#dbad50" stroke-width="1.5"/><text x="727" y="245" class="mb" text-anchor="middle">PD-L1</text><text x="727" y="275" class="ms" text-anchor="middle">high</text><text x="442" y="330" class="sb" text-anchor="middle">the driver alteration &#8211; invisible on the scan</text></g><g class="lg lg3"><line x1="157" y1="345" x2="157" y2="392" stroke="#dbad50" stroke-width="2.2" marker-end="url(#ag)"/><rect x="72" y="398" width="170" height="72" rx="8" fill="#1a3050" stroke="#27446e"/><text x="157" y="441" class="dr" text-anchor="middle">osimertinib</text><line x1="347" y1="345" x2="347" y2="392" stroke="#dbad50" stroke-width="2.2" marker-end="url(#ag)"/><rect x="262" y="398" width="170" height="72" rx="8" fill="#1a3050" stroke="#27446e"/><text x="347" y="441" class="dr" text-anchor="middle">alectinib</text><line x1="537" y1="345" x2="537" y2="392" stroke="#dbad50" stroke-width="2.2" marker-end="url(#ag)"/><rect x="452" y="398" width="170" height="72" rx="8" fill="#1a3050" stroke="#27446e"/><text x="537" y="441" class="dr" text-anchor="middle">sotorasib</text><line x1="727" y1="345" x2="727" y2="392" stroke="#dbad50" stroke-width="2.2" marker-end="url(#ag)"/><rect x="642" y="398" width="170" height="72" rx="8" fill="#1a3050" stroke="#27446e"/><text x="727" y="441" class="dr" text-anchor="middle">pembrolizumab</text><text x="442" y="512" class="cap" text-anchor="middle">The mechanism decides the treatment.</text></g><g class="lg lg4"><text x="915" y="30" class="hd">CONFLICT</text><rect x="1075" y="58" width="505" height="80" rx="10" fill="#142846" stroke="#27446e" stroke-width="1.6"/><text x="1327" y="99" class="big" text-anchor="middle">War</text><text x="1327" y="127" class="sb" text-anchor="middle">interstate &#183; civil &#183; hybrid &#183; insurgency</text></g><g class="lg lg5"><rect x="957" y="205" width="170" height="95" rx="8" fill="none" stroke="#6f8bab" stroke-width="1.5" stroke-dasharray="6 5"/><text x="1042" y="245" class="mb" fill="#9db8d6" text-anchor="middle">commitment</text><text x="1042" y="275" class="ms" text-anchor="middle">problem</text><rect x="1147" y="205" width="170" height="95" rx="8" fill="none" stroke="#6f8bab" stroke-width="1.5" stroke-dasharray="6 5"/><text x="1232" y="245" class="mb" fill="#9db8d6" text-anchor="middle">private</text><text x="1232" y="275" class="ms" text-anchor="middle">information</text><rect x="1337" y="205" width="170" height="95" rx="8" fill="none" stroke="#6f8bab" stroke-width="1.5" stroke-dasharray="6 5"/><text x="1422" y="245" class="mb" fill="#9db8d6" text-anchor="middle">issue</text><text x="1422" y="275" class="ms" text-anchor="middle">indivisibility</text><rect x="1527" y="205" width="170" height="95" rx="8" fill="none" stroke="#6f8bab" stroke-width="1.5" stroke-dasharray="6 5"/><text x="1612" y="245" class="mb" fill="#9db8d6" text-anchor="middle">audience</text><text x="1612" y="275" class="ms" text-anchor="middle">costs</text><text x="1327" y="330" class="sb" text-anchor="middle">the mechanisms &#8211; known, and almost never in the data</text></g><g class="lg lg6"><path d="M1075 98 H 947 V 434 H 1069" fill="none" stroke="#e2915f" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#ar)"/><rect x="1075" y="398" width="505" height="72" rx="8" fill="#2b1d24" stroke="#e2915f" stroke-width="1.6"/><text x="1327" y="441" class="dr" fill="#e2915f" text-anchor="middle">the response &#8211; keyed to the label</text><text x="1327" y="512" class="capm" text-anchor="middle">We still classify by the organ.</text></g></svg><div class="ob-step l1" data-frag="1"><div class="ob-note" style="--x:5%;--y:75%;--w:90%"><div class="k">One organ, one label</div><div class="d">For most of the twentieth century this <em>was</em> the diagnosis: a tumour, in a lung. The label named <em>where</em> it was. Everyone carrying it got the same protocol &ndash; and when the protocol failed, the reading was that we had not given enough of it.</div></div></div><div class="ob-step l2" data-frag="1"><div class="ob-note" style="--x:5%;--y:75%;--w:90%"><div class="k">Same organ, different disease</div><div class="d">Two patients, same lung, same scan, same stage &ndash; and four different diseases underneath. From <b>2004</b> onward it was the driver alteration that mattered: EGFR, ALK, KRAS G12C, PD-L1. <b>The scan cannot see any of them.</b> Only the molecular layer can.</div></div></div><div class="ob-step l3" data-frag="1"><div class="ob-note" style="--x:5%;--y:75%;--w:90%"><div class="k">The mechanism decides</div><div class="d">Each driver gets its own drug &ndash; osimertinib, alectinib, sotorasib, pembrolizumab &ndash; and giving the wrong one does nothing, however correct the organ-level diagnosis was. <b>Medicine did not get better at treating lung cancer. It stopped treating &lsquo;lung cancer&rsquo;.</b></div></div></div><div class="ob-step l4" data-frag="1"><div class="ob-note" style="--x:5%;--y:75%;--w:90%"><div class="k">Our categories are surface categories</div><div class="d">Now the same picture for us. Interstate, civil, hybrid, insurgency, grey zone: every one of those names a place where the conflict <em>surfaces</em>, not a mechanism that generates it. It is the organ-level diagnosis &ndash; and it is what almost everything we have is labelled by.</div></div></div><div class="ob-step l5" data-frag="1"><div class="ob-note" style="--x:5%;--y:75%;--w:90%"><div class="k">The mechanisms are not a mystery</div><div class="d">We have had the candidates for three decades: private information with incentives to misrepresent, commitment problems and issue indivisibility (<em>Fearon 1995</em>), domestic audience costs (<em>Fearon 1994</em>). <b>Ask which of our corpora could tell you, for one given case, which of them was operating.</b></div></div></div><div class="ob-step l6" data-frag="1"><div class="ob-note" style="--x:5%;--y:75%;--w:90%"><div class="k">So the label still decides the response</div><div class="d">Nothing routes through that row. The response is picked from the surface category, and when it fails, the reading is that we did not do enough of it. <b>That is the humors loop again</b> &ndash; and breaking exactly that loop is what precision oncology was.</div></div></div><div class="ob-step l7" data-frag="1"><div class="ob-note" style="--x:5%;--y:75%;--w:90%"><div class="k">What the week is actually about</div><div class="d">Not more data. An instrument that measures the layers underneath the label, so the categories themselves can be tested, split, recombined or thrown away. <b>On conflict we do not yet have the diagnosis, let alone the cure.</b></div></div></div></div></section><section class="slide obuild d2ls" data-t="From epistemic darkness to light" data-sid="d2l001" data-n="&lt;b&gt;DELIVERY&lt;/b&gt; &middot; this is the geomics &lt;i&gt;darkness-to-light&lt;/i&gt; figure from geomics.org, rebuilt from its ORIGINAL build layers so it assembles on screen instead of arriving finished.&lt;ul&gt;&lt;li&gt;&lt;b&gt;Left column first, and let it look bad.&lt;/b&gt; The sparseness IS the argument &ndash; five of six layers essentially unread.&lt;/li&gt;&lt;li&gt;&lt;b&gt;The barrier is the hinge:&lt;/b&gt; not theory, not willingness &ndash; &lt;i&gt;throughput&lt;/i&gt;. Reading meaning at scale, in the original languages.&lt;/li&gt;&lt;li&gt;&lt;b&gt;The beam is the &lsquo;omics move,&lt;/b&gt; the same one as slide 13: layers measured whole, then read TOGETHER. Say the word &lt;i&gt;integration&lt;/i&gt; out loud.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Ties straight back to the lung-cancer slide:&lt;/b&gt; present column = chemotherapy, one-size; future column = precision, tailored. Same argument, different picture.&lt;/li&gt;&lt;li&gt;&lt;b&gt;PROVENANCE:&lt;/b&gt; layers from &lt;code&gt;StratBase/Proposals/Geomics/media/figures/_layers/&lt;/code&gt;, generator &lt;code&gt;geomics_darkness_to_light_260708.py&lt;/code&gt;. Nothing redrawn.&lt;/li&gt;&lt;li&gt;&lt;b&gt;GUARD RAIL:&lt;/b&gt; the caveat on the metaphor still applies &ndash; biology has a central dogma and meiosis, international affairs has neither. We borrow the &lt;i&gt;method&lt;/i&gt;, and we &lt;b&gt;estimate&lt;/b&gt; the cross-layer structure rather than assume it.&lt;/li&gt;&lt;/ul&gt;&lt;b&gt;THE MOVE:&lt;/b&gt; every other slide this morning says the field is stuck. &lt;b&gt;This one says what the instrument would look like&lt;/b&gt; &ndash; and that it is buildable now."><div class="ob-pic"><div class="ob-step" data-frag="1"><img src="img/d2l/1_scaffold.png" alt=""><img src="img/d2l/2_present_0.png" alt=""><div class="ob-note" style="--x:52%;--y:14%;--w:44%"><div class="k">Six layers, one actor</div><div class="d">The same stack the &lsquo;omics slide just walked, drawn for a country. <b>Surface at the top</b> &ndash; actions and statements, the things that make it into an event dataset. <b>Deep drivers at the bottom</b> &ndash; values and identity. Every cell is something you could in principle measure. Russia here, but the logic holds for any actor, dyad or conflict.</div></div></div><div class="ob-step" data-frag="1"><img src="img/d2l/2_present_1.png" alt=""><img src="img/d2l/2_present_2.png" alt=""><img src="img/d2l/2_present_3.png" alt=""><img src="img/d2l/2_present_4.png" alt=""><img src="img/d2l/2_present_5.png" alt=""><div class="ob-note" style="--x:52%;--y:14%;--w:44%"><div class="k">This is what we actually have</div><div class="d">Look at how few cells are lit. The surface layer is sampled &ndash; that is what our event data and our expert commentary cover. <b>Below it, almost nothing.</b> Not because those layers are unknowable, but because reading meaning at that volume was impossible until very recently.</div></div></div><div class="ob-step" data-frag="1"><img src="img/d2l/3_present_cap.png" alt=""><div class="ob-note" style="--x:52%;--y:14%;--w:44%"><div class="k">So the response is one-size</div><div class="d">A shallow read can only support a reactive, undifferentiated assessment. <b>This is the chemotherapy column</b> &ndash; treat the surface, treat everyone the same, and find out afterwards whether it worked.</div></div></div><div class="ob-step" data-frag="1"><img src="img/d2l/4_barrier.png" alt=""><div class="ob-note" style="--x:52%;--y:14%;--w:44%"><div class="k">The knowledge barrier</div><div class="d">What stood between the two columns was never theory and never willingness. It was <b>throughput</b>: reading meaning, in the original languages, at the scale the record actually exists at. That is a machine problem, and it was unsolved.</div></div></div><div class="ob-step" data-frag="1"><img src="img/d2l/5_enabler.png" alt=""><div class="ob-note" style="--x:46%;--y:60%;--w:50%"><div class="k">What changed</div><div class="d">LLM extraction &middot; knowledge graphs &middot; calibrated measurement &middot; decision support. <b>Only the first of those is new</b> &ndash; the others were waiting on it. The barrier came down in the last few years, on our watch.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-scrim"></div><img src="img/d2l/6_future_0.png" alt=""><img src="img/d2l/6_future_1.png" alt=""><img src="img/d2l/6_future_2.png" alt=""><img src="img/d2l/6_future_3.png" alt=""><img src="img/d2l/6_future_4.png" alt=""><img src="img/d2l/6_future_5.png" alt=""><div class="ob-note wide" style="--x:3.5%;--y:28%;--w:44%"><div class="k">Every layer, measured</div><div class="d">The same six layers, now densely populated &ndash; not a better dataset of the same kind, but <b>the layers that were dark being read at all</b>. This is the step that has no precedent in how our field works.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-scrim"></div><img src="img/d2l/7_beam.png" alt=""><img src="img/d2l/8_future_cap.png" alt=""><div class="ob-note wide" style="--x:3.5%;--y:28%;--w:44%"><div class="k">Wired together, and then it pays</div><div class="d">The beam is the point: <b>the layers read together</b>, so a claim at the top traces to evidence at the bottom. A deep read makes a precise, tailored response possible &ndash; the immunotherapy column. <b>This is the whole programme, and it is what the rest of the week is training you to do on your own question.</b></div></div></div></div></section><section class="slide" data-t="Where is our vaccine?" data-n="SDS: name the three pathologies out loud, then ask the question and let it sit. Do not answer it - the week is the answer." data-sid="c90e35"><h2>They did the homework. They got a vaccine.</h2><p class="sub">Three habits we have, and one they gave up.</p><div class="split" style="gap:2.5%"><div class="stack" style="flex:1;gap:.45em"><div class="card tint" data-frag="1"><div class="k">A callous disregard for empirics</div><div class="d">Claims travel on plausibility and citation weight. The evidence is illustrative, chosen after the argument.</div></div><div class="card tint" data-frag="2"><div class="k">A callous disregard for recall</div><div class="d">We optimise for the sources we found, never for the ones we missed &ndash; and we cannot see what we missed.</div></div><div class="card tint" data-frag="3"><div class="k">A callous disregard for systematic reasoning</div><div class="d">Nothing is defined, so nothing accumulates. Every study starts the argument again.</div></div></div><div class="stack" style="flex:0 0 40%;justify-content:center;gap:.45em"><div class="card" data-frag="4"><div class="k">What they did instead</div><div class="d">Defined the layers. Measured each one whole. Integrated them. It took decades and it was not glamorous work.</div></div><div class="card hot" data-frag="5"><div class="k">And so</div><div class="d"><b>They got a vaccine.</b> <em>Where is ours &ndash; for war, and for conflict?</em></div></div></div></div></section>
<section class="slide" data-t="Paradigm shifts across disciplines" data-sid="93045a" data-n="&lt;b&gt;DELIVERY&lt;/b&gt; &middot; ONE slide now, five disciplines, chosen &ndash; not ten across two slides. Build it &lt;b&gt;cell by cell&lt;/b&gt;, not row by row: the cadence is the point, because each row is the same crossing told four times.&lt;ul&gt;&lt;li&gt;&lt;b&gt;Why these five.&lt;/b&gt; &lt;i&gt;Medicine&lt;/i&gt; is this morning's spine &ndash; humors, the &lsquo;omics, AlphaFold. &lt;i&gt;Biology&lt;/i&gt; IS the &lsquo;omics move: individual genes to whole genomes. &lt;i&gt;Sociology&lt;/i&gt; is ours &ndash; sampling versus &lt;b&gt;n&nbsp;=&nbsp;all&lt;/b&gt;. &lt;i&gt;History&lt;/i&gt; is the record that was always there and unread, which is the geomics argument. &lt;i&gt;Political science&lt;/i&gt; is last, on purpose.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Dropped on purpose:&lt;/b&gt; economics (AI and labour markets &ndash; a different argument), physics (chaos), environmental science (materials discovery), and linguistics and psychology, which repeat what History and Sociology already carry. &lt;b&gt;Ten rows across two slides made the same point five times too often.&lt;/b&gt;&lt;/li&gt;&lt;li&gt;&lt;b&gt;Sociology is the row to stop on:&lt;/b&gt; every other field stopped sampling its object of study when it became possible to read all of it. We have not.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Then political science, and let it sit.&lt;/b&gt; The row is thinner than the others, and that is the finding, not an editing failure.&lt;/li&gt;&lt;/ul&gt;&lt;b&gt;THE MOVE:&lt;/b&gt; every neighbouring field made the same crossing, and each one crossed when measuring the whole thing became possible. &lt;b&gt;Ours is the one that did not.&lt;/b&gt;"><h2>Paradigm shifts across disciplines</h2><p class="sub">Five neighbours, and the same crossing every time: from a sample of the thing, to the whole thing.</p><table class="shift"><tr><th>Discipline</th><th>Conventional wisdom</th><th>New understanding</th><th>Key insight</th><th>Impact</th></tr><tr><td data-frag="1" class="d">Medicine</td><td data-frag="2">Doctors make treatment decisions based on clinical judgment</td><td data-frag="3">Evidence-based medicine guided by data analytics</td><td data-frag="4" class="k">Medical data volume doubles every 40 months since the 1980s</td><td data-frag="5"><ul><li>More personalized treatments</li><li>Improved patient outcomes</li><li>AI in diagnosis</li></ul></td></tr><tr><td data-frag="6" class="d">Biology</td><td data-frag="7">Research focuses on individual genes and proteins</td><td data-frag="8">High-throughput technologies enable whole-genome studies</td><td data-frag="9" class="k">Holistic study has profound implications</td><td data-frag="10"><ul><li>Understanding biological systems</li><li>Personalized medicine</li><li>AI-powered protein design</li></ul></td></tr><tr><td data-frag="11" class="d">Sociology</td><td data-frag="12">Social research relies on sampling techniques</td><td data-frag="13">Big data allows analysis of entire populations (n = all)</td><td data-frag="14" class="k">Comprehensive analysis raises privacy concerns</td><td data-frag="15"><ul><li>More accurate social insights</li><li>Real-time network study</li><li>Privacy questions</li></ul></td></tr><tr><td data-frag="16" class="d">History</td><td data-frag="17">Research relies on limited historical records</td><td data-frag="18">AI can decipher previously unreadable ancient texts</td><td data-frag="19" class="k">New sources could change historical understanding</td><td data-frag="20"><ul><li>Deciphering ancient scrolls</li><li>New historical data</li><li>Challenging interpretations</li></ul></td></tr><tr><td data-frag="21" class="d">Political science</td><td data-frag="22">Campaigns rely on traditional outreach methods</td><td data-frag="23">AI analyzes voter data and personalizes messaging</td><td data-frag="24" class="k">Raises concerns about manipulation and democracy</td><td data-frag="25"><ul><li>Voter manipulation concerns</li><li>Impact on political discourse</li></ul></td></tr></table></section>

<section class="slide" data-t="What transfers, and what does not" data-n="&lt;b&gt;THE HONEST SLIDE&lt;/b&gt; &ndash; it buys you the next twenty minutes. &lt;ul&gt; &lt;li&gt;&lt;b&gt;Left column fast.&lt;/b&gt; The one that matters is the first: &lt;b&gt;the transferable move is NOT more data &ndash; it is that categories get recut by mechanism.&lt;/b&gt;&lt;/li&gt; &lt;li&gt;&lt;i&gt;Lung cancer&lt;/i&gt; is named for an organ; molecular profiling dissolved it, and &lt;b&gt;tumour-agnostic approvals&lt;/b&gt; now treat by mutation wherever it appears.&lt;/li&gt; &lt;li&gt;&lt;b&gt;Interstate war, civil war, insurgency, crisis, deterrence failure&lt;/b&gt; are every one of them named for &lt;i&gt;where the thing surfaced&lt;/i&gt;. &lt;i&gt;Correlates of War&lt;/i&gt; codes by battle deaths and actor type &ndash; &lt;b&gt;that is classifying by organ.&lt;/b&gt;&lt;/li&gt; &lt;li&gt;&lt;b&gt;The N objection, which someone WILL raise:&lt;/b&gt; medicine had millions of patients, we have 200 states. &lt;b&gt;The answer:&lt;/b&gt; the state and the war ARE the phenotype. Change the unit to the &lt;i&gt;utterance&lt;/i&gt;, the &lt;i&gt;demarche&lt;/i&gt;, the &lt;i&gt;dyad-week&lt;/i&gt;, and N goes from hundreds to hundreds of millions. &lt;b&gt;That reunitisation is the whole precondition&lt;/b&gt; &ndash; and it is what LLMs made affordable.&lt;/li&gt; &lt;/ul&gt; &lt;b&gt;NOW SLOW DOWN&lt;/b&gt; for the right column. &lt;b&gt;This is the column that makes the rest credible in a room of academics.&lt;/b&gt; &lt;ul&gt; &lt;li&gt;Say plainly: &lt;b&gt;no central dogma, no experiment, no adverse-event registry.&lt;/b&gt;&lt;/li&gt; &lt;li&gt;&lt;b&gt;The third is the deepest, and it is yours, not the brief's:&lt;/b&gt; a tumour does not change its behavior because you published its profile. &lt;b&gt;An adversary does.&lt;/b&gt; &lt;i&gt;Reflexivity&lt;/i&gt; has no analogue in biology and &lt;b&gt;it is the one difference that never goes away&lt;/b&gt;, however much data we get.&lt;/li&gt; &lt;/ul&gt; &lt;b&gt;CLOSE&lt;/b&gt; on the footer line and go straight to &lt;i&gt;So why not us&lt;/i&gt; &ndash; which now reads as a real question rather than a rhetorical one." data-sid="c2714a"><h2>What transfers, and what does not</h2><p class="sub">The analogy is worth the left column. It is worth saying the right column out loud first.</p><figure class="viz" data-frag="1"><img src="img/viz/omics_transfer_ledger.svg" style="width:100%;height:auto;object-fit:contain;border-radius:3px" alt="Two columns: what transfers from the omics, and where the analogy breaks"></figure></section><section class="slide" data-t="So why not us?" data-n="Ask the room for their answer before revealing either card." data-sid="ddd23c"><h2>Every neighboring discipline crossed over. Why didn't ours?</h2><p class="sub">Two answers. Neither of them is about the tools.</p><div class="split"><div class="stack"><div class="card hot" data-frag="1"><div class="k">1 &middot; We never built the instrument</div><div class="d">Biology has the Gene Ontology, medicine has SNOMED and ICD. <b>We have no shared, defined vocabulary for what we study</b> &ndash; so nothing anyone measures can be compared with anything anyone else measured.</div></div></div><div class="stack"><div class="card hot" data-frag="2"><div class="k">2 &middot; The incentives point the other way</div><div class="d">A new framework is publishable; a measurement layer is infrastructure. <b>The work that would have let the field cross over is the work nobody is rewarded for doing.</b></div></div></div></div></section>
<section class="slide" data-t="How do we currently do it?" data-n="Genuine show of hands. Do not fill the silence - the answers are the slide." data-sid="a6b3d1"><div class="fill"><div class="body-lg">How do we <span class="y">currently</span> do it?</div><div class="body-lg" data-frag="1"><span class="sub2">You tell me.</span></div></div></section>
<section class="slide" data-t="How search is typically done today" data-n="The Hobbes line is the joke. The four questions under it are the actual indictment." data-sid="1d4b51"><h2>How search is typically done today</h2><p class="sub">Solitary, poor, nasty, brutish, and short.</p><div class="split"><div class="stack"><div class="card hot" data-frag="1"><div class="k">In 99.9% of cases it is not explicit</div><div class="d">And it is <b>not documented</b>. The references are non-transparent: <em>why those sources and not others? which excerpt exactly? complete citation? alternative readings?</em></div></div></div><div class="stack"><div class="card " data-frag="2"><div class="k">What we lean on instead</div><div class="d"><b>Presumably authoritative sources</b> - peer-reviewed, most-cited. <em>Trust me, I know the literature.</em> And herd behavior.</div></div><div class="card tint" data-frag="3"><div class="k">The alternatives that already exist</div><div class="d">Bibliometric databases: Scopus, Web of Science, Lens. And, cheating, <em>syllabus site:.edu</em>.</div></div></div></div></section>
<section class="slide" data-t="The sophistication of our queries" data-n="Let the bars land first - AND is a sliver, OR is almost nothing. Then the 92.7% box." data-sid="43e9ad"><h2>The sophistication of our queries</h2><p class="sub">Measured in our own literature.</p><div class="fill" style="justify-content:center" data-frag="1"><img src="img/viz/query_sophistication.svg" alt="Operator use and session depth in PubMed" style="width:auto;max-width:100%;height:auto;max-height:54cqh;object-fit:contain"></div></section>
<section class="slide" data-t="Problems with search today" data-n="Time is the one that actually decides what gets read. Say so." data-sid="b1a142"><h2>Problems with search today</h2><p class="sub">Three, and only one of them is about the tools.</p><div class="grid c3"><div class="card " data-frag="1"><div class="k">Access</div><div class="d">Paywalls and terms of use. <b>We are unusually fortunate here through RuBase</b>, which is exactly why it is easy to forget how binding this is for everyone else.</div></div><div class="card hot" data-frag="2"><div class="k">Time</div><div class="d">Small projects force researchers to the low-hanging fruit: to <b>narrow, risk-averse precision</b>, and to neglect recall.</div></div><div class="card " data-frag="3"><div class="k">Search query syntax</div><div class="d">Many datasets have decidedly suboptimal search. Nearly all are keyword-based old-school search; not even proximity operators are always implemented.</div></div></div><div class="small-note" data-frag="4">And we are stuck with that <b>to build the corpus</b> &ndash; which we can then play with the way we want, with unsupervised and semi-supervised NLP tools.</div></section>
<section class="slide obuild prb" data-t="Precision and recall" data-sid="10f148" data-n="&lt;b&gt;DELIVERY&lt;/b&gt; &middot; SDS&#x27;s two comments on this slide: &lt;i&gt;&quot;I want this to build up as in the original ppt slide&quot;&lt;/i&gt; and &lt;i&gt;&quot;I want the Russian examples back in here&quot;&lt;/i&gt;. Both are now in.&lt;ul&gt;&lt;li&gt;&lt;b&gt;Steps 1-5 are the definitions&lt;/b&gt; &ndash; the collection, the two sets, then the two formulas. Do not rush; the point is that ONE denominator is visible and the other never is.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Step 6 is the beat:&lt;/b&gt; three cells you can inspect, one you cannot. &lt;i&gt;Every AND and every NOT is a bet on that cell being empty.&lt;/i&gt;&lt;/li&gt;&lt;li&gt;&lt;b&gt;Steps 7-8 are the Russian example, restored from the 2025 deck:&lt;/b&gt; &lt;b&gt;31,000&lt;/b&gt; Integrum publications on &#1089;&#1076;&#1077;&#1088;&#1078;&#1080;&#1074;&#1072;&#1085;&#1080;&#1077;/&#1091;&#1089;&#1090;&#1088;&#1072;&#1096;&#1077;&#1085;&#1080;&#1077;/&#1079;&#1072;&#1087;&#1091;&#1075;&#1080;&#1074;&#1072;&#1085;&#1080;&#1077;, against 144, ~200 and 449.&lt;/li&gt;&lt;li&gt;&lt;b&gt;PROVENANCE:&lt;/b&gt; all four figures are reproduced from YOUR OWN 2025 GaTech slide (&lt;code&gt;gt2025_precrecall-29&lt;/code&gt;) &ndash; the covers are cropped from it unaltered. The CNA study is Fink &amp; Kofman, &lt;i&gt;Russian Strategy for Escalation Management&lt;/i&gt;, April 2020; the book is Oscar Jonsson, &lt;i&gt;The Russian Understanding of War&lt;/i&gt;.&lt;/li&gt;&lt;li&gt;&lt;b&gt;🟥 ONE THING TO CHECK:&lt;/b&gt; I could not identify the author in the middle photograph from the slide render, so the slide does NOT name him and the alt text does not either. &lt;b&gt;Name him yourself when you say &#x27;often more than 200&#x27;&lt;/b&gt;, or tell me who he is and I will label the tile.&lt;/li&gt;&lt;li&gt;&lt;b&gt;GUARD RAIL:&lt;/b&gt; this is the RUSSIAN-language recall case. Do not mix it with the CHINESE-literature case &ndash; that one has its own verified figures (70,346 Chinese records; 0.15-0.20% coverage; and the zero before 2015).&lt;/li&gt;&lt;/ul&gt;&lt;b&gt;THE MOVE:&lt;/b&gt; precision is visible so it gets optimised; recall is invisible so it goes unmeasured &ndash; and the gap is not a rounding error, it is 31,000 against 449."><h2>Precision and recall</h2><p class="sub">Two numbers. Almost everyone optimises the one they can see.</p><div class="ob-pic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1770 750" role="img" aria-label="Precision and recall, built up: the document collection, the relevant set, the retrieved set, the two formulas, the four-cell grid, and then the Russian corpus against what the best Western work cites."><style>.hd{font:700 23px system-ui,sans-serif;fill:#dbad50;letter-spacing:.14em}.lb{font:600 30px system-ui,sans-serif;fill:#f3f6fb}.sm{font:400 23px system-ui,sans-serif;fill:#9db8d6}.fm{font:italic 400 27px Georgia,serif;fill:#f3f6fb}.fk{font:italic 700 29px Georgia,serif;fill:#dbad50}.cell{font:600 25px system-ui,sans-serif;fill:#f3f6fb}.axl{font:700 20px system-ui,sans-serif;fill:#dbad50;letter-spacing:.1em}.huge{font:800 92px system-ui,sans-serif;fill:#dbad50}.hug2{font:600 25px system-ui,sans-serif;fill:#9db8d6}.tick{font:700 27px system-ui,sans-serif;fill:#f3f6fb}</style><rect width="1770" height="750" fill="#09182f"/><g class="lg p1"><ellipse cx="330" cy="150" rx="300" ry="128" fill="none" stroke="#9db8d6" stroke-width="2.4"/><text x="52" y="46" class="sm">Entire document</text><text x="52" y="74" class="sm">collection</text></g><g class="lg p2"><circle cx="272" cy="158" r="103" fill="#c9a227" fill-opacity=".55" stroke="#dbad50" stroke-width="2"/><text x="232" y="152" class="lb" text-anchor="middle" font-size="24">Relevant</text><text x="232" y="180" class="sm" text-anchor="middle">documents</text></g><g class="lg p3"><circle cx="404" cy="158" r="103" fill="#b4643a" fill-opacity=".55" stroke="#e2915f" stroke-width="2"/><text x="452" y="152" class="lb" text-anchor="middle" font-size="24">Retrieved</text><text x="452" y="180" class="sm" text-anchor="middle">documents</text></g><g class="lg p4"><text x="30" y="330" class="fk">recall</text><text x="150" y="312" class="fm">relevant documents retrieved</text><line x1="145" y1="322" x2="600" y2="322" stroke="#f3f6fb" stroke-width="1.6"/><text x="150" y="352" class="fm">ALL relevant documents</text></g><g class="lg p5"><text x="30" y="424" class="fk">precision</text><text x="196" y="406" class="fm">relevant documents retrieved</text><line x1="191" y1="416" x2="646" y2="416" stroke="#f3f6fb" stroke-width="1.6"/><text x="196" y="446" class="fm">ALL documents retrieved</text></g><g class="lg p6"><text x="836.0" y="48" class="axl" text-anchor="middle">RETRIEVED</text><text x="1084.0" y="48" class="axl" text-anchor="middle">NOT RETRIEVED</text><text x="706" y="124.0" class="axl" text-anchor="end">RELEVANT</text><text x="706" y="244.0" class="axl" text-anchor="end">IRRELEVANT</text><rect x="720" y="64" width="232" height="104" rx="8" fill="#1d3a22" stroke="#7fd39b" stroke-width="1.8"/><text x="836.0" y="108" class="cell" text-anchor="middle">retrieved &amp; relevant</text><text x="836.0" y="140" class="sm" text-anchor="middle" font-size="21">what you see</text><rect x="968" y="64" width="232" height="104" rx="8" fill="#4a2320" stroke="#f08a6a" stroke-width="1.8"/><text x="1084.0" y="108" class="cell" text-anchor="middle">not retrieved</text><text x="1084.0" y="140" class="sm" text-anchor="middle" font-size="21">but relevant &#8211; invisible</text><rect x="720" y="184" width="232" height="104" rx="8" fill="#42301a" stroke="#e2b85a" stroke-width="1.8"/><text x="836.0" y="228" class="cell" text-anchor="middle">retrieved</text><text x="836.0" y="260" class="sm" text-anchor="middle" font-size="21">but irrelevant</text><rect x="968" y="184" width="232" height="104" rx="8" fill="#16283f" stroke="#6f8bab" stroke-width="1.8"/><text x="1084.0" y="228" class="cell" text-anchor="middle">not retrieved</text><text x="1084.0" y="260" class="sm" text-anchor="middle" font-size="21">&amp; irrelevant</text><text x="720" y="338" class="sm">Precision is measured on the left column. <tspan fill="#f08a6a" font-weight="700">Recall needs the cell you cannot see.</tspan></text></g><g class="lg p7"><text x="722" y="392" class="hd">OUR RUSSIAN DETERRENCE CORPUS &#183; INTEGRUM</text><text x="722" y="482" class="huge">31,000</text><text x="1022" y="472" class="hug2">publications</text><text x="722" y="530" class="hug2" font-size="22">&#1089;&#1076;&#1077;&#1088;&#1078;&#1080;&#1074;&#1072;&#1085;&#1080;&#1077; &#183; &#1091;&#1089;&#1090;&#1088;&#1072;&#1096;&#1077;&#1085;&#1080;&#1077; &#183; &#1079;&#1072;&#1087;&#1091;&#1075;&#1080;&#1074;&#1072;&#1085;&#1080;&#1077;</text></g><g class="lg p8"><text x="1240" y="46" class="hd">WHAT THE BEST WESTERN WORK CITES</text><text x="1240" y="404" class="sm" font-size="22">Each is careful, serious scholarship.</text><text x="1240" y="436" class="sm" font-size="22">None of them is reading the corpus.</text></g></svg><img class="prt" src="img/pr/cna.jpg" alt="CNA, Russian Strategy for Escalation Management (Fink and Kofman, 2020) - 700 to 144" style="left:70.1%;top:8%;width:8.6%;height:30%;object-fit:contain;object-position:top"><img class="prt" src="img/pr/author.jpg" alt="A monograph author whose works often carry more than 200 references" style="left:79.6%;top:8%;width:8.6%;height:30%;object-fit:contain;object-position:top"><img class="prt" src="img/pr/jonsson.jpg" alt="Oscar Jonsson, The Russian Understanding of War - 449 references" style="left:89.0%;top:8%;width:8.6%;height:30%;object-fit:contain;object-position:top"><div class="ob-step p1" data-frag="1"><div class="ob-note" style="--x:4%;--y:76%;--w:92%"><div class="k">The frame</div><div class="d">Everything your field could have found on your question. Not what is in your library, not what is in your database &ndash; <b>everything that exists</b>. Both numbers are measured against this, which is already the uncomfortable part.</div></div></div><div class="ob-step p2" data-frag="1"><div class="ob-note" style="--x:4%;--y:76%;--w:92%"><div class="k">Relevant</div><div class="d">The documents that actually bear on your question. <b>You never see this set.</b> It is defined by the question, not by your query, and nothing in your workflow ever shows it to you.</div></div></div><div class="ob-step p3" data-frag="1"><div class="ob-note" style="--x:4%;--y:76%;--w:92%"><div class="k">Retrieved</div><div class="d">What your query returned. This is the only set you ever look at, which is why it quietly becomes your picture of the field &ndash; and why the two circles being different sizes is the whole problem.</div></div></div><div class="ob-step p4" data-frag="1"><div class="ob-note" style="--x:4%;--y:76%;--w:92%"><div class="k">Recall</div><div class="d">Of everything relevant, how much you got. The denominator is the set you cannot see, so recall <b>cannot be computed from your results</b> &ndash; only estimated, and only if you go looking. Almost nobody does.</div></div></div><div class="ob-step p5" data-frag="1"><div class="ob-note" style="--x:4%;--y:76%;--w:92%"><div class="k">Precision</div><div class="d">Of what you retrieved, how much was relevant. You <em>can</em> compute this: it is all sitting in front of you. <b>That is exactly why it is the one everyone optimises</b> &ndash; not because it matters more.</div></div></div><div class="ob-step p6" data-frag="1"><div class="ob-note" style="--x:4%;--y:76%;--w:92%"><div class="k">The four cells</div><div class="d">Three of them you can inspect. The fourth &ndash; relevant, not retrieved &ndash; is invisible by construction, and it is the only one that decides whether your literature review is a review of the literature. <b>Every AND and every NOT is a bet on that cell being empty.</b></div></div></div><div class="ob-step p7" data-frag="1"><div class="ob-note" style="--x:4%;--y:76%;--w:92%"><div class="k">Now a real number</div><div class="d">Our own Integrum corpus on Russian deterrence &ndash; &#1089;&#1076;&#1077;&#1088;&#1078;&#1080;&#1074;&#1072;&#1085;&#1080;&#1077;, &#1091;&#1089;&#1090;&#1088;&#1072;&#1096;&#1077;&#1085;&#1080;&#1077;, &#1079;&#1072;&#1087;&#1091;&#1075;&#1080;&#1074;&#1072;&#1085;&#1080;&#1077; &ndash; holds about <b>31,000 publications</b>. That is the denominator for anyone writing about how Russia thinks about deterrence.</div></div></div><div class="ob-step p8" data-frag="1"><div class="ob-note" style="--x:4%;--y:76%;--w:92%"><div class="k">And the numerator</div><div class="d">The best Western work on exactly this: a CNA study that went from 700 sources to <b>144</b>; monographs that often clear <b>200</b>; Jonsson's book at <b>449</b>. All careful scholarship. <b>Against 31,000.</b> That is not a precision problem &ndash; it is a recall problem, and nobody reports it.</div></div></div></div></section>
<section class="slide" data-t="What would a useful search even look like?" data-n="Diversity is the one nobody optimises for, and it is the one that decides what your field contains." data-sid="6705c1"><h2>What would a useful search even look like?</h2><p class="sub">Two questions, then six metrics.</p><div class="split"><div class="stack"><div class="kicker">Are we looking for</div><div class="card hot" data-frag="1"><div class="k">Good or excellent articles?</div><div class="d">And how would we know?</div></div><div class="card hot" data-frag="2"><div class="k">Good knowledge and insight?</div><div class="d">And how would we know <em>that</em>?</div></div></div><div class="stack"><div class="kicker">Metrics of usefulness</div><div class="card " data-frag="3"><div class="k">Precision and accuracy</div><div class="d">Just <b>narrow</b> (influencing / IR / EUR to RUS), or <b>broad</b> (influencing / IR, or even influencing / human)?</div></div><div class="card " data-frag="4"><div class="k">And then</div><div class="d"><b>Recall</b> &middot; <b>authoritativeness</b> &middot; <b>quality</b> &middot; <b>diversity</b>: semantic, disciplinary, linguistic.</div></div></div></div></section>
<section class="slide" data-t="The peer-review crisis" data-n="Current as of late 2025. Reveal one at a time; the AI line is the one that changes the room." data-sid="1b2e10"><h2>The peer-review crisis</h2><p class="sub">Not an anecdote. The numbers are current, and they are getting worse.</p><div class="split" style="gap:2.5%"><div class="stack" style="flex:1;gap:.45em"><div class="card tint" data-frag="1"><div class="k">The scale</div><div class="d"><b>13,000</b> retractions in 2023 alone. By August 2025 the cumulative record stood at roughly <b>55,000</b> retracted papers.</div></div><div class="card tint" data-frag="2"><div class="k">Fake peer review</div><div class="d">More than <b>6,400</b> retractions across 2024&ndash;25 were attributed to fabricated review &ndash; the mechanism that is supposed to be the safeguard.</div></div><div class="card tint" data-frag="3"><div class="k">Paper mills</div><div class="d">About <b>2,300</b> cases, and roughly <b>20%</b> of health and life-science retractions from 2016&ndash;25. Hindawi alone retracted over <b>8,000</b> articles.</div></div></div><div class="stack" style="flex:0 0 40%;justify-content:center"><div class="card hot" data-frag="4"><div class="k">And now, generated text</div><div class="d"><b>2,100</b> retractions are linked to AI-generated content &ndash; flagged by &ldquo;tortured phrases&rdquo; and text a model plainly wrote. <em>The volume problem and the trust problem are now the same problem.</em></div></div></div></div></section>

<section class="slide img" data-t="McNamara&#x27;s first law of defense analysis" data-n="Never answer the question you were asked until you have asked a broader one." data-sid="256149"><img src="img/x_mcnamara.jpg" alt="McNamara&#x27;s first law of defense analysis"></section>
<section class="slide img" data-t="Metascience is here" data-n="Other fields built a discipline for studying their own reliability. We have not." data-sid="27f512"><img src="img/x_metascience.jpg" alt="Metascience is here"></section>
<section class="slide" data-t="Why at least try broader?" data-n="The &#x27;now we can&#x27; turn is the point of the slide. Everything before it is the setup." data-sid="20300b"><h2>Why at least try broader?</h2><p class="sub">Take any existing research question. Say models of regionalism.</p><div class="grid c3"><div class="card " data-frag="1"><div class="k">You find the comparative literature</div><div class="d">Which may already be doing the work of identifying those models for you.</div></div><div class="card hot" data-frag="2"><div class="k">And you also find the single cases</div><div class="d">Studies on <b>one</b> regional organization that were never in the comparative literature &ndash; but ask similar questions, or carry an interesting design.</div></div><div class="card " data-frag="3"><div class="k">Which leads somewhere</div><div class="d">New research questions, and new research designs.</div></div></div><div class="small-note" data-frag="4">And mainly because <b>now we can</b>. It used to be a daunting prospect. Today we collate large bibliometric and full-text datasets, explore them, and find relevant text spans far more quickly and intelligently. <b>Breaking through the stovepipes, and building more transversal knowledge.</b></div></section>
<section class="slide obuild an3b" data-t="Towards strategic analysis 3.0" data-n="One era at a time. Note that 2.0 is where most of the field still sits." data-sid="5de4dc"><h2>Towards strategic analysis 3.0</h2><p class="sub">From analogue to digital, and then: <b>text is data</b>.</p><div class="ob-pic"><img class="ob-plate" src="img/d1_analysis3.jpg" alt="Three eras of strategic analysis"><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/d1_analysis3.jpg" style="clip-path:inset(11% 64% 0% 0%)" alt="Analysis 1.0"><div class="ob-note" style="--x:40%;--y:8%;--w:50%"><div class="k">1.0 &middot; the expert</div><div class="d">One scholar, deep reading, a judgment you either trust or you do not. Analogue: a single mind, working alone, with no way for anyone else to check the reasoning that produced the verdict.</div></div></div><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/d1_analysis3.jpg" style="clip-path:inset(11% 38% 0% 36%)" alt="Analysis 2.0"><div class="ob-note" style="--x:64%;--y:8%;--w:33%"><div class="k">2.0 &middot; multiple perspectives</div><div class="d">Several experts, structured methods, contending views. Digital, but still bounded by how much a team can read: more perspectives than 1.0, yet the ceiling is still human reading speed.</div></div></div><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/d1_analysis3.jpg" style="clip-path:inset(11% 0% 0% 62%)" alt="Analysis 3.0"><div class="ob-note" style="--x:4%;--y:14%;--w:30%"><div class="k">3.0 &middot; text is data</div><div class="d">The record itself becomes measurable, at a scale no reading team reaches. Every document becomes a source of structured claims &ndash; toward knowledge graphs built from thousands of texts at once.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-scrim"></div><div class="ob-note wide" style="--x:8%;--y:28%;--w:84%"><div class="k">The point of the arrow</div><div class="d"><b>Toward cumulative knowledge-building</b> &ndash; each study adding to a structure rather than restarting the argument. That is what makes 3.0 different in kind, not just in scale, from 1.0 and 2.0.</div></div></div></div></section>
<section class="slide obuild pcb" data-t="Pub-centric to knowledge-centric" data-n="Reveal the stack, then the shift, then the cost. The cost card is the argument." data-sid="70b561"><h2>From pub-centric to knowledge-centric</h2><p class="sub">The unit of knowledge is changing under us.</p><div class="ob-pic"><img class="ob-plate" src="img/d1_pubcentric.jpg" alt="From a mountain of publications to a language model"><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/d1_pubcentric.jpg" style="clip-path:inset(12% 53% 0% 0%)" alt="The mountain of publications"><div class="ob-note" style="--x:52%;--y:10%;--w:44%"><div class="k">From: the publication</div><div class="d">The paper is the atom. To know something you find, read and remember whole documents &ndash; and the pile grows faster than anyone can read it. Every fact worth knowing has to be rediscovered by whoever reads it next.</div></div></div><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/d1_pubcentric.jpg" style="clip-path:inset(12% 0% 0% 47%)" alt="A language model"><div class="ob-note" style="--x:4%;--y:58%;--w:38%"><div class="k">To: the claim</div><div class="d">The atom becomes the individual <em>claim</em>, extractable and comparable across thousands of documents at once. A model like this becomes the interface: ask a question and get an answer assembled from claims across the whole record.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-scrim"></div><div class="ob-note wide" style="--x:8%;--y:30%;--w:84%"><div class="k">What that costs you</div><div class="d"><b>A claim you cannot trace back to its source is worthless.</b> Everything this week does about provenance exists because of that.</div></div></div></div></section>
<section class="slide obuild dikwbuild" data-t="The 'real' IR vs 'our' IR" data-n="Climb the ladder one rung at a time, then reveal the short-circuit. Ask the room where their own work sits." data-sid="16e211"><h2>From data to decisions: the &lsquo;real&rsquo; IR vs &lsquo;our&rsquo; IR</h2><p class="sub">Five rungs. Most of our field uses two of them.</p><div class="ob-pic"><img class="ob-plate" src="img/d1_dikw.jpg" alt=""><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/d1_dikw.jpg" style="clip-path:inset(75.7% 10.9% 0% 17.2%)" alt="Data"><div class="ob-note" style="--x:26%;--y:3%;--w:48%"><div class="k">Data</div><div class="d">Signals. Numbers, text, audio, images, video. On their own they know nothing &ndash; a raw pixel or a logged timestamp carries no meaning until something is done to it. This is the only rung most of the field ever really works with.</div></div></div><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/d1_dikw.jpg" style="clip-path:inset(64.6% 24.6% 24.3% 27.3%)" alt="Information"><div class="ob-note" style="--x:26%;--y:3%;--w:48%"><div class="k">Information &middot; given context</div><div class="d">Data given context becomes information: useful, organized, structured. A number turns into a reading only once you know what it measures, in what units, against what baseline.</div></div></div><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/d1_dikw.jpg" style="clip-path:inset(46.5% 27.7% 35.4% 31.25%)" alt="Knowledge"><div class="ob-note" style="--x:26%;--y:3%;--w:48%"><div class="k">Knowledge &middot; given meaning</div><div class="d">Information given meaning becomes knowledge: contextual, synthesized, learned. This is where isolated facts start to connect into a picture that holds across cases, not just the one in front of you.</div></div></div><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/d1_dikw.jpg" style="clip-path:inset(27.8% 29.7% 53.5% 34.0%)" alt="Insight"><div class="ob-note" style="--x:26%;--y:3%;--w:48%"><div class="k">Insight &middot; given focus</div><div class="d">Knowledge given focus becomes insight: applied, integrated, actionable. It is knowledge aimed at a specific question, sharpened enough to change what someone actually does next.</div></div></div><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/d1_dikw.jpg" style="clip-path:inset(9.0% 33.6% 72.2% 36.7%)" alt="Decisions"><div class="ob-note" style="--x:3%;--y:5%;--w:29%"><div class="k">Decisions &middot; given purpose</div><div class="d">Insight given purpose becomes decisions: change, movement. This is the only rung that leaves the page and enters the world &ndash; and it is the top of a ladder that took four steps to build.</div></div></div><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/d1_dikw.jpg" style="clip-path:inset(0% 0% 0% 0%)" alt="The short-circuit"><div class="ob-scrim soft"></div><div class="ob-note wide" style="--x:16%;--y:32%;--w:68%"><div class="k">And what we actually do</div><div class="d"><b>We jump from data straight to insight and decisions</b>, skipping information and knowledge entirely &ndash; no shared structure, nothing that accumulates. <em>That short-circuit is the whole problem this week is about.</em></div></div></div></div></section>
<section class="slide rubasebuild" data-t="RuBase: what's in a name" data-n="Reveal the map, then the three readings of Base. The third is the ambition." data-sid="d4f10d"><h2>RuBase &ndash; what&rsquo;s in a name</h2><p class="sub">Ru &ndash; <b>Base</b>. Three readings, and the third is the point.</p><div class="rb-row"><div class="rbtrig m1" data-frag="1" style="position:absolute;width:0;height:0"></div><div class="rb-pic"><img class="rb-map" src="img/d1_name_map.jpg" alt="Russia in the colors of its flag"><svg class="rb-svg" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg"><text class="rb-word" x="10" y="52" font-size="52" font-weight="800" font-family="inherit"><tspan fill="#dbe6f2">Ru</tspan><tspan fill="var(--gold)">Base</tspan></text><g class="lg lg1"><rect x="8" y="88" width="108" height="20" rx="4" fill="#2a4a7a" stroke="#82a0bc"/><rect x="8" y="112" width="108" height="20" rx="4" fill="#234066" stroke="#82a0bc"/><rect x="8" y="136" width="108" height="20" rx="4" fill="#1c3555" stroke="#82a0bc"/><text x="62" y="176" font-size="13" fill="#e8edf3" text-anchor="middle">knowledge base</text></g><g class="lg lg2"><rect x="150" y="146" width="110" height="12" rx="2" fill="var(--gold)"/><rect x="158" y="130" width="94" height="12" rx="2" fill="#82a0bc"/><rect x="166" y="114" width="78" height="12" rx="2" fill="#5f7fa3"/><rect x="174" y="98" width="62" height="12" rx="2" fill="#48678c"/><rect x="182" y="82" width="46" height="12" rx="2" fill="#31567e"/><text x="205" y="176" font-size="13" fill="#e8edf3" text-anchor="middle">base of the pyramid</text></g><g class="lg lg3"><rect x="288" y="150" width="104" height="16" rx="2" fill="#dbad50" stroke="#f4d999"/><rect x="300" y="128" width="42" height="20" rx="2" fill="#c98f2e" stroke="#f4d999"/><rect x="346" y="128" width="42" height="20" rx="2" fill="#c98f2e" stroke="#f4d999"/><rect x="316" y="104" width="52" height="22" rx="2" fill="#dbad50" stroke="#f4d999"/><text x="340" y="176" font-size="13" fill="#e8edf3" text-anchor="middle">new foundation</text></g></svg></div><div class="stack rb-cards" style="flex:1;gap:.5em"><div class="card tint l1" data-frag="1"><div class="k">A knowledge <b>base</b></div><div class="d">Somewhere the evidence actually lives, rather than being rediscovered from scratch on every new project. Sources, extracts and judgments accumulate in one place instead of surviving only in someone&rsquo;s head or a folder that quietly gets lost.</div></div><div class="card tint l2" data-frag="1"><div class="k">The <b>base</b> of the DIKW pyramid</div><div class="d">The layer our field skips. Data made into information and knowledge, so that insight has something underneath it &ndash; a foundation the ladder from the last slide can actually stand on, instead of a jump straight to the top.</div></div><div class="card hot l3" data-frag="1"><div class="k">A new <b>foundation</b></div><div class="d">For <b>collaborative, cumulative knowledge-building</b> &ndash; work that adds up across people and years instead of restarting.</div></div></div></div></section>

<section class="slide" data-t="What this has produced" data-n="Evidence for a claim already made, not a portfolio." data-sid="d385e0"><h2>What this has actually produced</h2><p class="sub">Four projects, one method &ndash; the one you will use on your own question.</p><div class="grid c4"><div class="card num " data-frag="1"><div class="v">2,500+</div><div class="k">WACKO</div><div class="d">Official documents against the semantic echoes of <b>1,000+</b> Russian philosopher books.</div></div><div class="card num " data-frag="2"><div class="v">1958&ndash;2020</div><div class="k">Red Lines</div><div class="d">Red lines do <b>not &ndash; yet &ndash;</b> track Western provocations, or the reverse.</div></div><div class="card num " data-frag="3"><div class="v">1,400</div><div class="k">Gray Horizon</div><div class="d">Taxa across <b>13</b> dimensions of below-threshold conflict.</div></div><div class="card num " data-frag="4"><div class="v">1M+</div><div class="k">Regeneration</div><div class="d">Taxonomically annotated text chunks in one corpus.</div></div></div></section>

<section class="slide" data-t="The scholarly record on your topic" data-n="Make them guess out loud BEFORE the number appears. The gap between guess and number is the lesson." data-sid="1f47ad"><h2>The scholarly record on your topic</h2><p class="sub">Ask them to guess the size of their own field first. They will be wrong.</p><div class="split"><div class="stack"><div class="card num hot" data-frag="1"><div class="v">1,000 &ndash; 150k</div><div class="k">publications per topic</div><div class="d">What the scholarly knowledge base on most topics actually holds, in the largest bibliometric databases.</div></div></div><div class="stack"><div class="card " data-frag="2"><div class="k">Even the smallest databases</div><div class="d">Web of Science, Scopus &ndash; typically yield a few hundred publications on a topic.</div></div><div class="card hot" data-frag="3"><div class="k">Which is the problem</div><div class="d"><b>A figure far beyond human absorption capability.</b> Not a little beyond. Far beyond.</div></div></div></div></section>
