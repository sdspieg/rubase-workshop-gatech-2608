<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Out of the Dark Ages? &middot; slides</title>
<meta name="description" content="RuBase / StratBase Methods Workshop, Georgia Tech, 31 August to 4 September 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,400&display=swap">
<style>
/* == StratBase house palette - identical tokens to the sibling workshop apps == */
:root{
  --bg:#09182f; --db:#132f59; --db2:#173966; --gold:#dbad50;
  --lb:#9db8d6; --wh:#f3f6fb; --line:rgba(255,255,255,.12); --r:8px;
  --title-size:4.5cqw; --title-weight:700; --font:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--wh);overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}

/* ---------- house header ---------- */
.header{background:var(--db);border-bottom:1px solid var(--line);padding:8px 1.5rem;
 display:grid;grid-template-rows:auto auto;row-gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:100;flex-shrink:0}
.header-row1{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1rem}
.header-row2{display:flex;align-items:center;justify-content:center;gap:.5rem;padding-top:6px;
 border-top:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
.h-left,.h-right{display:flex;align-items:center;gap:1rem}
.h-right{justify-content:flex-end}
/* The QR lived only on the site, never in the deck he actually presents from (SDS, 2026-08-31:
   'because I don't see the QR code!!!!'). Same markup, same CSS, same behaviour as index.html. */
.h-qr{background:#fff;border:1px solid rgba(219,173,80,.55);border-radius:5px;padding:2px;
 line-height:0;cursor:pointer;flex:0 0 auto}
.h-qr img{width:52px;height:52px;display:block;image-rendering:pixelated}
.h-qr:hover{border-color:var(--gold);box-shadow:0 0 0 2px rgba(219,173,80,.25)}
#qrOverlay{position:fixed;inset:0;z-index:9999;background:rgba(4,12,26,.94);
 display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#qrOverlay[hidden]{display:none}
#qrOverlay img{width:min(70vh,70vw);height:min(70vh,70vw);background:#fff;padding:14px;
 border-radius:10px;image-rendering:pixelated}
.qr-inner{text-align:center}
.qr-url{margin-top:14px;color:var(--gold);font-size:1.05rem;letter-spacing:.02em}
.qr-hint{margin-top:5px;color:var(--lb);font-size:.82rem;opacity:.8}
/* the right-hand group is hidden under 980px; the QR is the one thing in it that must survive,
   because a QR nobody can see is the same as no QR at all */
.h-logo{height:34px;width:auto;flex-shrink:0;display:inline-flex;align-items:center;border-radius:4px;
 transition:opacity .15s,transform .15s;opacity:.9}
.h-logo:hover,.h-logo:focus-visible{opacity:1;transform:translateY(-1px)}
.h-logo:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.h-logo img{height:34px;width:auto;display:block}
.h-logo.invert img{filter:brightness(0) invert(1)}
.header-title{font-size:1.06rem;font-weight:700;color:var(--wh);letter-spacing:.4px;text-align:center;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-title span{color:var(--gold)}
.header-nav{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:center}
.header-nav a,.header-nav button,.header-nav select{background:transparent;border:1px solid var(--gold);
 color:var(--gold);padding:.34rem .78rem;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:700;
 font-size:.8rem;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s}
.header-nav a:hover,.header-nav button:hover{background:var(--gold);color:var(--db)}
.header-nav button.on{background:var(--gold);color:var(--db)}
.header-nav select option{background:var(--db);color:var(--wh)}
@media (max-width:1200px){.h-logo,.h-logo img{height:28px}.header-title{font-size:.94rem}
 .header-nav a,.header-nav button,.header-nav select{font-size:.75rem;padding:.3rem .6rem}}
@media (max-width:980px){.header-row1{grid-template-columns:auto 1fr auto}
 /* the right group used to vanish whole under 980px, which took the QR with it.
    Drop the logos, keep the QR - a QR nobody can see is the same as no QR. */
 .h-right{display:flex}.h-right .h-logo{display:none}
 .header-title{white-space:normal}}

/* ---------- day timeline ---------- */
.timeline-bar{background:var(--db2);padding:9px 24px;border-bottom:1px solid var(--line);
 display:flex;align-items:center;gap:0;overflow-x:auto;flex-shrink:0}
.timeline-block{flex:1;text-align:center;padding:7px 8px;cursor:pointer;transition:background .14s;
 min-width:126px;border-radius:6px;border:0;background:transparent;font-family:inherit;color:inherit}
.timeline-block:hover{background:rgba(219,173,80,.08)}
.timeline-block.active{background:rgba(219,173,80,.14);box-shadow:inset 0 -2px 0 var(--gold)}
.timeline-time{font-size:.7rem;color:var(--gold);font-weight:600;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.timeline-label{font-size:.85rem;font-weight:700;color:var(--wh)}
.timeline-duration{font-size:.68rem;color:var(--lb);margin-top:2px}
.timeline-connector{width:18px;height:2px;background:var(--line);flex-shrink:0}

/* ---------- layout ---------- */
.main-container{display:flex;flex:1;min-height:0}
.sidebar{width:284px;flex-shrink:0;background:var(--db);border-right:1px solid var(--line);
 padding:16px 16px 26px;overflow-y:auto}
.sidebar-section{margin-bottom:18px}
.sidebar-section-title{color:var(--gold);font-size:.76rem;text-transform:uppercase;letter-spacing:1px;
 margin-bottom:9px;padding-bottom:5px;border-bottom:1px solid rgba(219,173,80,.25)}
.sidebar-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;
 margin:2px 0;border-radius:6px;cursor:pointer;transition:all .14s;border:1px solid transparent;
 background:transparent;font-family:inherit;color:inherit;width:100%;text-align:left}
.sidebar-item:hover{border-color:var(--gold);background:rgba(219,173,80,.06);transform:translateX(3px)}
.sidebar-item.active{background:rgba(219,173,80,.12);border-color:var(--gold)}
.sidebar-item-title{font-size:.83rem;font-weight:600;line-height:1.3}
.sidebar-item.active .sidebar-item-title{color:var(--gold)}
.sidebar-badge{font-size:.66rem;color:var(--lb);font-variant-numeric:tabular-nums;flex-shrink:0}
.content-area{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}

/* ---------- stage ---------- */
#stage{flex:1;min-height:0;display:none;place-items:center;padding:14px;container-type:size}
#stage.on{display:grid}
.slide{position:relative;width:min(100%,100cqh * 16/9);aspect-ratio:16/9;background:var(--bg);
 border:1px solid var(--line);border-radius:var(--r);padding:3.1% 3.6%;display:none;flex-direction:column;
 container-type:inline-size;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45);--sc:1}
.slide.on{display:flex}
.slide.img{padding:0;background:#000}
.slide.img img{width:100%;height:100%;object-fit:contain;display:block;border-radius:var(--r)}
.src{position:absolute;right:.6%;top:.6%;background:rgba(9,24,47,.72);padding:2px 6px;border-radius:3px;
 font-size:10px;color:#5d7a9d;letter-spacing:.05em}

/* ---- type scale: every size is cqw * --sc; the autofit engine grows --sc to fill ---- */
/* STANDARD title size: 4.5cqw is the ceiling every h2 uses (SDS liked it on "Sound familiar?",
   2026-08-31, and asked whether it was the standard - it is). min(--sc,1) only ever SHRINKS a
   title, on content-dense slides that would otherwise overflow; it never grows one past the
   ceiling. Do not add a per-slide h2 override to "fix" a title that looks small - that slide's
   autofit --sc is below 1 because its own content needs the room. */
h2{margin:0 0 .34em;color:var(--gold);font-weight:var(--title-weight);font-size:calc(var(--title-size) * min(var(--sc), 1));
 line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:-.1em 0 .8em;color:var(--lb);font-size:calc(1.95cqw * min(var(--sc), 1));line-height:1.35;max-width:62ch}
.sub2{color:var(--lb);font-weight:400;font-size:.62em}
.body-lg{font-size:calc(2.75cqw * var(--sc));line-height:1.3;font-weight:500;text-wrap:balance}
/* A statement slide does not need to shout. 'calm' drops the scale a notch, and a
   highlighted figure keeps the gold without the extra weight - a bold gold number
   at full body-lg size dominated the entire slide. */
.body-lg .y{font-weight:600}
.kicker{font-size:calc(1.25cqw * min(var(--sc), 1));letter-spacing:.2em;text-transform:uppercase;color:var(--gold);
 font-weight:700;margin-bottom:.9em}
.fill{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:calc(1.6cqw * var(--sc))}
.small-note{margin-top:.8em;color:var(--lb);font-size:calc(1.4cqw * var(--sc));line-height:1.4}
.small-note b{color:var(--wh)}
.title-slide .t{font-size:calc(var(--title-size) * min(var(--sc), 1));font-weight:var(--title-weight);color:var(--gold);line-height:1.06;letter-spacing:-.02em}
.title-slide .s{font-size:calc(2.9cqw * min(var(--sc), 1));color:var(--wh);font-weight:600}
.title-slide .m{font-size:calc(1.5cqw * var(--sc));color:var(--lb);margin-top:.7em;line-height:1.6}
.slide.divider{background:linear-gradient(135deg,#09182f 0%,#173966 58%,#09182f 100%);border-color:var(--gold)}
.daycard{justify-content:center;gap:.28em}
.daytitle{font-size:calc(var(--title-size) * min(var(--sc), 1));font-weight:var(--title-weight);color:var(--gold);line-height:1.06;letter-spacing:-.012em}
.daysub{font-size:calc(2.6cqw * min(var(--sc), 1));color:var(--wh);font-weight:600;max-width:30ch;line-height:1.25}
.daymins{font-size:calc(1.45cqw * min(var(--sc), 1));color:var(--lb);margin-top:.9em;letter-spacing:.12em}

/* grids: rows STRETCH so cards fill the frame (align-content:center was the bug) */
.grid{display:grid;gap:1.8%;flex:1;min-height:0;align-content:stretch;grid-auto-rows:1fr}
.c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}
.c4{grid-template-columns:repeat(4,1fr)}.c5{grid-template-columns:repeat(5,1fr)}
.r2{grid-template-rows:repeat(2,1fr)}
.top .card{justify-content:flex-start}
.card{background:var(--db);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--r);
 padding:3.4% 4%;display:flex;flex-direction:column;justify-content:center;gap:.4em;min-height:0;min-width:0;overflow:hidden}
.card .k{font-size:calc(2.45cqw * var(--sc));font-weight:700;line-height:1.16;text-wrap:balance;color:var(--wh)}
.card .d{font-size:calc(1.55cqw * var(--sc));color:var(--lb);line-height:1.4}
/* A punchline card - .hot with no .k heading - is the payoff of the build-up and
   was rendering at body size, smaller than the layer headings it concludes. */
.card.hot > .d:only-child{font-size:calc(2.05cqw * var(--sc));color:var(--wh,#e8edf3);line-height:1.35}
.card .v{font-size:calc(5.4cqw * var(--sc));font-weight:900;color:var(--gold);line-height:1.02;
 font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.num .k{color:var(--gold)}
.q .k{font-weight:400;font-style:italic;color:var(--wh)}
.q .k::before{content:"\201C"}.q .k::after{content:"\201D"}
.q{border-left-color:var(--lb)}
.tint{background:transparent;border-left-color:var(--lb)}
.hot{border-color:var(--gold);background:rgba(219,173,80,.10)}
.hot .k{color:var(--gold)}
.y,.c{color:var(--gold)}
ul.big{margin:auto 0;padding-left:1.05em;display:flex;flex-direction:column;gap:.6em}
ul.big li{font-size:calc(2.55cqw * var(--sc));line-height:1.26}
ul.big li::marker{color:var(--gold)}
ul.big li b{color:var(--gold)}
ul.big li em{color:var(--wh);font-style:normal;font-weight:700}
.split{display:grid;grid-template-columns:1fr 1fr;gap:3%;flex:1;min-height:0;align-items:stretch}
.stack{display:flex;flex-direction:column;gap:.7em;min-width:0;justify-content:center}
/* was flex:0 0 30% - a fixed band that left half the slide empty */
.arrowrow{display:flex;align-items:stretch;gap:1.2%;flex:1 1 auto;min-height:0;min-width:0;margin-bottom:2%}
.arrowrow .card{flex:1 1 0;min-width:0;height:100%;padding:2.6% 2.4%}
.arrowrow .ar{color:var(--gold);font-size:calc(2.4cqw * var(--sc));font-weight:700;opacity:.75;flex:0 0 auto;align-self:center}


/* confusion matrix */
table.cm{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.cm td{border:1px solid var(--line);padding:3.2% 2%;text-align:center;
 font-size:calc(2.6cqw * var(--sc));font-weight:800;line-height:1.05}
table.cm td.h{background:transparent;border:0;color:var(--lb);font-weight:600;
 font-size:calc(1.5cqw * var(--sc));text-align:right;padding:1.4% 2%}
table.cm td.ok{background:var(--db);color:var(--wh)}
table.cm td.dis{background:rgba(219,173,80,.16);color:var(--gold);border-color:var(--gold)}


/* paradigm-shift tables */
table.shift{border-collapse:collapse;width:100%;flex:1;min-height:0;table-layout:fixed}
table.shift th{background:var(--db2);color:var(--gold);font-size:calc(1.35cqw * var(--sc));
 text-transform:uppercase;letter-spacing:.06em;padding:.7% .8%;text-align:left;
 border-bottom:1px solid var(--gold);font-weight:700}
table.shift td{border-bottom:1px solid var(--line);padding:.75% .8%;vertical-align:top;
 color:var(--lb);font-size:calc(1.35cqw * var(--sc));line-height:1.28}
table.shift td.d{color:var(--wh);font-weight:700}
table.shift td.k{color:var(--wh)}
table.shift tr:nth-child(even) td{background:rgba(255,255,255,.025)}
table.shift ul{margin:0;padding-left:1em;list-style:none}
table.shift ul li{position:relative;padding-left:.15em}
table.shift ul li::before{content:"\2022";color:var(--gold);position:absolute;left:-.8em}
table.shift col:first-child{width:12%}


/* ---------- build-up fragments ----------
   Fragments use OPACITY, not display, so they still occupy layout: the autofit
   engine measures the fully-built slide and must not resize mid-build. */
.slide [data-frag]{opacity:0;transform:translateY(.28em);transition:none}
/* ---- PAIRED REVEAL (SDS, 2026-08-31) ----------------------------------------
   His words: "the explanation shows while that ELEMENT shows, but then it
   disappears when the next element 'builds up'". The elements are parts of the
   PICTURE, not a column of cards - which is what I got wrong the first time.
   So: each explanation lights its OWN layer in the diagram, and only ONE
   explanation is on screen at a time. Earlier layers stay visible but dimmed, so
   the stack still accumulates while attention sits on the current one. */
.omics svg .lay{opacity:.18;transition:opacity .4s ease}
.omics .omx-expl,.omics .omx-expl.hot{
  border:1px solid rgba(219,173,80,.5);border-radius:6px;padding:.55em .7em;
  background:rgba(20,40,70,.55);opacity:0;max-height:0;overflow:hidden;
  transition:opacity .25s ease,max-height .35s ease,margin .35s ease}
.omics .omx-expl.shown{opacity:1;max-height:16em;margin-top:.5em}
/* the moment a LATER explanation is shown, this one goes away entirely */
.omics .omx-expl.shown:has(~ .omx-expl.shown){opacity:0;max-height:0;margin-top:0}
.omics .omx-expl.hot.shown{border-color:var(--gold,#dbad50);background:rgba(219,173,80,.10)}
/* The autofit inflates a sparse slide (--sc ~1.8), which blew the definition card up
   to 54px and dwarfed the diagram it is meant to introduce. Cap it: the definition is
   context, the diagram is the argument. */
.omics .card.tint .k{font-size:calc(1.95cqw * var(--sc))}
.omics .card.tint .d{font-size:calc(1.5cqw * var(--sc))}
.omics .omx-expl .k{font-size:calc(1.6cqw * var(--sc));color:var(--gold,#dbad50)}
.omics .omx-expl .d{font-size:calc(1.35cqw * var(--sc))}
/* :has() may NOT be nested inside :has() - the earlier version of these rules was
   invalid and silently dropped, so no layer ever lit. Express 'layer N is current'
   as: N is shown AND N+1 is not, with the :not(:has()) as a SIBLING of the :has(). */
.omics:has(.omx-expl[data-layer="1"].shown) svg .lay1{opacity:.5}
.omics:has(.omx-expl[data-layer="2"].shown) svg .lay2{opacity:.5}
.omics:has(.omx-expl[data-layer="3"].shown) svg .lay3{opacity:.5}
.omics:has(.omx-expl[data-layer="4"].shown) svg .lay4{opacity:.5}
.omics:has(.omx-expl[data-layer="1"].shown):not(:has(.omx-expl[data-layer="2"].shown)) svg .lay1{opacity:1}
.omics:has(.omx-expl[data-layer="2"].shown):not(:has(.omx-expl[data-layer="3"].shown)) svg .lay2{opacity:1}
.omics:has(.omx-expl[data-layer="3"].shown):not(:has(.omx-expl[data-layer="4"].shown)) svg .lay3{opacity:1}
.omics:has(.omx-expl[data-layer="4"].shown) svg .lay4{opacity:1}
/* ---- comment #49 "ATROCIOUS font" on the day divider, and #54 the oversized hero number ----
   .daytitle was capped at min(--sc,1) so it rendered at 4.5cqw on a slide whose autofit had
   already run to 3.2 - a day divider smaller than the body text of the slide before it. And
   .body-lg took --sc uncapped, which is how "200 million" got to ~6.2cqw. Both are now scaled
   deliberately rather than by whatever the fitter happened to land on. */
.slide.divider .daycard{justify-content:center;gap:.15em}
.slide.divider .kicker{font-size:1.85cqw;letter-spacing:.24em}
.slide.divider .daytitle{font-size:9.6cqw;line-height:1.0;margin:.06em 0 .1em}
.slide.divider .daysub{font-size:3.0cqw;line-height:1.24;max-width:26ch}
.slide.divider .daymins{font-size:1.7cqw;letter-spacing:.16em;margin-top:.5em}
.body-lg{font-size:calc(2.75cqw * min(var(--sc), 1.7))}
/* ---- OMICS: the ORIGINAL picture, built component by component (SDS 2026-08-31) ----
   His instruction: do NOT redraw the diagram as boxes and build THOSE. Parse the real
   components out of the original PowerPoint render and reveal those, each one paired
   with its own explanation, and only ONE explanation on screen at a time, placed where
   the already-revealed art is not. img/omics/*.png are those components: alpha layers
   cut by connected-component analysis over a polynomial-fitted background plate.
   Stacking all eight reproduces the original render to a mean 0.63/255 per pixel. */
.obuild .ob-pic{position:relative;width:100%;aspect-ratio:1770/750;margin:0 auto;
  max-height:66cqh;border-radius:4px;overflow:hidden;background:#0a1830}
.obuild .ob-pic img{position:absolute;inset:0;width:100%;height:100%;display:block}
.obuild .ob-step{position:absolute;inset:0;transform:none}
.obuild .ob-note{position:absolute;left:var(--x);top:var(--y);width:var(--w);
  background:rgba(10,24,47,.94);border:1px solid rgba(219,173,80,.55);
  border-left:3px solid var(--gold);border-radius:5px;padding:.72em .9em;
  box-shadow:0 8px 26px rgba(0,0,0,.55);transition:opacity .2s ease}
.obuild .ob-note .k{color:var(--gold);font-weight:700;font-size:1.72cqw;line-height:1.18;margin-bottom:.2em}
.obuild .ob-note .d{color:var(--wh);font-size:1.46cqw;line-height:1.42}
.obuild .ob-note.wide .d{font-size:1.62cqw}
/* only the CURRENT step keeps its box; every earlier one gives it up */
.obuild .ob-step:has(~ .ob-step.shown) .ob-note{opacity:0;visibility:hidden;transition:none}
/* the closing card dims the finished picture rather than covering any one part of it */
.obuild .ob-scrim{position:absolute;inset:0;background:rgba(6,16,34,.74)}
.obuild .ob-scrim.soft{background:rgba(6,16,34,.34)}
.obuild .ob-dates{position:absolute;left:0;right:0;bottom:.5em;text-align:center;
  color:var(--lb);font-size:1.18cqw}
/* ---- LUNG CANCER vs WAR: the phenotype/mechanism slide (SDS asked 2026-08-31) ----
   Same build grammar as the 'omics slide: one click adds one part of the PICTURE and
   the box that explains it, and the previous box goes away. The picture is drawn, not
   photographed, so it leaves its own note band along the bottom - which means the box
   never has to sit on top of anything. */
.lungb .ob-pic svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.lungb svg .lg{opacity:0;transition:opacity .34s ease}
.lungb:has(.ob-step.l1.shown) svg .lg1{opacity:1}
.lungb:has(.ob-step.l2.shown) svg .lg2{opacity:1}
.lungb:has(.ob-step.l3.shown) svg .lg3{opacity:1}
.lungb:has(.ob-step.l4.shown) svg .lg4{opacity:1}
.lungb:has(.ob-step.l5.shown) svg .lg5{opacity:1}
.lungb:has(.ob-step.l6.shown) svg .lg6{opacity:1}
body.measuring .lungb svg .lg,body.nobuild .lungb svg .lg{opacity:1;transition:none}
/* precision/recall uses the same grammar; its picture also leaves its own note band */
.prb .ob-pic svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.prb .ob-pic img.prt{position:absolute;display:block;border-radius:3px}
.prb svg .lg,.prb img.prt{opacity:0;transition:opacity .34s ease}
.prb:has(.ob-step.p1.shown) svg .p1{opacity:1}
.prb:has(.ob-step.p2.shown) svg .p2{opacity:1}
.prb:has(.ob-step.p3.shown) svg .p3{opacity:1}
.prb:has(.ob-step.p4.shown) svg .p4{opacity:1}
.prb:has(.ob-step.p5.shown) svg .p5{opacity:1}

   (SDS 2026-08-31). The source photo (img/d1_name_map.jpg) is a low-res flag-colored
   map with no internal structure to cut apart, so route 3 applies: draw the wordmark

.rubasebuild .rb-row{display:flex;align-items:center;gap:6%}

   layers that generated the figure on geomics.org, recovered from
   StratBase/Proposals/Geomics/media/figures/_layers/ (generator:
   geomics_darkness_to_light_260708.py). The figure carries its own title, so this
   slide is full-bleed and the explanation box sits where the art is not. */
.slide.d2ls{padding:0;background:#0a192f}
.d2ls .ob-pic{position:relative;width:100%;height:100%;aspect-ratio:auto;max-height:none;background:#0a192f;border-radius:var(--r);overflow:hidden}
.d2ls .ob-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.d2ls .ob-step{position:absolute;inset:0;transform:none}
.d2ls .ob-note .k{font-size:1.5cqw}
.d2ls .ob-note .d{font-size:1.34cqw;line-height:1.38}
/* SOLO CARDS - the appearing/disappearing explanatory box SDS asked for twice.
   The layer HEADING (.k) accumulates so the structure builds visibly; the
   EXPLANATION (.d) is present only while its layer is the current one, and
   collapses the moment the next layer appears. Driven entirely by the deck's own
   .shown mechanism via :has(), so there is no extra JS and no separate state to
   drift out of sync. Hidden state carries transition:none, per the ghosting fix. */
.slide .card.solo .d{max-height:14em;opacity:1;overflow:hidden;
  transition:max-height .38s ease,opacity .24s ease,margin .38s ease}
.slide .card.solo:has(~ .card.solo.shown) .d{max-height:0;opacity:0;margin:0}
.slide [data-frag].card.solo:not(.shown) .d{transition:none}
.slide .card.solo{transition:border-color .3s ease,background .3s ease}
.slide .card.solo.shown:not(:has(~ .card.solo.shown)){
  border-color:var(--gold,#dbad50)}
.slide .card.solo:has(~ .card.solo.shown) .k{opacity:.72}
.slide [data-frag].shown{opacity:1;transform:none;transition:opacity .26s ease,transform .26s ease}

body.nobuild .slide [data-frag]{opacity:1;transform:none}

<section class="slide obuild fbb" data-t="Flashback in time" data-n="&lt;b&gt;DELIVERY&lt;/b&gt; &middot; start with your own journey &ndash; you were trained as a Soviet expert. &lt;ul&gt; &lt;li&gt;&lt;b&gt;The photo:&lt;/b&gt; RAND/UCLA Center for Soviet Studies, &lt;i&gt;1990&ndash;91&lt;/i&gt;. Roster: Asmus, Azrael, Gottemoeller, Horelick, Nurick, Rumer, the Soviet TV monitoring facility, and Hans Rogger with a very young Stephan. &lt;b&gt;Name two or three and where they ended up.&lt;/b&gt;&lt;/li&gt; &lt;li&gt;&lt;b&gt;THE ARGUMENT &ndash; say it explicitly:&lt;/b&gt; ~200 Soviet specialists in one place, with a serious library.&lt;/li&gt; &lt;li&gt;RAND/UCLA plus a couple of comparable programs was the &lt;b&gt;only real attempt to build a research INFRASTRUCTURE&lt;/b&gt; &ndash; not a project, an infrastructure &ndash; so the US could understand a peer competitor profoundly unlike itself.&lt;/li&gt; &lt;li&gt;Built with the most advanced technology of the day, which was &lt;b&gt;OVERWHELMINGLY HUMAN&lt;/b&gt;: take experts who would otherwise be scattered, co-locate them, hope for network effects.&lt;/li&gt; &lt;li&gt;It had a &lt;b&gt;teaching layer&lt;/b&gt; too &ndash; you and Adam were trained there AND worked the research, reading the huge, mostly textual Soviet record and carrying up what mattered.&lt;/li&gt; &lt;/ul&gt; &lt;b&gt;LAND ON:&lt;/b&gt; the point is not that the old way was primitive. &lt;b&gt;They did the homework with what they had.&lt;/b&gt;" data-sid="592826"><h2>Flashback in time</h2><p class="sub">RAND/UCLA Center for Soviet Studies, 1990&ndash;91.</p><div class="ob-pic"><img class="ob-plate" src="img/x_flashback.jpg" alt=""><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/x_flashback.jpg" style="clip-path:inset(13% 52% 0% 4%)" alt="The roster"><div class="ob-note" style="--x:54%;--y:15%;--w:43%"><div class="k">The roster</div><div class="d">RAND and UCLA together fielded roughly <b>two hundred</b> Soviet specialists in one place, with a serious library &ndash; among them Asmus, Azrael, Gottemoeller, Horelick, Nurick and Rumer.</div></div></div><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/x_flashback.jpg" style="clip-path:inset(13% 33% 0% 48%)" alt="RAND/UCLA Center for Soviet Studies"><div class="ob-note" style="--x:69%;--y:15%;--w:29%"><div class="k">An infrastructure, not a project</div><div class="d">RAND/UCLA &ndash; plus a couple of comparable programs &ndash; was the <b>only real attempt to build a research infrastructure</b>, so the US could understand a peer competitor profoundly unlike itself.</div></div></div><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/x_flashback.jpg" style="clip-path:inset(13% 0% 46% 67%)" alt="Soviet TV monitoring facility"><div class="ob-note" style="--x:69%;--y:58%;--w:29%"><div class="k">Overwhelmingly human</div><div class="d">Built with the most advanced technology of the day, which was <b>overwhelmingly human</b>: take experts who would otherwise be scattered, co-locate them, hope for network effects.</div></div></div><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/x_flashback.jpg" style="clip-path:inset(54% 0% 0% 67%)" alt="Hans Rogger and a young Stephan De Spiegeleire"><div class="ob-note" style="--x:48%;--y:15%;--w:39%"><div class="k">A teaching layer, too</div><div class="d">Hans Rogger and a young Stephan De Spiegeleire: students were trained there <em>and</em> worked the research &ndash; reading the huge, mostly textual Soviet record and carrying up what mattered.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-scrim soft"></div><div class="ob-note wide" style="--x:8%;--y:38%;--w:84%"><div class="k">Not that the old way was primitive</div><div class="d"><b>They did the homework with what they had.</b></div></div></div></div></section>
<section class="slide obuild rbb" data-t="Russia is back. We are not." data-n="&lt;b&gt;DELIVERY&lt;/b&gt; &middot; the other half, and the reason this week exists. &lt;ul&gt; &lt;li&gt;&lt;b&gt;Read the Putin quote out loud.&lt;/b&gt; Strength has several dimensions &ndash; he means the &lt;i&gt;willingness to go all the way&lt;/i&gt;.&lt;/li&gt; &lt;li&gt;&lt;b&gt;Then make the turn:&lt;/b&gt; that infrastructure collapsed with the Soviet Union. People scattered.&lt;/li&gt; &lt;li&gt;By the time Putin not only arrived but turned &lt;b&gt;decisively away from Europe and the West&lt;/b&gt;, the analytical layer was spread thin on both sides of the Atlantic.&lt;/li&gt; &lt;li&gt;&lt;b&gt;Nobody rebuilt it.&lt;/b&gt; Governments were no longer willing or able to spend; think tanks, newspapers and the market were assumed to cover it.&lt;/li&gt; &lt;/ul&gt; &lt;b&gt;LAND ON:&lt;/b&gt; &lt;b&gt;the competitor came back. The expertise did not.&lt;/b&gt;" data-sid="0cae47"><h2>Russia is back. We are not.</h2><p class="sub">The competitor came back. The expertise did not.</p><div class="ob-pic"><img class="ob-plate" src="img/x_putinbear.jpg" alt=""><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/x_putinbear.jpg" style="clip-path:inset(19% 51% 20% 5%)" alt="Putin"><div class="ob-note" style="--x:52%;--y:22%;--w:44%"><div class="k">Read the quote out loud</div><div class="d">Putin&rsquo;s own words: strength has several dimensions &ndash; he means the <em>willingness to go all the way</em>.</div></div></div><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/x_putinbear.jpg" style="clip-path:inset(80% 0% 0% 0%)" alt="Putin quote banner"><div class="ob-note" style="--x:52%;--y:56%;--w:44%"><div class="k">Then make the turn</div><div class="d">That infrastructure <b>collapsed with the Soviet Union</b>. People scattered. By the time Putin turned decisively away from Europe and the West, the analytical layer was spread thin on both sides of the Atlantic.</div></div></div><div class="ob-step" data-frag="1"><img class="ob-reveal" src="img/x_putinbear.jpg" style="clip-path:inset(19% 0% 20% 49%)" alt="A Russia conference today"><div class="ob-note" style="--x:5%;--y:22%;--w:44%"><div class="k">Nobody rebuilt it</div><div class="d">Governments were no longer willing or able to spend; think tanks, newspapers and the market were assumed to cover it.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-scrim soft"></div><div class="ob-note wide" style="--x:8%;--y:38%;--w:84%"><div class="k">The turn this week answers</div><div class="d"><b>The competitor came back. The expertise did not.</b></div></div></div></div></section>
<section class="slide" data-t="We built it once. Then we stopped." data-n="&lt;b&gt;DELIVERY&lt;/b&gt; &middot; this turns the two photographs into an argument. &lt;b&gt;Do not rush it.&lt;/b&gt; Reveal the timeline first and let them read it. Then the three cards. &lt;ul&gt; &lt;li&gt;&lt;b&gt;Card 1 &ndash; we built it once,&lt;/b&gt; with nothing but people. That is the standard, and it was met.&lt;/li&gt; &lt;li&gt;&lt;b&gt;Card 2 &ndash; the misses.&lt;/b&gt; 2007, 2008, 2014, 2022 and more; the catalogue is in the EUCOM paper. &lt;b&gt;This is OUR track record, not somebody else's&lt;/b&gt; &ndash; which is why you can say it in this room.&lt;/li&gt; &lt;li&gt;&lt;b&gt;Card 3 &ndash; the one that should sting.&lt;/b&gt; Given the urgency AND the record, you would expect a field to reach for every new instrument it could find. &lt;b&gt;It has not.&lt;/b&gt; The incentives in academia and think tanks point the other way.&lt;/li&gt; &lt;li&gt;&lt;b&gt;BE FAIR HERE, and say it:&lt;/b&gt; satellite imagery, Telegram and social media &lt;i&gt;do&lt;/i&gt; mean more information is used than before. &lt;b&gt;What is missing is not information. It is system.&lt;/b&gt;&lt;/li&gt; &lt;/ul&gt; &lt;b&gt;THEN GO STRAIGHT&lt;/b&gt; to the humors &ndash; medicine had exactly this problem and fixed it." data-sid="2cc98d"><h2>We built it once. Then we stopped.</h2><p class="sub">The competitor came back. The infrastructure did not.</p><figure class="viz" data-frag="1"><img src="img/viz/capacity_timeline.svg" style="width:100%;height:auto;object-fit:contain;border-radius:3px" alt="Analytical capacity built through the 1960s to 1980s, collapsing after 1991, never rebuilt, against a run of missed inflections"></figure><div class="grid c3" style="margin-top:.5em"><div class="card" data-frag="2"><div class="k">It was done once</div><div class="d">About <b>200 specialists</b> in one place, with a real library and the most advanced technology of the day &ndash; which was <b>people</b>.</div></div><div class="card" data-frag="3"><div class="k">And our record since</div><div class="d"><b>2007. 2008. 2014. 2022.</b> Not obscure calls. The ones the field existed to make.</div></div><div class="card hot" data-frag="4"><div class="k">So you would expect experiment</div><div class="d">More urgency, worse record, better instruments than ever &ndash; and <b>less systematic work than ever</b>. The incentives point the other way.</div></div></div><div class="small-note" data-frag="5">To be fair: satellite imagery, Telegram and social media <em>do</em> mean more information is used than before. <b>What is missing is not information. It is system.</b></div></section><section class="slide" data-t="The week" data-n="THE map slide. Reuse it as the opening we-are-here slide every morning." data-sid="463051"><h2>The week</h2><p class="sub">One pipeline. Each day owns one stage of it, and each day stands on its own.</p><div class="grid c5 top"><div class="card hot" data-frag="1"><div class="k">Day 1 &middot; Foundations</div><div class="d">Why the way we work now does not hold.</div></div><div class="card " data-frag="2"><div class="k">Day 2 &middot; Corpora</div><div class="d">Finding what you have been missing.</div></div><div class="card " data-frag="3"><div class="k">Day 3 &middot; Taxonomies</div><div class="d">Building the instrument.</div></div><div class="card " data-frag="4"><div class="k">Day 4 &middot; Classification</div><div class="d">Applying it at scale, and evaluating it.</div></div><div class="card " data-frag="5"><div class="k">Day 5 &middot; Your projects</div><div class="d">And the parts of the kit you can take.</div></div></div><div class="small-note" data-frag="6">Students come and go. <b>Every day is self-contained</b> and opens with a cold start, so arriving on Wednesday costs you nothing.</div></section>
<section class="slide divider" data-t="Day 1 &amp;middot; Monday 31 August - Foundations" data-n="Day divider. Recap where we are on the five-day map, then go." data-sid="5539ea"><div class="fill daycard"><div class="kicker">Day 1 &middot; Monday 31 August</div><div class="daytitle">Foundations</div><div class="daysub">How we got here, why it stopped working &ndash; and what a field that fixed it looks like</div><div class="daymins">11:00 &ndash; 13:30</div></div></section>
<section class="slide" data-t="How this week works" data-n="Fletcher text verbatim. The third card also tells drop-ins they can join later." data-sid="8d2bbe"><h2>How this week works</h2><p class="sub">Six ground rules.</p><div class="grid c3"><div class="card " data-frag="1"><div class="k">Please interrupt</div><div class="d">Questions <b>and comments</b> welcome at any time &ndash; you may know things I do not, and I want to hear them.</div></div><div class="card " data-frag="2"><div class="k">We will not finish everything &ndash; by design</div><div class="d">Quality over coverage. Topics bleed into the next day; that is fine, the days are not sealed off. Each day stands alone, so walking in on any single day still leaves you with something you can use. <b>This is not the five-day program compressed:</b> that one runs 32 hours end to end, this one is 12.5.</div></div><div class="card " data-frag="3"><div class="k">Bring your friends</div><div class="d">Share the QR in the banner, or just the link. Anyone is welcome, on any day, for any part of it &ndash; no sign-up, no obligation to come back.</div></div><div class="card " data-frag="4"><div class="k">No grades, nothing assessed</div><div class="d">Nothing here is marked, submitted or evaluated. The only test that matters is whether you leave with something you can use on your own work.</div></div><div class="card " data-frag="5"><div class="k">It stays online after the week</div><div class="d">Slides, materials and the kit remain up. <b>You do not need to take notes frantically</b> &ndash; scan the QR and read it again on Saturday.</div></div><div class="card hot" data-frag="6"><div class="k">It runs on your question, not mine</div><div class="d">You bring <b>one research question</b> and carry it through all five days &ndash; if you do not have one yet, we write it together on Monday. Nothing here is a demo on my data, and <b>none of it needs you to write code</b>.</div></div></div></section> <section class="slide" data-t="Who is in the room?" data-sid="3b45b5" data-n="&lt;b&gt;DELIVERY&lt;/b&gt; &middot; &lt;b&gt;set the clock before you start:&lt;/b&gt; one minute each, or &lt;b&gt;thirty seconds&lt;/b&gt; if the room is large. &lt;ul&gt; &lt;li&gt;&lt;b&gt;Three prompts only:&lt;/b&gt; first name &middot; School or major &middot; classification.&lt;/li&gt; &lt;li&gt;&lt;b&gt;Georgia Tech's own vocabulary&lt;/b&gt; (checked against the registrar): the academic unit is a &lt;b&gt;School&lt;/b&gt; &ndash; Sam Nunn School of International Affairs, School of Computer Science, School of Public Policy. Undergraduates have a &lt;b&gt;major&lt;/b&gt;. The registrar's word for level is &lt;b&gt;classification&lt;/b&gt;, and GT says &lt;b&gt;first-year through fourth-year&lt;/b&gt;, &lt;i&gt;not&lt;/i&gt; freshman/sophomore.&lt;/li&gt; &lt;li&gt;&lt;b&gt;Do NOT comment on each one&lt;/b&gt; or this eats fifteen minutes. Let them run down the row.&lt;/li&gt; &lt;/ul&gt; &lt;b&gt;WHY YOU ARE ASKING:&lt;/b&gt; the examples, the hands-on topics and the Friday clinics all come from &lt;b&gt;their&lt;/b&gt; questions."><h2>Who is in the room?</h2><p class="sub">One minute each &ndash; thirty seconds if we are many.</p><div class="grid c3"><div class="card " data-frag="1"><div class="k">Your first name</div><div class="d">That is all. No titles.</div></div><div class="card " data-frag="2"><div class="k">Your School or major</div><div class="d">INTA, Computer Science, Public Policy, ECE, History &ndash; whatever you would put on a form. If you are visiting, say where from.</div></div><div class="card " data-frag="3"><div class="k">Your classification</div><div class="d">First-year through fourth-year, MS, PhD, postdoc, faculty, visitor.</div></div></div><div class="small-note" data-frag="4">I am asking because <b>the rest of the week is pointed at whatever is in this room</b> &ndash; the examples, the hands-on topics and the Friday clinics all come from your questions, not mine.</div></section>
<section class="slide" data-t="Sound familiar?" data-n="Show of hands on each. The only audience survey you get." data-sid="8724ac"><h2>Sound familiar?</h2><p class="sub">Which of these is yours?</p><div class="grid c3 r2"><div class="card q" data-frag="1"><div class="k">Have I read enough? What am I missing?</div></div><div class="card q" data-frag="2"><div class="k">I found 3,000 papers on Google Scholar. Now what?</div></div><div class="card q" data-frag="3"><div class="k">WoS, Scopus, Google Scholar&hellip; which one do I use? Or can I merge them?</div></div><div class="card q" data-frag="4"><div class="k">Everyone cites the same 10 papers. Is that the whole field?</div></div><div class="card q" data-frag="5"><div class="k">How do I deal with sources in languages I don't read?</div></div><div class="card q" data-frag="6"><div class="k">My committee wants &lsquo;systematic analysis&rsquo; but I'm just&hellip; reading?</div></div></div></section>
