<section class="slide" data-t="What are ontologies and taxonomies?" data-n="The tiger example does the work. Do not over-explain it."><h2>What are ontologies and taxonomies?</h2><p class="sub">Both organize knowledge. They do slightly different jobs.</p><div class="split"><div class="stack"><div class="card " data-frag="1"><div class="k">A taxonomy classifies</div><div class="d">Concepts into hierarchical, tree-like structures, grouping related entities under broader categories and defining <b>is-a</b> relationships. <em>A tiger is a mammal.</em></div></div><div class="card tint" data-frag="2"><div class="k">Like a library classification</div><div class="d">Books on physics are grouped together.</div></div></div><div class="stack"><div class="card hot" data-frag="3"><div class="k">An ontology relates</div><div class="d">It goes beyond classification by defining relationships between concepts: rules, attributes and connections describing how elements interact. <em>A tiger preys on deer. A tiger's habitat is the jungle.</em></div></div><div class="card tint" data-frag="4"><div class="k">Like a knowledge graph</div><div class="d">Books linked not just by category but by content, themes and authors.</div></div></div></div></section>
<section class="slide" data-t="Why they matter for cumulative knowledge" data-n="The third example is the one about us. Land it and move."><h2>Why they matter for cumulative knowledge</h2><p class="sub">Progress depends on building on previous findings rather than rediscovering them.</p><div class="grid c4"><div class="card " data-frag="1"><div class="k">Structuring information</div><div class="d">A common language for concepts, reducing ambiguity and organizing knowledge systematically.</div></div><div class="card " data-frag="2"><div class="k">Facilitating discoverability</div><div class="d">Well-classified work can be retrieved and compared efficiently, which reduces duplicated effort.</div></div><div class="card " data-frag="3"><div class="k">Enabling interdisciplinary research</div><div class="d">Ontologies define connections between fields, so researchers in different disciplines can understand each other's concepts.</div></div><div class="card hot" data-frag="4"><div class="k">Supporting machine learning</div><div class="d">Many AI systems rely on structured knowledge representations to interpret data, recognize patterns and generate new hypotheses.</div></div></div><div class="small-note" data-frag="5"><b>In biology</b> the Gene Ontology keeps gene functions described consistently across species and studies. <b>In astronomy</b> stellar classification standardises how types of star are described. <b>In the social sciences</b> the lack of rigorous taxonomies leaves terms like <em>power</em> and <em>institutions</em> used inconsistently, and studies fragmented.</div></section>
<section class="slide" data-t="Patchy scientific uptake" data-n="The context-dependent defense is the one they will raise. Pre-empt it here."><h2>Patchy scientific uptake</h2><p class="sub">Some fields built the instrument. Ours did not.</p><div class="split"><div class="stack"><div class="kicker">Well developed</div><div class="card " data-frag="1"><div class="k">Biology and medicine</div><div class="d">Gene Ontology, SNOMED CT and ICD give research and clinical practice a structured language.</div></div><div class="card " data-frag="2"><div class="k">Computer science and AI</div><div class="d">Ontologies power knowledge graphs, semantic search and expert systems: the Semantic Web, WordNet.</div></div><div class="card " data-frag="3"><div class="k">Linguistics, astronomy and physics</div><div class="d">FrameNet and Universal Dependencies; Harvard stellar classification for celestial objects, particles and phenomena.</div></div></div><div class="stack"><div class="kicker">Underdeveloped</div><div class="card hot" data-frag="4"><div class="k">Social sciences</div><div class="d"><em>Power</em>, <em>identity</em> and <em>institutions</em> used inconsistently across studies and subfields.</div></div><div class="card hot" data-frag="5"><div class="k">International relations and political science</div><div class="d">No rigorous taxonomies for geopolitical strategies, military doctrines or diplomatic norms.</div></div><div class="card hot" data-frag="6"><div class="k">History, humanities, economics</div><div class="d">Classification informal and subjective; macroeconomic concepts like <em>inflation expectations</em> lack standard definitions across models.</div></div></div></div><div class="small-note" data-frag="7"><b>Why some fields lag:</b> they rely on fluid, interpretive concepts rather than strictly defined categories; standardized datasets are missing, which makes formal classification harder; and IR and political science actively resist rigid taxonomies <b>because their concepts are context-dependent</b>. That last one is an argument, not an excuse.</div></section>
<section class="slide img" data-t="Multidimensional taxonomies: an analogy" data-n="The one slide that makes multi-dimensionality click."><img src="img/d3_analogy.jpg" alt="Multidimensional taxonomies: an analogy"></section>
<section class="slide" data-t="The taxonomy generation prompt (1)" data-n="HLTP is our word and it needs saying once, slowly. It is just: an independent way of looking at the thing."><h2>The taxonomy generation prompt</h2><p class="sub">What you are asking for, before you ask for it.</p><div class="split"><div class="stack"><div class="card " data-frag="1"><div class="k">A multi-dimensional taxonomy</div><div class="d">A framework for analyzing a complex domain through <b>multiple independent analytical perspectives</b>, each a fundamental way of looking at the subject.</div></div><div class="card hot" data-frag="2"><div class="k">Not the usual thing</div><div class="d">Traditional hierarchical taxonomies organize concepts along a <em>single</em> dimension. Complex phenomena live in spaces where several factors operate at once, and independently.</div></div></div><div class="stack"><div class="kicker">Four levels</div><div class="card " data-frag="3"><div class="k">HLTP</div><div class="d"><b>High-Level Taxonomic Principles</b>: the independent dimensions, the lenses. Temporal, geographical, power application.</div></div><div class="card " data-frag="4"><div class="k">Second and third level</div><div class="d">Major divisions within each principle, then the specific operational areas within those.</div></div><div class="card tint" data-frag="5"><div class="k">Taxa</div><div class="d">The concrete instances that get classified along every dimension.</div></div></div></div></section><section class="slide" data-t="The MDTDF prompt, componentized" data-n="This is the prompt itself, taken apart - every element here is in StratBase/MDTDF.md, so you can say honestly that this IS the working document rather than a teaching summary of it. Build it: 1-4 the four phases, each with five steps, and note that phase 2 is where independence gets tested, not phase 4. 5 the four output levels - HLTP, second level, third level, taxon, 8 to 15 taxa per third level - and the nesting is the point. 6 the five criteria every HLTP must pass. 7 THE TEST THAT MATTERS, and slow down here: position on one dimension changes while the others stay put; if two always move together you have one dimension wearing two hats, so merge them; and a model will hand you a beautiful taxonomy whose dimensions are NOT independent and will not warn you. 8 the TSV contract, four columns, no quotes. 9 the worked example, which is the fastest way to make multi-dimensionality concrete: a community policing patrol is pre-incident AND local AND soft power AND community engagement AND throughput AND tacit AND tactical, all at once. 10 then the wrapper - run the whole thing twice, blind, and murderboard it; where the two disagree is where the domain is genuinely contestable."><h2>The MDTDF prompt, componentized</h2><p class="sub">Every element of the working framework document &ndash; not a summary written for teaching.</p><figure class="viz"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 392" role="img"
     aria-label="The MDTDF prompt decomposed: four development phases, the four-level output structure from HLTP down to taxon, the five validation criteria with the independence test, the TSV output contract, and the murderboard wrapper that runs the whole prompt twice blind.">

<g data-frag="1"><text x="20" y="24" class="hd" fill="#dbad50">THE METHOD &#183; FOUR PHASES, EACH WITH FIVE STEPS</text></g>
<g data-frag="1">
<rect x="20" y="32" width="226" height="58" rx="6" fill="#142846" stroke="#27446e"/>
<text x="32" y="50" class="ph">1 &#183; identify</text>
<text x="32" y="65" class="st">domain definition &#183; brainstorm &#183;</text>
<text x="32" y="77" class="st">literature &#183; experts &#183; first principles</text>
</g>
<g data-frag="2">
<rect x="258" y="32" width="226" height="58" rx="6" fill="#142846" stroke="#27446e"/>
<text x="270" y="50" class="ph">2 &#183; refine</text>
<text x="270" y="65" class="st">independence testing &#183; classify examples</text>
<text x="270" y="77" class="st">&#183; gaps &#183; merge overlaps</text>
<line x1="230" y1="61" x2="252" y2="61" stroke="#7d93ad" stroke-width="1.8" marker-end="url(#m1)"/>
</g>
<g data-frag="3">
<rect x="496" y="32" width="226" height="58" rx="6" fill="#142846" stroke="#27446e"/>
<text x="508" y="50" class="ph">3 &#183; second level</text>
<text x="508" y="65" class="st">divisions &#183; mutual exclusivity &#183;</text>
<text x="508" y="77" class="st">completeness &#183; boundary tests</text>
<line x1="468" y1="61" x2="490" y2="61" stroke="#7d93ad" stroke-width="1.8" marker-end="url(#m1)"/>
</g>
<g data-frag="4">
<rect x="734" y="32" width="226" height="58" rx="6" fill="#142846" stroke="#27446e"/>
<text x="746" y="50" class="ph">4 &#183; validate</text>
<text x="746" y="65" class="st">real cases &#183; edge cases &#183; expert review</text>
<text x="746" y="77" class="st">&#183; use it &#183; iterate</text>
<line x1="706" y1="61" x2="728" y2="61" stroke="#7d93ad" stroke-width="1.8" marker-end="url(#m1)"/>
</g>
<g data-frag="5">
<text x="20" y="118" class="hd" fill="#5fae86">WHAT IT MUST PRODUCE &#183; FOUR LEVELS</text>
<rect x="20" y="132" width="300" height="22" rx="4" fill="#142846" stroke="#5fae86"/>
<text x="30" y="147" class="lv" fill="#5fae86">HLTP</text>
<text x="124" y="147" class="mc">an independent LENS on the domain</text>
<rect x="36" y="158" width="284" height="22" rx="4" fill="#142846" stroke="#6fa8d6"/>
<text x="46" y="173" class="lv" fill="#6fa8d6">2nd Level TE</text>
<text x="140" y="173" class="mc">major division inside that lens</text>
<rect x="52" y="184" width="268" height="22" rx="4" fill="#142846" stroke="#6fa8d6"/>
<text x="62" y="199" class="lv" fill="#6fa8d6">3rd Level TE</text>
<text x="156" y="199" class="mc">specific operational area</text>
<rect x="68" y="210" width="252" height="22" rx="4" fill="#142846" stroke="#d69a6f"/>
<text x="78" y="225" class="lv" fill="#d69a6f">Taxon</text>
<text x="172" y="225" class="mc">a concrete instance &#183; 8-15 per 3rd level</text>
</g>
<g data-frag="6">
<text x="352" y="118" class="hd" fill="#7d93ad">EVERY HLTP MUST PASS FIVE</text>
<rect x="352" y="130" width="150" height="18" rx="4" fill="#0d2035" stroke="#27446e"/>
<text x="362" y="143" class="mc">independence</text>
<rect x="352" y="152" width="150" height="18" rx="4" fill="#0d2035" stroke="#27446e"/>
<text x="362" y="165" class="mc">universality</text>
<rect x="352" y="174" width="150" height="18" rx="4" fill="#0d2035" stroke="#27446e"/>
<text x="362" y="187" class="mc">fundamentality</text>
<rect x="352" y="196" width="150" height="18" rx="4" fill="#0d2035" stroke="#27446e"/>
<text x="362" y="209" class="mc">distinctiveness</text>
<rect x="352" y="218" width="150" height="18" rx="4" fill="#0d2035" stroke="#27446e"/>
<text x="362" y="231" class="mc">utility</text>
</g>
<g data-frag="7">
<rect x="520" y="126" width="440" height="94" rx="7" fill="#142846" stroke="#dbad50" stroke-width="1.5"/>
<text x="534" y="146" class="ph" fill="#dbad50">The one test that matters</text>
<text x="534" y="164" class="mc">Position on one dimension changes &#8212; the others stay put.</text>
<text x="534" y="177" class="mc">If two of your dimensions always move together, you have</text>
<text x="534" y="190" class="mc">ONE dimension wearing two hats. Merge them.</text>
<text x="534" y="203" class="mc">A model will hand you a beautiful taxonomy whose dimensions</text>
<text x="534" y="216" class="mc">are not independent, and it will not warn you.</text>
</g>
<g data-frag="8">
<text x="20" y="248" class="hd" fill="#7d93ad">THE OUTPUT CONTRACT</text>
<rect x="20" y="256" width="482" height="60" rx="6" fill="#0d2035" stroke="#27446e"/>
<text x="32" y="274" class="mono">HLTP &#8594; 2nd Level TE &#8594; 3rd Level TE &#8594; Taxon</text>
<text x="32" y="290" class="mono">Functional Domain | Law Enforcement | Apprehension | Warrant execution</text>
<text x="32" y="308" class="st">TSV, four columns, no quotes, no extra metadata, grouped by level &#183; one row = one full path</text>
</g>
<g data-frag="9">
<text x="520" y="248" class="hd" fill="#d69a6f">ONE ACTIVITY, SEVEN LENSES</text>
<rect x="520" y="256" width="440" height="60" rx="6" fill="#142846" stroke="#d69a6f"/>
<text x="534" y="274" class="mc">A community policing patrol is simultaneously:</text>
<text x="534" y="290" class="st">pre-incident &#183; local &#183; soft power &#183; community engagement</text>
<text x="534" y="304" class="st">throughput &#183; tacit knowledge &#183; tactical</text>
</g>
<g data-frag="10">
<rect x="20" y="330" width="940" height="46" rx="6" fill="#12243f" stroke="#dbad50"/>
<text x="34" y="349" class="ft">Then run the whole prompt TWICE, blind &#8212; two models, neither seeing the other &#8212; and murderboard the results.</text>
<text x="34" y="367" class="mc">Where the two taxonomies disagree is where your domain is genuinely contestable. That disagreement is a finding, not a defect.</text>
</g>
</svg></figure></section><section class="slide" data-t="The taxonomy prompt, murderboarded" data-n="This is the slide that says what our taxonomies actually ARE, so do not rush the payoff line. Build it: 1 one prompt, the MDTDF, with the domain left blank - you fill it in with one sentence. 2 it goes to TWO frontier models, blind, neither seeing the other. 3 and 4: they come back DIFFERENT - show that, because it is the whole reason for doing it this way; here Fable found three dimensions and Sol found four, and only one of them overlaps. 5 the murderboard - now they see each other and argue. Usually two or three rounds; one run last night went thirteen and they still did not agree, which is a result, not a failure. The reason this matters is sycophancy: ask one model to critique what it just produced and it will go soft on you. 6 the converged output, and the word that carries it is ORTHOGONAL - independent axes, each varying without the others. 7 THE POINT, say it slowly: not how do I break this up, but from which vantage points can I look at it. You are mapping your own priors before you commit to one, which is why you routinely find angles you had never considered on a topic you have worked for years. 8 the honest limit: a few cents per taxonomy, and we are NOT the omics - they have tens of thousands of ontologies in a defined common format so theirs compose; ours do not, yet."><h2>The taxonomy prompt, murderboarded</h2><p class="sub">One prompt, two models generating blind, and an argument between them.</p><figure class="viz"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 372" role="img"
     aria-label="The MDTDF pipeline: one prompt with the domain left blank goes to two frontier models which generate taxonomies blind and independently; the two differ; a murderboard makes them argue until they converge; the output is a multi-dimensional taxonomy whose dimensions are orthogonal vantage points rather than a decomposition.">

</svg></figure></section><section class="slide" data-t="The murderboard" data-n="Use this right after the generation prompt, because it answers the obvious question: the model just handed you a taxonomy that looks authoritative - now what? Build it up one step at a time. 1 the artifact, frozen and named by hash, so a verdict always describes bytes that still exist. 2 two INDEPENDENT models - the drafter cannot be one of them, and say that out loud. 3 blind first rounds, which is the only thing that makes later agreement informative. 4 the author rules, because two reviewers can converge on a mistake. 5 they reflect, and may HOLD - a held position must be re-argued against the new input and must name what would change it. 6 the loop, and say that going round more than once is normal, not failure. 7 the checker: both GO on the SAME bytes, and a conditional GO is downgraded to NO_GO. 8 both endings are valid - recorded dissent is a result, not a failure. 9 the punchline, and let it land. If you have time, the story: on the case this was written from, the board rewrote the paper&#x27;s thesis sentence."><h2>The murderboard</h2><p class="sub">Two models argue over a frozen artifact until both sign off on the identical bytes &ndash; or until the disagreement <em>is</em> the finding.</p><figure class="viz"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 364" role="img"
     aria-label="The murderboard cycle, revealed in nine steps: a frozen artifact, two independent models, blind first rounds, the author ruling, the reviewers reflecting, the loop between them, the machine checker, and the two valid endings - dual GO or recorded dissent.">

</g>
</svg></figure><div class="small-note" data-frag="10"><b>You</b> &ndash; the author &ndash; cannot be one of the two reviewers &ndash; that GO is a self-assessment, and no checker can tell the difference. <b>Naming the arrangement is the requirement.</b></div></section>
<section class="slide" data-t="The taxonomy generation prompt (2)" data-n="These five ARE the independence test they run in the hands-on block. Flag it forward."><h2>And how to test the dimensions you get back</h2><p class="sub">Five criteria. A dimension that fails one of them is not a dimension.</p><div class="grid c5 top"><div class="card hot" data-frag="1"><div class="k">Independence</div><div class="d">Does this dimension vary <b>independently</b> of the others?</div></div><div class="card " data-frag="2"><div class="k">Universality</div><div class="d">Can <b>all</b> instances in the domain be classified along it?</div></div><div class="card " data-frag="3"><div class="k">Fundamentality</div><div class="d">Does it capture something essential, rather than superficial?</div></div><div class="card " data-frag="4"><div class="k">Distinctiveness</div><div class="d">Does it give a genuinely <b>unique</b> analytical perspective?</div></div><div class="card " data-frag="5"><div class="k">Utility</div><div class="d">Does it reveal insight, or support practical work?</div></div></div><div class="small-note" data-frag="6"><b>The method that produces them:</b> define the domain boundaries &middot; brainstorm dimensions from several perspectives &middot; review the literature for existing frameworks &middot; consult domain experts &middot; and ask, from first principles, what fundamentally defines this domain. <em>Independence is the one that fails most often, and Wednesday&#39;s hands-on tests exactly that.</em></div></section>

<section class="slide" data-t="The independence test" data-n="The quality gate. Peer-swap taxonomies here and let them break each other&#x27;s."><h2>The independence test</h2><p class="sub">A taxonomy is only an instrument if its dimensions are actually independent.</p><div class="grid c3"><div class="card " data-frag="1"><div class="k">Can a case score high on A and low on B?</div><div class="d">If not, A and B are the same dimension wearing two names.</div></div><div class="card " data-frag="2"><div class="k">Does every taxon have a plausible negative case?</div><div class="d">If nothing could fail to qualify, the taxon measures nothing.</div></div><div class="card hot" data-frag="3"><div class="k">Would a second coder assign the same label?</div><div class="d">If not, you have a vocabulary, not a scheme.</div></div></div><div class="small-note" data-frag="4">Target for your own: <b>8&ndash;12 dimensions</b>, tested for independence, before you classify anything. The prompt that generates one is in <a href="index.html#materials">Materials</a> &ndash; it is the real one we use, with the domain left blank.</div></section>
<section class="slide" data-t="What your instrument cannot see" data-n="The RRLS blind spot, generalised. This is the idea they should still have in five years."><h2>What your instrument cannot see</h2><p class="sub">The most transferable idea of the week.</p><div class="split"><div class="stack"><div class="card " data-frag="1"><div class="k">A real filter, from our own work</div><div class="d">A statement enters the set only if it carries <b>both</b> a boundary span <b>and</b> a threatened-consequence span.</div></div><div class="card hot" data-frag="2"><div class="k">The consequence</div><div class="d">Deliberately deniable coercion is invisible <b>by construction</b>. Two documents sit in the corpus and produced <b>zero</b> hits.</div></div></div><div class="stack"><div class="body-lg">The rejections were <em>correct</em> on the coding scheme.<br>It is not a bug.</div><p class="sub" style="margin:0">An instrument only sees what its definition admits. Write down, today, what yours is built to miss.</p></div></div></section>

<section class="slide" data-t="Prompting an LLM to assign chunks to taxonomic elements" data-n="Read the two bolded constraints out loud. Everything on Thursday depends on them."><h2>The assignment prompt</h2><p class="sub">Verbatim from the pipeline. This is the whole of what tells the model what to do.</p><div class="promptwrap"><div><pre class="prompt"><span class="c">system_prompt</span>

You are an <b>expert military analyst</b> specializing in assessing
military capabilities and strategic trends in assessing Russian
military regeneration prospects.

Your task is to <b>classify each text chunk</b> according to our
taxonomy that lists various important aspects of Russia&#39;s
military regeneration aptitude.

Below is the taxonomy in JSON form for your reference. You must
<b>ONLY use Tier-3 name values present in this taxonomy</b>.

<span class="c">[TAXONOMY START]  ... the whole scheme is injected here ...</span></pre></div><div><pre class="prompt"><span class="c">for each text chunk</span>

&bull; Read the chunk carefully.

&bull; Identify any content that matches the definitions of any
  Tier-3 node in the taxonomy <b>exactly</b>.

&bull; Assign a Tier-3 node <b>only if there is direct evidence</b>
  or a clear match in the chunk&#39;s text to that node&#39;s
  definition. <b>If unsure, leave it untagged.</b>

&bull; Return an array element with: chunk_id (the index),
  tier3_tags (array of Tier-3 node names that apply).</pre></div></div><div class="small-note" data-frag="1"><b>Two lines carry the whole method.</b> <em>Only use names present in this taxonomy</em> stops the model inventing categories; <em>if unsure, leave it untagged</em> is what makes the output honest rather than complete. A model that always answers is a model you cannot measure.</div></section>

<section class="slide" data-t="Prompting an LLM to analyze all chunks for one element" data-n="The chunk-ID requirement is the point. Say why before you show the write-up."><h2>The analysis prompt</h2><p class="sub">Once the chunks are labeled, this is what turns labels into an argument.</p><pre class="prompt">You are an expert in military analysis. Your task is to <b>analyze a specific topic</b>,
focusing on its implications for Russian military regeneration capabilities. The analysis
will be conducted using data provided as input, and it should <b>reference the chunk IDs</b>
associated with the specific text used to support each observation.</pre><div class="grid c4"><div class="card num " data-frag="1"><div class="v">1</div><div class="k">Summary</div><div class="d">Key points for this topic, and how they relate to the capacity to regenerate across domains. <b>Explicitly mention strengths and weaknesses.</b> Reference the chunk IDs.</div></div><div class="card num " data-frag="2"><div class="v">2</div><div class="k">Themes</div><div class="d">The recurring themes and subtopics &ndash; manpower, logistics, equipment, adaptability, industrial capacity, economic resilience. <b>Specific examples with chunk IDs.</b></div></div><div class="card num hot" data-frag="3"><div class="v">3</div><div class="k">Evolution</div><div class="d">How the discussion changed over time, <b>using months as the primary unit</b>, tied to specific events. Highlight turning points.</div></div><div class="card num hot" data-frag="4"><div class="v">4</div><div class="k">Author and source differences</div><div class="d">Where sources agree, disagree, or are simply silent. <b>Silence is a finding.</b></div></div></div><div class="small-note" data-frag="5">Every instruction demands <b>a chunk ID</b>. That is not bureaucracy: it is what makes the write-up auditable, and it is the difference between an analysis you can defend and a summary you have to be trusted on.</div></section>

<section class="slide" data-t="A SWOT analysis of Russian regeneration aptitude" data-n="The end-to-end payoff slide. Say out loud that every line traces back to labeled chunks."><h2>A SWOT analysis of Russian regeneration aptitude</h2><p class="sub">Produced end to end by the pipeline: question, corpus, taxonomy, labels, this.</p><div class="split"><div class="stack"><div class="kicker">Self-perceived strengths</div><div class="card " data-frag="1"><div class="k">Manpower flexibility</div><div class="d">A broad pool of conscripts, volunteers and private military companies, read as evidence of an ability to mobilise and field sizeable forces rapidly.</div></div><div class="card " data-frag="2"><div class="k">Industrial resilience</div><div class="d">Despite technological bottlenecks, official messaging underscores capacity to maintain or increase output in key defense sectors, often on Soviet-era infrastructure.</div></div><div class="card " data-frag="3"><div class="k">Doctrinal adaptation</div><div class="d">Evolving tactics in hybrid and urban warfare presented as institutional learning: drones, updated artillery practice, novel offensive strategies.</div></div></div><div class="stack"><div class="kicker">Self-perceived weaknesses</div><div class="card hot" data-frag="4"><div class="k">Morale and discipline gaps</div><div class="d">Uneven training standards, inconsistent welfare support and mixed-force structures degrading cohesion and battlefield effectiveness.</div></div><div class="card hot" data-frag="5"><div class="k">Logistical fragility</div><div class="d">Rail disruption, shortages of advanced components, sabotage threats. Sanctions limit access to modern technology and amplify reliance on Soviet platforms.</div></div><div class="card hot" data-frag="6"><div class="k">Command complexities</div><div class="d">Centralised directives coexisting with irregular and regional forces, straining unified command, communication and long-term planning.</div></div></div></div></section>
<section class="slide" data-t="Measure whether it worked" data-n="Set this up before the punchline slide."><h2>Now measure whether it worked</h2><p class="sub">Three checks, in increasing order of discomfort.</p><div class="grid c3"><div class="card " data-frag="1"><div class="k">Does the quoted span exist?</div><div class="d">Make the model quote the text justifying each call, then check mechanically that the quote is really there.</div></div><div class="card " data-frag="2"><div class="k">Do two models agree?</div><div class="d">One model is an opinion. Disagreement is where your scheme is ambiguous.</div></div><div class="card hot" data-frag="3"><div class="k">Do two humans agree?</div><div class="d">Cohen's kappa. This is the number your committee will ask for.</div></div></div></section>
<section class="slide" data-t="An illustration from our own current work" data-n="PROVISIONAL - our labels are not yet independently validated. Present it as an illustration of the method, never as a finding."><h2>What that measurement found</h2><div class="split"><div class="stack"><div class="card num hot" data-frag="1"><div class="v">2.5% &ndash; 45.8%</div><div class="k">span fabrication</div><div class="d">How often the quote justifying a call was <b>not actually in the passage</b>. <b>Preliminary, on our own unvalidated labels.</b></div></div></div><div class="stack"><div class="body-lg">An <span class="y">eighteen-fold</span> spread &ndash; at <em>identical accuracy</em>.</div><p class="sub" style="margin:0">No accuracy leaderboard would ever show you this. It is only visible because we forced the model to point at its evidence and then checked.</p></div></div></section>
<section class="slide" data-t="Two traps" data-n="Both from our own scars. Concrete, not cautionary."><h2>Two traps that will cost you a result</h2><p class="sub">Both measured, both expensive.</p><div class="grid c2"><div class="card hot" data-frag="1"><div class="k">The router trap</div><div class="d">An open-weight model called through a load-balancing router may be served to you <b>quantised</b>, from an arbitrary host. Your benchmark then measures the host, not the model.</div></div><div class="card " data-frag="2"><div class="k">The anchoring trap</div><div class="d">Show a coder the model's answer and you have not measured agreement &ndash; you have measured compliance. Blind coding or nothing.</div></div></div><div class="small-note" data-frag="3">And the honest framing for your methods section: a single adjudicated pass gives you <b>agreement with your own reference</b>, not accuracy against ground truth. Say so, and you will be believed.</div></section>
<section class="slide" data-t="Reading a kappa" data-n="Give them the bands before the worked number, or the number means nothing."><h2>Reading a kappa</h2><p class="sub">Cohen's kappa corrects agreement for the agreement you would get by chance alone.</p><div class="grid c4"><div class="card hot" data-frag="1"><div class="k">&lt; 0.40</div><div class="d">Poor to fair. Your scheme is ambiguous, not your coders.</div></div><div class="card " data-frag="2"><div class="k">0.40 &ndash; 0.60</div><div class="d">Moderate. Publishable with discussion of where it fails.</div></div><div class="card " data-frag="3"><div class="k">0.60 &ndash; 0.80</div><div class="d">Substantial. This is a realistic target for a first pass.</div></div><div class="card " data-frag="4"><div class="k">&gt; 0.80</div><div class="d">Almost suspicious. Check that your coders were genuinely independent.</div></div></div><div class="small-note" data-frag="5">Two coders, one scheme, the same passages, <b>neither seeing the other or the model</b>. Anything else is not a kappa, whatever you call it in the paper.</div></section>
<section class="slide" data-t="A real number" data-n="0.384 is ours, measured, and the reason the blind path exists. Use it - it is honest and it stings."><h2>A real number, from our own pipeline</h2><p class="sub">And what it cost us to learn it.</p><div class="split"><div class="stack"><div class="card num hot" data-frag="1"><div class="v">0.384</div><div class="k">auto-draft kappa, red lines</div><div class="d">Model-drafted labels, then human review. The neighboring layer scored <b>0.563</b> on the same pass. <b>Poor</b> &ndash; and it looks fine until you compute it.</div></div></div><div class="stack"><div class="body-lg">The coders were not disagreeing with each other.<br>They were <span class="y">agreeing with the model</span>.</div><p class="sub" style="margin:0">Show a reviewer the machine answer and you measure compliance, not reliability. The fix is expensive and unavoidable: a genuinely blind second pass.</p></div></div></section>
<section class="slide" data-t="A real confusion matrix" data-n="Ask what they would conclude BEFORE the next slide. Most will say 93 percent, fine, move on."><h2>A real confusion matrix</h2><p class="sub">Two human readers, one scheme, the red-line layer. Every cell is ours.</p><div class="split"><div class="stack"><table class="cm"><tr><td class="h"></td><td class="h">B says yes</td><td class="h">B says no</td></tr><tr><td class="h">A says yes</td><td class="ok">34</td><td class="dis">2</td></tr><tr><td class="h">A says no</td><td class="dis">9</td><td class="ok">207</td></tr></table><div class="small-note" data-frag="1">252 passages coded by both. Raw agreement <b>93%</b>.</div></div><div class="stack"><div class="body-lg">The disagreement is <span class="y">one-directional</span>: <b>9</b> against <b>2</b>.</div><p class="sub" style="margin:0">That asymmetry is the finding. This is not noise between two careful readers. One of them is systematically <em>more inclusive</em> than the other. A threshold disagreement can be fixed by rewriting a definition. Noise cannot.</p></div></div></section>
<section class="slide" data-t="The same data, two answers" data-n="THE evaluation slide of the week. A high agreement number on a skewed base rate means almost nothing."><h2>The same data. Two answers.</h2><p class="sub">Both are correctly computed. Only one of them means anything.</p><div class="grid c3"><div class="card num " data-frag="1"><div class="v">93%</div><div class="k">raw agreement</div><div class="d">What the matrix says if you stop reading there.</div></div><div class="card num hot" data-frag="2"><div class="v">0.24</div><div class="k">Cohen's kappa</div><div class="d">On the passages where the second reader actually made an independent call.</div></div><div class="card hot" data-frag="3"><div class="k">Why they diverge</div><div class="d"><b>216 of 252 passages are an easy no</b>, agreed without either reader having to think. Chance alone scores about three quarters on a base rate that skewed. Kappa subtracts that floor. Raw agreement pockets it.</div></div></div><div class="small-note" data-frag="4">The gate we had set for ourselves was <b>0.70</b>. The honest reading is not that the coders failed: it is that <b>the boundary is genuinely subjective</b>, which is a reportable finding rather than something to bury. <b>Caveat, and say it out loud:</b> n = 34 contested passages, so the interval is wide, and this is expert re-annotation rather than two fully independent coders.</section>
<section class="slide" data-t="Where the model stands" data-n="The argument for keeping a human on the hard layer - and for never reporting one overall number."><h2>And where the model actually stands</h2><p class="sub">Same passages, same scheme. Measured per layer, not overall.</p><div class="grid c3"><div class="card num hot" data-frag="1"><div class="v">&minus;0.02</div><div class="k">model vs human, red lines</div><div class="d">On the contested passages the production model is <b>indistinguishable from chance</b>. Raw agreement 55%.</div></div><div class="card num " data-frag="2"><div class="v">+0.72</div><div class="k">model vs human, nuclear signalling</div><div class="d">On the easier layer the same model is <b>substantial</b>. Raw agreement 89%.</div></div><div class="card hot" data-frag="3"><div class="k">So measure per layer</div><div class="d">One model, one scheme, one corpus &ndash; and it is <em>worthless on one layer and good on the other</em>. A single headline accuracy would have hidden both facts.</div></div></div><div class="small-note" data-frag="4">Two independent readers and the careful literal machine reads all clustered around <b>0.65 to 0.72</b>; the inclusive reader sat apart from every one of them. <b>The disagreement axis was not human versus machine.</b></div></section>
<section class="slide" data-t="The number we still do not have" data-n="Do not skip this. Saying &#x27;we do not have it yet&#x27; is the most credible thing in the deck."><h2>The number we still do not have</h2><p class="sub">And why we are telling you that instead of quoting one.</p><div class="split"><div class="stack"><div class="body-lg">Everything on the last three slides is <span class="y">expert re-annotation</span>, not two independent coders.</div><p class="sub" style="margin:0">The same person was second reader <em>and</em> adjudicator, and part of the pass was assisted. That is a legitimate second look. It is not inter-annotator reliability, and calling it that in a paper would be the thing a reviewer catches.</p></div><div class="stack"><div class="card hot" data-frag="1"><div class="k">What a clean number needs</div><div class="d">Two coders. One scheme. The same passages. <b>Neither seeing the other, nor the model.</b></div></div><div class="card " data-frag="2"><div class="k">Where ours stands</div><div class="d">A blind app exists and the passages are drawn. The pass has <b>not come back yet</b>, so we quote no clean kappa at all.</div></div></div></div></section>
<section class="slide" data-t="What to report" data-n="This is the takeaway artifact. Put it on one page and hand it out."><h2>What to report</h2><p class="sub">Six lines. If your methods section has these, it will survive review.</p><div class="grid c3 r2"><div class="card " data-frag="1"><div class="k">1 &middot; The question</div><div class="d">Stated so someone else could ask it again.</div></div><div class="card " data-frag="2"><div class="k">2 &middot; The query</div><div class="d">Verbatim, with the date you ran it and the database version.</div></div><div class="card " data-frag="3"><div class="k">3 &middot; The corpus</div><div class="d">N documents, N chunks, sources, languages, and how duplicates were handled.</div></div><div class="card " data-frag="4"><div class="k">4 &middot; The scheme</div><div class="d">Dimensions, levels, and one worked coding decision.</div></div><div class="card hot" data-frag="5"><div class="k">5 &middot; The reliability</div><div class="d">Kappa, how many coders, and whether they were blind.</div></div><div class="card hot" data-frag="6"><div class="k">6 &middot; The blind spot</div><div class="d">What your instrument cannot see, in one sentence.</div></div></div></section>

<section class="slide" data-t="How to represent knowledge" data-n="The non-state-actor point is the one that lands with an IR room."><h2>How to represent knowledge</h2><p class="sub">Three reasons the graph formalism is the one that stuck.</p><div class="grid c3"><div class="card " data-frag="1"><div class="k">A graph formalism</div><div class="d">Labeled graphs in the graph-theory sense, where the reasoning mechanisms are <b>graph operations</b>, with graph homomorphism at the core.</div></div><div class="card " data-frag="2"><div class="k">Logically founded</div><div class="d">Which matters, because logic has been the foundation for knowledge representation and reasoning <em>for millennia</em>.</div></div><div class="card hot" data-frag="3"><div class="k">And it is what industry actually built</div><div class="d">It works with the new knowledge graphs, involving some of the world's premier <b>non-state</b> actors: Google, Baidu, the Wikipedia ecosystem, Amazon, Facebook, Yahoo, Yandex.</div></div></div></section>
<section class="slide img" data-t="An experiment in truthiness" data-n="Why search alone was never enough."><img src="img/d5_truthiness.jpg" alt="An experiment in truthiness"></section>
<section class="slide" data-t="Things, not strings" data-n="The entity-versus-string distinction is the whole reason a taxonomy is worth building."><h2>Things, not strings</h2><p class="sub">Companies moved from information retrieval to question answering.</p><div class="split"><div class="stack"><div class="card " data-frag="1"><div class="k">What that shift needs</div><div class="d">Some NLP, above all <b>named entity recognition</b>, and good knowledge bases.</div></div><div class="card tint" data-frag="2"><div class="k">DBpedia</div><div class="d">An open-source knowledge base in RDF, built from Wikipedia.</div></div></div><div class="stack"><div class="card hot" data-frag="3"><div class="k">Google, as the worked example</div><div class="d"><b>2014</b> Freebase: 1.2 billion facts about 43 million entities.<br><b>2015</b> the Google knowledge graph, updated by text information extraction.</div></div><div class="card " data-frag="4"><div class="k">And everyone else has one</div><div class="d">Microsoft (Satori), IBM (Watson), Apple, Wolfram (Alpha), Facebook (Open Graph).</div></div></div></div></section>
<section class="slide img" data-t="We have already done work on an IR ontology" data-n="Ours. Show it as evidence that the direction is real, not aspirational."><img src="img/d5_irontology.jpg" alt="We have already done work on an IR ontology"></section>
<section class="slide img" data-t="AHHSH" data-n="Where our own work is heading. Two slides only - they cannot use this yet, and clinic time matters more."><img src="img/d5_ahhsh.jpg" alt="AHHSH"></section>
<section class="slide img" data-t="Roadmap" data-n="Honest about what exists and what does not."><img src="img/d5_roadmap.jpg" alt="Roadmap"></section>
<section class="slide" data-t="What you can take" data-n="Say which is which, plainly."><h2>What you can actually take</h2><p class="sub">Being precise about this buys more credibility than overclaiming.</p><div class="split"><div class="stack"><div class="card hot" data-frag="1"><div class="k">Yours to use</div><div class="d">The method. The query discipline. The taxonomy architecture and its independence test. The evaluation habit. The public dashboards and reports.</div></div></div><div class="stack"><div class="card " data-frag="2"><div class="k">Ours, and not transferable</div><div class="d">Credentialed corpora, licensed sources, the annotation database, and anything that needs our infrastructure to run.</div></div><div class="card " data-frag="3"><div class="k">The honest middle</div><div class="d">Prompts and pipelines we will share, that will need adapting to your material before they are any use.</div></div></div></div></section>
<section class="slide" data-t="Clinics" data-n="Circulate. Ten minutes each, and mean it."><h2>Clinics</h2><p class="sub">The rest of today is yours.</p><div class="grid c3"><div class="card " data-frag="1"><div class="k">Bring what you built</div><div class="d">Corpus, taxonomy, classifications &ndash; however far you got.</div></div><div class="card " data-frag="2"><div class="k">Ten minutes each</div><div class="d">One specific recommendation, not general encouragement.</div></div><div class="card hot" data-frag="3"><div class="k">Missing days is fine</div><div class="d">Come with the question and we will start from wherever you are.</div></div></div></section>
<section class="slide" data-t="30-day plan" data-n="The thing that survives the week. Send it to them in writing afterwards."><h2>Your 30-day plan</h2><p class="sub">Four things, in order. Nothing here needs our infrastructure.</p><div class="grid c4"><div class="card " data-frag="1"><div class="k">Week 1</div><div class="d">Freeze your research question and harvest the corpus properly &ndash; with dedup.</div></div><div class="card " data-frag="2"><div class="k">Week 2</div><div class="d">Build the taxonomy to L3 on one branch, and run the independence test.</div></div><div class="card " data-frag="3"><div class="k">Week 3</div><div class="d">Classify a sample. Measure fabrication and agreement.</div></div><div class="card hot" data-frag="4"><div class="k">Week 4</div><div class="d">Write the methods section. Include what your instrument cannot see.</div></div></div></section>
<section class="slide" data-t="The week in one slide" data-n="Say it back to them. People underestimate what they got through."><h2>The week, in one slide</h2><p class="sub">What you did, in the order you did it.</p><div class="grid c5 top"><div class="card " data-frag="1"><div class="k">Monday</div><div class="d">Named a question, and saw why the usual way of answering it does not hold.</div></div><div class="card " data-frag="2"><div class="k">Tuesday</div><div class="d">Built a corpus, and could say how complete it is.</div></div><div class="card " data-frag="3"><div class="k">Wednesday</div><div class="d">Built an instrument, and tested whether its dimensions are independent.</div></div><div class="card " data-frag="4"><div class="k">Thursday</div><div class="d">Ran the instrument over the corpus, and measured how well it worked.</div></div><div class="card hot" data-frag="5"><div class="k">Friday</div><div class="d">Turned that into something you can defend.</div></div></div></section>
<section class="slide" data-t="When it breaks" data-n="The most useful slide of the week for anyone working alone afterwards."><h2>When it breaks &ndash; and it will</h2><p class="sub">The four failures that will actually happen, and what each one means.</p><div class="grid c2 r2"><div class="card " data-frag="1"><div class="k">The query returns 40,000 hits</div><div class="d">Your terms are too broad, or you are missing a NOT. Narrow by domain, never by convenience.</div></div><div class="card " data-frag="2"><div class="k">The query returns 11 hits</div><div class="d">Almost always a quoting or a field-search error &ndash; not a small field.</div></div><div class="card " data-frag="3"><div class="k">The model labels everything the same</div><div class="d">Your taxon has no plausible negative case. Fix the scheme, not the prompt.</div></div><div class="card hot" data-frag="4"><div class="k">Two coders disagree constantly</div><div class="d">Good. That is the scheme telling you where it is ambiguous.</div></div></div></section>
<section class="slide" data-t="Close" data-n="From the Boston invitation. End on it and stop talking."><div class="fill"><div class="body-lg">The question is not whether AI will change research methods.</div><div class="body-lg" data-frag="1"><span class="c">It is whether you will be ahead of the curve or behind it.</span></div></div></section></template>
<script>
/* ---------------- data ---------------- */
var DAYS=[
 {n:1,label:"Day 1",title:"Foundations",when:"Mon 31 Aug",time:"11:00 &ndash; 13:30",
  desc:"How we got here, why it stopped working &ndash; and what a field that fixed it looks like.",
  items:["The four humors to AlphaFold","How we actually search today","The reliability crisis","Strategic analysis 3.0"]},
 {n:2,label:"Day 2",title:"Corpora",when:"Tue 1 Sep",time:"11:00 &ndash; 13:30",
  desc:"Finding what you have been missing &ndash; and proving that you found it.",
  items:["The size of your own field","Misleading tips of icebergs","Two ways to explore the record","Build a seed corpus"]},
 {n:3,label:"Day 3",title:"Taxonomies",when:"Wed 2 Sep",time:"11:00 &ndash; 13:30",
  desc:"Building an instrument, not a filing system.",
  items:["What a taxonomy is for","Deductive and inductive","Levels and definitions","Draft one live"]},
 {n:4,label:"Day 4",title:"Classification",when:"Thu 3 Sep",time:"11:00 &ndash; 13:30",
  desc:"Applying the taxonomy at scale &ndash; and being honest about how well it worked.",
  items:["Prompt to schema","Run it over the corpus","Measure whether it worked","Reading a kappa"]},
 {n:5,label:"Day 5",title:"Your projects",when:"Fri 4 Sep",time:"11:00 &ndash; 13:30",
  desc:"What to take, what to build next, and what is not transferable.",
  items:["Where this is going","The kit, part by part","Your project, mapped","What not to promise"]}];
var PIPE=[["Stage 1","Frame"],["Stage 2","Discover"],["Stage 3","Instrument"],["Stage 4","Extract"],["Stage 5","Deliver"]];

/* ---------------- boot ---------------- */
var stage=document.getElementById('stage'),tpl=document.getElementById('deck');
stage.appendChild(tpl.content.cloneNode(true));
var slides=[].slice.call(stage.querySelectorAll('.slide'));
var dividers=[];slides.forEach(function(s,i){if(s.classList.contains('divider'))dividers.push(i);});
var cur=0,fitted=[],view='home';

/* ---------------- AUTOFIT: grow --sc until the slide is as full as it can be ----------------
   Every type size on a slide is calc(N cqw * var(--sc)). We binary-search the largest --sc at
   which nothing overflows its box. That is what makes a slide FILL its frame instead of
   floating a small block of text in the middle of it. Runs once per slide, then is cached;
   the cache is dropped on resize because cqw is relative to the frame.                        */
function overflows(s){
  var body=document.body, had=body.classList.contains('measuring');
  if(!had)body.classList.add('measuring');
  try{ return _overflows(s); } finally { if(!had)body.classList.remove('measuring'); }
}
function _overflows(s){
  /* Two independent failure modes.
     (1) VERTICAL/BLOCK overflow: a child escapes a box that clips. Rect containment, not
         scrollHeight - with line-height near 1 a glyph box is taller than its element box, so
         scrollHeight>clientHeight fires on every heading even when the layout is perfect.
         Every layout box must be checked, INCLUDING .fill: checking only the slide's direct
         children passes any .fill, because .fill is flex:1 and so always fits by construction
         while its children spill straight out of the frame.
     (2) HORIZONTAL text overflow: a long word that cannot wrap ("Classification", "Foundations")
         overflows its element without moving that element's rect at all. Rect containment is
         blind to it; scrollWidth is the only signal. Tolerance 4px absorbs letter-spacing,
         which adds trailing space after the last glyph. */
  var TOL=2, WTOL=4;
  function inner(el){
    var r=el.getBoundingClientRect(),cs=getComputedStyle(el);
    return {left:r.left+parseFloat(cs.paddingLeft),right:r.right-parseFloat(cs.paddingRight),
            top:r.top+parseFloat(cs.paddingTop),bottom:r.bottom-parseFloat(cs.paddingBottom)};
  }
  function outside(box,r){
    return r.left<box.left-TOL||r.right>box.right+TOL||r.top<box.top-TOL||r.bottom>box.bottom+TOL;
  }
  var boxes=[s].concat([].slice.call(
    s.querySelectorAll('.fill,.card,.grid,.split,.stack,.arrowrow,ul.big')));
  for(var i=0;i<boxes.length;i++){
    var bb=inner(boxes[i]),kids=boxes[i].children;
    for(var j=0;j<kids.length;j++){
      if(outside(bb,kids[j].getBoundingClientRect()))return true;
    }
  }
  /* A <pre> clips its own content without moving any rect, so rect containment
     cannot see it. Its line-height is 1.5, well clear of the glyph-overflow
     artifact that makes scrollHeight useless on tight-leading headings, so
     scrollHeight is the right test here and only here. */
  var pres=s.querySelectorAll('pre.prompt');
  for(var q=0;q<pres.length;q++){
    if(pres[q].scrollHeight>pres[q].clientHeight+2)return true;
  }
  var text=s.querySelectorAll('h2,.sub,.body-lg,.kicker,.small-note,.card .k,.card .d,.card .v,'
    +'li,.daytitle,.daysub,.daymins,.title-slide .t,.title-slide .s,.title-slide .m,.ar');
  for(var t=0;t<text.length;t++){
    if(text[t].scrollWidth>text[t].clientWidth+WTOL)return true;
  }
  return false;
}
function autofit(i){
  var s=slides[i];
  document.body.classList.add('measuring');
  try{ _autofit(i); } finally { document.body.classList.remove('measuring'); }
}
function _autofit(i){
  var s=slides[i];
  if(s.classList.contains('img'))return;
  if(fitted[i])return;
  var lo=0.5,hi=3.2,best=0.5;
  s.style.setProperty('--sc',hi);
  if(!overflows(s)){best=hi;}
  else{
    for(var k=0;k<9;k++){
      var mid=(lo+hi)/2;
      s.style.setProperty('--sc',mid);
      if(overflows(s)){hi=mid;}else{best=mid;lo=mid;}
    }
  }
  s.style.setProperty('--sc',best);
  fitted[i]=true;
}

/* ---------------- navigation ---------------- */
function dayOf(i){var d=0;for(var k=0;k<dividers.length;k++){if(i>=dividers[k])d=k+1;}return d;}
/* ---------------- build-up fragments ----------------
   Right arrow reveals the next fragment before advancing; left arrow un-reveals
   before going back. Entering forwards starts unbuilt; entering backwards, or by
   jump or deep link, starts fully built, so a link never lands on a half-drawn
   slide. B toggles builds off. */
var buildOff=false;
function frags(i){return slides[i].querySelectorAll('[data-frag]');}
function fragShown(i){return slides[i].querySelectorAll('[data-frag].shown').length;}
function setFrags(i,n){
  var f=frags(i);
  for(var k=0;k<f.length;k++){f[k].classList.toggle('shown',k<n);}
  paintPip(i);
}
function paintPip(i){
  var el=document.getElementById('buildpip'),n=frags(i).length;
  if(!el)return;
  el.textContent=(n&&!buildOff)?('  \u25CF '+fragShown(i)+'/'+n):'';
}
function stepFwd(){
  if(buildOff)return false;
  var f=frags(cur),n=fragShown(cur);
  if(n<f.length){setFrags(cur,n+1);return true;}
  return false;
}
function stepBack(){
  if(buildOff)return false;
  var n=fragShown(cur);
  if(n>0){setFrags(cur,n-1);return true;}
  return false;
}
function toggleBuild(){
  buildOff=!buildOff;
  document.body.classList.toggle('nobuild',buildOff);
  setFrags(cur,buildOff?frags(cur).length:fragShown(cur));
}
function go(i,push,built){ if(i<0)i=0;if(i>=slides.length)i=slides.length-1; /* set the incoming slide's fragment state BEFORE it becomes visible: otherwise a slide that still carries .shown from a previous build paints fully built for a few frames and then collapses - the 'ghosting' flash. */ setFrags(i, (buildOff || built===true) ? frags(i).length : 0); slides[cur].classList.remove('on'); cur=i; slides[cur].classList.add('on'); autofit(cur); setFrags(cur, (buildOff || built===true) ? frags(cur).length : 0);
  document.getElementById('counter').textContent=(cur+1)+' / '+slides.length;
  document.getElementById('slidetitle').innerHTML=slides[cur].dataset.t||'';
  document.getElementById('notes').innerHTML=slides[cur].dataset.n?('<b>Note</b> &nbsp;'+slides[cur].dataset.n):'<i>No note on this slide.</i>';
  paintTimeline();paintSidebar();
  if(push!==false)history.replaceState(null,'','#'+(cur+1));
}
function showDeck(i,built){
  view='deck';
  document.getElementById('home').classList.remove('on');
  stage.classList.add('on');document.getElementById('deckbar').classList.add('on');
  document.getElementById('navHome').classList.remove('on');
  document.getElementById('navDeck').classList.add('on');
  go(typeof i==='number'?i:cur, true, built!==false ? true : false);
}
function showHome(){
  view='home';
  stage.classList.remove('on');document.getElementById('deckbar').classList.remove('on');
  document.getElementById('notes').classList.remove('on');
  document.getElementById('home').classList.add('on');
  document.getElementById('navHome').classList.add('on');
  document.getElementById('navDeck').classList.remove('on');
  history.replaceState(null,'','#home');
  paintTimeline();paintSidebar();
}
function goDay(d){showDeck(d===0?0:dividers[d-1]);}
function toggleNotes(){document.getElementById('notes').classList.toggle('on');}
function toggleOv(){
  var ov=document.getElementById('ov');
  if(!ov.classList.contains('on'))buildOv();
  ov.classList.toggle('on');
}
function present(){
  if(view!=='deck')showDeck();
  document.body.classList.add('present');
  fitted=[];autofit(cur);
  if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(function(){});
}
function unpresent(){
  document.body.classList.remove('present');
  fitted=[];autofit(cur);
  if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(function(){});
}

/* ---------------- chrome painting ---------------- */
function paintTimeline(){
  var bar=document.getElementById('timelineBar');
  if(!bar.dataset.built){
    var h='';
    DAYS.forEach(function(d,k){
      if(k)h+='<div class="timeline-connector"></div>';
      h+='<button class="timeline-block" data-d="'+(k+1)+'" onclick="goDay('+(k+1)+')">'+
         '<div class="timeline-time">'+d.label+' &#183; '+d.when+'</div>'+
         '<div class="timeline-label">'+d.title+'</div>'+
         '<div class="timeline-duration">'+d.time+'</div></button>';
    });
    bar.innerHTML=h;bar.dataset.built='1';
  }
  var d=view==='deck'?dayOf(cur):0;
  [].forEach.call(bar.querySelectorAll('.timeline-block'),function(b){
    b.classList.toggle('active',parseInt(b.dataset.d,10)===d);});
}
function paintSidebar(){
  var sb=document.getElementById('sidebar'),h='';
  if(view==='home'){
    h+='<div class="sidebar-section"><div class="sidebar-section-title">The week</div>';
    DAYS.forEach(function(d,k){
      h+='<button class="sidebar-item" onclick="goDay('+(k+1)+')"><span class="sidebar-item-title">'+
         d.label+' &#183; '+d.title+'</span><span class="sidebar-badge">'+d.when+'</span></button>';});
    h+='</div><div class="sidebar-section"><div class="sidebar-section-title">Deck</div>'+
       '<button class="sidebar-item" onclick="showDeck(0)"><span class="sidebar-item-title">Open from the start</span><span class="sidebar-badge">'+slides.length+'</span></button>'+
       '<button class="sidebar-item" onclick="toggleOv()"><span class="sidebar-item-title">Slide overview</span><span class="sidebar-badge">O</span></button>'+
       '<button class="sidebar-item" onclick="present()"><span class="sidebar-item-title">Present full screen</span><span class="sidebar-badge">F</span></button></div>'+
       '<div class="sidebar-section"><div class="sidebar-section-title">Reference</div>'+
       '<a class="sidebar-item" href="index.html"><span class="sidebar-item-title">Back to the program</span><span class="sidebar-badge">&#8599;</span></a>'+
       '<a class="sidebar-item" href="casestudy.html"><span class="sidebar-item-title">Worked case study</span><span class="sidebar-badge">&#8599;</span></a>'+
       '<a class="sidebar-item" href="index.html#materials"><span class="sidebar-item-title">Prompts and materials</span><span class="sidebar-badge">&#8599;</span></a>'+
       '<a class="sidebar-item" href="https://rubase.org/" target="_blank" rel="noopener"><span class="sidebar-item-title">RuBase dashboard</span><span class="sidebar-badge">&#8599;</span></a>'+
       '<a class="sidebar-item" href="https://sdspieg.github.io/rubase-workshop-5day/"><span class="sidebar-item-title">5-day full program</span><span class="sidebar-badge">&#8599;</span></a></div>';
    sb.innerHTML=h;return;
  }
  var d=dayOf(cur);
  var start=d===0?0:dividers[d-1];
  var end=d<dividers.length?dividers[d]:slides.length;
  if(d===0){start=0;end=dividers.length?dividers[0]:slides.length;}
  h+='<div class="sidebar-section"><div class="sidebar-section-title">'+
     (d===0?'Opening':('Day '+d+' &#183; '+DAYS[d-1].title))+'</div>';
  for(var i=start;i<end;i++){
    h+='<button class="sidebar-item'+(i===cur?' active':'')+'" onclick="showDeck('+i+')">'+
       '<span class="sidebar-item-title">'+(slides[i].dataset.t||('Slide '+(i+1)))+'</span>'+
       '<span class="sidebar-badge">'+(i+1)+'</span></button>';
  }
  h+='</div><div class="sidebar-section"><div class="sidebar-section-title">Jump to a day</div>';
  DAYS.forEach(function(dd,k){
    h+='<button class="sidebar-item'+(k+1===d?' active':'')+'" onclick="goDay('+(k+1)+')">'+
       '<span class="sidebar-item-title">'+dd.label+' &#183; '+dd.title+'</span>'+
       '<span class="sidebar-badge">'+dd.when+'</span></button>';});
  h+='</div>';
  sb.innerHTML=h;
  var act=sb.querySelector('.sidebar-item.active');
  if(act&&act.scrollIntoViewIfNeeded)act.scrollIntoViewIfNeeded();
}
function buildHome(){
  var h='<div class="welcome-screen">'+
    '<div class="welcome-title">Out of the Dark Ages?</div>'+
    '<div class="welcome-subtitle">Supercharging your research workflow with LLMs. Five afternoons in which we take one research pipeline apart&nbsp;&ndash; from the question, through the corpus and the instrument, to a result you can defend&nbsp;&ndash; and put it back together with tools that did not exist when most of our methods were written.</div>'+
    '<div class="welcome-meta">Sam Nunn School of International Affairs &#183; 31 August &ndash; 4 September 2026 &#183; 11:00&ndash;13:30 daily &#183; Nunn Conference Room</div>'+
    '<div class="pipeline">';
  PIPE.forEach(function(p,k){
    if(k)h+='<div class="pipe-arrow">&rarr;</div>';
    h+='<button class="pipe-step" onclick="goDay('+(k+1)+')"><div class="step-label">'+p[0]+'</div><div class="step-name">'+p[1]+'</div></button>';});
  h+='</div><div class="session-grid">';
  DAYS.forEach(function(d,k){
    h+='<button class="session-card" onclick="goDay('+(k+1)+')">'+
       '<div class="card-num">'+d.n+'</div>'+
       '<div class="card-time">'+d.when+' &#183; '+d.time+'</div>'+
       '<div class="card-title">'+d.title+'</div>'+
       '<div class="card-desc">'+d.desc+'</div><div class="card-items">';
    d.items.forEach(function(it){h+='<div class="card-item"><span class="card-item-bullet"></span><span>'+it+'</span></div>';});
    h+='</div></button>';});
  h+='</div></div>';
  document.getElementById('home').innerHTML=h;
}
function buildOv(){
  var g=document.getElementById('ovg'),h='';
  slides.forEach(function(s,i){
    h+='<button class="'+(s.classList.contains('divider')?'d':'')+'" onclick="document.getElementById(\'ov\').classList.remove(\'on\');showDeck('+i+')">'+
       '<i>'+(i+1)+'</i>'+(s.dataset.t||'')+'</button>';});
  g.innerHTML=h;
}

/* ---------------- keys ---------------- */
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  var k=e.key;
  if(k==='Escape'){
    if(document.getElementById('ov').classList.contains('on')){document.getElementById('ov').classList.remove('on');return;}
    if(document.body.classList.contains('present')){unpresent();return;}
  }
  if(view!=='deck'&&['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','n','N'].indexOf(k)>-1){showDeck();if(k==='ArrowRight'||k==='ArrowLeft')return;}
  if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();if(!stepFwd())go(cur+1);}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();if(!stepBack())go(cur-1,true,true);}
  else if(k==='ArrowDown'){e.preventDefault();var d=dayOf(cur);goDay(Math.min(d+1,DAYS.length));}
  else if(k==='ArrowUp'){e.preventDefault();var d2=dayOf(cur);goDay(Math.max(d2-1,0));}
  else if(k==='Home'){e.preventDefault();go(0);}
  else if(k==='End'){e.preventDefault();go(slides.length-1);}
  else if(k==='o'||k==='O'){toggleOv();}
  else if(k==='n'||k==='N'){toggleNotes();}
  else if(k==='b'||k==='B'){toggleBuild();}
  else if(k==='f'||k==='F'){document.body.classList.contains('present')?unpresent():present();}
});
document.addEventListener('fullscreenchange',function(){
  if(!document.fullscreenElement&&document.body.classList.contains('present'))document.body.classList.remove('present');
  fitted=[];autofit(cur);
});
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){fitted=[];autofit(cur);},140);});

/* ---------------- start ---------------- */
buildHome();
var hash=(location.hash||'').replace('#','');
if(hash&&hash!=='home'&&!isNaN(parseInt(hash,10))){showDeck(parseInt(hash,10)-1);}
else{showHome();}
</script>
