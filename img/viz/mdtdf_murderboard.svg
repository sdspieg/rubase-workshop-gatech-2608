<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 372" role="img"
     aria-label="The MDTDF pipeline: one prompt with the domain left blank goes to two frontier models which generate taxonomies blind and independently; the two differ; a murderboard makes them argue until they converge; the output is a multi-dimensional taxonomy whose dimensions are orthogonal vantage points rather than a decomposition.">
<style>.hd{font:700 10.5px system-ui,sans-serif;letter-spacing:.1em}.ph{font:700 12.5px system-ui,sans-serif;fill:#e8edf3}.mc{font:400 10.3px system-ui,sans-serif;fill:#9fb3c8}.dim{font:500 10.4px system-ui,sans-serif;fill:#cfe0ee}.tag{font:600 9.4px system-ui,sans-serif;letter-spacing:.05em}.ft{font:italic 600 12.5px system-ui,sans-serif;fill:#dbad50}.mono{font:500 10px ui-monospace,monospace;fill:#dbad50}</style>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7d93ad"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dbad50"/></marker></defs>
<rect width="980" height="372" fill="#09182f"/>
<g data-frag="1">
<text x="20" y="26" class="hd" fill="#dbad50">ONE PROMPT</text>
<rect x="20" y="38" width="128" height="150" rx="7" fill="#142846" stroke="#dbad50" stroke-width="1.5"/>
<text x="34" y="62" class="ph">MDTDF</text>
<text x="34" y="80" class="mc">Multi-Dimensional</text>
<text x="34" y="93" class="mc">Taxonomy</text>
<text x="34" y="106" class="mc">Development</text>
<text x="34" y="119" class="mc">Framework</text>
<rect x="34" y="134" width="100" height="20" rx="4" fill="#0d2035" stroke="#27446e"/>
<text x="84" y="148" class="mono" text-anchor="middle">{{DOMAIN}}</text>
<text x="34" y="172" class="mc">your one sentence</text>
</g>
<g data-frag="2">
<line x1="152" y1="80" x2="176" y2="80" stroke="#7d93ad" stroke-width="2" marker-end="url(#a1)"/>
<line x1="152" y1="150" x2="176" y2="150" stroke="#7d93ad" stroke-width="2" marker-end="url(#a1)"/>
<text x="290" y="26" class="hd" fill="#7d93ad">GENERATED BLIND, INDEPENDENTLY</text>
<path d="M186,124 L400,124" stroke="#27446e" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="293" y="121" class="tag" fill="#7d93ad" text-anchor="middle">neither sees the other</text>
</g>
<g data-frag="3">
<rect x="186" y="44" width="214" height="63" rx="6" fill="#142846" stroke="#6fa8d6"/>
<text x="198" y="59" class="tag" fill="#6fa8d6">Fable &#183; 3 dimensions</text>
<text x="198" y="75" class="dim">&#183; domains: physical / not</text>
<text x="198" y="90" class="dim">&#183; levels of war</text>
<text x="198" y="105" class="dim">&#183; doctrinal traditions</text>
</g>
<g data-frag="4">
<rect x="186" y="140" width="214" height="78" rx="6" fill="#142846" stroke="#d69a6f"/>
<text x="198" y="155" class="tag" fill="#d69a6f">Sol &#183; 4 dimensions</text>
<text x="198" y="181" class="dim">&#183; levels of war</text>
<text x="198" y="196" class="dim">&#183; historical moments</text>
<text x="198" y="211" class="dim">&#183; technology regime</text>
<text x="198" y="226" class="dim">&#183; command style</text>
</g>
<g data-frag="5">
<line x1="404" y1="80" x2="424" y2="104" stroke="#dbad50" stroke-width="2" marker-end="url(#a2)"/>
<line x1="404" y1="172" x2="424" y2="148" stroke="#dbad50" stroke-width="2" marker-end="url(#a2)"/>
<rect x="430" y="86" width="132" height="86" rx="7" fill="#142846" stroke="#dbad50" stroke-width="1.5"/>
<text x="496" y="108" class="ph" text-anchor="middle">murderboard</text>
<text x="496" y="126" class="mc" text-anchor="middle">now they see</text>
<text x="496" y="139" class="mc" text-anchor="middle">each other</text>
<text x="496" y="160" class="tag" text-anchor="middle" fill="#dbad50">2 &#8211; 13 ROUNDS</text>
<text x="496" y="192" class="mc" text-anchor="middle">they argue, they do not flatter</text>
</g>
<g data-frag="6">
<line x1="566" y1="129" x2="590" y2="129" stroke="#dbad50" stroke-width="2" marker-end="url(#a2)"/>
<text x="782" y="26" class="hd" fill="#5fae86">CONVERGED &#183; ORTHOGONAL</text>
<rect x="600" y="38" width="360" height="176" rx="7" fill="#142846" stroke="#5fae86"/>
<line x1="690" y1="126" x2="690" y2="68" stroke="#5fae86" stroke-width="1.6"/>
<circle cx="690" cy="68" r="3.4" fill="#5fae86"/>
<line x1="690" y1="126" x2="740" y2="97" stroke="#5fae86" stroke-width="1.6"/>
<circle cx="740" cy="97" r="3.4" fill="#5fae86"/>
<line x1="690" y1="126" x2="740" y2="155" stroke="#5fae86" stroke-width="1.6"/>
<circle cx="740" cy="155" r="3.4" fill="#5fae86"/>
<line x1="690" y1="126" x2="690" y2="184" stroke="#5fae86" stroke-width="1.6"/>
<circle cx="690" cy="184" r="3.4" fill="#5fae86"/>
<line x1="690" y1="126" x2="640" y2="155" stroke="#5fae86" stroke-width="1.6"/>
<circle cx="640" cy="155" r="3.4" fill="#5fae86"/>
<line x1="690" y1="126" x2="640" y2="97" stroke="#5fae86" stroke-width="1.6"/>
<circle cx="640" cy="97" r="3.4" fill="#5fae86"/>
<circle cx="690" cy="126" r="5" fill="#dbad50"/>
<text x="690" y="206" class="tag" fill="#5fae86" text-anchor="middle">independent axes</text>
<text x="776" y="62" class="dim">&#183; domains</text>
<text x="776" y="86" class="dim">&#183; levels of war</text>
<text x="776" y="110" class="dim">&#183; doctrine</text>
<text x="776" y="134" class="dim">&#183; period</text>
<text x="776" y="158" class="dim">&#183; technology</text>
<text x="776" y="182" class="dim">&#183; actors</text>
<text x="776" y="206" class="mc">each varies without the others</text>
</g>
<g data-frag="7">
<rect x="20" y="232" width="940" height="52" rx="6" fill="#12243f" stroke="#27446e"/>
<text x="490" y="252" class="ft" text-anchor="middle">Not &#8220;how do I break this up?&#8221; but &#8220;from which vantage points can I look at it?&#8221;</text>
<text x="490" y="272" class="mc" text-anchor="middle">You are mapping your own priors before you commit to one &#8212; which is why you find angles you had never considered</text>
</g>
<g data-frag="8">
<rect x="20" y="296" width="940" height="52" rx="6" fill="#0d2035" stroke="#27446e"/>
<text x="38" y="316" class="mc">Cost of a full taxonomy: <tspan fill="#dbad50" font-weight="600">a few cents</tspan>. A run that never converges is a result too &#8212; one went 13 rounds without agreement.</text>
<text x="38" y="336" class="mc">And we are not the &#8216;omics: they have tens of thousands of ontologies in a <tspan fill="#dbad50" font-style="italic">defined common format</tspan>, so theirs compose. Ours do not, yet.</text>
</g>
</svg>