<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 364" role="img"
     aria-label="The murderboard cycle, revealed in nine steps: a frozen artefact, two independent models, blind first rounds, the author ruling, the reviewers reflecting, the loop between them, the machine checker, and the two valid endings - dual GO or recorded dissent.">
<style>.hd{font:700 11px system-ui,sans-serif;letter-spacing:.09em}.ph{font:700 13px system-ui,sans-serif;fill:#e8edf3}.mc{font:400 10.6px system-ui,sans-serif;fill:#9fb3c8}.mi{font:italic 400 10.6px system-ui,sans-serif;fill:#8fa6bd}.tag{font:600 9.6px system-ui,sans-serif;letter-spacing:.05em}.ft{font:italic 600 12.5px system-ui,sans-serif;fill:#dbad50}</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7d93ad"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dbad50"/></marker></defs>
<rect width="980" height="364" fill="#09182f"/>
<g data-frag="1">
<rect x="20" y="112" width="104" height="94" rx="7" fill="#142846" stroke="#dbad50" stroke-width="1.5"/>
<text x="72" y="140" class="ph" text-anchor="middle">the artefact</text>
<text x="72" y="160" class="mc" text-anchor="middle">frozen, by hash</text>
<text x="72" y="176" class="mc" text-anchor="middle">immutable</text>
<text x="72" y="196" class="tag" text-anchor="middle" fill="#dbad50">v1 &#8594; v2 &#8594; v3</text>
</g>
<g data-frag="2">
<text x="248" y="30" class="hd" fill="#7d93ad" text-anchor="middle">TWO INDEPENDENT MODELS</text>
<rect x="160" y="40" width="84" height="34" rx="6" fill="#0d2035" stroke="#27446e"/>
<text x="202" y="62" class="tag" text-anchor="middle" fill="#e8edf3">reviewer A</text>
<line x1="202" y1="76" x2="202" y2="90" stroke="#27446e" stroke-width="1.4"/>
<rect x="256" y="40" width="84" height="34" rx="6" fill="#0d2035" stroke="#27446e"/>
<text x="298" y="62" class="tag" text-anchor="middle" fill="#e8edf3">reviewer B</text>
<line x1="298" y1="76" x2="298" y2="90" stroke="#27446e" stroke-width="1.4"/>
</g>
<g data-frag="3">
<line x1="128" y1="152" x2="146" y2="152" stroke="#7d93ad" stroke-width="2" marker-end="url(#ar)"/>
<rect x="152" y="92" width="182" height="120" rx="7" fill="#142846" stroke="#27446e"/>
<text x="166" y="116" class="ph">1 &#183; blind</text>
<text x="166" y="138" class="mc">Neither reviewer reads the</text>
<text x="166" y="152" class="mc">other first.</text>
<text x="166" y="174" class="mi">Two independent verdicts.</text>
</g>
<g data-frag="4">
<line x1="336" y1="152" x2="354" y2="152" stroke="#7d93ad" stroke-width="2" marker-end="url(#ar)"/>
<rect x="348" y="92" width="182" height="120" rx="7" fill="#142846" stroke="#27446e"/>
<text x="362" y="116" class="ph">2 &#183; author rules</text>
<text x="362" y="138" class="mc">The author adjudicates every</text>
<text x="362" y="152" class="mc">item.</text>
<text x="362" y="174" class="mi">Two reviewers can converge</text>
<text x="362" y="188" class="mi">on a mistake.</text>
</g>
<g data-frag="5">
<line x1="532" y1="152" x2="550" y2="152" stroke="#7d93ad" stroke-width="2" marker-end="url(#ar)"/>
<rect x="544" y="92" width="182" height="120" rx="7" fill="#142846" stroke="#27446e"/>
<text x="558" y="116" class="ph">3 &#183; reflect</text>
<text x="558" y="138" class="mc">accept, modify, refuse or</text>
<text x="558" y="152" class="mc">hold.</text>
<text x="558" y="174" class="mi">A held position must be re-</text>
<text x="558" y="188" class="mi">argued.</text>
</g>
<g data-frag="7">
<line x1="728" y1="152" x2="746" y2="152" stroke="#7d93ad" stroke-width="2" marker-end="url(#ar)"/>
<rect x="740" y="92" width="182" height="120" rx="7" fill="#142846" stroke="#27446e"/>
<text x="754" y="116" class="ph">4 &#183; the checker</text>
<text x="754" y="138" class="mc">Both GO, on the SAME bytes.</text>
<text x="754" y="160" class="mi">Conditional GO is downgraded</text>
<text x="754" y="174" class="mi">to NO_GO.</text>
</g>
<g data-frag="6">
<path d="M634,212 C634,250 440,250 440,212" fill="none" stroke="#dbad50" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ag)"/>
<text x="537" y="266" class="tag" text-anchor="middle" fill="#dbad50">LOOPS UNTIL IT NARROWS</text>
</g>
<g data-frag="8">
<text x="838" y="30" class="hd" fill="#7d93ad" text-anchor="middle">BOTH ARE VALID ENDINGS</text>
<rect x="750" y="40" width="84" height="34" rx="6" fill="#0d2035" stroke="#5fae86"/>
<text x="792" y="62" class="tag" text-anchor="middle" fill="#5fae86">DUAL GO</text>
<line x1="792" y1="76" x2="792" y2="90" stroke="#27446e" stroke-width="1.4"/>
<rect x="846" y="40" width="84" height="34" rx="6" fill="#0d2035" stroke="#c9614f"/>
<text x="888" y="62" class="tag" text-anchor="middle" fill="#c9614f">DISSENT</text>
<line x1="888" y1="76" x2="888" y2="90" stroke="#27446e" stroke-width="1.4"/>
</g>
<g data-frag="9">
<rect x="20" y="304" width="940" height="34" rx="6" fill="#12243f" stroke="#27446e"/>
<text x="490" y="326" class="ft" text-anchor="middle">A board that must end in agreement will produce agreement &#8212; and it will mean nothing.</text>
</g>
</svg>