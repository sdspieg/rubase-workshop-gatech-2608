<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Workshop prompt</title>
  <style>
    :root{--bg:#09182f;--panel:#132f59;--panel2:#173966;--gold:#dbad50;--muted:#9db8d6;--text:#f3f6fb;--line:rgba(255,255,255,.14)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px max(20px,calc((100vw - 1180px)/2));background:rgba(19,47,89,.97);border-bottom:1px solid var(--line);box-shadow:0 3px 12px rgba(0,0,0,.3)}
    header strong{color:var(--gold);font-size:1.05rem} header a{color:var(--muted);font-size:.84rem;font-weight:700;text-decoration:none} header a:hover{color:var(--gold)}
    main{max-width:1180px;margin:0 auto;padding:30px 22px 60px} h1{margin:0;color:var(--gold);font-size:clamp(1.55rem,3vw,2.25rem)}
    .intro{margin:8px 0 20px;color:var(--muted);line-height:1.55}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px}
    .actions button,.actions a{border:1px solid var(--gold);border-radius:5px;background:rgba(219,173,80,.1);color:var(--gold);font:inherit;font-size:.82rem;font-weight:800;padding:9px 13px;text-decoration:none;cursor:pointer}
    .actions button:hover,.actions a:hover{background:var(--gold);color:var(--bg)} #copyStatus{align-self:center;color:var(--muted);font-size:.78rem}
    .participant-prompt{margin:0;padding:26px 28px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:7px;color:#d7e4f2;font:400 .92rem/1.6 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;tab-size:4}
    .error{color:#f2a07b}@media(max-width:620px){header{align-items:flex-start;flex-direction:column;padding:12px 16px}main{padding:22px 14px 45px}.participant-prompt{padding:18px 16px;font-size:.84rem}}
  </style>
</head>
<body>
  <header><strong>RuBase / StratBase Methods Workshop</strong><a href="index.html#materials">← Materials</a></header>
  <main>
    <h1 id="promptTitle">Loading prompt…</h1>
    <p class="intro">Hover over any dotted term for a plain-English definition. Keyboard users can focus the same terms. Copying still gives you the exact, unmodified prompt text.</p>
    <div class="actions"><button id="copyPrompt" type="button">Copy the full prompt</button><a id="downloadPrompt" download>Download Markdown</a><a href="index.html#glossary">Open the full A–Z glossary</a><span id="copyStatus" aria-live="polite"></span></div>
    <pre id="promptText" class="participant-prompt">Loading…</pre>
  </main>
  <script src="prompt-viewer.js"></script>
  <script src="glossary-tooltips.js"></script>
</body>
</html>
