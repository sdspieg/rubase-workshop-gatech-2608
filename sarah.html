e86"/><circle cx="896.9" cy="262.4" r="4.4" fill="#5fae86"/><rect x="610" y="376" width="560" height="132" rx="8" fill="#142846" stroke="#5fae86" stroke-width="1.7"/><text x="632" y="410" class="ap-lb" fill="#5fae86">Let the record answer</text><text x="632" y="442" class="ap-tx">You open the aperture first, look at everything that comes</text><text x="632" y="468" class="ap-tx">back, and narrow on evidence rather than on the label you</text><text x="632" y="494" class="ap-tx">happened to start with. The cost is a longer first pass.</text></g></svg></figure></section><section class="slide obuild mcnr" data-t="McNamara&#x27;s first law of defense analysis" data-n="Never answer the question you were asked until you have asked a broader one." data-sid="256149"><h2>McNamara&rsquo;s first law of defense analysis</h2><p class="sub">A book, a photograph, and the paragraph that starts every analysis.</p><div class="ob-pic"><div class="ob-step" data-frag="1"><img class="cmp" style="--x:80%;--y:4%;--w:16%" src="img/mcn/cover.png" alt="How Much Is Enough? Shaping the Defense Program 1961-1969"><div class="lay cap" style="--x:76%;--y:63%;--w:23%"><b>How Much Is Enough?</b>Enthoven &amp; Smith, 1971</div><div class="ob-note" style="--x:4%;--y:20%;--w:50%"><div class="k">The book that wrote it down</div><div class="d">Alain Enthoven and K. Wayne Smith ran systems analysis in the Pentagon and then set out how the defense program had actually been shaped between 1961 and 1969. It is still the standard account of what analysis inside a defense ministry is for.</div></div></div><div class="ob-step" data-frag="1"><img class="cmp" style="--x:61%;--y:4%;--w:16%" src="img/mcn/mcnamara.png" alt="Robert S. McNamara"><div class="lay cap" style="--x:57%;--y:63%;--w:23%"><b>Robert S. McNamara</b>Defense Secretary, 1961&ndash;68</div><div class="ob-note" style="--x:4%;--y:20%;--w:50%"><div class="k">The man the rule is named for</div><div class="d">McNamara arrived from Ford and insisted that every major program be considered and analyzed as a whole rather than line by line. The habit he imposed on his staff is the one this book records, and it long outlived his own record in office.</div></div></div><div class="ob-step" data-frag="1"><img class="cmp" style="--x:1%;--y:4%;--w:54%" src="img/mcn/page.png" alt="Page 54 of How Much Is Enough?, with McNamara&rsquo;s First Law of Analysis highlighted"><div class="ob-note" style="--x:1%;--y:72%;--w:54%"><div class="k">Page 54, highlighted</div><div class="d">The rule is not in a manual or a doctrine note. It is one aside inside a paragraph about why the number of Draft Presidential Memoranda kept growing.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-scrim"></div><div class="lay quo" style="--x:5%;--y:10%;--w:90%">&ldquo;<em>Always start by looking at the grand totals.</em> Whatever problem you are studying, back off and look at it in the large. Don&rsquo;t start with a small piece and work up; look at the total first and then break it down into its parts.&rdquo;<div class="att">Enthoven &amp; Smith, <i>How Much Is Enough?</i>, p.&nbsp;54</div></div><div class="ob-note wide" style="--x:5%;--y:56%;--w:90%"><div class="k">McNamara&rsquo;s First Law of Analysis</div><div class="d">Read it as a rule about scope, not about arithmetic. The grand total is whatever the whole of your problem is, and you are not allowed to start inside it.</div></div></div><div class="ob-step" data-frag="1"><div class="lay mc-dg" style="--x:4%;--y:35%;--w:36%"><div class="mc-tot">THE GRAND TOTAL</div><div class="mc-arr">&#9660;</div><div class="mc-parts"><span>part</span><span>part</span><span>part</span><span>part</span></div><div class="mc-cap">Total first, then the parts&nbsp;&ndash; never a part first and upwards.</div></div><div class="ob-note" style="--x:2%;--y:71%;--w:96%"><div class="k">Why it is the first law for this week</div><div class="d">A literature search is the same move. Ask what the whole body of work on your question looks like before you ask what any one paper says, because a search that starts from the paper you already know only ever returns its own neighborhood.</div></div></div></div></section><section class="slide obuild dbwall" data-t="Where to get data?" data-n="The last line is the honest one: budget, not method, usually picks the database." data-sid="84f368"><h2>Where to get the data</h2><p class="sub">The bibliometric databases, and what is wrong with each of them.</p><div class="ob-pic"><div class="ob-step" data-frag="1"><div class="wg-lab" style="--x:2%;--y:2%">YOU PAY FOR THESE</div><img class="wg-a" style="--x:2%;--y:8%" src="img/src2025/image85.png" alt="Scopus"><img class="wg-a" style="--x:17.4%;--y:8%" src="img/src2025/image86.png" alt="Clarivate Analytics Web of Science"><img class="wg-a" style="--x:32.8%;--y:8%" src="img/src2025/image89.png" alt="Dimensions"><img class="wg-a" style="--x:48.2%;--y:8%" src="img/src2025/image91.png" alt="scite_"><div class="ob-note" style="--x:65%;--y:4%;--w:32%"><div class="k">Subscription-based</div><div class="d">Scopus, Web of Science, Dimensions and scite_ are sold by subscription, and at the scale you need &ndash; whole fields, not single papers &ndash; they are <b>(very) expensive</b>. Whether your university buys one of them decides what your corpus can contain.</div></div></div><div class="ob-step" data-frag="1"><div class="wg-lab" style="--x:2%;--y:28%">THESE ARE OPEN</div><img class="wg-b" style="--x:2%;--y:34%" src="img/src2025/image87.png" alt="Google Scholar"><img class="wg-b" style="--x:22.55%;--y:34%" src="img/src2025/image92.png" alt="Crossref"><img class="wg-b" style="--x:43.1%;--y:34%" src="img/src2025/image93.png" alt="Semantic Scholar"><img class="wg-b" style="--x:2%;--y:53%" src="img/src2025/image95.png" alt="OpenAlex"><img class="wg-b" style="--x:22.55%;--y:53%" src="img/src2025/image88.png" alt="Lens.org"><img class="wg-b" style="--x:43.1%;--y:53%" src="img/src2025/image94.png" alt="1findr"><div class="ob-note" style="--x:65%;--y:4%;--w:32%"><div class="k">Hard to access anyway</div><div class="d">Google Scholar, Crossref, Semantic Scholar, OpenAlex, the Lens and 1findr are free to query. Retrieving in <em>quantity</em> is another matter: rate limits, export caps, and pagination you have to write code around.</div></div></div><div class="ob-step" data-frag="1"><div class="wg-lab" style="--x:2%;--y:73%">AND THIS ONE IS GONE</div><img class="wg-c" style="--x:2%;--y:79%" src="img/src2025/image90.png" alt="Microsoft Academic Search"><div class="ob-note" style="--x:65%;--y:4%;--w:32%"><div class="k">And one of them simply stopped</div><div class="d">Microsoft Academic is on this wall because it was one of the good ones, and it was switched off. Anything built on it stopped working, and a corpus assembled from it can never be refreshed.</div></div></div><div class="ob-step" data-frag="1"><svg class="wg-qual" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 122" role="img" aria-label="Schematic grid: the same article as five database records, with fields present, disagreeing or missing"><text x="26" y="18" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#dbad50" letter-spacing=".9">SCHEMATIC &#183; ONE ARTICLE, FIVE RECORDS</text><rect x="26" y="30" width="19" height="14" rx="3" fill="#4f7bb0"/><rect x="49" y="30" width="19" height="14" rx="3" fill="#4f7bb0"/><rect x="72" y="30" width="19" height="14" rx="3" fill="#4f7bb0"/><rect x="95" y="30" width="19" height="14" rx="3" fill="#4f7bb0"/><rect x="118" y="30" width="19" height="14" rx="3" fill="#dbad50"/><rect x="141" y="30" width="19" height="14" rx="3" fill="none" stroke="#3a5c8c" stroke-width="1.5"/><rect x="26" y="48" width="19" height="14" rx="3" fill="#4f7bb0"/><rect x="49" y="48" width="19" height="14" rx="3" fill="#4f7bb0"/><rect x="72" y="48" width="19" height="14" rx="3" fill="#dbad50"/><rect x="95" y="48" width="19" height="14" rx="3" fill="#4f7bb0"/><rect x="118" y="48" width="19" height="14" rx="3" fill="none" stroke="#3a5c8c" stroke-width="1.5"/><rect x="141" y="48" width="19" height="14" rx="3" fill="none" stroke="#3a5c8c" stroke-width="1.5"/><rect x="26" y="66" width="19" height="14" rx="3" fill="#4f7bb0"/><rect x="49" y="66" width="19" height="14" rx="3" fill="#4f7bb0"/><rect x="72" y="66" width="19" height="14" rx="3" fill="#4f7bb0"/><rect x="95" y="66" width="19" height="14" rx="3" fill="#4f7bb0"/><rect x="118" y="66" width="19" height="14" rx="3" fill="#dbad50"/><rect x="141" y="66" width="19" height="14" rx="3" fill="none" stroke="#3a5c8c" stroke-width="1.5"/><rect x="26" y="84" width="19" height="14" rx="3" fill="#4f7bb0"/><rect x="49" y="84" width="19" height="14" rx="3" fill="#4f7bb0"/><rect x="72" y="84" width="19" height="14" rx="3" fill="#4f7bb0"/><rect x="95" y="84" width="19" height="14" rx="3" fill="#4f7bb0"/><rect x="118" y="84" width="19" height="14" rx="3" fill="none" stroke="#3a5c8c" stroke-width="1.5"/><rect x="141" y="84" width="19" height="14" rx="3" fill="none" stroke="#3a5c8c" stroke-width="1.5"/><rect x="26" y="102" width="19" height="14" rx="3" fill="#4f7bb0"/><rect x="49" y="102" width="19" height="14" rx="3" fill="#dbad50"/><rect x="72" y="102" width="19" height="14" rx="3" fill="#4f7bb0"/><rect x="95" y="102" width="19" height="14" rx="3" fill="#4f7bb0"/><rect x="118" y="102" width="19" height="14" rx="3" fill="#4f7bb0"/><rect x="141" y="102" width="19" height="14" rx="3" fill="#dbad50"/><rect x="190" y="30" width="19" height="14" rx="3" fill="#4f7bb0"/><text x="218" y="42" font-family="system-ui,sans-serif" font-size="15" fill="#f3f6fb">the field is there</text><rect x="190" y="56" width="19" height="14" rx="3" fill="#dbad50"/><text x="218" y="68" font-family="system-ui,sans-serif" font-size="15" fill="#f3f6fb">the records disagree</text><rect x="190" y="82" width="19" height="14" rx="3" fill="none" stroke="#3a5c8c" stroke-width="1.5"/><text x="218" y="94" font-family="system-ui,sans-serif" font-size="15" fill="#f3f6fb">it is simply missing</text></svg><div class="ob-note" style="--x:65%;--y:4%;--w:32%"><div class="k">Of disappointing quality</div><div class="d">Many inconsistencies and omissions, <em>even within</em> a single database: a missing DOI, one author under three spellings, a year that disagrees with the article&rsquo;s own title page. The grid is the shape of the problem, not a count of it.</div></div></div><div class="ob-step" data-frag="1"><svg class="wg-ovl" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 272" role="img" aria-label="Schematic: three heavily overlapping database circles, the union barely larger than the largest"><text x="18" y="22" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#dbad50" letter-spacing=".9">SCHEMATIC &#183; THREE DATABASES</text><circle cx="158" cy="104" r="60" fill="rgba(79,123,176,.42)" stroke="#7fa8d8" stroke-width="2"/><circle cx="242" cy="104" r="60" fill="rgba(219,173,80,.34)" stroke="#dbad50" stroke-width="2"/><circle cx="200" cy="158" r="60" fill="rgba(120,180,190,.34)" stroke="#8fd0d8" stroke-width="2"/><text x="18" y="246" font-family="system-ui,sans-serif" font-size="16" fill="#f3f6fb">the third one adds the crescent,</text><text x="18" y="266" font-family="system-ui,sans-serif" font-size="16" fill="#f3f6fb">not another database&#8217;s worth</text></svg><div class="ob-note" style="--x:65%;--y:4%;--w:32%"><div class="k">Significantly overlapping</div><div class="d">These are not independent samples of the literature. They share sources and they share each other&rsquo;s metadata, so the second and third add far less than their headline counts promise. <b>More sources is not more coverage.</b></div></div></div><div class="ob-step" data-frag="1"><div class="ob-scrim soft"></div><div class="ob-note wide" style="--x:5%;--y:30%;--w:56%"><div class="k">And few value-added services</div><div class="d">Surprisingly few, given the price: disambiguation you cannot trust, no full text, and little help with anything past the citation. <b>The one you can afford is usually the one that decides your corpus</b> &ndash; budget picks the database, the database picks the record, and the record picks the finding.</div></div></div></div></section><section class="slide obuild lvnb" data-t="Enter your query" data-n="Hands-on starts here. Their own question. &middot; REBUILT 2026-09-01: just the Venn and its legend, built up, student voice. The next slide hands them the query." data-sid="17306f"><h2>Three places to ask &ndash; and they do not agree</h2><p class="sub">The same question, three free databases, three different answers.</p><div class="ob-pic"><svg class="lvn-svg" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Three free scholarly databases as overlapping sets: the Lens, Semantic Scholar and OpenAlex share a large core, and each holds records the others do not."><style>.lvn-nm{font:700 25px system-ui,sans-serif;fill:#f3f6fb}.lvn-sub{font:400 16px system-ui,sans-serif;fill:#9db8d6}.lvn-key{font:700 15px system-ui,sans-serif;fill:#dbad50;letter-spacing:.06em}.lvn-leg{font:400 15px system-ui,sans-serif;fill:#e8edf3}</style><g class="lvn-g lvn-g1"><circle cx="372" cy="170" r="130" fill="rgba(80,150,220,.30)" stroke="#5096dc" stroke-width="2.5"/><text class="lvn-nm" x="212" y="105">The Lens</text><text class="lvn-sub" x="212" y="129">scholarly + patents</text></g><g class="lvn-g lvn-g2"><circle cx="628" cy="170" r="130" fill="rgba(90,200,160,.28)" stroke="#5ac8a0" stroke-width="2.5"/><text class="lvn-nm" x="606" y="105">Semantic Scholar</text><text class="lvn-sub" x="606" y="129">reads the full text</text></g><g class="lvn-g lvn-g3"><circle cx="500" cy="255" r="130" fill="rgba(219,173,80,.26)" stroke="#dbad50" stroke-width="2.5"/><text class="lvn-nm" x="400" y="352">OpenAlex</text><text class="lvn-sub" x="400" y="374">fully open, bulk-downloadable</text></g><g class="lvn-g lvn-g4"><rect x="60" y="424" width="470" height="118" rx="10" fill="rgba(19,47,89,.55)" stroke="rgba(219,173,80,.45)" stroke-width="1.5"/><rect x="80" y="442" width="18" height="18" rx="4" fill="rgba(80,150,220,.55)" stroke="#5096dc" stroke-width="2"/><text class="lvn-leg" x="108" y="457">The Lens &#183; scholarly works and patents, free, account needed</text><rect x="80" y="472" width="18" height="18" rx="4" fill="rgba(90,200,160,.5)" stroke="#5ac8a0" stroke-width="2"/><text class="lvn-leg" x="108" y="487">Semantic Scholar &#183; reads the papers, not just their titles</text><rect x="80" y="502" width="18" height="18" rx="4" fill="rgba(219,173,80,.45)" stroke="#dbad50" stroke-width="2"/><text class="lvn-leg" x="108" y="517">OpenAlex &#183; fully open, the whole corpus is downloadable</text><text class="lvn-key" x="458" y="238">SHARED</text><text class="lvn-key" x="252" y="192">ONLY</text><text class="lvn-key" x="252" y="212">HERE</text><text class="lvn-key" x="700" y="192">ONLY</text><text class="lvn-key" x="700" y="212">HERE</text></g></svg><div class="ob-step ls1" data-frag="1"><div class="ob-note" style="--x:56%;--y:62%;--w:42%"><div class="k">1 &middot; The Lens</div><div class="d">Free, no subscription, and the only one of the three that indexes the <b>patent</b> record alongside the scholarly one. Everything on the previous slide was run here.</div></div></div><div class="ob-step ls2" data-frag="1"><div class="ob-note" style="--x:56%;--y:62%;--w:42%"><div class="k">2 &middot; Semantic Scholar</div><div class="d">Also free, and it reads the papers rather than only indexing them &ndash; so it surfaces citation context and related work that a keyword match never reaches.</div></div></div><div class="ob-step ls3" data-frag="1"><div class="ob-note" style="--x:56%;--y:62%;--w:42%"><div class="k">3 &middot; OpenAlex</div><div class="d">Fully open: the whole corpus is downloadable, which makes it the one you can query at scale yourself without asking anyone.</div></div></div><div class="ob-step ls4" data-frag="1"><div class="ob-note" style="--x:56%;--y:62%;--w:42%"><div class="k">What the overlap means</div><div class="d">The three share a large core &ndash; and each one holds records the other two do not. <b>No single service is the literature.</b> Which is why the count you are about to get depends on where you ask.</div></div></div></div></section><section class="slide obuild lensq" data-t="Now run your own" data-n="&lt;b&gt;HANDS-ON &middot; this is the one they DO&lt;/b&gt; &middot; the previous slide showed our query; this one hands it over.&lt;ul&gt;&lt;li&gt;Give them a minute per step and walk the room - the point is that everyone leaves with two numbers written down.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Insist on the quotation marks.&lt;/b&gt; Without them the engines search the words separately and the count is meaningless.&lt;/li&gt;&lt;li&gt;The three services WILL disagree. That is the finding, not a mistake - different corpora, different coverage.&lt;/li&gt;&lt;li&gt;They bring both numbers to Day 3; the taxonomy work uses them.&lt;/li&gt;&lt;/ul&gt;" data-sid="lensq1"><h2>Now run your own</h2><p class="sub">Your topic, three free services, and two numbers you keep.</p><div class="ob-pic"><div class="ob-step" data-frag="1"><div class="lq-topic"><span class="lq-q">&ldquo;</span>your topic, in one phrase<span class="lq-q">&rdquo;</span></div><div class="ob-note" style="--x:3%;--y:81%;--w:47%"><div class="k">1 &middot; Write your topic as one phrase</div><div class="d">Not a sentence and not a list &ndash; the words you would expect to appear together in a title. Put it in <b>quotation marks</b>. Without them the engine searches the words separately and the number it gives you back means nothing.</div></div></div><div class="ob-step" data-frag="1"><img class="lq-logo lq-lens" src="img/src2025/image88.png" alt="The Lens"><img class="lq-qr lq-qr-lens" src="img/qr/qr_lens.png" alt="QR code for lens.org"><div class="lq-url lq-url-lens">lens.org</div><div class="ob-note" style="--x:3%;--y:81%;--w:47%"><div class="k">2 &middot; The Lens &mdash; lens.org</div><div class="d">Free, no subscription, and it covers the scholarly <em>and</em> the patent record. Make an account first &ndash; you cannot save or export a search without one, and you will want to.</div></div></div><div class="ob-step" data-frag="1"><img class="lq-logo lq-s2" src="img/src2025/image93.png" alt="Semantic Scholar"><img class="lq-qr lq-qr-s2" src="img/qr/qr_s2.png" alt="QR code for semanticscholar.org"><div class="lq-url lq-url-s2">semanticscholar.org</div><div class="ob-note" style="--x:3%;--y:81%;--w:47%"><div class="k">3 &middot; Semantic Scholar &mdash; semanticscholar.org</div><div class="d">Also free. It reads the papers as well as indexing them, so it will show you citation context and related work that a plain keyword match never surfaces.</div></div></div><div class="ob-step" data-frag="1"><img class="lq-logo lq-oa" src="img/src2025/image95.png" alt="OpenAlex"><img class="lq-qr lq-qr-oa" src="img/qr/qr_openalex.png" alt="QR code for openalex.org"><div class="lq-url lq-url-oa">openalex.org</div><div class="ob-note" style="--x:3%;--y:81%;--w:47%"><div class="k">4 &middot; OpenAlex &mdash; openalex.org</div><div class="d">The fully open one: every record is downloadable, so it is the only one of the three you can query programmatically at scale without asking anyone's permission.</div></div></div><div class="ob-step" data-frag="1"><div class="lq-counts"><div class="lq-row"><span class="lq-lab">the exact phrase</span><span class="lq-slot">&nbsp;</span></div><div class="lq-row"><span class="lq-lab">plus your OR variants</span><span class="lq-slot">&nbsp;</span></div></div><div class="ob-note" style="--x:3%;--y:81%;--w:47%"><div class="k">5 &middot; Two numbers, written down</div><div class="d">Run the exact phrase first and note the count. Then add the variants the way we just built ours &ndash; the plurals, the adjective forms, the British spelling &ndash; and note it again. <b>Keep both numbers.</b> Day 3 starts from them.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-scrim soft"></div><div class="ob-note wide" style="--x:8%;--y:34%;--w:84%"><div class="k">The three will not agree &ndash; that is the finding</div><div class="d">Different services index different corpora, so the same query returns three different numbers. <b>None of them is the truth and none of them is a mistake.</b> The gap between them is the first honest measure of how much of your own literature you have never seen.</div></div></div></div></section><section class="slide obuild mrib" data-t="An epistemic MRI" data-n="Deterrence-IS 1958-2020: 810 articles, 2,312 terms, 41,868 links." data-sid="0734c8"><h2>An epistemic MRI</h2><p class="sub">The deterrence literature, 1958&ndash;2020: 810 articles, 2,312 terms, 41,868 links.</p><div class="ob-pic"><div class="ob-step" data-frag="1"><img class="mri-map" src="img/src2025/image103.png" alt="CiteSpace co-occurrence map of the deterrence literature: twenty labelled clusters and red stars on the Russia-related terms"><div class="ob-note" style="--x:54.5%;--y:6%;--w:44%"><div class="k">The whole field in one scan</div><div class="d">Every dot is one of 2,312 terms, sized by how often it occurs and colored by the cluster the algorithm put it in; every thread is one of 41,868 co-occurrences between them. Twenty clusters emerged on their own &ndash; strategic stability, cyber deterrence, nuclear weapon, arms control, world order &ndash; and nobody read an article to find them.</div></div></div><div class="ob-step" data-frag="1"><svg class="mri-rings" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1925 1474" role="img" aria-label="A white ring drawn around each of the ten red-starred Russia-related terms"><circle cx="552" cy="745" r="34" fill="none" stroke="#0b1d38" stroke-width="19"/><circle cx="552" cy="745" r="34" fill="none" stroke="#ffffff" stroke-width="8"/><circle cx="1516" cy="405" r="34" fill="none" stroke="#0b1d38" stroke-width="19"/><circle cx="1516" cy="405" r="34" fill="none" stroke="#ffffff" stroke-width="8"/><circle cx="1416" cy="317" r="34" fill="none" stroke="#0b1d38" stroke-width="19"/><circle cx="1416" cy="317" r="34" fill="none" stroke="#ffffff" stroke-width="8"/><circle cx="1456" cy="349" r="34" fill="none" stroke="#0b1d38" stroke-width="19"/><circle cx="1456" cy="349" r="34" fill="none" stroke="#ffffff" stroke-width="8"/><circle cx="1303" cy="951" r="34" fill="none" stroke="#0b1d38" stroke-width="19"/><circle cx="1303" cy="951" r="34" fill="none" stroke="#ffffff" stroke-width="8"/><circle cx="983" cy="909" r="34" fill="none" stroke="#0b1d38" stroke-width="19"/><circle cx="983" cy="909" r="34" fill="none" stroke="#ffffff" stroke-width="8"/><circle cx="1121" cy="787" r="34" fill="none" stroke="#0b1d38" stroke-width="19"/><circle cx="1121" cy="787" r="34" fill="none" stroke="#ffffff" stroke-width="8"/><circle cx="1205" cy="925" r="34" fill="none" stroke="#0b1d38" stroke-width="19"/><circle cx="1205" cy="925" r="34" fill="none" stroke="#ffffff" stroke-width="8"/><circle cx="1047" cy="944" r="34" fill="none" stroke="#0b1d38" stroke-width="19"/><circle cx="1047" cy="944" r="34" fill="none" stroke="#ffffff" stroke-width="8"/><circle cx="1163" cy="641" r="34" fill="none" stroke="#0b1d38" stroke-width="19"/><circle cx="1163" cy="641" r="34" fill="none" stroke="#ffffff" stroke-width="8"/></svg><div class="ob-note" style="--x:54.5%;--y:6%;--w:44%"><div class="k">Ten stars, and Russia is inside</div><div class="d">The rings mark every term the map flags with a red star: <em>russia</em>, <em>russian federation</em>, <em>russian academy</em>, <em>russian thought</em>, <em>russian government</em>, <em>new russia</em>, <em>america russia</em> and three more. Nine of the ten sit in the dense right half of the map, among arms control and nuclear deterrence; one sits far out on the left edge on its own.</div></div></div><div class="ob-step" data-frag="1"><svg class="mri-burst" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-label="Citation-burst chart: eleven of the fifteen strongest bursting terms in the deterrence literature, each with the years its burst ran"><text x="0" y="22" font-family="'Titillium Web',system-ui,sans-serif" font-size="23" font-weight="700" fill="#dbad50" letter-spacing=".6">TERM</text><text x="300" y="22" text-anchor="end" font-family="'Titillium Web',system-ui,sans-serif" font-size="23" font-weight="700" fill="#dbad50" letter-spacing=".6">STR</text><text x="330.0" y="22" text-anchor="start" font-family="'Titillium Web',system-ui,sans-serif" font-size="22" fill="#82a0bc">1958</text><text x="566.4" y="22" text-anchor="middle" font-family="'Titillium Web',system-ui,sans-serif" font-size="22" fill="#82a0bc">1990</text><text x="788.0" y="22" text-anchor="end" font-family="'Titillium Web',system-ui,sans-serif" font-size="22" fill="#82a0bc">2020</text><text x="0" y="68" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#e8edf3">nuclear energy</text><text x="300" y="68" text-anchor="end" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#e8edf3">4.96</text><line x1="330.0" y1="60" x2="788.0" y2="60" stroke="#2f4e79" stroke-width="4"/><rect x="669.8" y="54" width="22.2" height="11" rx="5" fill="#e2483d"/><text x="0" y="102" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#e8edf3">international study</text><text x="300" y="102" text-anchor="end" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#e8edf3">6.64</text><line x1="330.0" y1="94" x2="788.0" y2="94" stroke="#2f4e79" stroke-width="4"/><rect x="721.5" y="88" width="22.2" height="11" rx="5" fill="#e2483d"/><text x="0" y="136" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#e8edf3">north korea</text><text x="300" y="136" text-anchor="end" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#e8edf3">5.33</text><line x1="330.0" y1="128" x2="788.0" y2="128" stroke="#2f4e79" stroke-width="4"/><rect x="721.5" y="122" width="66.5" height="11" rx="5" fill="#e2483d"/><text x="0" y="170" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#e8edf3">south korea</text><text x="300" y="170" text-anchor="end" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#e8edf3">4.97</text><line x1="330.0" y1="162" x2="788.0" y2="162" stroke="#2f4e79" stroke-width="4"/><rect x="721.5" y="156" width="51.7" height="11" rx="5" fill="#e2483d"/><text x="0" y="204" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#e8edf3">nuclear strategy</text><text x="300" y="204" text-anchor="end" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#e8edf3">5.79</text><line x1="330.0" y1="196" x2="788.0" y2="196" stroke="#2f4e79" stroke-width="4"/><rect x="728.9" y="190" width="22.2" height="11" rx="5" fill="#e2483d"/><text x="0" y="238" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#e8edf3">nato</text><text x="300" y="238" text-anchor="end" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#e8edf3">5.17</text><line x1="330.0" y1="230" x2="788.0" y2="230" stroke="#2f4e79" stroke-width="4"/><rect x="743.7" y="224" width="29.5" height="11" rx="5" fill="#e2483d"/><text x="0" y="272" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#e8edf3">cyber deterrence</text><text x="300" y="272" text-anchor="end" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#e8edf3">9</text><line x1="330.0" y1="264" x2="788.0" y2="264" stroke="#2f4e79" stroke-width="4"/><rect x="751.1" y="258" width="36.9" height="11" rx="5" fill="#e2483d"/><text x="0" y="306" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#e8edf3">network security</text><text x="300" y="306" text-anchor="end" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#e8edf3">6.42</text><line x1="330.0" y1="298" x2="788.0" y2="298" stroke="#2f4e79" stroke-width="4"/><rect x="751.1" y="292" width="36.9" height="11" rx="5" fill="#e2483d"/><text x="0" y="340" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#e8edf3">strategic stability</text><text x="300" y="340" text-anchor="end" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#e8edf3">4.56</text><line x1="330.0" y1="332" x2="788.0" y2="332" stroke="#2f4e79" stroke-width="4"/><rect x="751.1" y="326" width="36.9" height="11" rx="5" fill="#e2483d"/><text x="0" y="374" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#ffffff" font-weight="700">russia</text><text x="300" y="374" text-anchor="end" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#ffffff">4.61</text><line x1="330.0" y1="366" x2="788.0" y2="366" stroke="#2f4e79" stroke-width="4"/><rect x="758.5" y="360" width="29.5" height="11" rx="5" fill="#f0a03c"/><text x="0" y="408" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#e8edf3">cyber domain</text><text x="300" y="408" text-anchor="end" font-family="'Titillium Web',system-ui,sans-serif" font-size="24" fill="#e8edf3">5.65</text><line x1="330.0" y1="400" x2="788.0" y2="400" stroke="#2f4e79" stroke-width="4"/><rect x="765.8" y="394" width="11.0" height="11" rx="5" fill="#e2483d"/></svg><div class="ob-note" style="--x:54.5%;--y:61%;--w:44%"><div class="k">What the field got excited about, and when</div><div class="d">The same tool reports citation bursts &ndash; terms whose use spikes for a run of years. Eleven of the fifteen are drawn here, in the order they began: <em>cyber deterrence</em> is the strongest at 9.0, and <em>russia</em> bursts from 2016 to 2020.</div></div></div><div class="ob-step" data-frag="1"><img class="mri-time" src="img/src2025/image104.png" alt="The same network redrawn as a timeline, 1958 to 2020, one lane per cluster, with red stars marking the Russia terms"><div class="ob-note" style="--x:2%;--y:78%;--w:60%"><div class="k">The same corpus, laid out in time</div><div class="d">The identical network redrawn against a calendar: 1958 at the left edge, 2020 at the right, one lane per cluster. Of the nine red stars on it, seven fall after 2005 and four after 2012.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-scrim soft"></div><div class="ob-note wide" style="--x:6%;--y:27%;--w:88%"><div class="k">An MRI, not a bibliography</div><div class="d"><b>This scans a whole field&rsquo;s vocabulary; it does not hand you a reading list.</b> It tells you where your topic sits, what it is next to, when it arrived and how much of the field it actually occupies &ndash; four questions a keyword search cannot answer, because a keyword search returns only what you already knew to ask for.</div></div></div></div></section><section class="slide obuild chinaslice" data-t="Slicing and dicing - and what is missing" data-n="Coverage of the Chinese scholarly record. Verify wording before delivery." data-sid="9ce288"><h2>Slicing and dicing &ndash; and what is missing</h2><p class="sub">Cut the same corpus as many ways as you like; the cut can only show what was captured in the first place.</p><div class="ob-pic"><div class="ob-step" data-frag="1"><div class="cs-hd cs-el" style="--l:1.5%;--t:0%;--w:49%">Slice by author</div><img class="pn cs-el" src="img/src2025/image146.png" alt="Lens panel: Most Active Authors, Russian corpus" style="--l:1.5%;--t:6%;--w:24%"><div class="cs-cap cs-el" style="--l:1.5%;--t:43%;--w:24%"><div class="c">Russia</div><div class="v">document-count axis runs to <b>90</b></div></div><div class="ob-note" style="--x:1.5%;--y:55%;--w:48%"><div class="k">The same records, re-ranked</div><div class="d">The Lens re-sorts a finished result set by any field in it, so ranking by author costs nothing and runs no new search. On the Russian corpus that yields a real distribution: one clear leader, a shoulder of three or four names, and a tail still worth reading at position twenty.</div></div></div><div class="ob-step" data-frag="1"><img class="pn cs-el" src="img/src2025/image150.png" alt="Lens panel: Most Active Authors, Chinese slice" style="--l:26.5%;--t:6%;--w:24%"><div class="cs-cap cs-el" style="--l:26.5%;--t:43%;--w:24%"><div class="c">China</div><div class="v">the same axis stops at <b>2.6</b></div></div><div class="ob-note" style="--x:1.5%;--y:55%;--w:48%"><div class="k">The identical panel, one slice over</div><div class="d">Now the same panel on the Chinese slice. The axis gives it away before any name does: it tops out below three documents where the Russian one needed ninety. Two authors have two papers and every other name in the top twenty has one.</div></div></div><div class="ob-step" data-frag="1"><div class="cs-hd cs-el" style="--l:52.5%;--t:0%;--w:46%">Slice by institution</div><img class="pn cs-el" src="img/src2025/image145.png" alt="Lens panel: Top Institutions Logo Grid, Russian corpus" style="--l:52.5%;--t:6%;--w:22.5%"><div class="cs-cap cs-el" style="--l:52.5%;--t:54%;--w:22.5%"><div class="c">Russia</div><div class="v">top institution <b>831</b> &middot; fifteenth <b>67</b></div></div><div class="ob-note" style="--x:40%;--y:65.5%;--w:58.5%"><div class="k">A different cut, same corpus</div><div class="d">Re-group the identical records by institution and they come back as a wall of logos, each tagged with its output. The Russian Academy of Sciences carries 831 documents, Kirov Military Medical Academy 421, Moscow State University 230 &ndash; and the fifteenth cell still holds 67.</div></div></div><div class="ob-step" data-frag="1"><img class="pn cs-el" src="img/src2025/image151.png" alt="Lens panel: Top Institutions Logo Grid, Chinese slice" style="--l:76%;--t:6%;--w:22.5%"><div class="cs-cap cs-el" style="--l:76%;--t:54%;--w:22.5%"><div class="c">China</div><div class="v">top institution <b>9</b> &middot; last cells on <b>2</b></div></div><div class="ob-note" style="--x:40%;--y:65.5%;--w:58.5%"><div class="k">What a shallow pool looks like</div><div class="d">The same grid for China puts Jilin University on top with 9, Peking University on 7, the bottom row on 2. Two of the fifteen cells are not Chinese at all &ndash; King&rsquo;s College London and the University of Gondar in Ethiopia.</div></div></div><div class="ob-step" data-frag="1"><img class="pn cs-el" src="img/src2025/image153.png" alt="Lens panel: countries and regions map with the JSON and CSV download menu open" style="--l:1.5%;--t:65%;--w:17%"><div class="ob-note wide" style="--x:20.5%;--y:66%;--w:78%"><div class="k">Every slice exports; none of them fixes the input</div><div class="d">Any of these cuts comes out of the dashboard as JSON or CSV, which is what makes them so quotable as the state of a field. They are not that. This is &lsquo;just&rsquo; The Lens, which does not have particularly expansive coverage of the Chinese scholarly record &ndash; and a cut can only ever show what the database captured.</div></div></div></div></section><section class="slide obuild mcubeb" data-t="Slicing your topic" data-sid="a7f3c2" data-n="&lt;b&gt;The thesis slide for the whole morning.&lt;/b&gt; Put it up before any data.&lt;ul&gt;&lt;li&gt;Ask the room, before the second click, how they would break warfare into parts. Most will offer ONE list &ndash; usually the levels of war. That is the point: one list is one cut, and they will have picked it without noticing they were choosing.&lt;/li&gt;&lt;li&gt;The three axes shown are real and independent: a strategic act can be cyber and autonomous, or land and industrial. Say that out loud &ndash; independence is what makes the cells meaningful rather than a cross-tab of overlapping labels.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Warfare is deliberately the same domain as the two blind runs&lt;/b&gt; they do later this morning, so this cube is the thing they will actually build.&lt;/li&gt;&lt;li&gt;The lizard-head DECT slide later is the empirical version of exactly this claim: one object, different read-outs, different nameable categories. Call back to this cube when you get there.&lt;/li&gt;&lt;li&gt;27 cells from 3&times;3&times;3 is worth saying: three modest axes already give you more positions than any flat list a person would write by hand.&lt;/li&gt;&lt;/ul&gt;"><h2>One object, and the cuts you make in it</h2><p class="sub">Today is not about filing papers &middot; it is about how you wrap your mind around a topic</p><div class="ob-pic"><div class="ob-step m1" data-frag="1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1770 840" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><rect width="1770" height="840" fill="#0a1830"/><style>.mc3-ax{font:700 27px "Titillium Web",Segoe UI,sans-serif;fill:#dbad50;letter-spacing:.09em}.mc3-v{font:600 25px "Titillium Web",Segoe UI,sans-serif;fill:#9db8d6}.mc3-hot{font:700 25px "Titillium Web",Segoe UI,sans-serif;fill:#e7c47c}.mc3-g1,.mc3-g2,.mc3-g3,.mc3-g4,.mc3-g5{opacity:0;visibility:hidden;transition:none}</style><g class="mc3-g1"><g transform="translate(195.00 196.00) scale(50.0000)"><polygon points="0.0000,-3.0000 2.5981,-1.5000 0.0000,0.0000 -2.5981,-1.5000" fill="#3f72af" stroke="#89aad2" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="2.5981,1.5000 0.0000,3.0000 0.0000,0.0000 2.5981,-1.5000" fill="#22508e" stroke="#89aad2" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="-2.5981,1.5000 0.0000,3.0000 0.0000,0.0000 -2.5981,-1.5000" fill="#12305a" stroke="#89aad2" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><line x1="0.8660" y1="-2.5000" x2="-1.7321" y2="-1.0000" stroke="#89aad2" stroke-width=".9" opacity=".75" vector-effect="non-scaling-stroke"/><line x1="-1.7321" y1="2.0000" x2="-1.7321" y2="-1.0000" stroke="#89aad2" stroke-width=".9" opacity 700 -1.1605,-0.6700 -2.0265,-1.1700" fill="#3f72af" stroke="#dbad50" stroke-width="1.0" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="-0.2944,-0.1700 -1.1605,0.3300 -1.1605,-0.6700 -0.2944,-1.1700" fill="#22508e" stroke="#dbad50" stroke-width="1.0" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="-2.0265,-0.1700 -1.1605,0.3300 -1.1605,-0.6700 -2.0265,-1.1700" fill="#12305a" stroke="#dbad50" stroke-width="1.0" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="1.1605,-1.6700 2.0265,-1.1700 1.1605,-0.6700 0.2944,-1.1700" fill="#3f72af" stroke="#dbad50" stroke-width="1.0" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="2.0265,-0.1700 1.1605,0.3300 1.1605,-0.6700 2.0265,-1.1700" fill="#22508e" stroke="#dbad50" stroke-width="1.0" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="0.2944,-0.1700 1.1605,0.3300 1.1605,-0.6700 0.2944,-1.1700" fill="#12305a" stroke="#dbad50" stroke-width="1.0" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="0.0000,-1.0000 0.8660,-0.5000 0.0000,0.0000 -0.8660,-0.5000" fill="#e7c47c" stroke="#dbad50" stroke-width="1.0" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="0.8660,0.5000 0.0000,1.0000 0.0000,0.0000 0.8660,-0.5000" fill="#c79640" stroke="#dbad50" stroke-width="1.0" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="-0.8660,0.5000 0.0000,1.0000 0.0000,0.0000 -0.8660,-0.5000" fill="#9d7229" stroke="#dbad50" stroke-width="1.0" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></g><line x1="1464" y1="366" x2="1696" y2="366" stroke="#dbad50" stroke-width="1.8" opacity=".55"/><text x="1580" y="394" text-anchor="middle" class="mc3-ax">ALL THREE AT ONCE</text><text x="1580" y="428" text-anchor="middle" class="mc3-v">27 cells</text><text x="1580" y="458" text-anchor="middle" class="mc3-hot">one is lit</text><text x="1580" y="488" text-anchor="middle" class="mc3-v">that cell is a case</text></g></svg><div class="ob-note" style="--x:1.5%;--y:62%;--w:41%"><div class="k">What today is actually about</div><div class="d">Whatever you study arrives as one undifferentiated object &ndash; here, warfare. You cannot hold it in your head whole, and no single list of topics will let you. Today is about the cuts you make in it.</div></div></div><div class="ob-step m2" data-frag="1"><div class="ob-note" style="--x:8.8%;--y:62%;--w:41%"><div class="k">Cut it one way</div><div class="d">Slice along the level of war and you get tactical, operational and strategic. Every piece of the object is in exactly one of those three, and nothing has been left out.</div></div></div><div class="ob-step m3" data-frag="1"><div class="ob-note" style="--x:28.3%;--y:62%;--w:41%"><div class="k">Cut the same object another way</div><div class="d">Now slice by domain instead: land and sea, air and space, cyber and information. Nothing about the object changed. These are different categories of the same thing, and neither cut is more correct than the other.</div></div></div><div class="ob-step m4" data-frag="1"><div class="ob-note" style="--x:47.7%;--y:62%;--w:41%"><div class="k">And a third</div><div class="d">Slice by technology regime &ndash; industrial, precision, autonomous. Three independent questions, three sets of answers, all of them true of the same warfare at the same time.</div></div></div><div class="ob-step m5" data-frag="1"><div class="ob-note" style="--x:54.5%;--y:62%;--w:41%"><div class="k">The cells, not the slices</div><div class="d">Hold all three cuts at once and you get twenty-seven cells. The lit one is a strategic, cyber and information, autonomous case &ndash; a fully specified position, not a label. That cell is what a multidimensional taxonomy gives you and a single list cannot.</div></div></div><div class="ob-step m6" data-frag="1"><div class="ob-scrim"></div><div class="ob-note wide" style="--x:8%;--y:64%;--w:84%"><div class="k">Wrapping your mind around a topic is the whole unit</div><div class="d">A taxonomy is not a filing system for papers you have already read. It is the set of cuts that turns one unmanageable object into positions you can name, count, compare and search for. The rest of this morning is about deriving those cuts for your own topic rather than borrowing someone else&rsquo;s &ndash; and about testing whether the cuts you got back are any good.</div></div></div></div></section><section class="slide obuild wcubeb" data-t="Not a tidy cube" data-sid="b6d914" data-n="&lt;b&gt;The honest counterweight to the cube.&lt;/b&gt; Runs straight on from it.&lt;ul&gt;&lt;li&gt;&lt;b&gt;Do not let this land as &lsquo;so taxonomies are hopeless&rsquo;.&lt;/b&gt; The order matters: the cube is how you START, this slide is what the murderboard is FOR. Say the closing line before anyone concludes the exercise is pointless.&lt;/li&gt;&lt;li&gt;The strongest of the four is usually RAGGED. Ask the room what an empty cell means &ndash; you will get &lsquo;nobody has done it&rsquo; and &lsquo;it is impossible&rsquo;, which is exactly the distinction, and it is a publishable one.&lt;/li&gt;&lt;li&gt;CORRELATED is the one people resist. The MDTDF prompt asks for INDEPENDENT dimensions; independence is the goal, not the guarantee, and a murderboard that never finds a correlated pair probably was not adversarial.&lt;/li&gt;&lt;li&gt;CURVED is where the LLM classifier will fail tomorrow. Flag it here so the Day-4 measurement is not a surprise.&lt;/li&gt;&lt;li&gt;Same subject as the previous slide throughout &ndash; warfare, the domain of their two blind runs.&lt;/li&gt;&lt;/ul&gt;"><h2>But real topics are not tidy cubes</h2><p class="sub">The same warfare &middot; four things a clean Cartesian product cannot say</p><div class="ob-pic"><div class="ob-step w1" data-frag="1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1770 840" preserveAspectRatio="xM effect="non-scaling-stroke"/><polygon points="-1.90,-4.40 -2.77,-3.90 -2.77,-4.90 -1.90,-5.40" fill="#c99f49" stroke="#dbad50" stroke-width="0.85" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="-3.64,-4.40 -2.77,-3.90 -2.77,-4.90 -3.64,-5.40" fill="#7f642e" stroke="#dbad50" stroke-width="0.85" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="-3.64,-4.40 -2.77,-3.90 -3.64,-3.40 -4.50,-3.90" fill="#ffe76b" stroke="#dbad50" stroke-width="0.85" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="-2.77,-2.90 -3.64,-2.40 -3.64,-3.40 -2.77,-3.90" fill="#c99f49" stroke="#dbad50" stroke-width="0.85" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="-4.50,-2.90 -3.64,-2.40 -3.64,-3.40 -4.50,-3.90" fill="#7f642e" stroke="#dbad50" stroke-width="0.85" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="-1.90,-4.40 -1.04,-3.90 -1.90,-3.40 -2.77,-3.90" fill="#ffe76b" stroke="#dbad50" stroke-width="0.85" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="-1.04,-2.90 -1.90,-2.40 -1.90,-3.40 -1.04,-3.90" fill="#c99f49" stroke="#dbad50" stroke-width="0.85" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="-2.77,-2.90 -1.90,-2.40 -1.90,-3.40 -2.77,-3.90" fill="#7f642e" stroke="#dbad50" stroke-width="0.85" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="-2.77,-2.90 -1.90,-2.40 -2.77,-1.90 -3.64,-2.40" fill="#ffe76b" stroke="#dbad50" stroke-width="0.85" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="-1.90,-1.40 -2.77,-0.90 -2.77,-1.90 -1.90,-2.40" fill="#c99f49" stroke="#dbad50" stroke-width="0.85" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="-3.64,-1.40 -2.77,-0.90 -2.77,-1.90 -3.64,-2.40" fill="#7f642e" stroke="#dbad50" stroke-width="0.85" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="-0.17,-4.40 0.69,-3.90 -0.17,-3.40 -1.04,-3.90" fill="#ffe76b" stroke="#dbad50" stroke-width="0.85" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="0.69,-2.90 -0.17,-2.40 -0.17,-3.40 0.69,-3.90" fill="#c99f49" stroke="#dbad50" stroke-width="0.85" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="-1.04,-2.90 -0.17,-2.40 -0.17,-3.40 -1.04,-3.90" fill="#7f642e" stroke="#dbad50" stroke-width="0.85" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><polygon points="3.22,3.17 4.09,3.67 3.22,4.17 2.36,3.67" fill="none" stroke="#dbad50" stroke-width="0.8" stroke-linejoin="round" vector-effect="non-scaling-stroke" stroke-dasharray="3 3"/><polygon points="4.09,4.67 3.22,5.17 3.22,4.17 4.09,3.67" fill="none" stroke="#dbad50" stroke-width="0.8" stroke-linejoin="round" vector-effect="non-scaling-stroke" stroke-dasharray="3 3"/><polygon points="2.36,4.67 3.22,5.17 3.22,4.17 2.36,3.67" fill="none" stroke="#dbad50" stroke-width="0.8" stroke-linejoin="round" vector-effect="non-scaling-stroke" stroke-dasharray="3 3"/></g><line x1="1440" y1="366" x2="1696" y2="366" stroke="#dbad50" stroke-width="1.8" opacity=".55"/><text x="1568" y="394" text-anchor="middle" class="wc-ax">RAGGED</text><text x="1568" y="430" text-anchor="middle" class="wc-v">a hole, and one region</text><text x="1568" y="462" text-anchor="middle" class="wc-v">with nothing in it</text></g></svg><div class="ob-note" style="--x:1.5%;--y:62%;--w:41%"><div class="k">Uneven, not 3 &times; 3 &times; 3</div><div class="d">Dimensions do not arrive with the same number of values, and the values are not the same size. There are orders of magnitude more tactical cases than strategic ones, so the tidy cube quietly implies a balance your corpus will never have.</div></div></div><div class="ob-step w2" data-frag="1"><div class="ob-note" style="--x:18.2%;--y:62%;--w:41%"><div class="k">Correlated, so the cells shear</div><div class="d">Autonomous systems cluster at particular levels of war. When two dimensions are correlated the cutting planes stop being perpendicular: some combinations are crowded, others barely exist, and a flat list of categories shows neither.</div></div></div><div class="ob-step w3" data-frag="1"><div class="ob-note" style="--x:43.2%;--y:62%;--w:41%"><div class="k">Curved, because the real boundary bends</div><div class="d">Where does cyber stop and information begin? That cut is a surface, not a plane, and cases near it are graded rather than assigned. A taxonomy that pretends otherwise produces its most confident labels exactly where they are least safe.</div></div></div><div class="ob-step w4" data-frag="1"><div class="ob-note" style="--x:57.5%;--y:62%;--w:41%"><div class="k">Ragged, with a hole in it</div><div class="d">The solid is not convex, it has a void running through it, and one whole region has nothing inside. An empty cell is a finding: either nobody has studied that combination, or it cannot exist &ndash; and which of the two it is, is a research question in its own right.</div></div></div><div class="ob-step w5" data-frag="1"><div class="ob-scrim"></div><div class="ob-note wide" style="--x:8%;--y:64%;--w:84%"><div class="k">Start from the cube anyway</div><div class="d">Three clean, perpendicular, equal axes are how you get anything at all, and a model will hand you a set in about a minute. The murderboard later this morning is where you find out which of your cuts are uneven, which are correlated, which bend, and which enclose nothing &ndash; and that is the step that turns a tidy diagram into an instrument you can actually measure with.</div></div></div></div></section><section class="slide obuild ontb" data-t="What are ontologies and taxonomies?" data-n="The tiger example does the work. Do not over-explain it." data-sid="4b7fb0"><h2>What are ontologies and taxonomies?</h2><p class="sub">Both organize knowledge. One says what a thing <em>is</em>; the other says what it <em>does</em>.</p><div class="ob-pic"><svg class="on-base" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A taxonomy drawn as a tree of is-a links beside an ontology drawn as a graph of typed relations."><style>.on-h{font:700 16px "Titillium Web",system-ui,sans-serif;fill:#dbad50;letter-spacing:.09em}.on-l{font:600 15px "Titillium Web",system-ui,sans-serif;fill:#f3f6fb}.on-lg{font:700 15.5px "Titillium Web",system-ui,sans-serif;fill:#dbad50}.on-e{font:400 12.5px "Titillium Web",system-ui,sans-serif;fill:#9db8d6;font-style:italic}.on-c{font:600 12.5px "Titillium Web",system-ui,sans-serif;fill:#9db8d6;letter-spacing:.08em}.on-t{font:400 14.5px "Titillium Web",system-ui,sans-serif;fill:#f3f6fb}.on-nd{fill:#132f59;stroke:#3a5c8c;stroke-width:1.3}.on-ng{fill:#1d3f70;stroke:#dbad50;stroke-width:1.8}.on-bk{fill:#2b5187}.on-sh{fill:none;stroke:#3d5f8c;stroke-width:1.5}.on-ln{fill:none;stroke:#5f83ad;stroke-width:1.5}.on-ar{fill:none;stroke:#dbad50;stroke-width:1.7}.on-dt{fill:#dbad50}</style><rect width="1000" height="400" fill="#0a1830"/><line x1="500" y1="16" x2="500" y2="292" stroke="rgba(255,255,255,.11)" stroke-width="1"/><line x1="26" y1="176" x2="974" y2="176" stroke="rgba(255,255,255,.06)" stroke-width="1"/></svg><div class="ob-step" data-frag="1"><svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><text x="30" y="26" class="on-h">TAXONOMY &middot; A TREE OF ONE LINK</text><path d="M78 64 V87 H104" class="on-ln"/><path d="M152 100 V123 H178" class="on-ln"/><path d="M226 136 V159 H252" class="on-ln"/><text x="72" y="86" class="on-e" text-anchor="end">is-a</text><text x="146" y="122" class="on-e" text-anchor="end">is-a</text><text x="220" y="158" class="on-e" text-anchor="end">is-a</text><rect x="30" y="38" width="104" height="26" rx="5" class="on-nd"/><text x="82" y="56" class="on-l" text-anchor="middle">Animal</text><rect x="104" y="74" width="104" height="26" rx="5" class="on-nd"/><text x="156" y="92" class="on-l" text-anchor="middle">Mammal</text><rect x="178" y="110" width="104" height="26" rx="5" class="on-nd"/><text x="230" y="128" class="on-l" text-anchor="middle">Carnivore</text><rect x="252" y="146" width="104" height="26" rx="5" class="on-ng"/><text x="304" y="164" class="on-lg" text-anchor="middle">Tiger</text><text x="372" y="163" class="on-e">one parent, one path</text></svg><div class="ob-note" style="--x:3%;--y:76%;--w:94%"><div class="k">A taxonomy classifies</div><div class="d">It sorts concepts into a hierarchy and asserts one kind of link: <b>is-a</b>. A tiger is a carnivore, a carnivore is a mammal, a mammal is an animal. Everything else you know about a tiger has nowhere to live in this structure.</div></div></div><div class="ob-step" data-frag="1"><svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><text x="30" y="194" class="on-h">ONE BOOK, ONE SHELF</text><text x="30" y="210" class="on-c">PHYSICS</text><rect x="30" y="218" width="110" height="58" rx="3" class="on-sh"/><rect x="41" y="228" width="16" height="38" rx="2" class="on-bk"/><rect x="63" y="228" width="16" height="38" rx="2" class="on-bk"/><rect x="85" y="228" width="16" height="38" rx="2" class="on-bk"/><rect x="107" y="228" width="16" height="38" rx="2" class="on-bk"/><text x="152" y="210" class="on-c">BIOLOGY</text><rect x="152" y="218" width="110" height="58" rx="3" class="on-sh"/><rect x="163" y="228" width="16" height="38" rx="2" class="on-bk"/><rect x="185" y="228" width="16" height="38" rx="2" class="on-bk"/><rect x="207" y="228" width="16" height="38" rx="2" class="on-bk"/><rect x="229" y="228" width="16" height="38" rx="2" class="on-bk"/><text x="274" y="210" class="on-c">HISTORY</text><rect x="274" y="218" width="110" height="58" rx="3" class="on-sh"/><rect x="285" y="228" width="16" height="38" rx="2" class="on-bk"/><rect x="307" y="228" width="16" height="38" rx="2" class="on-bk"/><rect x="329" y="228" width="16" height="38" rx="2" class="on-bk"/><rect x="351" y="228" width="16" height="38" rx="2" class="on-bk"/><text x="398" y="240" class="on-e">found by subject,</text><text x="398" y="258" class="on-e">and only by</text><text x="398" y="276" class="on-e">subject</text></svg><div class="ob-note" style="--x:3%;--y:76%;--w:94%"><div class="k">Like a library classification</div><div class="d">Every book gets exactly one shelf, and the shelf is chosen by subject. Physics sits with physics. That is an excellent way to find a book when you already know which subject you want &ndash; and no help at all otherwise.</div></div></div><div class="ob-step" data-frag="1"><svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><text x="520" y="26" class="on-h">ONTOLOGY &middot; A GRAPH OF MANY LINKS</text><line x1="700" y1="92" x2="632" y2="62" class="on-ar"/><line x1="790" y1="94" x2="874" y2="60" class="on-ar"/><line x1="790" y1="112" x2="874" y2="150" class="on-ar"/><line x1="700" y1="114" x2="632" y2="150" class="on-ar"/><text x="636" y="66" class="on-e" text-anchor="end">is-a</text><text x="800" y="70" class="on-e">preys on</text><text x="798" y="152" class="on-e">habitat is</text><text x="636" y="146" class="on-e" text-anchor="end">has</text><rect x="530" y="38" width="102" height="26" rx="5" class="on-nd"/><text x="581" y="56" class="on-l" text-anchor="middle">Mammal</text><rect x="874" y="38" width="96" height="26" rx="5" class="on-nd"/><text x="922" y="56" class="on-l" text-anchor="middle">Deer</text><rect x="874" y="150" width="96" height="26" rx="5" class="on-nd"/><text x="922" y="168" class="on-l" text-anchor="middle">Jungle</text><rect x="530" y="150" width="102" height="26" rx="5" class="on-nd"/><text x="581" y="168" class="on-l" text-anchor="middle">Stripes</text><rect x="694" y="88" width="96" height="30" rx="5" class="on-ng"/><text x="742" y="108" class="on-lg" text-anchor="middle">Tiger</text></svg><div class="ob-note" style="--x:3%;--y:76%;--w:94%"><div class="k">An ontology relates</div><div class="d">It keeps the is-a backbone and adds typed relationships between concepts: rules, attributes and connections describing how elements interact. <em>A tiger preys on deer. A tiger&rsquo;s habitat is the jungle.</em> The label on the edge is itself knowledge.</div></div></div><div class="ob-step" data-frag="1"><svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><text x="520" y="194" class="on-h">LINKED ACROSS SHELVES</text><text x="516" y="210" class="on-c">PHYSICS</text><rect x="516" y="218" width="104" height="58" rx="3" class="on-sh"/><rect x="527" y="228" width="16" height="38" rx="2" class="on-bk"/><rect x="549" y="228" width="16" height="38" rx="2" class="on-bk"/><rect x="571" y="228" width="16" height="38" rx="2" class="on-bk"/><rect x="593" y="228" width="16" height="38" rx="2" class="on-bk"/><text x="632" y="210" class="on-c">BIOLOGY</text><rect x="632" y="218" width="104" height="58" rx="3" class="on-sh"/><rect x="643" y="228" width="16" height="38" rx="2" class="on-bk"/><rect x="665" y="228" width="16" height="38" rx="2" class="on-bk"/><rect x="687" y="228" width="16" height="38" rx="2" class="on-bk"/><rect x="709" y="228" width="16" height="38" rx="2" class="on-bk"/><text x="748" y="210" class="on-c">HISTORY</text><rect x="748" y="218" width="104" height="58" rx="3" class="on-sh"/><rect x="759" y="228" width="16" height="38" rx="2" class="on-bk"/><rect x="781" y="228" width="16" height="38" rx="2" class="on-bk"/><rect x="803" y="228" width="16" height="38" rx="2" class="on-bk"/><rect x="825" y="228" width="16" height="38" rx="2" class="on-bk"/><path d="M547 276 Q604 296 660 276" class="on-ar"/><path d="M692 276 Q750 296 806 276" class="on-ar"/><path d="M530 276 Q700 306 826 276" class="on-ar"/><text x="862" y="240" class="on-e">linked by author,</text><text x="862" y="258" class="on-e">theme and</text><text x="862" y="276" class="on-e">argument</text></svg><div class="ob-note" style="--x:3%;--y:76%;--w:94%"><div class="k">Like a knowledge graph</div><div class="d">Now the books are linked not only by category but by content, themes and authors. A question can travel along those links instead of stopping at the shelf. That is the difference between finding a document and following an argument.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-scrim"></div><svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><text x="40" y="58" class="on-h">PUBTATOR3 &middot; ENTITY TYPES &rarr; TERMINOLOGIES</text><text x="520" y="58" class="on-h">PUBTATOR3 &middot; TWELVE RELATION TYPES</text><rect x="530" y="89" width="7" height="7" class="on-dt"/><text x="546" y="96" class="on-t">ASSOCIATE</text><rect x="530" y="121" width="7" height="7" class="on-dt"/><text x="546" y="128" class="on-t">CAUSE</text><rect x="530" y="153" width="7" height="7" class="on-dt"/><text x="546" y="160" class="on-t">COMPARE</text><rect x="530" y="185" width="7" height="7" class="on-dt"/><text x="546" y="192" class="on-t">COTREAT</text><rect x="530" y="217" width="7" height="7" class="on-dt"/><text x="546" y="224" class="on-t">DRUG_INTERACT</text><rect x="530" y="249" width="7" height="7" class="on-dt"/><text x="546" y="256" class="on-t">INHIBIT</text><rect x="762" y="89" width="7" height="7" class="on-dt"/><text x="778" y="96" class="on-t">INTERACT</text><rect x="762" y="121" width="7" height="7" class="on-dt"/><text x="778" y="128" class="on-t">NEGATIVE_CORRELATE</text><rect x="762" y="153" width="7" height="7" class="on-dt"/><text x="778" y="160" class="on-t">POSITIVE_CORRELATE</text><rect x="762" y="185" width="7" height="7" class="on-dt"/><text x="778" y="192" class="on-t">PREVENT</text><rect x="762" y="217" width="7" height="7" class="on-dt"/><text x="778" y="224" class="on-t">STIMULATE</text><rect x="762" y="249" width="7" height="7" class="on-dt"/><text x="778" y="256" class="on-t">TREAT</text><text x="520" y="288" class="on-e">one is-a backbone &middot; twelve ways two things can be related</text></svg><div class="on-shot" style="--x:4%;--y:18%;--w:42%"><img src="img/src2025/image50.png" alt="PubTator3 table of annotated entity types and their normalization terminologies"></div><div class="ob-note" style="--x:3%;--y:76%;--w:94%"><div class="k">Both layers, in one live system</div><div class="d">PubTator3 publishes exactly these two tables. The first maps entity types onto standard terminologies &ndash; that is the taxonomy. The second names twelve relation types with which any two entities can be connected &ndash; that is the ontology, and it is where the biology actually is.</div></div></div></div></section><section class="slide obuild mdtq" data-t="Now build one for your own topic" data-n="&lt;b&gt;HANDS-ON &middot; the taxonomy they leave with&lt;/b&gt; &middot; this is the one they DO on Day 3.&lt;ul&gt;&lt;li&gt;Give them the QR first and wait until people have it open - the prompt is long and they need it in front of them, not described.&lt;/li&gt;&lt;li&gt;&lt;b&gt;The DOMAIN block is the whole exercise.&lt;/b&gt; Three short answers. Most of the room will write the INSTANCE wrong on the first try - they will name a document rather than the thing being classified. That is the teachable moment; do not pre-empt it.&lt;/li&gt;&lt;li&gt;Insist on running it TWICE in two different models. The disagreement is the finding.&lt;/li&gt;&lt;li&gt;They bring both taxonomies to Day 4, which classifies a corpus with them.&lt;/li&gt;&lt;/ul&gt;" data-sid="mdtq01"><h2>Now build one for your own topic</h2><p class="sub">The whole prompt, three lines you write, and two models that must not see each other.</p><div class="ob-pic"><div class="ob-step" data-frag="1"><div class="mq-qrwrap"><img class="mq-qr" src="img/qr/qr_mdtdf.png" alt="QR code for the full MDTDF prompt"><div class="mq-url">the full prompt &middot; one page, one copy button</div></div><div class="ob-note" style="--x:46%;--y:18%;--w:52%"><div class="k">1 &middot; Get the prompt</div><div class="d">Scan it. You get the whole framework &ndash; every phase, every criterion, the output contract &ndash; on one page with a button that copies the lot. <b>Nothing to remember and nothing to retype.</b></div></div></div><div class="ob-step" data-frag="1"><div class="mq-dom"><div class="mq-dl">DOMAIN</div><div class="mq-dv">what is this a taxonomy OF, and where does it stop?</div><div class="mq-dl">INSTANCE</div><div class="mq-dv">the single thing you classify &ndash; an issue, an event, an argument</div><div class="mq-dl">APPLICATION</div><div class="mq-dv">the corpus you will actually run it over</div></div><div class="ob-note" style="--x:46%;--y:18%;--w:52%"><div class="k">2 &middot; Fill in three lines for YOUR topic</div><div class="d">The DOMAIN block at the end is the only part you write. <b>The hard one is INSTANCE.</b> If you name a document, a chapter or a paragraph, you will get a taxonomy of your sources’ filing system instead of your subject.</div></div></div><div class="ob-step" data-frag="1"><div class="mq-warn"><span class="mq-x">&#10007;</span> no dimensions are supplied to the model</div><div class="ob-note" style="--x:46%;--y:18%;--w:52%"><div class="k">3 &middot; Do not hand it the answer</div><div class="d">The prompt deliberately contains <b>no candidate dimensions</b>. If you suggest them, the model will agree with you and you will have learned nothing about your domain. Let it derive them.</div></div></div><div class="ob-step" data-frag="1"><div class="mq-twin"><div class="mq-m mq-m1">model A</div><div class="mq-vs">blind</div><div class="mq-m mq-m2">model B</div></div><div class="ob-note" style="--x:46%;--y:18%;--w:52%"><div class="k">4 &middot; Run it twice, blind</div><div class="d">Two models, neither seeing the other’s output. <b>Where the two taxonomies disagree is where your domain is genuinely contestable.</b> That disagreement is a finding, not a defect &ndash; and it is what you murderboard next.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-scrim soft"></div><div class="ob-note wide" style="--x:8%;--y:36%;--w:84%"><div class="k">Bring both taxonomies to tomorrow</div><div class="d">Day 4 runs a real corpus through a real taxonomy and measures how well it worked. <b>It works far better with yours than with mine.</b></div></div></div></div></section><section class="slide mbrd" data-t="The murderboard" data-n="Use this right after the generation prompt, because it answers the obvious question: the model just handed you a taxonomy that looks authoritative - now what? Build it up one step at a time. 1 the artifact, frozen and named by hash, so a verdict always describes bytes that still exist. 2 two INDEPENDENT models - the drafter cannot be one of them, and say that out loud. 3 blind first rounds, which is the only thing that makes later agreement informative. 4 the author rules, because two reviewers can converge on a mistake. 5 they reflect, and may HOLD - a held position must be re-argued against the new input and must name what would change it. 6 the loop, and say that going round more than once is normal, not failure. 7 the checker: both GO on the SAME bytes, and a conditional GO is downgraded to NO_GO. 8 both endings are valid - recorded dissent is a result, not a failure. 9 the punchline, and let it land. If you have time, the story: on the case this was written from, the board rewrote the paper&#x27;s thesis sentence." data-sid="48a61f"><h2>The murderboard</h2><p class="sub">Two models argue over frozen bytes until both sign off&#160;&ndash; or the disagreement <em>is</em> the finding.</p><figure class="viz"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-label="The murderboard cycle, revealed in nine steps: a frozen artifact, two independent models, blind first rounds, the author ruling, the reviewers reflecting, the loop between them, the machine checker, and the two valid endings - dual GO or recorded dissent."><style>.mb-hd{font:700 13.5px system-ui,sans-serif;letter-spacing:.09em}.mb-ph{font:700 16.5px system-ui,sans-serif;fill:#e8edf3}.mb-mc{font:400 13.2px system-ui,sans-serif;fill:#9fb3c8}.mb-mi{font:italic 400 13.2px system-ui,sans-serif;fill:#8fa6bd}.mb-tag{font:600 13px system-ui,sans-serif;letter-spacing:.05em}.mb-ft{font:italic 600 15.5px system-ui,sans-serif;fill:#dbad50}</style><defs><marker id="mbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7d93ad"/></marker><marker id="mbag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dbad50"/></marker></defs><rect width="980" height="400" fill="#09182f"/><g data-frag="1"><rect x="14" y="126" width="122" height="120" rx="7" fill="#142846" stroke="#dbad50" stroke-width="1.6"/><text x="75" y="158" class="mb-ph" text-anchor="middle">the artifact</text><text x="75" y="184" class="mb-mc" text-anchor="middle">frozen, by hash</text><text x="75" y="203" class="mb-mc" text-anchor="middle">immutable</text><text x="75" y="232" class="mb-tag" text-anchor="middle" fill="#dbad50">v1 &#8594; v2 &#8594; v3</text></g><g data-frag="1"><text x="267" y="30" class="mb-hd" fill="#7d93ad" text-anchor="middle">TWO INDEPENDENT MODELS</text><rect x="170" y="42" width="92" height="40" rx="6" fill="#0d2035" stroke="#27446e"/><text x="216" y="68" class="mb-tag" text-anchor="middle" fill="#e8edf3">reviewer A</text><line x1="216" y1="84" x2="216" y2="110" stroke="#27446e" stroke-width="1.4"/><rect x="274" y="42" width="92" height="40" rx="6" fill="#0d2035" stroke="#27446e"/><text x="320" y="68" class="mb-tag" text-anchor="middle" fill="#e8edf3">reviewer B</text><line x1="320" y1="84" x2="320" y2="110" stroke="#27446e" stroke-width="1.4"/></g><g data-frag="1"><line x1="140" y1="186" x2="154" y2="186" stroke="#7d93ad" stroke-width="2" marker-end="url(#mbar)"/><rect x="158" y="110" width="186" height="150" rx="7" fill="#142846" stroke="#27446e"/><text x="172" y="142" class="mb-ph">1 &#183; blind</text><text x="172" y="172" class="mb-mc">Neither reviewer reads</text><text x="172" y="191" class="mb-mc">the other first.</text><text x="172" y="224" class="mb-mi">Two independent</text><text x="172" y="243" class="mb-mi">verdicts.</text></g><g data-frag="1"><line x1="348" y1="186" x2="358" y2="186" stroke="#7d93ad" stroke-width="2" marker-end="url(#mbar)"/><rect x="362" y="110" width="186" height="150" rx="7" fill="#142846" stroke="#27446e"/><text x="376" y="142" class="mb-ph">2 &#183; YOU rule</text><text x="376" y="172" class="mb-mc">The human who wrote it</text><text x="376" y="191" class="mb-mc">adjudicates every item.</text><text x="376" y="224" class="mb-mi">Two reviewers can</text><text x="376" y="243" class="mb-mi">converge on a mistake.</text></g><g data-frag="1"><line x1="552" y1="186" x2="562" y2="186" stroke="#7d93ad" stroke-width="2" marker-end="url(#mbar)"/><rect x="566" y="110" width="186" height="150" rx="7" fill="#142846" stroke="#27446e"/><text x="580" y="142" class="mb-ph">3 &#183; reflect</text><text x="580" y="172" class="mb-mc">Accept, modify, refuse</text><text x="580" y="191" class="mb-mc">or hold.</text><text x="580" y="224" class="mb-mi">A held position must</text><text x="580" y="243" class="mb-mi">be re-argued.</text></g><g data-frag="1"><path d="M659,260 C659,304 464,304 464,260" fill="none" stroke="#dbad50" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#mbag)"/><text x="561" y="326" class="mb-tag" text-anchor="middle" fill="#dbad50">LOOPS UNTIL IT NARROWS</text></g><g data-frag="1"><line x1="756" y1="186" x2="766" y2="186" stroke="#7d93ad" stroke-width="2" marker-end="url(#mbar)"/><rect x="770" y="110" width="186" height="150" rx="7" fill="#142846" stroke="#27446e"/><text x="784" y="142" class="mb-ph">4 &#183; the checker</text><text x="784" y="172" class="mb-mc">Both GO, on the SAME</text><text x="784" y="191" class="mb-mc">bytes.</text><text x="784" y="224" class="mb-mi">Conditional GO is</text><text x="784" y="243" class="mb-mi">downgraded to NO_GO.</text></g><g data-frag="1"><text x="861" y="30" class="mb-hd" fill="#7d93ad" text-anchor="middle">BOTH ARE VALID ENDINGS</text><rect x="762" y="42" width="94" height="40" rx="6" fill="#0d2035" stroke="#5fae86"/><text x="809" y="68" class="mb-tag" text-anchor="middle" fill="#5fae86">DUAL GO</text><line x1="809" y1="84" x2="809" y2="110" stroke="#27446e" stroke-width="1.4"/><rect x="864" y="42" width="94" height="40" rx="6" fill="#0d2035" stroke="#c9614f"/><text x="911" y="68" class="mb-tag" text-anchor="middle" fill="#c9614f">DISSENT</text><line x1="911" y1="84" x2="911" y2="110" stroke="#27446e" stroke-width="1.4"/></g><g data-frag="1"><rect x="14" y="344" width="946" height="42" rx="6" fill="#12243f" stroke="#27446e"/><text x="487" y="372" class="mb-ft" text-anchor="middle">A board that must end in agreement will produce agreement&#160;&ndash; and it will mean nothing.</text></g></svg></figure><div class="small-note" data-frag="1"><b>You</b>&#160;&ndash; the author&#160;&ndash; cannot be one of the two reviewers&#160;&ndash; that GO is a self-assessment, and no checker can tell the difference. <b>Naming the arrangement is the requirement.</b></div></section><section class="slide" data-t="Measure whether it worked" data-n="Set this up before the punchline slide." data-sid="e631a8"><h2>Now measure whether it worked</h2><p class="sub">Three checks, in increasing order of discomfort.</p><div class="grid c3"><div class="card " data-frag="1"><div class="k">Does the quoted span exist?</div><div class="d">Make the model quote the text justifying each call, then check mechanically that the quote is really there.</div></div><div class="card " data-frag="2"><div class="k">Do two models agree?</div><div class="d">One model is an opinion. Disagreement is where your scheme is ambiguous.</div></div><div class="card hot" data-frag="3"><div class="k">Do two humans agree?</div><div class="d">Cohen's kappa. This is the number your committee will ask for.</div></div></div></section><section class="slide obuild aprb" data-t="What your instrument cannot see" data-n="The RRLS blind spot, generalised. This is the idea they should still have in five years." data-sid="4e7a9c"><h2>What your instrument cannot see</h2><p class="sub">The most transferable idea of the week.</p><div class="ob-pic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1770 750" role="img" aria-label="The Red Lines corpus, drawn as a field of document marks, with the two required spans as two overlapping circles; only the lens where they overlap is admitted. Two real documents sit in the boundary-span circle alone and produced zero hits, and the closing step darkens everything outside the lens."><style>.apr-lb{font:400 24px system-ui,sans-serif;fill:#9db8d6}.apr-gd{font:700 30px system-ui,sans-serif;fill:#dbad50}.apr-sm{font:400 23px system-ui,sans-serif;fill:#9db8d6}.apr-wb{font:700 30px system-ui,sans-serif;fill:#e2915f}.apr-wn{font:400 23px system-ui,sans-serif;fill:#e2915f}.apr-hu{font:700 46px system-ui,sans-serif;fill:#e2915f}.apr-cl{font:400 26px system-ui,sans-serif;fill:#e2915f}.apr-st{font:700 32px system-ui,sans-serif;fill:#f3f6fb}.apr-ls{font:400 23px system-ui,sans-serif;fill:#dbe6f5}</style><defs><mask id="apr-lm"><rect width="1770" height="750" fill="#fff"/><path d="M810.0 80.6 A220 220 0 0 1 810.0 449.4 A220 220 0 0 1 810.0 80.6 Z" fill="#000"/><circle cx="542" cy="259" r="58" fill="#000"/><circle cx="607" cy="349" r="58" fill="#000"/><rect x="52" y="150" width="376" height="214" rx="10" fill="#000"/></mask></defs><rect width="1770" height="750" fill="#09182f"/><rect x="73" y="52" width="15" height="21" rx="2" fill="#1f3a60"/><rect x="73" y="107" width="15" height="21" rx="2" fill="#1f3a60"/><rect x="75" y="169" width="15" height="21" rx="2" fill="#1f3a60"/><rect x="65" y="214" width="15" height="21" rx="2" fill="#1f3a60"/><rect x="75" y="28
