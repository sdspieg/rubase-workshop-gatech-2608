<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open source, at the scale it actually exists &middot; INTA 4803/8803</title>
<meta name="description" content="Guest lecture for INTA 4803/8803 Open Source Intelligence, Sam Nunn School, 2 September 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,400&display=swap">
<style>
/* == StratBase house palette - identical tokens to the sibling workshop apps == */
:root{
  --bg:#09182f; --db:#132f59; --db2:#173966; --gold:#dbad50;
  --lb:#9db8d6; --wh:#f3f6fb; --line:rgba(255,255,255,.12); --r:8px;
  --title-size:4.5cqw; --title-weight:700; --font:"Titillium Web",-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--wh);overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}

/* ---------- house header ---------- */
.header{background:var(--db);border-bottom:1px solid var(--line);padding:8px 1.5rem;
 display:grid;grid-template-rows:auto auto;row-gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:100;flex-shrink:0}
.header-row1{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1rem}
.header-row2{display:flex;align-items:center;justify-content:center;gap:.5rem;padding-top:6px;
 border-top:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
.h-left,.h-right{display:flex;align-items:center;gap:1rem}
.h-right{justify-content:flex-end}

/* the shared Google Doc, on the slide where the room is asked to fill it in */
.docqr{display:flex;align-items:center;gap:1.2em;margin-top:.7em;
 background:rgba(219,173,80,.07);border:1px solid rgba(219,173,80,.4);
 border-left:3px solid var(--gold);border-radius:6px;padding:.7em .9em}
.docqr img{width:calc(9.5cqw * min(var(--sc),1.25));height:auto;flex:0 0 auto;
 background:#fff;padding:5px;border-radius:5px;image-rendering:pixelated}
.docqr .k{color:var(--gold);font-weight:700;font-size:calc(1.5cqw * min(var(--sc),1.4));margin-bottom:.15em}
.docqr .d{color:var(--wh);font-size:calc(1.32cqw * min(var(--sc),1.4));line-height:1.4}
/* The QR lived only on the site, never in the deck he actually presents from (SDS, 2026-08-31:
   'because I don't see the QR code!!!!'). Same markup, same CSS, same behaviour as index.html. */
.h-qr{background:#fff;border:1px solid rgba(219,173,80,.55);border-radius:5px;padding:2px;
 line-height:0;cursor:pointer;flex:0 0 auto}
.h-qr img{width:52px;height:52px;display:block;image-rendering:pixelated}
.h-qr:hover{border-color:var(--gold);box-shadow:0 0 0 2px rgba(219,173,80,.25)}
#qrOverlay{position:fixed;inset:0;z-index:9999;background:rgba(4,12,26,.94);
 display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#qrOverlay[hidden]{display:none}
#qrOverlay img{width:min(70vh,70vw);height:min(70vh,70vw);background:#fff;padding:14px;
 border-radius:10px;image-rendering:pixelated}
.qr-inner{text-align:center}
.qr-url{margin-top:14px;color:var(--gold);font-size:1.05rem;letter-spacing:.02em}
.qr-hint{margin-top:5px;color:var(--lb);font-size:.82rem;opacity:.8}
/* the right-hand group is hidden under 980px; the QR is the one thing in it that must survive,
   because a QR nobody can see is the same as no QR at all */
.h-logo{height:34px;width:auto;flex-shrink:0;display:inline-flex;align-items:center;border-radius:4px;
 transition:opacity .15s,transform .15s;opacity:.9}
.h-logo:hover,.h-logo:focus-visible{opacity:1;transform:translateY(-1px)}
.h-logo:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.h-logo img{height:34px;width:auto;display:block}
.h-logo.invert img{filter:brightness(0) invert(1)}
.header-title{font-size:1.06rem;font-weight:700;color:var(--wh);letter-spacing:.4px;text-align:center;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-title span{color:var(--gold)}
.header-nav{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:center}
.header-nav a,.header-nav button,.header-nav select{background:transparent;border:1px solid var(--gold);
 color:var(--gold);padding:.34rem .78rem;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:700;
 font-size:.8rem;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s}
.header-nav a:hover,.header-nav button:hover{background:var(--gold);color:var(--db)}
.header-nav button.on{background:var(--gold);color:var(--db)}
.header-nav select option{background:var(--db);color:var(--wh)}
@media (max-width:1200px){.h-logo,.h-logo img{height:28px}.header-title{font-size:.94rem}
 .header-nav a,.header-nav button,.header-nav select{font-size:.75rem;padding:.3rem .6rem}}
@media (max-width:980px){.header-row1{grid-template-columns:auto 1fr auto}
 /* the right group used to vanish whole under 980px, which took the QR with it.
    Drop the logos, keep the QR - a QR nobody can see is the same as no QR. */
 .h-right{display:flex}.h-right .h-logo{display:none}
 .header-title{white-space:normal}}

/* ---------- day timeline ---------- */
.timeline-bar{background:var(--db2);padding:9px 24px;border-bottom:1px solid var(--line);
 display:flex;align-items:center;gap:0;overflow-x:auto;flex-shrink:0}
.timeline-block{flex:1;text-align:center;padding:7px 8px;cursor:pointer;transition:background .14s;
 min-width:126px;border-radius:6px;border:0;background:transparent;font-family:inherit;color:inherit}
.timeline-block:hover{background:rgba(219,173,80,.08)}
.timeline-block.active{background:rgba(219,173,80,.14);box-shadow:inset 0 -2px 0 var(--gold)}
.timeline-time{font-size:.7rem;color:var(--gold);font-weight:600;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.timeline-label{font-size:.85rem;font-weight:700;color:var(--wh)}
.timeline-duration{font-size:.68rem;color:var(--lb);margin-top:2px}
.timeline-connector{width:18px;height:2px;background:var(--line);flex-shrink:0}

/* ---------- layout ---------- */
.main-container{display:flex;flex:1;min-height:0}
.sidebar{width:284px;flex-shrink:0;background:var(--db);border-right:1px solid var(--line);
 padding:16px 16px 26px;overflow-y:auto}
.sidebar-section{margin-bottom:18px}
.sidebar-section-title{color:var(--gold);font-size:.76rem;text-transform:uppercase;letter-spacing:1px;
 margin-bottom:9px;padding-bottom:5px;border-bottom:1px solid rgba(219,173,80,.25)}
.sidebar-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;
 margin:2px 0;border-radius:6px;cursor:pointer;transition:all .14s;border:1px solid transparent;
 background:transparent;font-family:inherit;color:inherit;width:100%;text-align:left}
.sidebar-item:hover{border-color:var(--gold);background:rgba(219,173,80,.06);transform:translateX(3px)}
.sidebar-item.active{background:rgba(219,173,80,.12);border-color:var(--gold)}
.sidebar-item-title{font-size:.83rem;font-weight:600;line-height:1.3}
.sidebar-item.active .sidebar-item-title{color:var(--gold)}
.sidebar-badge{font-size:.66rem;color:var(--lb);font-variant-numeric:tabular-nums;flex-shrink:0}
.content-area{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}

/* ---------- stage ---------- */
#stage{flex:1;min-height:0;display:none;place-items:center;padding:14px;container-type:size}
#stage.on{display:grid}
.slide{position:relative;width:min(100%,100cqh * 16/9);aspect-ratio:16/9;background:var(--bg);
 border:1px solid var(--line);border-radius:var(--r);padding:3.1% 3.6%;display:none;flex-direction:column;
 container-type:inline-size;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45);--sc:1}
.slide.on{display:flex}
.slide.img{padding:0;background:#000}
.slide.img img{width:100%;height:100%;object-fit:contain;display:block;border-radius:var(--r)}
.src{position:absolute;right:.6%;top:.6%;background:rgba(9,24,47,.72);padding:2px 6px;border-radius:3px;
 font-size:10px;color:#5d7a9d;letter-spacing:.05em}

/* ---- type scale: every size is cqw * --sc; the autofit engine grows --sc to fill ---- */
/* STANDARD title size: 4.5cqw is the ceiling every h2 uses (SDS liked it on "Sound familiar?",
   2026-08-31, and asked whether it was the standard - it is). min(--sc,1) only ever SHRINKS a
   title, on content-dense slides that would otherwise overflow; it never grows one past the
   ceiling. Do not add a per-slide h2 override to "fix" a title that looks small - that slide's
   autofit --sc is below 1 because its own content needs the room. */
h2{margin:0 0 .34em;color:var(--gold);font-weight:var(--title-weight);font-size:var(--title-size);
 line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:-.1em 0 .8em;color:var(--lb);font-size:calc(1.95cqw * min(var(--sc), 1));line-height:1.35;max-width:62ch}
.sub2{color:var(--lb);font-weight:400;font-size:.62em}
.body-lg{font-size:calc(2.75cqw * var(--sc));line-height:1.3;font-weight:500;text-wrap:balance}
/* A statement slide does not need to shout. 'calm' drops the scale a notch, and a
   highlighted figure keeps the gold without the extra weight - a bold gold number
   at full body-lg size dominated the entire slide. */
.body-lg .y{font-weight:600}
.kicker{font-size:calc(1.25cqw * min(var(--sc), 1));letter-spacing:.2em;text-transform:uppercase;color:var(--gold);
 font-weight:700;margin-bottom:.9em}
.fill{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:calc(1.6cqw * var(--sc))}
/* SDS "Eyeball. Fix" on the 186-million slide, 2026-08-31: .small-note scaled with the FULL --sc,
   so on a sparse slide (--sc 3.2) the source line rendered as large as the sentence it supports.
   A footnote must never compete with the statement above it - hence the cap. */
.small-note{margin-top:.8em;color:var(--lb);font-size:calc(1.4cqw * min(var(--sc), 1.45));line-height:1.4}
.small-note b{color:var(--wh)}
.title-slide .t{font-size:var(--title-size);font-weight:var(--title-weight);color:var(--gold);line-height:1.06;letter-spacing:-.02em}
.title-slide .s{font-size:calc(2.9cqw * min(var(--sc), 1));color:var(--wh);font-weight:600}
.title-slide .m{font-size:calc(1.5cqw * var(--sc));color:var(--lb);margin-top:.7em;line-height:1.6}
.slide.divider{background:linear-gradient(135deg,#09182f 0%,#173966 58%,#09182f 100%);border-color:var(--gold)}
.daycard{justify-content:center;gap:.28em}
.daytitle{font-size:var(--title-size);font-weight:var(--title-weight);color:var(--gold);line-height:1.06;letter-spacing:-.012em}
.daysub{font-size:calc(2.6cqw * min(var(--sc), 1));color:var(--wh);font-weight:600;max-width:30ch;line-height:1.25}
.daymins{font-size:calc(1.45cqw * min(var(--sc), 1));color:var(--lb);margin-top:.9em;letter-spacing:.12em}

/* grids: rows STRETCH so cards fill the frame (align-content:center was the bug) */
.grid{display:grid;gap:1.8%;flex:1;min-height:0;align-content:stretch;grid-auto-rows:1fr}
.c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}
.c4{grid-template-columns:repeat(4,1fr)}.c5{grid-template-columns:repeat(5,1fr)}
.r2{grid-template-rows:repeat(2,1fr)}
.top .card{justify-content:flex-start}
.card{background:var(--db);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--r);
 padding:3.4% 4%;display:flex;flex-direction:column;justify-content:center;gap:.4em;min-height:0;min-width:0;overflow:hidden}
.card .k{font-size:calc(2.45cqw * var(--sc));font-weight:700;line-height:1.16;text-wrap:balance;color:var(--wh)}
.card .d{font-size:calc(1.55cqw * var(--sc));color:var(--lb);line-height:1.4}
/* A punchline card - .hot with no .k heading - is the payoff of the build-up and
   was rendering at body size, smaller than the layer headings it concludes. */
.card.hot > .d:only-child{font-size:calc(2.05cqw * var(--sc));color:var(--wh,#e8edf3);line-height:1.35}
.card .v{font-size:calc(5.4cqw * var(--sc));font-weight:900;color:var(--gold);line-height:1.02;
 font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.num .k{color:var(--gold)}
.q .k{font-weight:400;font-style:italic;color:var(--wh)}
.q .k::before{content:"\201C"}.q .k::after{content:"\201D"}
.q{border-left-color:var(--lb)}
.tint{background:transparent;border-left-color:var(--lb)}
.hot{border-color:var(--gold);background:rgba(219,173,80,.10)}
.hot .k{color:var(--gold)}
.y,.c{color:var(--gold)}
ul.big{margin:auto 0;padding-left:1.05em;display:flex;flex-direction:column;gap:.6em}
ul.big li{font-size:calc(2.55cqw * var(--sc));line-height:1.26}
ul.big li::marker{color:var(--gold)}
ul.big li b{color:var(--gold)}
ul.big li em{color:var(--wh);font-style:normal;font-weight:700}
.split{display:grid;grid-template-columns:1fr 1fr;gap:3%;flex:1;min-height:0;align-items:stretch}
.stack{display:flex;flex-direction:column;gap:.7em;min-width:0;justify-content:center}
/* was flex:0 0 30% - a fixed band that left half the slide empty */
.arrowrow{display:flex;align-items:stretch;gap:1.2%;flex:1 1 auto;min-height:0;min-width:0;margin-bottom:2%}
.arrowrow .card{flex:1 1 0;min-width:0;height:100%;padding:2.6% 2.4%}
.arrowrow .ar{color:var(--gold);font-size:calc(2.4cqw * var(--sc));font-weight:700;opacity:.75;flex:0 0 auto;align-self:center}


/* confusion matrix */
table.cm{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.cm td{border:1px solid var(--line);padding:3.2% 2%;text-align:center;
 font-size:calc(2.6cqw * var(--sc));font-weight:800;line-height:1.05}
table.cm td.h{background:transparent;border:0;color:var(--lb);font-weight:600;
 font-size:calc(1.5cqw * var(--sc));text-align:right;padding:1.4% 2%}
table.cm td.ok{background:var(--db);color:var(--wh)}
table.cm td.dis{background:rgba(219,173,80,.16);color:var(--gold);border-color:var(--gold)}


/* paradigm-shift tables */
table.shift{border-collapse:collapse;width:100%;flex:1;min-height:0;table-layout:fixed}
table.shift th{background:var(--db2);color:var(--gold);font-size:calc(1.35cqw * var(--sc));
 text-transform:uppercase;letter-spacing:.06em;padding:.7% .8%;text-align:left;
 border-bottom:1px solid var(--gold);font-weight:700}
table.shift td{border-bottom:1px solid var(--line);padding:.75% .8%;vertical-align:top;
 color:var(--lb);font-size:calc(1.35cqw * var(--sc));line-height:1.28}
table.shift td.d{color:var(--wh);font-weight:700}
table.shift td.k{color:var(--wh)}
table.shift tr:nth-child(even) td{background:rgba(255,255,255,.025)}
table.shift ul{margin:0;padding-left:1em;list-style:none}
table.shift ul li{position:relative;padding-left:.15em}
table.shift ul li::before{content:"\2022";color:var(--gold);position:absolute;left:-.8em}
table.shift col:first-child{width:12%}


/* ---------- build-up fragments ----------
   Fragments use OPACITY, not display, so they still occupy layout: the autofit
   engine measures the fully-built slide and must not resize mid-build. */
.slide [data-frag]{opacity:0;transform:translateY(.28em);transition:none}
/* ---- PAIRED REVEAL (SDS, 2026-08-31) ----------------------------------------
   His words: "the explanation shows while that ELEMENT shows, but then it
   disappears when the next element 'builds up'". The elements are parts of the
   PICTURE, not a column of cards - which is what I got wrong the first time.
   So: each explanation lights its OWN layer in the diagram, and only ONE
   explanation is on screen at a time. Earlier layers stay visible but dimmed, so
   the stack still accumulates while attention sits on the current one. */
.omics svg .lay{opacity:.18;transition:opacity .4s ease}
.omics .omx-expl,.omics .omx-expl.hot{
  border:1px solid rgba(219,173,80,.5);border-radius:6px;padding:.55em .7em;
  background:rgba(20,40,70,.55);opacity:0;max-height:0;overflow:hidden;
  transition:none}
.omics .omx-expl.shown{opacity:1;max-height:16em;margin-top:.5em}
/* the moment a LATER explanation is shown, this one goes away entirely */
.omics .omx-expl.shown:has(~ .omx-expl.shown){opacity:0;max-height:0;margin-top:0}
.omics .omx-expl.hot.shown{border-color:var(--gold,#dbad50);background:rgba(219,173,80,.10)}
/* The autofit inflates a sparse slide (--sc ~1.8), which blew the definition card up
   to 54px and dwarfed the diagram it is meant to introduce. Cap it: the definition is
   context, the diagram is the argument. */
.omics .card.tint .k{font-size:calc(1.95cqw * var(--sc))}
.omics .card.tint .d{font-size:calc(1.5cqw * var(--sc))}
.omics .omx-expl .k{font-size:calc(1.6cqw * var(--sc));color:var(--gold,#dbad50)}
.omics .omx-expl .d{font-size:calc(1.35cqw * var(--sc))}
/* :has() may NOT be nested inside :has() - the earlier version of these rules was
   invalid and silently dropped, so no layer ever lit. Express 'layer N is current'
   as: N is shown AND N+1 is not, with the :not(:has()) as a SIBLING of the :has(). */
.omics:has(.omx-expl[data-layer="1"].shown) svg .lay1{opacity:.5}
.omics:has(.omx-expl[data-layer="2"].shown) svg .lay2{opacity:.5}
.omics:has(.omx-expl[data-layer="3"].shown) svg .lay3{opacity:.5}
.omics:has(.omx-expl[data-layer="4"].shown) svg .lay4{opacity:.5}
.omics:has(.omx-expl[data-layer="1"].shown):not(:has(.omx-expl[data-layer="2"].shown)) svg .lay1{opacity:1}
.omics:has(.omx-expl[data-layer="2"].shown):not(:has(.omx-expl[data-layer="3"].shown)) svg .lay2{opacity:1}
.omics:has(.omx-expl[data-layer="3"].shown):not(:has(.omx-expl[data-layer="4"].shown)) svg .lay3{opacity:1}
.omics:has(.omx-expl[data-layer="4"].shown) svg .lay4{opacity:1}
/* ---- comment #49 "ATROCIOUS font" on the day divider, and #54 the oversized hero number ----
   .daytitle was capped at min(--sc,1) so it rendered at 4.5cqw on a slide whose autofit had
   already run to 3.2 - a day divider smaller than the body text of the slide before it. And
   .body-lg took --sc uncapped, which is how "200 million" got to ~6.2cqw. Both are now scaled
   deliberately rather than by whatever the fitter happened to land on. */
.slide.divider .daycard{justify-content:center;gap:.15em}
.slide.divider .kicker{font-size:1.85cqw;letter-spacing:.24em}
.slide.divider .daytitle{font-size:9.6cqw;line-height:1.0;margin:.06em 0 .1em}
.slide.divider .daysub{font-size:3.0cqw;line-height:1.24;max-width:26ch}
.slide.divider .daymins{font-size:1.7cqw;letter-spacing:.16em;margin-top:.5em}
.body-lg{font-size:calc(2.75cqw * min(var(--sc), 1.7))}
/* ---- OMICS: the ORIGINAL picture, built component by component (SDS 2026-08-31) ----
   His instruction: do NOT redraw the diagram as boxes and build THOSE. Parse the real
   components out of the original PowerPoint render and reveal those, each one paired
   with its own explanation, and only ONE explanation on screen at a time, placed where
   the already-revealed art is not. img/omics/*.png are those components: alpha layers
   cut by connected-component analysis over a polynomial-fitted background plate.
   Stacking all eight reproduces the original render to a mean 0.63/255 per pixel. */
.obuild .ob-pic{position:relative;width:100%;aspect-ratio:1770/750;margin:0 auto;
  max-height:66cqh;border-radius:4px;overflow:hidden;background:#0a1830}
.obuild .ob-pic img{position:absolute;inset:0;width:100%;height:100%;display:block}
.obuild .ob-step{position:absolute;inset:0;transform:none}
.obuild .ob-note{position:absolute;left:var(--x);top:var(--y);width:var(--w);
  background:rgba(10,24,47,.94);border:1px solid rgba(219,173,80,.55);
  border-left:3px solid var(--gold);border-radius:5px;padding:.72em .9em;
  box-shadow:0 8px 26px rgba(0,0,0,.55);transition:opacity .2s ease}
.obuild .ob-note .k{color:var(--gold);font-weight:700;font-size:1.72cqw;line-height:1.18;margin-bottom:.2em}
.obuild .ob-note .d{color:var(--wh);font-size:1.46cqw;line-height:1.42}
.obuild .ob-note.wide .d{font-size:1.62cqw}
/* only the CURRENT step keeps its box; every earlier one gives it up */
.obuild .ob-step:has(~ .ob-step.shown) .ob-note{opacity:0;visibility:hidden;transition:none}
/* the closing card dims the finished picture rather than covering any one part of it */
.obuild .ob-scrim{position:absolute;inset:0;background:rgba(6,16,34,.74)}
.obuild .ob-scrim.soft{background:rgba(6,16,34,.34)}
.obuild .ob-dates{position:absolute;left:0;right:0;bottom:.5em;text-align:center;
  color:var(--lb);font-size:1.18cqw}
/* ---- LUNG CANCER vs WAR: the phenotype/mechanism slide (SDS asked 2026-08-31) ----
   Same build grammar as the 'omics slide: one click adds one part of the PICTURE and
   the box that explains it, and the previous box goes away. The picture is drawn, not
   photographed, so it leaves its own note band along the bottom - which means the box
   never has to sit on top of anything. */
.lungb .ob-pic svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.lungb svg .lg{opacity:0;transition:none}
.lungb:has(.ob-step.l1.shown) svg .lg1{opacity:1}
.lungb:has(.ob-step.l2.shown) svg .lg2{opacity:1}

/* ---- uptb (763eb4) "Patchy scientific uptake" -------------------------------------
   Was two stacks of six prose cards plus a small-note, zero art. Now it is a
   scoreboard: one row per field, and in each row three slots for the classification
   standards that field actually has. A solid gold slot is a named, maintained
   standard; a dashed slot is a term the field uses constantly with nothing behind it.
   The counts are not invented - each chip is a standard or a term the slide's own
   prose names, so the shape (3, 3, 3 filled against 0, 0, 0) is the argument made
   visible rather than asserted.
   Each step's art is an <svg> overlay inside its own .ob-step, so the deck's base
   [data-frag] rule is the only hidden state. All SVG classes prefixed .up-. */
.uptb .ob-pic{aspect-ratio:5/2;max-height:64cqh}

/* ---- 7784cd - WHERE THE MODEL STANDS, as a dumbbell on the shared kappa ruler ----

   thing that makes the slide land - how far apart they are, and that one of them is on the
   wrong side of zero - had to be worked out from the type. Same ruler geometry as a3043f
   (x = 150 + 1500k on a 1770-wide viewBox) with a shaded stub left of zero for the
   negative value. Classes prefixed ws- : an inline SVG <style> is NOT scoped to its
   subtree. Hidden states carry transition:none, never a fade. */

.wsb svg .ws-lg{opacity:0;transition:none}

   documents in that collage are now ten separate files (cut from the flat render at their

/* ---- 7cf1ca "LLMs: pros and cons" (campaign B, 2026-08-31) ----------------------
   WAS: two columns of seven text cards, 799 characters, no picture at all. The slide already
   called itself a ledger, so the ledger is now literal: a two-pan balance whose beam actually
   tips as each card lands. Weight is NOT a measurement and is not presented as one - a block is
   drawn heavy exactly when the deck already marked that card `hot`, i.e. when it is one of the
   three that decide whether a result survives review, which is what the speaker note says. The
   beam angle is 1.2 degrees per unit of net weight, clamped at 8 degrees so the pans stay inside
   the frame; the pans translate by 540*sin(theta) so each hanger stays on its end of the beam.
   Every class is prefixed bl- because an inline SVG <style> is not scoped to its subtree. */
.llmbal .ob-pic{aspect-ratio:1770/750;max-height:none;background:transparent}
.llmbal .ob-pic svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.llmbal svg .bl-b{opacity:0;transition:none}
.llmbal:has(.ob-step.c1.shown) svg .bl-iL1{opacity:1}
.llmbal:has(.ob-step.c2.shown) svg .bl-iL2{opacity:1}
.llmbal:has(.ob-step.c3.shown) svg .bl-iL3{opacity:1}
.llmbal:has(.ob-step.c4.shown) svg .bl-iL4{opacity:1}
.llmbal:has(.ob-step.c5.shown) svg .bl-iR1{opacity:1}
.llmbal:has(.ob-step.c6.shown) svg .bl-iR2{opacity:1}
.llmbal:has(.ob-step.c7.shown) svg .bl-iR3{opacity:1}
body.measuring .llmbal svg .bl-b,body.nobuild .llmbal svg .bl-b{opacity:1;transition:none}
/* the tip. transform-box/origin put the rotation on the pivot in viewBox coordinates. */
.llmbal svg .bl-beam{transform-box:view-box;transform-origin:885px 105px;transition:transform .45s ease}
.llmbal svg .bl-panL,.llmbal svg .bl-panR{transform-box:view-box;transition:transform .45s ease}
.llmbal:has(.ob-step.c1.shown) svg .bl-beam{transform:rotate(-3.60deg)}
.llmbal:has(.ob-step.c1.shown) svg .bl-panL{transform:translateY(33.9px)}
.llmbal:has(.ob-step.c1.shown) svg .bl-panR{transform:translateY(-33.9px)}
.llmbal:has(.ob-step.c2.shown) svg .bl-beam{transform:rotate(-4.80deg)}
.llmbal:has(.ob-step.c2.shown) svg .bl-panL{transform:translateY(45.2px)}
.llmbal:has(.ob-step.c2.shown) svg .bl-panR{transform:translateY(-45.2px)}
.llmbal:has(.ob-step.c3.shown) svg .bl-beam{transform:rotate(-6.00deg)}
.llmbal:has(.ob-step.c3.shown) svg .bl-panL{transform:translateY(56.4px)}
.llmbal:has(.ob-step.c3.shown) svg .bl-panR{transform:translateY(-56.4px)}
.llmbal:has(.ob-step.c4.shown) svg .bl-beam{transform:rotate(-7.20deg)}
.llmbal:has(.ob-step.c4.shown) svg .bl-panL{transform:translateY(67.7px)}
.llmbal:has(.ob-step.c4.shown) svg .bl-panR{transform:translateY(-67.7px)}
.llmbal:has(.ob-step.c5.shown) svg .bl-beam{transform:rotate(-3.60deg)}
.llmbal:has(.ob-step.c5.shown) svg .bl-panL{transform:translateY(33.9px)}
.llmbal:has(.ob-step.c5.shown) svg .bl-panR{transform:translateY(-33.9px)}
.llmbal:has(.ob-step.c6.shown) svg .bl-beam{transform:rotate(-2.40deg)}
.llmbal:has(.ob-step.c6.shown) svg .bl-panL{transform:translateY(22.6px)}
.llmbal:has(.ob-step.c6.shown) svg .bl-panR{transform:translateY(-22.6px)}
.llmbal:has(.ob-step.c7.shown) svg .bl-beam{transform:rotate(1.20deg)}

/* ---- 7e21dc "True political science: dead last" -- REBUILT 2026-08-31 ----
   Was: <section class='slide img"> holding one flat PowerPoint raster,
   img/d3_deadlast.jpg - chart title, legend box, yellow callout and all six
   series baked into the pixels, with no HTML text of its own.
   Now: the chart is DRAWN in seven stacked transparent SVGs, one series per click,
   with direct labelling at the right instead of a legend box that hid one of its
   own data points (the 2023 Life-sciences marker sits under the callout in the
   original; its value was recovered by fitting the visible segments either side).
   Series values were MEASURED off the original render, not guessed: markers were
   located by colour match against the legend swatches, and read against the
   y-axis label centres (0.00 % at y=622 px, 10 % per 60.64 px).
   His legend parentheticals (0.66, 0.21, 0.16, 0.10, 0.06, 0.040) are exactly the
   2024 endpoints of the plotted curves divided by 100, so the axis here is drawn
   at the legend's scale, which makes the figure internally consistent.
   Nothing in img/src2025/ matches this figure - the campaign index confirms all of
   Day 3 is route 2 or route 3. This is route 3 (drawn).
   No .ob-plate, no .ob-reveal, NO new opacity rule: the deck's own
   .slide [data-frag]{opacity:0;transition:none} does the hiding, so nothing fades
   back to hidden after autofit's measuring pass. */

/* 🟥 EVERY .ob-step IS A FULL-SIZE TRANSPARENT LAYER, AND IT WAS SWALLOWING THE WHOLE SLIDE.

   reached by the pointer at all - document.elementFromPoint returned the topmost .ob-step
   instead. That is what made the deck uncommentable: SDS could not click a png on the query
   slide, or a component on any SVG slide, because a transparent overlay from a LATER build

   chunk_ids}. Rebuilt as the breadcrumb path, the JSON itself set in the deck's own mono
   face (the house technique already used for the Boolean-query slide: "the string itself
   is TYPE ... never a raster"), and the chunk_ids drawn as evidence chips rather than a
   raw array. No custom hidden-state CSS: relies only on the deck's generic .obuild /
   [data-frag] machinery.

   width, and the code panel started at top:15% -- too soon, so its own last chip printed

/* 3a0713 - The MDTDF prompt, componentized: comment "I want more verbose appearing/
   disappearing explanatory boxes for all of these phases" + "name the actual topic".
   The four phase panels (mdt-p1..mdt-p4, frags 2-5) each now pair with a real
   explanation box (.mdt-note), sourced verbatim from MDTDF.md's own five-step
   methodology per phase. Only ONE box on screen at a time, exactly like .ob-note
   elsewhere: the deck's established :has():not(:has()) idiom (see .omics svg .lay1-4)
   is reused here because this slide draws its build as bare <g data-frag> groups
   inside one inline SVG, not as .ob-step divs - there is no .ob-pic wrapper to hang
   the standard .obuild .ob-note rule off of. All four notes occupy the same
   below-the-phases real estate (y30%-)), which is completely empty of any revealed
   art while phases 1-4 are being explained: frags 6-11 (output levels, criteria, the
   test, the contract, the worked example, the murderboard wrapper) are all still
   [data-frag] hidden at that point, so nothing already on screen is covered. Note 4
   clears itself the moment frag 6 (mdt-lv, "WHAT IT MUST PRODUCE") arrives, exactly
   the same "next art bumps the box" rule the .ob-step pattern enforces elsewhere.
   Hidden state carries transition:none; the fade lives only on the shown rule. */
.mdtdf figure.viz{position:relative}
.mdtdf .mdt-note{position:absolute;left:var(--x);top:var(--y);width:var(--w);
  box-sizing:border-box;background:rgba(9,24,47,.95);
  border:1px solid rgba(219,173,80,.55);border-radius:8px;padding:1.3% 1.6%;
  opacity:0;visibility:hidden;transition:none;pointer-events:none}
.mdtdf .mdt-note .k{color:#dbad50;font-weight:700;font-size:1.62cqw;
  line-height:1.2;margin-bottom:.35em;letter-spacing:.01em}
.mdtdf .mdt-note .d{color:#e8edf3;font-size:1.32cqw;line-height:1.44}
.mdtdf:has(g.mdt-p1.shown):not(:has(g.mdt-p2.shown)) .mdt-note.n1{opacity:1;visibility:visible;transition:opacity .3s ease}
.mdtdf:has(g.mdt-p2.shown):not(:has(g.mdt-p3.shown)) .mdt-note.n2{opacity:1;visibility:visible;transition:opacity .3s ease}
.mdtdf:has(g.mdt-p3.shown):not(:has(g.mdt-p4.shown)) .mdt-note.n3{opacity:1;visibility:visible;transition:opacity .3s ease}
.mdtdf:has(g.mdt-p4.shown):not(:has(g.mdt-lv.shown)) .mdt-note.n4{opacity:1;visibility:visible;transition:opacity .3s ease}
body.measuring .mdtdf .mdt-note,body.nobuild .mdtdf .mdt-note{opacity:0;visibility:hidden;transition:none}

   StratBase/Proposals/Geomics/media/figures/_layers/ (generator:
   geomics_darkness_to_light_260708.py). The figure carries its own title, so this
   slide is full-bleed and the explanation box sits where the art is not. */
.slide.d2ls{padding:0;background:#0a192f}
.d2ls .ob-pic{position:relative;width:100%;height:100%;aspect-ratio:auto;max-height:none;background:#0a192f;border-radius:var(--r);overflow:hidden}

/* SOLO CARDS - the appearing/disappearing explanatory box SDS asked for twice.
   The layer HEADING (.k) accumulates so the structure builds visibly; the
   EXPLANATION (.d) is present only while its layer is the current one, and
   collapses the moment the next layer appears. Driven entirely by the deck's own
   .shown mechanism via :has(), so there is no extra JS and no separate state to
   drift out of sync. Hidden state carries transition:none, per the ghosting fix. */
.slide .card.solo .d{max-height:14em;opacity:1;overflow:hidden;
  transition:max-height .38s ease,opacity .24s ease,margin .38s ease}
.slide .card.solo:has(~ .card.solo.shown) .d{max-height:0;opacity:0;margin:0}
.slide [data-frag].card.solo:not(.shown) .d{transition:none}
.slide .card.solo{transition:border-color .3s ease,background .3s ease}
.slide .card.solo.shown:not(:has(~ .card.solo.shown)){
  border-color:var(--gold,#dbad50)}
.slide .card.solo:has(~ .card.solo.shown) .k{opacity:.72}
.slide [data-frag].shown{opacity:1;transform:none;transition:opacity .26s ease,transform .26s ease}

<section class="slide" data-t="Title" data-sid="sar001" data-n="&lt;b&gt;Skiles 254, 15:30&ndash;16:45.&lt;/b&gt; Meet Sarah at Habersham around 15:00.&lt;ul&gt;&lt;li&gt;They have read the red-lines paper and have rubase.org access (GT-RuBase) through 6 December.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Two hands-on stops&lt;/b&gt; &ndash; the query slide and the taxonomy prompt. Both need laptops open; say so at the start so nobody has one shut.&lt;/li&gt;&lt;li&gt;This is an OSINT course, early semester. The through-line is: open source is not a place you look, it is an instrument you build and then measure.&lt;/li&gt;&lt;li&gt;Invite them to the workshop &ndash; 11:00&ndash;13:30 daily through Friday, lunch provided.&lt;/li&gt;&lt;/ul&gt;"><h2>Open source, at the scale it actually exists</h2><p class="sub">Building an instrument for a literature you cannot read &middot; and being honest about what it misses</p><div class="sar-hero"><div class="sar-title"><div class="sar-row"><span class="sar-k">Class</span><span class="sar-v">INTA 4803 / 8803 &middot; Open Source Intelligence</span></div><div class="sar-row"><span class="sar-k">Guest</span><span class="sar-v">Stephan De Spiegeleire &middot; HCSS</span></div><div class="sar-row"><span class="sar-k">You read</span><span class="sar-v">the red-lines paper &middot; this hour is the machinery behind it</span></div><div class="sar-row"><span class="sar-k">Bring</span><span class="sar-v">a laptop, and a topic you actually care about</span></div></div><div class="sar-qr"><img src="img/qr_dashboard.png" alt=""><div class="sar-qrc">log in now &middot; <b>GT-RuBase</b><br>you will need it in ten minutes</div></div></div></section><section class="slide obuild fbb" data-t="Flashback in time" data-n="&lt;b&gt;DELIVERY&lt;/b&gt; &middot; start with your own journey &ndash; you were trained as a Soviet expert. &lt;ul&gt; &lt;li&gt;&lt;b&gt;The photo:&lt;/b&gt; RAND/UCLA Center for Soviet Studies, &lt;i&gt;1990&ndash;91&lt;/i&gt;. Roster: Asmus, Azrael, Gottemoeller, Horelick, Nurick, Rumer, the Soviet TV monitoring facility, and Hans Rogger with a very young Stephan. &lt;b&gt;Name two or three and where they ended up.&lt;/b&gt;&lt;/li&gt; &lt;li&gt;&lt;b&gt;THE ARGUMENT &ndash; say it explicitly:&lt;/b&gt; ~200 Soviet specialists in one place, with a serious library.&lt;/li&gt; &lt;li&gt;RAND/UCLA plus a couple of comparable programs was the &lt;b&gt;only real attempt to build a research INFRASTRUCTURE&lt;/b&gt; &ndash; not a project, an infrastructure &ndash; so the US could understand a peer competitor profoundly unlike itself.&lt;/li&gt; &lt;li&gt;Built with the most advanced technology of the day, which was &lt;b&gt;OVERWHELMINGLY HUMAN&lt;/b&gt;: take experts who would otherwise be scattered, co-locate them, hope for network effects.&lt;/li&gt; &lt;li&gt;It had a &lt;b&gt;teaching layer&lt;/b&gt; too &ndash; you and Adam were trained there AND worked the research, reading the huge, mostly textual Soviet record and carrying up what mattered.&lt;/li&gt; &lt;/ul&gt; &lt;b&gt;LAND ON:&lt;/b&gt; the point is not that the old way was primitive. &lt;b&gt;They did the homework with what they had.&lt;/b&gt;" data-sid="592826"><h2>Flashback in time</h2><p class="sub">RAND/UCLA Center for Soviet Studies, 1990&ndash;91.</p><div class="ob-pic"><div class="ob-step" data-frag="1"><img class="cmp" style="--x:0.6%;--y:1.5%;--w:17%" src="img/d1_flashback/roster_left.png" alt="Left column of the 1990&ndash;91 RAND/UCLA roster"><img class="cmp" style="--x:18.3%;--y:1.5%;--w:17%" src="img/d1_flashback/roster_mid.png" alt="Second column of the roster"><div class="ob-note" style="--x:40%;--y:22%;--w:57%"><div class="k">About two hundred names</div><div class="d">RAND and UCLA together fielded roughly two hundred Soviet specialists, listed here by department and by subject. You are not meant to read this page &ndash; its length is the argument. Six entries are boxed in red because the room already knows the names.</div></div></div><div class="ob-step" data-frag="1"><img class="cmp" style="--x:18.3%;--y:68%;--w:17%" src="img/d1_flashback/seminar.png" alt="Four researchers on a seminar panel"><div class="ob-note" style="--x:40%;--y:22%;--w:57%"><div class="k">A standing seminar, not a mailing list</div><div class="d">Alex Alexiev, Abraham S. Becker, Robert Nurick and Eugene Rumer on one panel. Co-location was the technology: two hundred people who argued with each other every week, rather than two hundred people who happened to share a subject.</div></div></div><div class="ob-step" data-frag="1"><img class="cmp" style="--x:36.2%;--y:1.5%;--w:17.4%" src="img/d1_flashback/brochure.png" alt="The RAND/UCLA Center for Soviet Studies brochure"><div class="ob-note" style="--x:56%;--y:12%;--w:43%"><div class="k">An infrastructure, not a project</div><div class="d">The 1990&ndash;91 program of advanced research and training in Soviet studies. RAND/UCLA, with a couple of comparable programs, was the only serious attempt to build a research <b>infrastructure</b> &ndash; not a grant and not a project &ndash; so that the United States could understand a peer competitor profoundly unlike itself.</div></div></div><div class="ob-step" data-frag="1"><img class="cmp" style="--x:55.6%;--y:1.5%;--w:21.6%" src="img/d1_flashback/tvfacility.png" alt="The Soviet TV monitoring facility"><div class="ob-note" style="--x:55.6%;--y:41%;--w:44%"><div class="k">Overwhelmingly human technology</div><div class="d">The Soviet TV monitoring facility was the most advanced equipment the center had, and all it did was put Soviet broadcast output on a screen. Everything downstream of those screens was a person watching it, reading around it and writing it up.</div></div></div><div class="ob-step" data-frag="1"><img class="cmp" style="--x:78%;--y:1.5%;--w:21.6%" src="img/d1_flashback/rogger.png" alt="Hans Rogger and a young Stephan De Spiegeleire"><div class="ob-note" style="--x:55.6%;--y:41%;--w:44%"><div class="k">A teaching layer, too</div><div class="d">Hans Rogger and a very young Stephan De Spiegeleire. Students were trained inside the research rather than beside it: they read the huge, mostly textual Soviet record themselves, and carried up what mattered.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-scrim soft"></div><div class="fb-names" style="--x:55.6%;--y:41%;--w:44%"><div class="h">The six boxed in red, as the roster printed them</div><div class="c"><b>Ron Asmus</b><span>Political Science Dept., RAND; Soviet-East European relations and East European politics</span></div><div class="c"><b>Jeremy Azrael</b><span>Political Science Dept., RAND; Soviet politics and foreign policy</span></div><div class="c"><b>Rose Gottemoeller</b><span>Political Science Dept., RAND; Soviet military policy</span></div><div class="c"><b>Arnold Horelick</b><span>Political Science Dept., RAND and UCLA; Soviet politics, foreign and military policy</span></div><div class="c"><b>Robert Nurick</b><span>Political Science Dept., RAND; Soviet foreign and military policy</span></div><div class="c"><b>Eugene Rumer</b><span>Political Science Dept., RAND; Soviet foreign and military policy</span></div></div><div class="ob-note" style="--x:1%;--y:24%;--w:34%"><div class="k">Six of the two hundred</div><div class="d">These are their entries exactly as the 1990&ndash;91 roster set them &ndash; one department and one subject each. Every one of them went on to a career at the center of US policy toward Russia, or of the argument about it.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-scrim soft"></div><div class="ob-note wide" style="--x:8%;--y:36%;--w:84%"><div class="k">Not that the old way was primitive</div><div class="d"><b>They did the homework with what they had.</b> The technology was people, a library and a weekly seminar &ndash; and it was organized, funded and staffed as an infrastructure, which is the part that has not been replaced.</div></div></div></div></section><section class="slide obuild rbb" data-t="Russia is back. We are not." data-n="&lt;b&gt;DELIVERY&lt;/b&gt; &middot; the other half, and the reason this week exists. &lt;ul&gt; &lt;li&gt;&lt;b&gt;Read the Putin quote out loud.&lt;/b&gt; Strength has several dimensions &ndash; he means the &lt;i&gt;willingness to go all the way&lt;/i&gt;.&lt;/li&gt; &lt;li&gt;&lt;b&gt;Then make the turn:&lt;/b&gt; that infrastructure collapsed with the Soviet Union. People scattered.&lt;/li&gt; &lt;li&gt;By the time Putin not only arrived but turned &lt;b&gt;decisively away from Europe and the West&lt;/b&gt;, the analytical layer was spread thin on both sides of the Atlantic.&lt;/li&gt; &lt;li&gt;&lt;b&gt;Nobody rebuilt it.&lt;/b&gt; Governments were no longer willing or able to spend; think tanks, newspapers and the market were assumed to cover it.&lt;/li&gt; &lt;/ul&gt; &lt;b&gt;LAND ON:&lt;/b&gt; &lt;b&gt;the competitor came back. The expertise did not.&lt;/b&gt;" data-sid="0cae47"><h2>Russia is back. We are not.</h2><p class="sub">The competitor came back. The expertise did not.</p><div class="ob-pic"><div class="ob-step" data-frag="1"><img class="cmp" style="--x:0.6%;--y:1%;--w:26.5%" src="img/d1_putin/putin_bear.jpg" alt="Putin riding a bear, the internet image of Russian power"><div class="ob-note" style="--x:2.5%;--y:74%;--w:95%"><div class="k">Russia came back</div><div class="d">This is the image the 2010s attached to Russian power, and it traveled because it caught a posture: strength as performance. Behind the meme, the state re-entered the field as a first-order competitor.</div></div></div><div class="ob-step" data-frag="1"><blockquote class="rb-q" style="--x:60%;--y:1%;--w:39.4%"><p>&ldquo;It&rsquo;s not just pounding your fists and making loud statements. I believe that strength has several dimensions: first, a person must be convinced of the truth in what he is doing, and secondly, he must be ready to go all the way to achieve the goals that he set.&rdquo;</p><cite>Vladimir Putin</cite></blockquote><div class="ob-note" style="--x:2.5%;--y:74%;--w:95%"><div class="k">Read it out loud</div><div class="d">Putin&rsquo;s own account of what strength is. Notice what is <em>not</em> in it: nothing about fists or loud statements, and everything about conviction and about being ready to go all the way. That is a claim about will, and it is the one the West kept discounting.</div></div></div><div class="ob-step" data-frag="1"><img class="cmp" style="--x:28.5%;--y:1%;--w:30.2%" src="img/d1_putin/conference_russia.jpg" alt="A Conference on Russia today: one auditorium, two days"><div class="ob-note" style="--x:2.5%;--y:74%;--w:95%"><div class="k">Nobody rebuilt the analytical layer</div><div class="d">A conference on Russia today: an auditorium, a program, two days. That is what replaced a center of two hundred specialists with a library and a standing seminar. Governments stopped paying for the infrastructure.</div></div></div><div class="ob-step" data-frag="1"><div class="rb-tl" style="--x:0.6%;--y:49%;--w:98.8%"><div class="rb-stop"><i></i><b>1991</b><span>The Soviet Union dissolves. The centers close, the money stops and the specialists scatter into other subjects.</span></div><div class="rb-stop"><i></i><b>1990s</b><span>Governments stop paying for standing area expertise. Think tanks, newspapers and the market are assumed to cover it.</span></div><div class="rb-stop"><i></i><b>2007</b><span>Munich. Putin says out loud that Russia will not accept the Western order as given.</span></div><div class="rb-stop"><i></i><b>2014</b><span>Crimea. The escalation arrives at an analytical layer that is already thin on both sides of the Atlantic.</span></div><div class="rb-stop"><i></i><b>2022</b><span>The full-scale invasion. The competitor is back at full size, and nobody has rebuilt the infrastructure.</span></div></div><div class="ob-note" style="--x:2.5%;--y:74%;--w:95%"><div class="k">Thirty years of divergence</div><div class="d">The competitor rebuilt itself in public and on a schedule. The expertise did not: it dispersed in the 1990s and was never reassembled, so each escalation met a thinner analytical layer than the one before it.</div></div></div><div class="ob-step" data-frag="1"><div class="ob-scrim soft"></div><div class="ob-note wide" style="--x:2.5%;--y:74%;--w:95%"><div class="k">The turn this week answers</div><div class="d"><b>The competitor came back. The expertise did not.</b> The rest of the week is about doing the homework anyway &ndash; with fewer people, less time, and instruments the 1990 center never had.</div></div></div></div></section><section class="slide obuild prod4" data-t="What this has produced" data-n="Evidence for a claim already made, not a portfolio." data-sid="d385e0"><h2>What this has actually produced</h2><p class="sub">Four projects, one method &ndash; the one you will use on your own question. On a single axis, so the sizes are comparable rather than impressive.</p><div class="ob-pic"><div class="ob-step pd-a" data-frag="1"><svg class="rc-lay pd-s1" viewBox="0 0 1770 750" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-hidden="true"><style>.pd-ax{stroke:#9db8d6;stroke-width:3}.pd-tk{stroke:#9db8d6;stroke-width:2}.pd-tl{font:400 24px system-ui,-apple-system,sans-serif;fill:#9db8d6}.pd-cap{font:400 22px system-ui,-apple-system,sans-serif;fill:#6f8bad}.pd-mk{font:600 26px system-ui,-apple-system,sans-serif;fill:#9db8d6}.pd-mg{font:700 28px system-ui,-apple-system,sans-serif;fill:#dbad50}.pd-stem{stroke:#dbad50;stroke-width:3}.pd-rib{fill:rgba(157,184,214,.18);stroke:#9db8d6;stroke-width:2}.pd-shot{font:400 22px system-ui,-apple-system,sans-serif;fill:#6f8bad}</style><line class="pd-ax" x1="130" y1="640" x2="960" y2="640"/><line class="pd-tk" x1="130" y1="640" x2="130" y2="658"/><text class="pd-tl" x="130" y="686" text-anchor="middle">1,000</text><line class="pd-tk" x1="381.4" y1="640" x2="381.4" y2="658"/><text class="pd-tl" x="381.4" y="686" text-anchor="middle">10,000</text><line class="pd-tk" x1="632.8" y1="640" x2="632.8" y2="658"/><text class="pd-tl" x="632.8" y="686" text-anchor="middle">100,000</text><line class="pd-tk" x1="884.2" y1="640" x2="884.2" y2="658"/><text class="pd-tl" x="884.2" y="686" text-anchor="middle">1,000,000</text><text class="pd-cap" x="545" y="722" text-anchor="middle">one shared logarithmic axis &middot; items held by the project</text><line class="pd-stem" x1="230" y1="640" x2="230" y2="556"/><circle cx="230" cy="556" r="10" fill="#dbad50"/><text class="pd-mg" x="246" y="542" text-anchor="start">2,500+ official documents</text><line class="pd-stem" x1="130" y1="640" x2="130" y2="604"/><circle cx="130" cy="604" r="10" fill="#dbad50"/><text class="pd-mk" x="146" y="590" text-anchor="start"></text><line class="pd-tk" x1="142" y1="604" x2="238" y2="590"/><text class="pd-mk" x="246" y="598">1,000+ philosopher books</text></svg><div class="ob-note" style="--x:58%;--y:16%;--w:40%"><div class="k">WACKO</div><div class="d">Official Russian documents set against the semantic echoes of more than a thousand Russian philosopher books. The question is not what a doctrine says, it is which older argument it is repeating.</div></div></div><div class="ob-step pd-b" data-frag="1"><svg class="rc-lay pd-s2" viewBox="0 0 1770 750" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-hidden="true"><rect class="pd-rib" x="130" y="348" width="570" height="38" rx="4"/><line class="pd-tk" x1="130" y1="342" x2="130" y2="392"/><line class="pd-tk" x1="700" y1="342" x2="700" y2="392"/><text class="pd-tl" x="130" y="334" text-anchor="start">1958</text><text class="pd-tl" x="700" y="334" text-anchor="end">2020</text><text class="pd-cap" x="120" y="375" text-anchor="end">time</text><text class="pd-cap" x="415" y="374" text-anchor="middle">63 years of declared thresholds, coded</text></svg><div class="ob-note" style="--x:58%;--y:16%;--w:40%"><div class="k">Red Lines</div><div class="d">Sixty-three years of declared Soviet and Russian thresholds, coded and placed against Western moves. The finding is a null one and is reported as such: they do <b>not &ndash; yet &ndash;</b> track Western provocations, or the reverse.</div></div></div><div class="ob-step pd-c" data-frag="1"><svg class="rc-lay pd-s3" viewBox="0 0 1770 750" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-hidden="true"><line class="pd-stem" x1="166.7" y1="640" x2="166.7" y2="484"/><circle cx="166.7" cy="484" r="10" fill="#dbad50"/><text class="pd-mk" x="182.7" y="470" text-anchor="start">1,400 taxa, in 13 dimensions</text><rect x="185" y="494" width="16" height="16" rx="2" fill="#dbad50" opacity=".85"/><rect x="215" y="494" width="16" height="16" rx="2" fill="#dbad50" opacity=".85"/><rect x="245" y="494" width="16" height="16" rx="2" fill="#dbad50" opacity=".85"/><rect x="275" y="494" width="16" height="16" rx="2" fill="#dbad50" opacity=".85"/><rect x="305" y="494" width="16" height="16" rx="2" fill="#dbad50" opacity=".85"/><rect x="335" y="494" width="16" height="16" rx="2" fill="#dbad50" opacity=".85"/><rect x="365" y="494" width="16" height="16" rx="2" fill="#dbad50" opacity=".85"/><rect x="395" y="494" width="16" height="16" rx="2" fill="#dbad50" opacity=".85"/><rect x="425" y="494" width="16" height="16" rx="2" fill="#dbad50" opacity=".85"/><rect x="455" y="494" width="16" height="16" rx="2" fill="#dbad50" opacity=".85"/><rect x="485" y="494" width="16" height="16" rx="2" fill="#dbad50" opacity=".85"/><rect x="515" y="494" width="16" height="16" rx="2" fill="#dbad50" opacity=".85"/><rect x="545" y="494" width="16" height="16" rx="2" fill="#dbad50" opacity=".85"/></svg><div class="ob-note" style="--x:58%;--y:16%;--w:40%"><div class="k">Gray Horizon</div><div class="d">A taxonomy of below-threshold conflict: 1,400 taxa across thirteen dimensions that vary independently of one another. On the shared axis it sits beside WACKO, nearly three orders of magnitude below what comes next.</div></div></div><div class="ob-step pd-d" data-frag="1"><svg class="rc-lay pd-s4" viewBox="0 0 1770 750" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-hidden="true"><line class="pd-stem" x1="884.2" y1="640" x2="884.2" y2="448"/><circle cx="884.2" cy="448" r="10" fill="#dbad50"/><text class="pd-mg" x="868.2" y="434" text-anchor="end">1M+ annotated chunks</text></svg><div class="ob-note" style="--x:58%;--y:16%;--w:40%"><div class="k">Regeneration</div><div class="d">More than a million taxonomically annotated text chunks in one corpus. The same pipeline as the other three, run at a scale where you can no longer check it by reading &ndash; which is why Thursday is spent on reliability.</div></div></div><div class="ob-step pd-e" data-frag="1"><img class="rc-shot" style="--x:67.5%;--y:2%;--w:20%" src="img/src2025/image4.png" alt="Sunburst of an annotated corpus: every arc is one taxon, carrying its own count and share."><img class="rc-shot" style="--x:59.5%;--y:50%;--w:35%" src="img/b3/corpus_timeline.png" alt="Monthly document counts for one taxon of that same corpus, 2017 to 2024."><svg class="rc-lay pd-s5" viewBox="0 0 1770 750" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-hidden="true"><text class="pd-shot" x="1363" y="737" text-anchor="middle">both panels &middot; our own dashboards, on the military-affairs corpus</text></svg><div class="ob-note" style="--x:3%;--y:5%;--w:52%"><div class="k">What all four end in</div><div class="d">The same object every time: a corpus you can read through its own taxonomy, one arc per taxon carrying its own count, and any single taxon reopened as a time series. Both panels are our own dashboards, on the military-affairs corpus &ndash; the shape is what the method produces, whatever the subject.</div></div></div></div></section><section class="slide obuild rec1f" data-t="The scholarly record on your topic" data-n="Make them guess out loud BEFORE the number appears. The gap between guess and number is the lesson. Ask the room to guess the size of their own field first, out loud, before the opening question moves on; the gap between the guess and the axis is the whole lesson." data-sid="1f47ad"><h2>The scholarly record on your topic</h2><p class="sub">How many publications do you think already exist on your own research topic?</p><div class="ob-pic"><div class="ob-step" data-frag="1"><div class="rc-ask"><div class="rc-qmark">?</div></div><div class="ob-note" style="--x:4%;--y:32%;--w:40%"><div class="k">Pick a number</div><div class="d">Before anything else appears: how many publications do you think already exist on your own topic, in the databases you already know? Hold that number.</div></div></div><div class="ob-step rc-a" data-frag="1"><svg class="rc-lay rc-s1" viewBox="0 0 1770 750" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-hidden="true"><style>.rc-ax{stroke:#9db8d6;stroke-width:3}.rc-tk{stroke:#9db8d6;stroke-width:2}.rc-tl{font:400 26px system-ui,-apple-system,sans-serif;fill:#9db8d6}.rc-cap{font:400 24px system-ui,-apple-system,sans-serif;fill:#6f8bad}.rc-bl{font:700 28px system-ui,-apple-system,sans-serif;fill:#dbad50}.rc-bs{font:400 26px system-ui,-apple-system,sans-serif;fill:#9db8d6}.rc-mk{font:600 26px system-ui,-apple-system,sans-serif;fill:#f3f6fb}.rc-ring{fill:none;stroke:#dbad50;stroke-width:3}.rc-thr{stroke:#dbad50;stroke-width:3;opacity:.55;fill:none}</style><line class="rc-ax" x1="140" y1="596" x2="1690" y2="596"/><line class="rc-tk" x1="140" y1="596" x2="140" y2="616"/><text class="rc-tl" x="140" y="648" text-anchor="middle">100</text><line class="rc-tk" x1="595.9" y1="596" x2="595.9" y2="616"/><text class="rc-tl" x="595.9" y="648" text-anchor="middle">1,000</text><line class="rc-tk" x1="1051.8" y1="596" x2="1051.8" y2="616"/><text class="rc-tl" x="1051.8" y="648" text-anchor="middle">10,000</text><line class="rc-tk" x1="1507.6" y1="596" x2="1507.6" y2="616"/><text class="rc-tl" x="1507.6" y="648" text-anchor="middle">100,000</text><text class="rc-cap" x="915" y="700" text-anchor="middle">publications on one topic &middot; logarithmic scale</text><rect x="277.2" y="566" width="297.8" height="26" rx="3" fill="#9db8d6" opacity=".5"/><text class="rc-bs" x="426.1" y="552" text-anchor="middle">a few hundred</text></svg><div class="ob-note" style="--x:4%;--y:30%;--w:36%"><div class="k">What people guess</div><div class="d">Web of Science and Scopus, searched the way most of us were trained to search them, hand back a few hundred publications on a topic. That number feels like the field, so it becomes the answer.</div></div></div><div class="ob-step rc-b" data-frag="1"><img class="rc-shot" style="--x:44%;--y:3%;--w:54%" src="img/b3/fields_cloud.png" alt="Top fields of study in one working corpus: political science 9,154, law 4,740, foreign policy 3,222, politics 3,640, economics 3,367."><div class="ob-note" style="--x:4%;--y:6%;--w:36%"><div class="k">One topic, broken out by field</div><div class="d">This is the field-of-study breakdown of a single working corpus, straight off the dashboard. It is not a reading list of a hundred titles &ndash; it is tens of thousands of publications spread across several dozen disciplines.</div></div></div><div class="ob-step rc-c" data-frag="1"><svg class="rc-lay rc-s3" viewBox="0 0 1770 750" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-hidden="true"><rect x="595.9" y="566" width="992" height="26" rx="3" fill="#dbad50" opacity=".85"/><text class="rc-bl" x="1091.9" y="552" text-anchor="middle">1,000 &ndash; 150,000</text><rect class="rc-ring" x="857" y="275" width="637" height="63" rx="6"/><path class="rc-thr" d="M 1175,338 L 1034.3,592"/><circle cx="1034.3" cy="594" r="9" fill="#dbad50"/><rect class="rc-ring" x="1175" y="209" width="196" height="42" rx="6"/><path class="rc-thr" d="M 1273,251 L 904,592"/><circle cx="904" cy="594" r="9" fill="#dbad50"/><rect class="rc-ring" x="1326" y="157" width="247" height="36" rx="6"/><path class="rc-thr" d="M 1449,193 L 827.5,592"/><circle cx="827.5" cy="594" r="9" fill="#dbad50"/></svg><div class="ob-note" style="--x:4%;--y:30%;--w:36%"><div class="k">1,000 to 150,000 per topic</div><div class="d">Political science alone carries <b>9,154</b> publications here, law <b>4,740</b>, foreign policy <b>3,222</b>. Laid on a logarithmic axis, the few hundred you started from is one tick, near the left-hand end.</div></div></div><div class="ob-step rc-d" data-frag="1"><svg class="rc-lay rc-s4" viewBox="0 0 1770 750" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-hidden="true"><rect x="525.3" y="560" width="1074.7" height="40" fill="#e2915f" opacity=".28"/><line x1="525.3" y1="330" x2="525.3" y2="600" stroke="#e2915f" stroke-width="5" stroke-dasharray="12 10"/><circle cx="525.3" cy="596" r="10" fill="#e2915f"/><text class="rc-mk" text-anchor="end" x="503.3" y="374">one reader, two papers a day,</text><text class="rc-mk" text-anchor="end" x="503.3" y="408">every day for a year &asymp; 700</text></svg><div class="ob-note" style="--x:4%;--y:5%;--w:36%"><div class="k">Which is the problem</div><div class="d"><b>This is an assumption, not a database query</b>&#160;&ndash; two papers a day, every working day, for a year, comes to roughly 700. That is the same order as the opening guess, and two decades of reading short of even the smallest end of the real record. Not a little beyond human capacity. Far beyond it.</div></div></div></div></section><section class="slide obuild srchb" data-t="How search is typically done today" data-n="The Hobbes line is the joke. The four questions under it are the actual indictment." data-sid="1d4b51"><h2>How search is typically done today</h2><p class="sub">Solitary, poor, nasty, brutish, and short.</p><div class="ob-pic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1770 760" role="img" aria-label="A provenance chain of five links - the query, the source set, the excerpt, the citation, the alternative readings - every one of them drawn as a dashed box with the connectors broken. Below it, what carries the weight instead: a photograph of two figures peering through a magnifier, the line trust me I know the literature, and a flock of chevrons all pointing the same way. At the bottom, the alternatives that already exist: Scopus, Web of Science, Lens, and the syllabus site colon edu trick."><style>.sr-hd{font:700 25px system-ui,sans-serif;letter-spacing:.09em}.sr-nk{font:700 27px system-ui,sans-serif;fill:#c4d3e4}.sr-nq{font:italic 400 24px system-ui,sans-serif;fill:#7d93ad}.sr-qt{font:italic 700 46px system-ui,sans-serif;fill:#dbad50}.sr-mc{font:400 25px system-ui,sans-serif;fill:#9db8d6}.sr-sm{font:400 23px system-ui,sans-serif;fill:#7d93ad}.sr-pl{font:700 28px system-ui,sans-serif;fill:#f3f6fb}.sr-mo{font:700 27px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#dbad50}</style><rect width="1770" height="760" fill="#09182f"/><g class="sr-g sr-g1"><text x="30" y="36" class="sr-hd" fill="#dbad50">WHAT A CLAIM IN A PAPER ACTUALLY RESTS ON</text><rect x="20" y="72" width="310" height="176" rx="8" fill="#101f38" stroke="#2a4166" stroke-width="2" stroke-dasharray="8 7"/><text x="42" y="122" class="sr-nk">The query</text><text x="42" y="168" class="sr-nq">which words, in</text><text x="42" y="202" class="sr-nq">which database?</text><path d="M334 160 L345 160" stroke="#33475f" stroke-width="3"/><path d="M350 148 L356 172 M359 148 L365 172" stroke="#5d7284" stroke-width="3"/><path d="M370 160 L371 160" stroke="#33475f" stroke-width="3"/><rect x="375" y="72" width="310" height="176" rx="8" fill="#101f38" stroke="#2a4166" stroke-width="2" stroke-dasharray="8 7"/><text x="397" y="122" class="sr-nk">The source set</text><text x="397" y="168" class="sr-nq">why those sources,</text><text x="397" y="202" class="sr-nq">and not others?</text><path d="M689 160 L700 160" stroke="#33475f" stroke-width="3"/><path d="M705 148 L711 172 M714 148 L720 172" stroke="#5d7284" stroke-width="3"/><path d="M725 160 L726 160" stroke="#33475f" stroke-width="3"/><rect x="730" y="72" width="310" height="176" rx="8" fill="#101f38" stroke="#2a4166" stroke-width="2" stroke-dasharray="8 7"/><text x="752" y="122" class="sr-nk">The excerpt</text><text x="752" y="168" class="sr-nq">which passage,</text><text x="752" y="202" class="sr-nq">exactly?</text><path d="M1044 160 L1055 160" stroke="#33475f" stroke-width="3"/><path d="M1060 148 L1066 172 M1069 148 L1075 172" stroke="#5d7284" stroke-width="3"/><path d="M1080 160 L1081 160" stroke="#33475f" stroke-width="3"/><rect x="1085" y="72" width="310" height="176" rx="8" fill="#101f38" stroke="#2a4166" stroke-width="2" stroke-dasharray="8 7"/><text x="1107" y="122" class="sr-nk">The citation</text><text x="1107" y="168" class="sr-nq">complete, or a page</text><text x="1107" y="202" class="sr-nq">you cannot check?</text><path d="M1399 160 L1410 160" stroke="#33475f" stroke-width="3"/><path d="M1415 148 L1421 172 M1424 148 L1430 172" stroke="#5d7284" stroke-width="3"/><path d="M1435 160 L1436 160" stroke="#33475f" stroke-width="3"/><rect x="1440" y="72" width="310" height="176" rx="8" fill="#101f38" stroke="#2a4166" stroke-width="2" stroke-dasharray="8 7"/><text x="1462" y="122" class="sr-nk">Alternative readings</text><text x="1462" y="168" class="sr-nq">who disagrees, and</text><text x="1462" y="202" class="sr-nq">on what grounds?</text><text x="1740" y="292" class="sr-sm" text-anchor="end">not written down &middot; not transparent &middot; not checkable</text></g><g class="sr-g sr-g2"><rect x="28" y="330" width="364" height="183" rx="5" fill="#0d1c33" stroke="#27446e" stroke-width="2"/><image href="img/src2025/image107.jpg" x="30" y="332" width="360" height="179"/><text x="30" y="546" class="sr-sm">presumably authoritative &middot; peer-reviewed &middot; most-cited</text><text x="430" y="410" class="sr-qt">&ldquo;Trust me, I know the literature.&rdquo;</text><text x="430" y="462" class="sr-mc">And then everyone cites what everyone else already cited.</text><path d="M1330 344 L1356 359 L1330 374" fill="none" stroke="#dbad50" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.34"/><path d="M1412 344 L1438 359 L1412 374" fill="none" stroke="#dbad50" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.39"/><path d="M1494 344 L1520 359 L1494 374" fill="none" stroke="#dbad50" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.44"/><path d="M1576 344 L1602 359 L1576 374" fill="none" stroke="#dbad50" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.49"/><path d="M1658 344 L1684 359 L1658 374" fill="none" stroke="#dbad50" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.54"/><path d="M1330 402 L1356 417 L1330 432" fill="none" stroke="#dbad50" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.46"/><path d="M1412 402 L1438 417 L1412 432" fill="none" stroke="#dbad50" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.51"/><path d="M1494 402 L1520 417 L1494 432" fill="none" stroke="#dbad50" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.56"/><path d="M1576 402 L1602 417 L1576 432" fill="none" stroke="#dbad50" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.61"/><path d="M1658 402 L1684 417 L1658 432" fill="none" stroke="#dbad50" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.66"/><path d="M1330 460 L1356 475 L1330 490" fill="none" stroke="#dbad50" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.58"/><path d="M1412 460 L1438 475 L1412 490" fill="none" stroke="#dbad50" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.63"/><path d="M1494 460 L1520 475 L1494 490" fill="none" stroke="#dbad50" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.68"/><path d="M1576 460 L1602 475 L1576 490" fill="none" stroke="#dbad50" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.73"/><path d="M1658 460 L1684 475 L1658 490" fill="none" stroke="#dbad50" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.78"/><text x="1330" y="546" class="sr-sm">herd behavior</text></g><g class="sr-g sr-g3"><text x="30" y="596" class="sr-hd" fill="#7d93ad">ALTERNATIVES THAT ALREADY EXIST</text><rect x="30" y="612" width="392" height="94" rx="7" fill="#142846" stroke="#27446e"/><text x="226" y="670" class="sr-pl" text-anchor="middle">Scopus</text><rect x="450" y="612" width="392" height="94" rx="7" fill="#142846" stroke="#27446e"/><text x="646" y="670" class="sr-pl" text-anchor="middle">Web of Science</text><rect x="870" y="612" width="392" height="94" rx="7" fill="#142846" stroke="#27446e"/><text x="1066" y="670" class="sr-pl" text-anchor="middle">Lens</text><text x="1290" y="596" class="sr-hd" fill="#dbad50">AND, CHEATING</text><rect x="1290" y="612" width="450" height="94" rx="7" fill="#12233d" stroke="#dbad50" stroke-dasharray="8 6"/><text x="1515" y="670" class="sr-mo" text-anchor="middle">syllabus site:.edu</text><text x="30" y="746" class="sr-sm">every one of these leaves a trail you can hand to a reader</text></g></svg><div class="ob-step s1" data-frag="1"><div class="ob-note" style="--x:4%;--y:46%;--w:58%"><div class="k">In 99.9% of cases it is not explicit</div><div class="d">And it is <b>not documented</b>. Every link in that chain is missing: <em>why those sources and not others? which excerpt exactly? complete citation? alternative readings?</em> A reader cannot check any of it, and neither, six months later, can you.</div></div></div><div class="ob-step s2" data-frag="1"><div class="ob-note" style="--x:4%;--y:76%;--w:90%"><div class="k">What we lean on instead</div><div class="d"><b>Presumably authoritative sources</b>&nbsp;&ndash; peer-reviewed, most-cited. <em>Trust me, I know the literature.</em> And herd behavior: the same handful of works get cited because they were cited, which measures circulation, not fit to your question.</div></div></div><div class="ob-step s3" data-frag="1"><div class="ob-scrim soft"></div><div class="ob-note wide" style="--x:6%;--y:40%;--w:80%"><div class="k">The alternatives that already exist</div><div class="d">None of this is a tooling problem. Bibliometric databases&nbsp;&ndash; <b>Scopus, Web of Science, Lens</b>&nbsp;&ndash; already return a source set you can write down, hand over, and have someone else rerun. And, cheating, so does <em>syllabus site:.edu</em>, which gets you what the people who teach the subject actually assign.</div></div></div></div></section><section class="slide obuild prb" data-t="Precision and recall" data-sid="10f148" data-n="&lt;b&gt;DELIVERY&lt;/b&gt; &middot; SDS&#x27;s two comments on this slide: &lt;i&gt;&quot;I want this to build up as in the original ppt slide&quot;&lt;/i&gt; and &lt;i&gt;&quot;I want the Russian examples back in here&quot;&lt;/i&gt;. Both are now in.&lt;ul&gt;&lt;li&gt;&lt;b&gt;Steps 1-5 are the definitions&lt;/b&gt; &ndash; the collection, the two sets, then the two formulas. Do not rush; the point is that ONE denominator is visible and the other never is.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Step 6 is the beat:&lt;/b&gt; three cells you can inspect, one you cannot. &lt;i&gt;Every AND and every NOT is a bet on that cell being empty.&lt;/i&gt;&lt;/li&gt;&lt;li&gt;&lt;b&gt;Steps 7-8 are the Russian example, restored from the 2025 deck:&lt;/b&gt; &lt;b&gt;31,000&lt;/b&gt; Integrum publications on &#1089;&#1076;&#1077;&#1088;&#1078;&#1080;&#1074;&#1072;&#1085;&#1080;&#1077;/&#1091;&#1089;&#1090;&#1088;&#1072;&#1096;&#1077;&#1085;&#1080;&#1077;/&#1079;&#1072;&#1087;&#1091;&#1075;&#1080;&#1074;&#1072;&#1085;&#1080;&#1077;, against 144, ~200 and 449.&lt;/li&gt;&lt;li&gt;&lt;b&gt;PROVENANCE:&lt;/b&gt; all four figures are reproduced from YOUR OWN 2025 GaTech slide (&lt;code&gt;gt2025_precrecall-29&lt;/code&gt;) &ndash; the covers are cropped from it unaltered. The CNA study is Fink &amp; Kofman, &lt;i&gt;Russian Strategy for Escalation Management&lt;/i&gt;, April 2020; the book is Oscar Jonsson, &lt;i&gt;The Russian Understanding of War&lt;/i&gt;.&lt;/li&gt;&lt;li&gt;&lt;b&gt;🟥 ONE THING TO CHECK:&lt;/b&gt; I could not identify the author in the middle photograph from the slide render, so the slide does NOT name him and the alt text does not either. &lt;b&gt;Name him yourself when you say &#x27;often more than 200&#x27;&lt;/b&gt;, or tell me who he is and I will label the tile.&lt;/li&gt;&lt;li&gt;&lt;b&gt;GUARD RAIL:&lt;/b&gt; this is the RUSSIAN-language recall case. Do not mix it with the CHINESE-literature case &ndash; that one has its own verified figures (70,346 Chinese records; 0.15-0.20% coverage; and the zero before 2015).&lt;/li&gt;&lt;/ul&gt;&lt;b&gt;THE MOVE:&lt;/b&gt; precision is visible so it gets optimised; recall is invisible so it goes unmeasured &ndash; and the gap is not a rounding error, it is 31,000 against 449."><h2>Precision and recall</h2><p class="sub">Two numbers. Almost everyone optimises the one they can see.</p><div class="ob-pic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1770 750" role="img" aria-label="Precision and recall, built up: the document collection, the relevant set, the retrieved set, the two formulas, the four-cell grid, and then the Russian corpus against what the best Western work cites."><style>.pr-hd{font:700 24px system-ui,sans-serif;fill:#dbad50;letter-spacing:.04em}.pr-lb{font:600 30px system-ui,sans-serif;fill:#f3f6fb}.pr-sm{font:400 24px system-ui,sans-serif;fill:#9db8d6}.pr-fm{font:italic 400 27px Georgia,serif;fill:#f3f6fb}.pr-fk{font:italic 700 29px Georgia,serif;fill:#dbad50}.pr-cell{font:600 25px system-ui,sans-serif;fill:#f3f6fb}.pr-axl{font:700 24px system-ui,sans-serif;fill:#dbad50;letter-spacing:.1em}.pr-huge{font:800 92px system-ui,sans-serif;fill:#dbad50}.pr-hug2{font:600 26px system-ui,sans-serif;fill:#9db8d6}.pr-tick{font:700 27px system-ui,sans-serif;fill:#f3f6fb}</style><rect width="1770" height="750" fill="#09182f"/><g class="lg p1"><ellipse cx="330" cy="150" rx="300" ry="128" fill="none" stroke="#9db8d6" stroke-width="2.4"/><text x="52" y="46" class="pr-sm">Entire document</text><text x="52" y="74" class="pr-sm">collection</text></g><g class="lg p2"><circle cx="272" cy="158" r="103" fill="#c9a227" fill-opacity=".55" stroke="#dbad50" stroke-width="2"/><text x="232" y="152" class="pr-lb" text-anchor="middle" font-size="24">Relevant</text><text x="232" y="180" class="pr-sm" text-anchor="middle">documents</text></g><g class="lg p3"><circle cx="404" cy="158" r="103" fill="#b4643a" fill-opacity=".55" stroke="#e2915f" stroke-width="2"/><text x="452" y="152" class="pr-lb" text-anchor="middle" font-size="24">Retrieved</text><text x="452" y="180" class="pr-sm" text-anchor="middle">documents</text></g><g class="lg p4"><text x="30" y="330" class="pr-fk">recall</text><text x="150" y="312" class="pr-fm">relevant documents retrieved</text><line x1="145" y1="322" x2="600" y2="322" stroke="#f3f6fb" stroke-width="1.6"/><text x="150" y="352" class="pr-fm">ALL relevant documents</text></g><g class="lg p5"><text x="30" y="424" class="pr-fk">precision</text><text x="196" y="406" class="pr-fm">relevant documents retrieved</text><line x1="191" y1="416" x2="646" y2="416" stroke="#f3f6fb" stroke-width="1.6"/><text x="196" y="446" class="pr-fm">ALL documents retrieved</text></g><g class="lg p6"><text x="836.0" y="48" class="pr-axl" text-anchor="middle">RETRIEVED</text><text x="1084.0" y="48" class="pr-axl" text-anchor="middle">NOT RETRIEVED</text><text x="706" y="124.0" class="pr-axl" text-anchor="end">RELEVANT</text><text x="706" y="244.0" class="pr-axl" text-anchor="end">IRRELEVANT</text><rect x="720" y="64" width="232" height="104" rx="8" fill="#1d3a22" stroke="#7fd39b" stroke-width="1.8"/><text x="836.0" y="108" class="pr-cell" text-anchor="middle">retrieved &amp; relevant</text><text x="836.0" y="140" class="pr-sm" text-anchor="middle" font-size="21">what you see</text><rect x="968" y="64" width="232" height="104" rx="8" fill="#4a2320" stroke="#f08a6a" stroke-width="1.8"/><text x="1084.0" y="108" class="pr-cell" text-anchor="middle">not retrieved</text><text x="1084.0" y="140" class="pr-sm" text-anchor="middle" font-size="21">but relevant &#8211; invisible</text><rect x="720" y="184" width="232" height="104" rx="8" fill="#42301a" stroke="#e2b85a" stroke-width="1.8"/><text x="836.0" y="228" class="pr-cell" text-anchor="middle">retrieved</text><text x="836.0" y="260" class="pr-sm" text-anchor="middle" font-size="21">but irrelevant</text><rect x="968" y="184" width="232" height="104" rx="8" fill="#16283f" stroke="#6f8bab" stroke-width="1.8"/><text x="1084.0" y="228" class="pr-cell" text-anchor="middle">not retrieved</text><text x="1084.0" y="260" class="pr-sm" text-anchor="middle" font-size="21">&amp; irrelevant</text><text x="720" y="338" class="pr-sm">Precision is measured on the left column. <tspan fill="#f08a6a" font-weight="700">Recall needs the cell you cannot see.</tspan></text></g><g class="lg p7"><text x="722" y="366" class="pr-hd">OUR RUSSIAN DETERRENCE CORPUS</text><text x="722" y="396" class="pr-hd">INTEGRUM</text><text x="722" y="482" class="pr-huge">31,000</text><text x="1022" y="472" class="pr-hug2">publications</text><text x="722" y="532" class="pr-hug2" font-size="24">&#1089;&#1076;&#1077;&#1088;&#1078;&#1080;&#1074;&#1072;&#1085;&#1080;&#1077; &#183; &#1091;&#1089;&#1090;&#1088;&#1072;&#1096;&#1077;&#1085;&#1080;&#1077; &#183; &#1079;&#1072;&#1087;&#1091;&#1075;&#1080;&#1074;&#1072;&#1085;&#1080;&#1077;</text></g><g class="lg p8"><text x="1240" y="46" class="pr-hd">WHAT THE BEST WESTERN WORK CITES</text><text x="1240" y="404" class="pr-sm" font-size="24">Each is careful, serious scholarship.</text><text x="1240" y="438" class="pr-sm" font-size="24">None of them is reading the corpus.</text></g></svg><img class="prt" src="img/pr/cna.jpg" alt="CNA, Russian Strategy for Escalation Management (Fink and Kofman, 2020) - 700 to 144" style="left:70.1%;top:8%;width:8.6%;height:30%;object-fit:contain;object-position:top"><img class="prt" src="img/pr/author.jpg" alt="A monograph author whose works often carry more than 200 references" style="left:79.6%;top:8%;width:8.6%;height:30%;object-fit:contain;object-position:top"><img class="prt" src="img/pr/jonsson.jpg" alt="Oscar Jonsson, The Russian Understanding of War - 449 references" style="left:89.0%;top:8%;width:8.6%;height:30%;object-fit:contain;object-position:top"><div class="ob-step p1" data-frag="1"><div class="ob-note" style="--x:4%;--y:76%;--w:92%"><div class="k">The frame</div><div class="d">Everything your field could have found on your question. Not what is in your library, not what is in your database &ndash; <b>everything that exists</b>. Both numbers are measured against this, which is already the uncomfortable part.</div></div></div><div class="ob-step p2" data-frag="1"><div class="ob-note" style="--x:4%;--y:76%;--w:92%"><div class="k">Relevant</div><div class="d">The documents that actually bear on your question. <b>You never see this set.</b> It is defined by the question, not by your query, and nothing in your workflow ever shows it to you.</div></div></div><div class="ob-step p3" data-frag="1"><div class="ob-note" style="--x:4%;--y:76%;--w:92%"><div class="k">Retrieved</div><div class="d">What your query returned. This is the only set you ever look at, which is why it quietly becomes your picture of the field &ndash; and why the two circles being different sizes is the whole problem.</div></div></div><div class="ob-step p4" data-frag="1"><div class="ob-note" style="--x:4%;--y:76%;--w:92%"><div class="k">Recall</div><div class="d">Of everything relevant, how much you got. The denominator is the set you cannot see, so recall <b>cannot be computed from your results</b> &ndash; only estimated, and only if you go looking. Almost nobody does.</div></div></div><div class="ob-step p5" data-frag="1"><div class="ob-note" style="--x:4%;--y:76%;--w:92%"><div class="k">Precision</div><div class="d">Of what you retrieved, how much was relevant. You <em>can</em> compute this: it is all sitting in front of you. <b>That is exactly why it is the one everyone optimises</b> &ndash; not because it matters more.</div></div></div><div class="ob-step p6" data-frag="1"><div class="ob-note" style="--x:4%;--y:76%;--w:92%"><div class="k">The four cells</div><div class="d">Three of them you can inspect. The fourth &ndash; relevant, not retrieved &ndash; is invisible by construction, and it is the only one that decides whether your literature review is a review of the literature. <b>Every AND and every NOT is a bet on that cell being empty.</b></div></div></div><div class="ob-step p7" data-frag="1"><div class="ob-note" style="--x:4%;--y:76%;--w:92%"><div class="k">Now a real number</div><div class="d">Our own Integrum corpus on Russian deterrence &ndash; &#1089;&#1076;&#1077;&#1088;&#1078;&#1080;&#1074;&#1072;&#1085;&#1080;&#1077;, &#1091;&#1089;&#1090;&#1088;&#1072;&#1096;&#1077;&#1085;&#1080;&#1077;, &#1079;&#1072;&#1087;&#1091;&#1075;&#1080;&#1074;&#1072;&#1085;&#1080;&#1077; &ndash; holds about <b>31,000 publications</b>. That is the denominator for anyone writing about how Russia thinks about deterrence.</div></div></div><div class="ob-step p8" data-frag="1"><div class="ob-note" style="--x:4%;--y:76%;--w:92%"><div class="k">And the numerator</div><div class="d">The best Western work on exactly this: a CNA study that went from 700 sources to <b>144</b>; monographs that often clear <b>200</b>; Jonsson's book at <b>449</b>. All careful scholarship. <b>Against 31,000.</b> That is not a precision problem &ndash; it is a recall problem, and nobody reports it.</div></div></div></div></section><section class="slide apert" data-t="Broad versus narrow" data-n="THE aperture slide. Everything this week hangs off it. Let it sit." data-sid="e18c1e"><h2>Broad <span class="y">versus</span> narrow</h2><p class="sub">The aperture decides what your field is allowed to contain.</p><figure class="viz"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Two apertures over the same field of published work: a narrow one that lets a thin wedge through, and a broad one that lets most of the field through."><style>.ap-hd{font:700 18px system-ui,sans-serif;letter-spacing:.1em}.ap-lb{font:700 23px system-ui,sans-serif;fill:#e8edf3}.ap-tx{font:400 17.5px system-ui,sans-serif;fill:#9fb3c8}.ap-cap{font:400 18px system-ui,sans-serif;fill:#7d93ad}</style><rect width="1200" height="520" fill="#09182f"/><g data-frag="1"><circle cx="404.1" cy="185.0" r="3.6" fill="#24406b"/><circle cx="767.8" cy="172.0" r="3.6" fill="#24406b"/><circle cx="639.9" cy="220.7" r="3.6" fill="#24406b"/><circle cx="108.5" cy="244.2" r="3.6" fill="#24406b"/><circle cx="85.7" cy="232.0" r="3.6" fill="#24406b"/><circle cx="121.7" cy="175.1" r="3.6" fill="#24406b"/><circle cx="516.1" cy="297.3" r="3.6" fill="#24406b"/><circle cx="181.7" cy="197.1" r="3.6" fill="#24406b"/><circle cx="741.7" cy="317.3" r="3.6" fill="#24406b"/><circle cx="685.7" cy="225.8" r="3.6" fill="#24406b"/><circle cx="1129.6" cy="167.7" r="3.6" fill="#24406b"/><circle cx="998.6" cy="208.1" r="3.6" fill="#24406b"/><circle cx="204.4" cy="179.6" r="3.6" fill="#24406b"/><circle cx="387.0" cy="295.5" r="3.6" fill="#24406b"/><circle cx="245.0" cy="256.5" r="3.6" fill="#24406b"/><circle cx="754.5" cy="221.8" r="3.6" fill="#24406b"/><circle cx="653.1" cy="170.4" r="3.6" fill="#24406b"/><circle cx="110.3" cy="194.2" r="3.6" fill="#24406b"/><circle cx="800.6" cy="231.0" r="3.6" fill="#24406b"/><circle cx="393.3" cy="257.2" r="3.6" fill="#24406b"/><circle cx="547.9" cy="209.8" r="3.6" fill="#24406b"/><circle cx="927.3" cy="276.0" r="3.6" fill="#24406b"/><circle cx="315.4" cy="
